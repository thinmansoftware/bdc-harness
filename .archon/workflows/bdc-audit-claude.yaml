{name: bdc-audit-claude,description: "Claude-authored, Claude-reviewed lane for DOCUMENTATION-ONLY audit Work Orders whose sole\ndeliverable is one markdown report file (e.g. WO-*-AUDIT-01, WO-*-REAUDIT-01,\nWO-*-BUILDSTATE-AUDIT-01). Trimmed from bdc-feature-development: no plan/plan-review,\nno war-council-validator, no Codex diff-review chain, no opus-repair/pause-gate ladder --\nthere is no code-correctness surface for those nodes to protect. Read spec -> read code/schema\nper the WO's Behavior Source of Truth section -> write ONE markdown report -> ASCII-gate ->\nmanifest -> flip Notion -> commit+push -> open PR if needed.\nUse when: the WO body says \"audit\", \"re-audit\", \"build-state audit\", \"read-only\", or its ONLY\nfile in the Files-to-create list is a single docs/audits/*.md report with no code changes.\nNOT for: any WO that creates/modifies application code, migrations, or config -- use\nbdc-feature-development(-codex) for those; the review chain this lane cuts exists to catch\ncode-correctness bugs that a report cannot have.\n",policyFile: harness/policies/agent-behavior.md,model: sonnet,nodes: [{id: preflight-github-auth,persona: major-build,load_bearing: true,bash: "set -euo pipefail\nif ! git push --dry-run origin \"HEAD:refs/heads/preflight-auth-probe-$(date +%s)\" 2>&1; then\n  echo \"ERROR: GITHUB auth check failed -- container cannot push to origin.\" >&2\n  echo \"Likely cause: GITHUB_TOKEN missing in executor env, or token lacks repo scope.\" >&2\n  exit 1\nfi\necho \"preflight-github-auth PASS\"\n"},{id: read-spec,persona: xo,depends_on: [preflight-github-auth],bash: "set -euo pipefail\nWO_ID=\"${WO_ID:-}\"\nif [ -z \"$WO_ID\" ]; then\n  WO_ID=$(printf '%s\\n' \"$USER_MESSAGE\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)\nfi\nif [ -z \"$WO_ID\" ]; then\n  echo \"WO_ID missing. Provide WO_ID in environment or user message.\" >&2\n  exit 1\nfi\n# Specs live in bdc-xo (NOT the target codebase). Cross-repo fetch via gh api.\nSPEC_PATH=\"docs/work-orders/${WO_ID}.md\"\nSPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nif [ -z \"$SPEC_CONTENT\" ]; then\n  # Fallback 1: docs/superpowers/specs/${WO_ID}.md direct\n  SPEC_PATH=\"docs/superpowers/specs/${WO_ID}.md\"\n  SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  # Fallback 2: date-prefix glob in docs/superpowers/specs/ (Rule 5)\n  MATCH=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main\" --template '{{range .}}{{.path}}{{\"\\n\"}}{{end}}' 2>/dev/null | grep \"${WO_ID}.md$\" | head -n 1)\n  if [ -n \"$MATCH\" ]; then\n    SPEC_PATH=\"$MATCH\"\n    SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' | tr -d '\\n' | base64 -d || true)\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  # Fallback 3: GitHub issue body (tracker fallback per bdc-xo/CLAUDE.md)\n  ISSUE_NUM=$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'issue=[0-9]+' | head -n 1 | cut -d= -f2 || true)\n  if [ -z \"$ISSUE_NUM\" ]; then\n    ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \\\n      --search \"${WO_ID} in:title\" --json number,title \\\n      --jq '.[0].number' 2>/dev/null || true)\n  fi\n  if [ -n \"$ISSUE_NUM\" ] && [ \"$ISSUE_NUM\" != \"null\" ]; then\n    SPEC_CONTENT=$(gh issue view \"$ISSUE_NUM\" --repo bluedevilcollectibles/bdc-xo \\\n      --json body --jq .body 2>/dev/null || true)\n    [ -n \"$SPEC_CONTENT\" ] && SPEC_PATH=\"issues/${ISSUE_NUM}\"\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then echo \"Spec not found (tried docs/work-orders/, docs/superpowers/specs/ direct, date-prefix glob, and GitHub issue search)\" >&2; exit 1; fi\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nRUN_START_SHA=$(git -C \"$WT\" rev-parse HEAD 2>/dev/null || echo unknown)\nmkdir -p \"$ARTIFACTS_DIR\" 2>/dev/null || true\nprintf '%s\\n' \"$RUN_START_SHA\" > \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || true\nprintf 'WO_ID=%s\\nSPEC_PATH=bdc-xo:%s\\nRUN_START_SHA=%s\\n\\n' \"$WO_ID\" \"$SPEC_PATH\" \"$RUN_START_SHA\"\nprintf '%s\\n' \"$SPEC_CONTENT\"\n"},{id: implement,persona: major-build,depends_on: [read-spec],agent: major-build,task_class: medium_work,loop: {prompt: "You are producing a DOCUMENTATION-ONLY audit report for a BDC Work Order. This is a\nread-only investigation -- you are NOT changing any application code, config, or\nmigration. Your only deliverable is ONE markdown report file.\n\n## Spec\n$read-spec.output\n\n## What to do\n1. Read the spec's \"Behavior Source of Truth\" section (or equivalent) to find exactly\n   which code paths, schema tables, migrations, and running services to inspect.\n2. Verify claims LIVE where the spec says to -- read the actual source files (Read/Grep/\n   Glob), query the actual schema if the spec calls for it, do not trust prior specs or\n   memory. If the spec's own claims conflict with what you find in the codebase, trust\n   the codebase and note the discrepancy in the report.\n3. Write EXACTLY ONE markdown report at the path named in the spec (typically under\n   docs/audits/ in the target repo -- use the spec's own stated path verbatim; do not\n   improvise a different path).\n4. The report must be evidence-based: cite file paths + line numbers, cite the exact\n   grep/query commands you ran, and state findings as verified facts vs open questions.\n   Do not pad with generic recommendations not grounded in what you actually found.\n\n## WORKTREE PINNING\nYou run inside ONE assigned git worktree. Resolve it first:\n  WT=$(git rev-parse --show-toplevel)\nDo ALL your git/grep/diff/log calls relative to THIS worktree. Do not judge \"already\ndone\" against origin/main, the shared source/ checkout, or another thread's worktree.\n\n## Execution rules\n- Create/modify ONLY the one report file named in the spec (and, only if the spec\n  explicitly calls for it, an index/README line linking to it -- nothing else).\n- Do NOT touch application code, tests, migrations, or config. If you find yourself\n  about to edit a non-report file, STOP -- that is out of scope for this lane; report\n  the finding in the audit doc instead and flag it for a follow-up bdc-feature-development\n  WO.\n- Do not reformat unrelated files.\n- Do not deploy.\n- Stop and report BLOCKED if the spec is ambiguous about what to audit or where to write\n  the report.\n\n## Commit-and-push BEFORE exit\nWhen the report is complete, BEFORE emitting the sentinel below, run:\n\n```bash\nBRANCH=$(git rev-parse --abbrev-ref HEAD)\nWO_ID=\"${WO_ID:-$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)}\"\ngit add -A\ngit diff --cached --quiet || git commit -m \"docs: audit report for ${WO_ID}\n\nRead-only investigation. No application code changed.\n\nCo-Authored-By: Claude (Cauldron major-build) <noreply@anthropic.com>\"\ngit push -u origin \"$BRANCH\" 2>&1 || echo \"WARN: push failed - operator must recover from worktree\"\n```\n\n## Completion criteria + sentinel emission\nBefore emitting any completion sentinel, run this self-check IN THIS WORKTREE:\n  WT=$(git rev-parse --show-toplevel)\n  CHANGED=$(git -C \"$WT\" status --porcelain | wc -l)\n  AHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null \\\n          || git -C \"$WT\" rev-list --count HEAD --not --remotes 2>/dev/null || echo 0)\nThen choose EXACTLY ONE ending:\n\n1. REPORT WRITTEN (you wrote the report file, CHANGED>0 OR AHEAD>0): emit, each on its\n   own line:\n     COMPLETE\n     BUILD_COMPLETE\n     <promise>COMPLETE</promise>\n\n2. ALREADY SATISFIED (an equivalent up-to-date report already exists in THIS worktree's\n   HEAD and you made no changes): emit BOTH lines, each on its own line:\n     ALREADY_SATISFIED: <one sentence: which report file already exists and why it is current>\n     COMPLETE\n\n3. TRUE BLOCKER (spec ambiguous / cannot determine what to audit or where to write):\n     BLOCKED: <one-sentence reason>\n\nNever emit case-1 sentinels unless you actually wrote/updated the report file\n(CHANGED>0 OR AHEAD>0). A bare COMPLETE with no real change and no ALREADY_SATISFIED\nline is a false completion.\n",until: COMPLETE,max_iterations: 4,fresh_context: true}},{id: ascii-gate,persona: major-build,depends_on: [implement],load_bearing: true,bash: "set -uo pipefail\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\ncd \"$WT\"\nBASE=$(cat \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || echo \"\")\nif [ -z \"$BASE\" ] || [ \"$BASE\" = \"unknown\" ] || ! git rev-parse --verify \"$BASE\" >/dev/null 2>&1; then\n  BASE_REF=\"origin/${BASE_BRANCH:-main}\"\n  BASE=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"\")\nfi\nSRC_RE='\\.(md|js|jsx|ts|tsx|mjs|cjs|html|sh|bash|yaml|yml)$'\nif [ -n \"$BASE\" ] && git rev-parse --verify \"$BASE\" >/dev/null 2>&1; then\n  CHANGED=$( { git diff --name-only \"$BASE\"..HEAD 2>/dev/null; git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E \"$SRC_RE\" || true )\nelse\n  CHANGED=$( { git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E \"$SRC_RE\" || true )\nfi\nif [ -z \"$CHANGED\" ]; then\n  echo \"ascii-gate PASS (no changed files to scan)\"\n  exit 0\nfi\nGREP_P_OK=0\nif printf 'a\\xe2\\x80\\x94b\\n' | grep -qP \"[^\\x00-\\x7F]\" 2>/dev/null; then GREP_P_OK=1; fi\ndetect() {\n  f=\"$1\"\n  if [ \"$GREP_P_OK\" = \"1\" ]; then\n    grep -lP \"[^\\x00-\\x7F]\" \"$f\" >/dev/null 2>&1 && return 1\n  elif command -v perl >/dev/null 2>&1; then\n    perl -ne 'exit 1 if /[^\\x00-\\x7F]/' \"$f\" || return 1\n  else\n    od -An -tu1 \"$f\" 2>/dev/null | tr ' ' '\\n' | grep -qE '^(12[89]|1[3-9][0-9]|2[0-4][0-9]|25[0-5])$' && return 1\n  fi\n  return 0\n}\nHITFILE=$(mktemp)\nprintf '%s\\n' \"$CHANGED\" | while IFS= read -r f; do\n  [ -z \"$f\" ] && continue\n  [ -f \"$f\" ] || continue\n  if ! detect \"$f\"; then printf '%s\\n' \"$f\" >> \"$HITFILE\"; fi\ndone\nif [ -s \"$HITFILE\" ]; then\n  echo \"ASCII GATE FAILED -- non-ASCII bytes in changed file(s):\" >&2\n  cat \"$HITFILE\" >&2\n  echo \"Fix: em-dash/en-dash -> --, smart quotes -> ' and \\\", ellipsis -> ..., middot -> | or -, nbsp -> space, Unicode minus -> -. No emojis.\" >&2\n  rm -f \"$HITFILE\"\n  exit 1\nfi\nrm -f \"$HITFILE\"\necho \"ascii-gate PASS (scanned $(printf '%s\\n' \"$CHANGED\" | grep -c .) changed file(s), all ASCII)\"\nexit 0\n"},{id: decide-push-target,persona: major-build,depends_on: [ascii-gate],task_class: clerical,prompt: "Decide the push target for this BDC audit Work Order.\n\n## Inputs\nSpec:\n$read-spec.output\n\n## Branch Name Derivation Rules\nThe engine already appends a unique \"-thread-<hash>\" suffix at push time\n(UNIQUE_BRANCH in commit-and-push). Your job is to emit the BASE branch name only.\n- Derive the branch name from the WO ID ONLY. Do NOT copy the current git branch name.\n- Use prefix docs/ followed by the WO ID in lowercase with hyphens.\n  Example: WO-SHOPOPS-CHEERS-CRM-BUILDSTATE-AUDIT-01 -> docs/wo-shopops-cheers-crm-buildstate-audit-01\n- The branch MUST NOT start with archon/thread- or contain -thread- anywhere.\n- commit-and-push validates the emitted branch against this allowlist regex:\n  ^(docs/[A-Za-z0-9_-]+|feat/[A-Za-z0-9_-]+|fix/[A-Za-z0-9_-]+|wip/[A-Za-z0-9_-]+)$\n  and fails closed with \"Malformed branch name\" on mismatch.\n\n## Required Repo Policy\nExtract the target repository from the spec content. Look for any of these patterns\n(in priority order):\n1. `target_repo: <owner>/<repo>` (YAML field)\n2. `**Target repo:** \\`<owner>/<repo>\\`` (Markdown bold)\n3. `Target repo: <owner>/<repo>` (plain header)\n4. `**Target Repo:** \\`<owner>/<repo>\\`` (Markdown bold, capital R)\n\nMatch the extracted repo against this hardcoded Rule 20 staging-gate list:\n- bluedevilcollectibles/lspro-react\n- bluedevilcollectibles/shopops-storefront\n- bluedevilcollectibles/shopops\n\nNOTE: audit reports are docs-only and do NOT touch runtime behavior, so even for a\nstaging-gate repo the PR does not require a staging deploy -- but it still opens\nagainst the repo's default branch (main, or master for shopops / shopops-storefront\nper Rule 14). Emit staging_gate_required: false ALWAYS for this lane (docs-only never\nneeds a staging deploy gate); still emit the repo's correct default branch as base.\n\nIf the repo is shopops or shopops-storefront, output:\npush_target: feature-branch:<spec-derived-branch-name>\npr_required: true\nstaging_gate_required: false\nbase_branch: master\nrepo: <owner>/<repo>\n\nOtherwise (lspro-react, bdc-xo, or any other repo), output:\npush_target: feature-branch:<spec-derived-branch-name>\npr_required: true\nstaging_gate_required: false\nbase_branch: main\nrepo: <owner>/<repo>\n\nCRITICAL: You MUST emit a `repo:` line and a `base_branch:` line in every output case.\nIf no target_repo is parseable from the spec, emit `repo: unknown` and a WARNING line\nexplaining what is missing.\n"},{id: commit-and-push,persona: overseer,depends_on: [decide-push-target],load_bearing: true,bash: "set -euo pipefail\nDECIDE_OUTPUT=$decide-push-target.output\necho \"$DECIDE_OUTPUT\"\nif printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -q '^repo: unknown'; then\n  echo \"ERROR: decide-push-target could not resolve target repo; failing closed.\" >&2\n  exit 1\nfi\nBRANCH=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^push_target: feature-branch://p' | head -n 1)\nif [ -z \"$BRANCH\" ]; then\n  echo \"No feature branch target found in decide-push-target output.\" >&2\n  exit 1\nfi\nBRANCH_PATTERN='^(docs/[A-Za-z0-9_-]+|feat/[A-Za-z0-9_-]+|fix/[A-Za-z0-9_-]+|wip/[A-Za-z0-9_-]+)$'\nif ! printf '%s\\n' \"$BRANCH\" | grep -Eq \"$BRANCH_PATTERN\"; then\n  echo \"Malformed branch name: $BRANCH does not match required pattern docs/|feat/|fix/|wip/\" >&2\n  exit 1\nfi\nTHREAD_ID=$(git rev-parse --abbrev-ref HEAD | sed 's|archon/thread-||')\nUNIQUE_BRANCH=\"${BRANCH}-thread-${THREAD_ID}\"\ngit status --short\nDIRTY=$(git status --porcelain)\nif [ -z \"$DIRTY\" ]; then\n  if git rev-parse --quiet --verify \"origin/${UNIQUE_BRANCH}\" >/dev/null 2>&1; then\n    COMMITS_AHEAD=$(git rev-list --count \"origin/${UNIQUE_BRANCH}..HEAD\" 2>/dev/null || echo 0)\n  else\n    COMMITS_AHEAD=$(git rev-list --count HEAD --not --remotes=origin 2>/dev/null || echo 0)\n  fi\n  if [ \"$COMMITS_AHEAD\" = \"0\" ]; then\n    LOCAL_HEAD=$(git rev-parse HEAD)\n    RECOVERED=$(git ls-remote origin 2>/dev/null \\\n      | awk -v sha=\"$LOCAL_HEAD\" '$1 == sha {sub(/^refs\\/heads\\//, \"\", $2); print $2}' \\\n      | head -1)\n    if [ -n \"$RECOVERED\" ]; then\n      echo \"Recovered push target from remote: $RECOVERED\"\n      UNIQUE_BRANCH=\"$RECOVERED\"\n    else\n      echo \"No changed files and no commits ahead of origin/${UNIQUE_BRANCH} -- implement loop did not produce a report\" >&2\n      exit 1\n    fi\n  else\n    echo \"Backstop: $COMMITS_AHEAD commit(s) ahead of origin -- pushing pre-committed work.\"\n  fi\nelse\n  CHANGED_FILES=$(printf '%s\\n' \"$DIRTY\" | awk '{print substr($0,4)}')\n  printf '%s\\n' \"$CHANGED_FILES\" | while IFS= read -r path; do\n    [ -z \"$path\" ] && continue\n    git add -- \"$path\"\n  done\n  if git diff --cached --quiet; then\n    echo \"No changes staged; nothing for backstop to commit.\" >&2\n    exit 0\n  fi\n  WO_ID=\"${WO_ID:-$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)}\"\n  git commit -m \"docs: audit report for ${WO_ID}\"\nfi\nPUSH_OK=false\nfor attempt in 1 2 3; do\n  if git push origin HEAD:\"${UNIQUE_BRANCH}\" 2>&1; then\n    PUSH_OK=true\n    break\n  fi\n  echo \"WARN: push attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PUSH_OK\" = \"false\" ]; then\n  echo \"ERROR: git push failed after 3 attempts -- aborting workflow (load_bearing node).\" >&2\n  exit 1\nfi\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${UNIQUE_BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nLOCAL_HEAD=\"$(git rev-parse HEAD)\"\nif [ \"$REMOTE_HEAD\" != \"$LOCAL_HEAD\" ]; then\n  echo \"FATAL: canonical branch ${UNIQUE_BRANCH} not durably pushed (origin=${REMOTE_HEAD:-<absent>} local=${LOCAL_HEAD})\" >&2\n  exit 1\nfi\necho \"VERIFIED: origin/${UNIQUE_BRANCH} == local HEAD (${LOCAL_HEAD})\"\necho \"unique_branch=${UNIQUE_BRANCH}\"\n"},{id: open-pr-if-needed,persona: major-build,depends_on: [commit-and-push],task_class: clerical,load_bearing: true,bash: "set -euo pipefail\nDECIDE_OUTPUT=$decide-push-target.output\nIMPLEMENT_OUTPUT=$implement.output\nCOMMIT_PUSH_OUTPUT=$commit-and-push.output\nif ! printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -q '^pr_required: true'; then\n  echo \"PR not required; skipping.\"\n  exit 0\nfi\nUNIQUE_BRANCH=$(printf '%s\\n' \"$COMMIT_PUSH_OUTPUT\" | sed -n 's/^unique_branch=//p' | head -n 1)\nif [ -z \"$UNIQUE_BRANCH\" ]; then\n  echo \"UNIQUE_BRANCH not found in commit-and-push output.\" >&2\n  exit 1\nfi\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${UNIQUE_BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nif [ \"$REMOTE_HEAD\" != \"$(git rev-parse HEAD)\" ]; then\n  echo \"FATAL: open-pr precondition failed -- ${UNIQUE_BRANCH} not on origin at HEAD (origin=${REMOTE_HEAD:-<absent>}).\" >&2\n  exit 1\nfi\nREPO=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^repo: //p' | head -n 1)\nif [ -z \"$REPO\" ] || [ \"$REPO\" = \"unknown\" ]; then\n  echo \"ERROR: decide-push-target did not emit a valid 'repo: <owner>/<repo>'.\" >&2\n  exit 1\nfi\nBASE_BRANCH=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^base_branch: //p' | head -n 1)\nWO_ID=\"${WO_ID:-$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)}\"\nTITLE=\"docs: audit report for ${WO_ID}\"\nBODY_FILE=$(mktemp)\n{\n  echo \"## Summary\"\n  echo \"Documentation-only audit report per ${WO_ID}. No application code changed.\"\n  echo\n  echo \"## Implement output\"\n  echo \"$IMPLEMENT_OUTPUT\"\n} > \"$BODY_FILE\"\nPR_OK=false\nfor attempt in 1 2 3; do\n  if gh pr create --repo \"$REPO\" --title \"$TITLE\" --body-file \"$BODY_FILE\" --head \"$UNIQUE_BRANCH\" ${BASE_BRANCH:+--base \"$BASE_BRANCH\"} 2>&1; then\n    PR_OK=true\n    break\n  fi\n  EXIST=$(gh pr list --repo \"$REPO\" --head \"$UNIQUE_BRANCH\" --state open \\\n    --json url --jq '.[0].url // empty' 2>/dev/null || true)\n  if [ -n \"$EXIST\" ]; then\n    echo \"PR_URL=$EXIST\"\n    PR_OK=true\n    break\n  fi\n  echo \"WARN: gh pr create attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PR_OK\" = \"false\" ]; then\n  echo \"PR_CREATE_FAILED_BUT_BRANCH_SAFE: repo=${REPO} branch=${UNIQUE_BRANCH} sha=$(git rev-parse HEAD)\" >&2\n  echo \"ERROR: gh pr create failed after 3 attempts -- aborting workflow (load_bearing node).\" >&2\n  echo \"RECOVERY: open the PR manually -> gh pr create --repo ${REPO} --head ${UNIQUE_BRANCH} ${BASE_BRANCH:+--base ${BASE_BRANCH}}\" >&2\n  exit 1\nfi\n"},{id: build-manifest,persona: major-build,depends_on: [open-pr-if-needed],task_class: clerical,prompt: "Construct the Captain CI completion manifest for this BDC audit Work Order.\n\n## Inputs\nSpec:\n$read-spec.output\n\nImplementation (report authoring):\n$implement.output\n\n## Required Manifest Fields (Rule 2 v2 manifest, adapted for a DOCS-only WO)\n- WO ID\n- Builder: Claude (Cauldron major-build, bdc-audit-claude lane)\n- Files created: <the single audit report path>\n- Files modified: <none, unless the spec explicitly required an index update>\n- Tests: N/A (documentation-only; no test suite applies)\n- PRs: <repo PR URL, if opened>\n- Merge ancestors: <repo main/master HEAD, manifest commit>\n- Grep assertions: N/A (no runtime assertions for a report) OR the specific grep\n  commands used to VERIFY the audit's own claims against the codebase (cite these --\n  they are the evidence the audit did real verification, not guessing)\n- Runtime verification: N/A (docs-only, no runtime change)\n- Vercel deployment: N/A (docs-only, no deploy)\n- VALIDATION: PASS\n"},{id: flip-notion,persona: xo,depends_on: [build-manifest],task_class: clerical,bash: "set -euo pipefail\n\ncapture_node_output() {\n  python3 -c 'import shlex, sys; s=sys.stdin.read(); sys.stdout.write((lambda p: p[0] if len(p)==1 else s)(shlex.split(s)) if len(s)>=2 and s[0]==\"'\"'\"'\" and s.rstrip(\"\\n\").endswith(\"'\"'\"'\") else s)'\n}\n\nMANIFEST=$(capture_node_output <<'BDC_NODE_OUTPUT_MANIFEST'\n$build-manifest.output\nBDC_NODE_OUTPUT_MANIFEST\n)\n\nREAD_SPEC_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_READ_SPEC'\n$read-spec.output\nBDC_NODE_OUTPUT_READ_SPEC\n)\nISSUE_REPO=\"${ISSUE_REPO:-bluedevilcollectibles/bdc-xo}\"\nISSUE_NUM=$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'issue=[0-9]+' | head -1 | cut -d= -f2 || true)\nif [ -z \"$ISSUE_NUM\" ]; then\n  ISSUE_NUM=$(printf '%s\\n' \"$READ_SPEC_OUT\" | sed -n 's/^SPEC_PATH=.*issues\\/\\([0-9][0-9]*\\).*/\\1/p' | head -1)\nfi\nif [ -z \"$ISSUE_NUM\" ]; then\n  WO_ID_FROM_SPEC=$(printf '%s\\n' \"$READ_SPEC_OUT\" | sed -n 's/^WO_ID=//p' | head -1)\n  if [ -n \"$WO_ID_FROM_SPEC\" ]; then\n    ISSUE_NUM=$(gh issue list --repo \"$ISSUE_REPO\" --search \"$WO_ID_FROM_SPEC in:title\" --json number --jq '.[0].number // empty' 2>/dev/null || true)\n  fi\nfi\nif [ -z \"$ISSUE_NUM\" ]; then\n  echo \"flip-notion: no GitHub issue resolved; skipping status:review label + manifest comment.\"\n  exit 0\nfi\n\ngh label create status:review --repo \"$ISSUE_REPO\" --color 0E8A16 --description \"BDC workflow is ready for review\" 2>/dev/null || true\ngh issue edit \"$ISSUE_NUM\" --repo \