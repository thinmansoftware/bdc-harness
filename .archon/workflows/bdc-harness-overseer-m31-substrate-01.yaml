{name: bdc-harness-overseer-m31-substrate-01,description: "Use when: Executing WO-HARNESS-OVERSEER-M31-SUBSTRATE-01 (M-42 Slice 2) in\nbluedevilcollectibles/bdc-harness -- the immutable M-31 evidence, proposal, and\nsingle-use permit substrate.\nInput: WO_ID is baked in at root; no user message required at fire time.\nDoes: Reads the WO spec, plans a surgical implementation, implements + self-verifies,\nruns war-council validation, enforces the M-31 business-risk invariant (load_bearing),\ncommits, pushes, opens a PR, builds a Captain CI manifest, and flips Notion to Review.\nNOT for: Deploys, activation, provider mutation, doctrine-only edits, or other WOs.\n",policyFile: harness/policies/agent-behavior.md,provider: claude,model: sonnet,inputs: {WO_ID: {default: WO-HARNESS-OVERSEER-M31-SUBSTRATE-01}},nodes: [{id: preflight-github-auth,persona: major-build,load_bearing: true,bash: "set -euo pipefail\nif ! git push --dry-run origin \"HEAD:refs/heads/preflight-auth-probe-$(date +%s)\" 2>&1; then\n  echo \"ERROR: GitHub auth check failed -- container cannot push to origin.\" >&2\n  echo \"Likely cause: GITHUB_TOKEN missing in executor env, or token lacks repo scope.\" >&2\n  exit 1\nfi\necho \"preflight-github-auth PASS\"\n"},{id: read-spec,persona: xo,depends_on: [preflight-github-auth],trigger_rule: all_done,bash: "set -euo pipefail\nWO_ID=\"${WO_ID:-WO-HARNESS-OVERSEER-M31-SUBSTRATE-01}\"\nif [ -z \"$WO_ID\" ]; then\n  WO_ID=$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)\nfi\nif [ -z \"$WO_ID\" ]; then\n  echo \"WO_ID missing. Provide WO_ID input or user message.\" >&2\n  exit 1\nfi\n# Specs live in bdc-xo (NOT the target codebase). Cross-repo fetch via gh api.\nSPEC_PATH=\"docs/work-orders/${WO_ID}.md\"\nSPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nif [ -z \"$SPEC_CONTENT\" ]; then\n  SPEC_PATH=\"docs/superpowers/specs/${WO_ID}.md\"\n  SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  MATCH=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main\" --template '{{range .}}{{.path}}{{\"\\n\"}}{{end}}' 2>/dev/null | grep \"${WO_ID}.md$\" | head -n 1 || true)\n  if [ -n \"$MATCH\" ]; then\n    SPEC_PATH=\"$MATCH\"\n    SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  echo \"Spec not found for ${WO_ID} (tried docs/work-orders/, docs/superpowers/specs/ direct + glob).\" >&2\n  exit 1\nfi\n# Capture an immutable run-start base SHA BEFORE any node mutates the worktree.\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nRUN_START_SHA=$(git -C \"$WT\" rev-parse HEAD 2>/dev/null || echo unknown)\nmkdir -p \"$ARTIFACTS_DIR\" 2>/dev/null || true\nprintf '%s\\n' \"$RUN_START_SHA\" > \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || true\nprintf 'WO_ID=%s\\nSPEC_PATH=bdc-xo:%s\\nRUN_START_SHA=%s\\n\\n' \"$WO_ID\" \"$SPEC_PATH\" \"$RUN_START_SHA\"\nprintf '%s\\n' \"$SPEC_CONTENT\"\n"},{id: plan,persona: war-council-architect,agent: war-council-architect,depends_on: [read-spec],trigger_rule: all_done,task_class: medium_work,prompt: "Read the BDC Work Order spec below and produce a concise, surgical implementation plan.\n\n## Required Output (structured Markdown with these headings)\n- WO ID\n- Files to modify\n- Files to create\n- Files explicitly out of scope\n- Verification commands\n- Commit message\n- Push policy\n- Staging gate required\n\n## BDC Push Policy\nHardcoded Rule 20 staging-gate repos:\n- bluedevilcollectibles/lspro-react\n- bluedevilcollectibles/shopops-storefront\n- bluedevilcollectibles/shopops\nThe target of this WO is bluedevilcollectibles/bdc-harness, which is NOT a\nstaging-gate repo: use a feature branch plus PR WITHOUT the staging gate.\n\n## Scope discipline (M-42 Slice 2)\nThis WO owns migration 033 and the shared schema integration. It MUST NOT modify\npackages/overseer/src/service.ts, packages/overseer/src/actions/merge-ready.ts,\nany deployment configuration, or any provider mutation path. No execute, merge,\ndeploy, or activation logic is in scope. Permit preparation ends at a returned\npermit or a typed failure -- never at an external side effect.\n\n## Spec\n$read-spec.output\n"},{id: implement,idle_timeout: 600000,persona: major-build,agent: major-build,depends_on: [plan],trigger_rule: all_done,task_class: medium_work,wall_timeout_ms: 1800000,loop: {fresh_context: true,until: COMPLETE,max_iterations: 5,prompt: "Implement the approved plan for BDC Work Order WO-HARNESS-OVERSEER-M31-SUBSTRATE-01.\n\n## Spec\n$read-spec.output\n\n## Approved plan\n$plan.output\n\n## Prior iteration output (empty on first pass)\n$LOOP_PREV_OUTPUT\n\n## Worktree pinning\nYou run inside ONE assigned git worktree. Resolve it first with\nWT=$(git rev-parse --show-toplevel) and make EVERY git/grep/diff call relative to\nTHIS worktree. Do NOT judge \"already done\" against origin/main or any sibling\nworktree. Whether the WO is satisfied is decided ONLY by THIS worktree's HEAD.\n\n## Execution rules\n- Modify only files in scope per the spec's output contract:\n  migrations/033_overseer_m31_substrate.sql, packages/core/src/db/merge-steward.ts,\n  packages/core/src/db/merge-steward.test.ts, packages/overseer/src/m31-substrate.ts,\n  packages/overseer/src/__tests__/m31-substrate.test.ts,\n  packages/server/src/routes/schemas/merge-steward.schemas.ts,\n  packages/server/src/routes/api.merge-steward.test.ts,\n  docs/contracts/overseer-m31-substrate-v1.md, and the enumerated integration files\n  (packages/core/src/db/adapters/sqlite.ts, packages/core/src/db/index.ts,\n  packages/core/package.json, packages/overseer/src/types.ts,\n  packages/overseer/src/index.ts, packages/overseer/package.json,\n  packages/server/src/routes/api.ts, packages/server/package.json).\n- You MUST NOT modify packages/overseer/src/service.ts,\n  packages/overseer/src/actions/merge-ready.ts, deployment config, or any provider\n  mutation path.\n- All five M-31 tables are append-only. Snapshot membership is explicit and sorted.\n  Proposal IDs and execution IDs are unique. Permit issuance requires an exact\n  live-state comparison inside the 60-second validity window and single-use\n  consumption of the execution ID.\n- Prefer existing repo patterns (execution-claims fencing, board-authority audit,\n  registerOpenApiRoute). ASCII-only source. Do not reformat unrelated code. Do not\n  deploy. Do not use empty/verify-only commits.\n- Tests must assert real behavior (append-only rejection, 60/61-second boundary,\n  replay rejection, PostgreSQL/SQLite parity, structural absence of provider mutation).\n\n## Commit and push BEFORE exit\nWhen implementation is complete, BEFORE emitting the sentinel below, run:\n```bash\nBRANCH=$(git rev-parse --abbrev-ref HEAD)\nWO_ID=\"${WO_ID:-WO-HARNESS-OVERSEER-M31-SUBSTRATE-01}\"\ngit add -A\ngit diff --cached --quiet || git commit -m \"feat: implement ${WO_ID}\n\nImplementation per WO spec. Self-verified within implement loop.\n\nCo-Authored-By: Claude (Cauldron major-build) <noreply@anthropic.com>\"\ngit push -u origin \"$BRANCH\" 2>&1 || echo \"WARN: push failed -- operator must recover from worktree\"\n```\n\n## Completion criteria + sentinel\nRun this self-check IN THIS WORKTREE first:\n  WT=$(git rev-parse --show-toplevel)\n  CHANGED=$(git -C \"$WT\" status --porcelain | wc -l)\n  AHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null || git -C \"$WT\" rev-list --count HEAD --not --remotes 2>/dev/null || echo 0)\nThen choose EXACTLY ONE ending:\n1. REAL BUILD (you made in-scope changes; CHANGED>0 OR AHEAD>0). Emit each on its own line:\n     COMPLETE\n     BUILD_COMPLETE\n     <promise>COMPLETE</promise>\n2. ALREADY SATISFIED (deliverables already reachable from THIS worktree HEAD; no changes):\n     ALREADY_SATISFIED: <one sentence naming the deliverables already present>\n     COMPLETE\n3. TRUE BLOCKER (spec ambiguous / missing source of truth):\n     BLOCKED: <one-sentence reason>\nAnti-fraud: emit the case-1 build sentinels ONLY if you made real in-scope edits.\n"}},{id: war-council-validator,provider: claude,model: sonnet,persona: captain-ci-validator,depends_on: [implement],trigger_rule: all_done,task_class: medium_work,prompt: "Run the war-council-validator review for WO-HARNESS-OVERSEER-M31-SUBSTRATE-01.\n\n## Inputs\nSpec:\n$read-spec.output\n\nPlan:\n$plan.output\n\nImplementation output:\n$implement.output\n\nGit diff:\nRun `git diff --stat` and `git diff --check`, then inspect the changed files.\n\n## Required Output\nReturn either:\n- satisfied: with evidence that the spec deliverables and stop conditions were met\n  (append-only tables, sorted membership, unique proposal/execution IDs, 60/61-second\n  boundary, replay rejection, PostgreSQL/SQLite parity, no provider mutation path).\n- needs_revision: with exact file/path/behavior findings.\n"},{id: business-risk-gate,provider: claude,model: sonnet,persona: captain-ci-validator,depends_on: [war-council-validator],trigger_rule: all_done,load_bearing: true,task_class: medium_work,prompt: "You are the business-risk gate for WO-HARNESS-OVERSEER-M31-SUBSTRATE-01. You decide\nONE thing: does the implemented diff uphold the WO's business-risk invariant? You are\nread-only; judge ONLY this worktree's diff (run `git diff` and inspect changed files).\n\n## BUSINESS_RISK_INVARIANT (verbatim -- must hold)\nThe M-31 substrate must never allow its append-only evidence, snapshots, discrepancies, or proposals to be mutated or an execution permit to be issued without an exact live-state comparison inside the 60-second validity window, and no replayed or duplicate execution may ever reach a provider mutation path.\n\n## How to decide\nConfirm ALL of the following are true in the diff, with concrete file:line evidence:\n1. The five M-31 tables (snapshots, snapshot_members, discrepancies, action_proposals,\n   execution_receipts) are append-only -- UPDATE/DELETE are structurally rejected in\n   both the PostgreSQL migration 033 and the SQLite parity surface.\n2. An execution permit is issued ONLY after an exact live-state comparison, and ONLY\n   when the bound observation age is 60 seconds or less (61 seconds returns\n   observation_stale with no permit).\n3. Proposal IDs and execution IDs are unique, and a replayed or duplicate execution is\n   rejected transactionally BEFORE any external dependency can run\n   (proposal_replayed / execution_id_conflict).\n4. No provider client, GitHub mutation, deploy call, or other external side effect is\n   reachable from the permit-preparation path; service.ts and actions/merge-ready.ts\n   are unchanged.\n\n## Output (last line must be EXACTLY one of these)\n- If every clause above is confirmed upheld by the diff:\n    BUSINESS_RISK_GATE=PASS\n- If any clause is violated, unproven, or you cannot confirm with high confidence:\n    BUSINESS_RISK_GATE=BLOCK\n  followed by: BUSINESS_RISK_REASON=<one line naming the violated clause + evidence>\nDefault to BUSINESS_RISK_GATE=BLOCK. A permit path that might reach provider mutation,\na mutable evidence row, or a missing 60-second check is an automatic BLOCK.\n"},{id: decide-push-target,persona: major-build,depends_on: [business-risk-gate],trigger_rule: all_done,when: "$business-risk-gate.output contains 'BUSINESS_RISK_GATE=PASS'",task_class: clerical,prompt: "Decide the push target for WO-HARNESS-OVERSEER-M31-SUBSTRATE-01.\n\n## Inputs\nSpec:\n$read-spec.output\nValidator:\n$war-council-validator.output\n\n## Branch name derivation\nDerive the branch name from the WO ID ONLY -- do NOT copy the current git branch and\ndo NOT embed any archon/thread- suffix. Use prefix feat/ + WO ID lowercased with\nhyphens: feat/wo-harness-overseer-m31-substrate-01\nThe engine appends a unique -thread-<hash> suffix at push time; emit the BASE name only.\n\n## Repo policy\nTarget repository: bluedevilcollectibles/bdc-harness. This repo is NOT in the Rule 20\nstaging-gate list (lspro-react, shopops-storefront, shopops), so the PR targets the\nrepo default branch (no --base staging).\n\nEmit exactly:\n  push_target: feature-branch:feat/wo-harness-overseer-m31-substrate-01\n  pr_required: true\n  staging_gate_required: false\n  repo: bluedevilcollectibles/bdc-harness\n"},{id: commit-and-push,persona: overseer,depends_on: [decide-push-target],trigger_rule: all_done,when: "$business-risk-gate.output contains 'BUSINESS_RISK_GATE=PASS'",load_bearing: true,bash: "set -euo pipefail\nDECIDE_OUTPUT=$decide-push-target.output\nif printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -q '^out_of_scope: true'; then\n  echo \"Out of scope for this lane; failing closed.\" >&2\n  exit 1\nfi\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\ncd \"$WT\"\nBASE_BRANCH=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's|^push_target: feature-branch:||p' | head -n 1)\nif ! printf '%s\\n' \"$BASE_BRANCH\" | grep -qE '^(feat/[A-Za-z0-9_-]+|fix/[A-Za-z0-9_-]+|wip/[A-Za-z0-9_-]+)$'; then\n  echo \"Malformed branch name: '${BASE_BRANCH}'\" >&2\n  exit 1\nfi\nTHREAD_SUFFIX=$(git rev-parse --short HEAD)\nUNIQUE_BRANCH=\"${BASE_BRANCH}-thread-${THREAD_SUFFIX}\"\ngit add -A\nWO_ID=\"${WO_ID:-WO-HARNESS-OVERSEER-M31-SUBSTRATE-01}\"\ngit diff --cached --quiet || git commit -m \"feat: implement ${WO_ID}\n\nM-42 Slice 2: immutable M-31 evidence/proposal/permit substrate.\n\nCo-Authored-By: Claude (Cauldron overseer) <noreply@anthropic.com>\"\n# Real push with retry (3 attempts, exponential backoff). Fail closed.\nPUSHED=false\nfor attempt in 1 2 3; do\n  if git push -u origin \"HEAD:${UNIQUE_BRANCH}\" 2>&1; then PUSHED=true; break; fi\n  echo \"WARN: push attempt ${attempt} failed; retrying...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PUSHED\" != \"true\" ]; then\n  echo \"ERROR: commit-and-push failed after 3 attempts -- no commits reached origin.\" >&2\n  exit 1\nfi\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${UNIQUE_BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nif [ \"$REMOTE_HEAD\" != \"$(git rev-parse HEAD)\" ]; then\n  echo \"ERROR: origin verify failed -- ${UNIQUE_BRANCH} not at HEAD on origin.\" >&2\n  exit 1\nfi\necho \"unique_branch=${UNIQUE_BRANCH}\"\necho \"pushed_head=$(git rev-parse HEAD)\"\necho \"commit-and-push: ${UNIQUE_BRANCH} verified on origin at HEAD\"\n"},{id: open-pr-if-needed,persona: major-build,depends_on: [commit-and-push],trigger_rule: all_done,load_bearing: true,bash: "set -euo pipefail\nDECIDE_OUTPUT=$decide-push-target.output\nCOMMIT_PUSH_OUTPUT=$commit-and-push.output\nIMPLEMENT_OUTPUT=$implement.output\nVALIDATOR_OUTPUT=$war-council-validator.output\nif ! printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -q '^pr_required: true'; then\n  echo \"PR not required; skipping.\"\n  exit 0\nfi\nUNIQUE_BRANCH=$(printf '%s\\n' \"$COMMIT_PUSH_OUTPUT\" | sed -n 's/^unique_branch=//p' | head -n 1)\nif [ -z \"$UNIQUE_BRANCH\" ]; then\n  echo \"ERROR: unique_branch not found in commit-and-push output.\" >&2\n  exit 1\nfi\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${UNIQUE_BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nif [ \"$REMOTE_HEAD\" != \"$(git rev-parse HEAD)\" ]; then\n  echo \"ERROR: open-pr precondition failed -- ${UNIQUE_BRANCH} not on origin at HEAD.\" >&2\n  exit 1\nfi\nREPO=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^repo: //p' | head -n 1)\nif [ -z \"$REPO\" ] || [ \"$REPO\" = \"unknown\" ]; then\n  echo \"ERROR: decide-push-target did not emit a valid 'repo:'.\" >&2\n  exit 1\nfi\nSTAGING_GATE=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -c '^staging_gate_required: true' 2>/dev/null || true)\nSTAGING_GATE=\"${STAGING_GATE:-0}\"\nif [ \"$STAGING_GATE\" -ge 1 ] 2>/dev/null; then BASE_ARG=(--base staging); else BASE_ARG=(); fi\nTITLE=\"feat: WO-HARNESS-OVERSEER-M31-SUBSTRATE-01 (M-42 Slice 2 -- M-31 substrate)\"\nBODY_FILE=$(mktemp)\n{\n  echo \"## Summary\"\n  echo \"M-42 Slice 2: immutable M-31 evidence, proposal, and single-use permit substrate.\"\n  echo \"Slice 2 complete does not activate Overseer or authorize mutation.\"\n  echo\n  echo \"## Implement output\"\n  printf '%s\\n' \"$IMPLEMENT_OUTPUT\"\n  echo\n  echo \"## Validator\"\n  printf '%s\\n' \"$VALIDATOR_OUTPUT\"\n} > \"$BODY_FILE\"\nEXISTING=$(gh pr list --repo \"$REPO\" --head \"$UNIQUE_BRANCH\" --json url --jq '.[0].url' 2>/dev/null || true)\nif [ -n \"$EXISTING\" ]; then\n  echo \"PR already exists: $EXISTING\"\n  echo \"PR_URL=$EXISTING\"\n  exit 0\nfi\nPR_URL=\"\"\nfor attempt in 1 2 3; do\n  PR_URL=$(gh pr create --repo \"$REPO\" --head \"$UNIQUE_BRANCH\" \"${BASE_ARG[@]}\" --title \"$TITLE\" --body-file \"$BODY_FILE\" 2>&1 | grep -Eo 'https://github.com/[^ ]+/pull/[0-9]+' | head -n 1 || true)\n  [ -n \"$PR_URL\" ] && break\n  echo \"WARN: gh pr create attempt ${attempt} failed; retrying...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ -z \"$PR_URL\" ]; then\n  echo \"ERROR: PR creation failed after 3 attempts.\" >&2\n  exit 1\nfi\necho \"PR opened: $PR_URL\"\necho \"PR_URL=$PR_URL\"\n"},{id: build-manifest,persona: major-build,depends_on: [open-pr-if-needed],trigger_rule: all_done,task_class: clerical,prompt: "Construct the Captain CI completion manifest (v2) for WO-HARNESS-OVERSEER-M31-SUBSTRATE-01.\n\n## Inputs\nSpec:\n$read-spec.output\nPlan:\n$plan.output\nImplementation:\n$implement.output\nBusiness-risk gate:\n$business-risk-gate.output\nCommit and push evidence (ground truth for branch/HEAD):\n$commit-and-push.output\nPR evidence (ground truth PR URL):\n$open-pr-if-needed.output\nValidator:\n$war-council-validator.output\n\n## Required manifest fields (emit verbatim labels, one per line)\n  WO: WO-HARNESS-OVERSEER-M31-SUBSTRATE-01\n  Builder: major-build\n  Files created: <comma-separated files ADDED in the diff, or none>\n  Files modified: <comma-separated files CHANGED in the diff, or none>\n  Migrations added: migrations/033_overseer_m31_substrate.sql\n  Tests: <N passing / N total> or N/A (<reason>)\n  PRs: <PR URL from open-pr-if-needed, or N/A>\n  Business risk: <BUSINESS_RISK_GATE value from business-risk-gate>\n  Grep assertions: <read-only assertions, or N/A (<reason>)>\n  VALIDATION: PASS\nVALIDATION: PASS requires war-council-validator to be satisfied AND\nbusiness-risk-gate to be BUSINESS_RISK_GATE=PASS. Otherwise emit VALIDATION: BLOCKED.\nDerive Files created/modified from the git diff -- do not list unchanged files.\n"},{id: flip-notion,persona: major-build,depends_on: [build-manifest],trigger_rule: all_done,task_class: clerical,bash: "set -uo pipefail\nWO_ID=\"${WO_ID:-WO-HARNESS-OVERSEER-M31-SUBSTRATE-01}\"\nGATE=$business-risk-gate.output\nOPEN_PR=$open-pr-if-needed.output\nPR_URL=$(printf '%s\\n' \"$OPEN_PR\" | sed -n 's/^PR_URL=//p' | head -n 1)\nif printf '%s\\n' \"$GATE\" | grep -q 'BUSINESS_RISK_GATE=PASS' && [ -n \"$PR_URL\" ]; then\n  NEW_STATUS=\"Review\"\nelse\n  NEW_STATUS=\"Blocked\"\nfi\necho \"flip-notion: WO_ID=${WO_ID} target_status=${NEW_STATUS} pr=${PR_URL:-<none>}\"\n# Notion mutation is operator-side (Notion API not guaranteed in the build container).\n# Write the intended flip as a durable artifact; the operator/XO reconciler applies it.\nmkdir -p \"$ARTIFACTS_DIR\" 2>/dev/null || true\nprintf 'WO_ID=%s\\nCLAUDE_STATUS=%s\\nSTATUS=%s\\nPR_URL=%s\\n' \\\n  \"$WO_ID\" \"$([ \"$NEW_STATUS\" = \"Review\" ] && echo REVIEW || echo QUEUED)\" \"$NEW_STATUS\" \"${PR_URL:-}\" \\\n  > \"$ARTIFACTS_DIR/notion-flip.txt\" 2>/dev/null || true\necho \"flip-notion: recorded intended Notion flip to $ARTIFACTS_DIR/notion-flip.txt\"\nexit 0\n"}]}