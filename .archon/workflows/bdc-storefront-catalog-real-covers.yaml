{name: bdc-storefront-catalog-real-covers,description: "Use when: Executing WO-STOREFRONT-CATALOG-REAL-COVERS-01 -- plug AutoFix cover pipeline\n          into storefront catalog page so real cover art renders instead of placeholder\n          colored text plates.\nInput: WO_ID = WO-STOREFRONT-CATALOG-REAL-COVERS-01.\nDoes: Reads WO spec from bdc-xo. Writes scripts/backfill-seed-covers.mjs that calls\n      POST https://api.livesellerpro.app/covers/lookup/batch and writes resolved URLs\n      into lib/seed-data/catalog.json. Updates app/shops/[shopSlug]/catalog/page.tsx\n      to render <img src={item.cover_url}> with onError fallback to existing palette.\n      Adds __tests__/lib/catalog-cover-fallback.test.ts with >= 4 bun tests.\n      Runs backfill script, commits JSON + page + tests, opens PR against master.\n      Verifies Vercel preview deployment READY. Builds CODE manifest. Flips Notion to REVIEW.\nRepo: bluedevilcollectibles/shopops-storefront (single repo).\nparallel_ok: true -- single repo, no shared file conflicts.\nPolish bar: ROUGH OK (Mutant Market is beta tester, not paying).\nNOT for: any other WO.\n",policyFile: harness/policies/agent-behavior.md,model: sonnet,nodes: [{id: read-spec,bash: "set -euo pipefail\nWO_ID=\"${WO_ID:-WO-STOREFRONT-CATALOG-REAL-COVERS-01}\"\n\n# Primary path: docs/work-orders/<WO_ID>.md (gh --template, no jq dependency)\nSPEC_CONTENT=$(gh api \\\n  \"repos/bluedevilcollectibles/bdc-xo/contents/docs/work-orders/${WO_ID}.md?ref=main\" \\\n  --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\n\n# Fallback: glob docs/superpowers/specs/*<WO_ID>*.md (Rule 5)\nif [ -z \"$SPEC_CONTENT\" ]; then\n  GLOB_PATH=$(gh api \\\n    \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main\" \\\n    --template '{{range .}}{{.path}}{{\"\\n\"}}{{end}}' 2>/dev/null \\\n    | grep \"${WO_ID}.md$\" | head -1 || true)\n  if [ -n \"$GLOB_PATH\" ]; then\n    SPEC_CONTENT=$(gh api \\\n      \"repos/bluedevilcollectibles/bdc-xo/contents/${GLOB_PATH}?ref=main\" \\\n      --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\n  fi\nfi\n\nif [ -z \"$SPEC_CONTENT\" ]; then\n  # Fallback 4: GitHub issue body (WO-HARNESS-READ-SPEC-ISSUE-BODY-FALLBACK-01)\n  ISSUE_NUM=$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'issue=[0-9]+' | head -n 1 | cut -d= -f2 || true)\n  if [ -z \"$ISSUE_NUM\" ]; then\n    ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \\\n      --search \"${WO_ID} in:title\" --json number,title \\\n      --jq '.[0].number' 2>/dev/null || true)\n  fi\n  if [ -n \"$ISSUE_NUM\" ] && [ \"$ISSUE_NUM\" != \"null\" ]; then\n    SPEC_CONTENT=$(gh issue view \"$ISSUE_NUM\" --repo bluedevilcollectibles/bdc-xo \\\n      --json body --jq .body 2>/dev/null || true)\n    [ -n \"$SPEC_CONTENT\" ] && SPEC_PATH=\"issues/${ISSUE_NUM}\"\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then echo \"Spec not found (tried docs/work-orders/, docs/superpowers/specs/ direct, date-prefix glob, and GitHub issue search)\" >&2; exit 1; fi\n\nprintf 'WO_ID=%s\\nSPEC_PATH=bdc-xo:docs/work-orders/%s.md\\n\\n' \"$WO_ID\" \"$WO_ID\"\nprintf -- '--- SPEC ---\\n%s\\n' \"$SPEC_CONTENT\"\n"},{id: inspect-current-state,depends_on: [read-spec],bash: "# set -e DELIBERATELY OMITTED -- audit must NEVER fail (BUG-3 tolerant)\necho \"=== seed catalog current state ===\"\nif [ -f lib/seed-data/catalog.json ]; then\n  # python3 single-line replaces jq (jq not in bun container; multi-line py heredocs break Bun YAML parser)\n  TOTAL=$(python3 -c \"import json,sys; print(len(json.load(open('lib/seed-data/catalog.json'))))\" 2>/dev/null || echo 0)\n  WITH_COVER=$(python3 -c \"import json,sys; d=json.load(open('lib/seed-data/catalog.json')); print(sum(1 for x in d if x.get('cover_url')))\" 2>/dev/null || echo 0)\n  echo \"TOTAL_ITEMS=${TOTAL}\"\n  echo \"ITEMS_WITH_COVER_URL=${WITH_COVER}\"\n  echo \"FIRST_THREE_UPCS:\"\n  python3 -c \"import json; d=json.load(open('lib/seed-data/catalog.json')); [print('  upc='+str(x.get('upc'))+' title='+str(x.get('title'))+' cover_url='+str(x.get('cover_url'))) for x in d[:3]]\" 2>/dev/null || true\nelse\n  echo \"WARN: lib/seed-data/catalog.json not found at CWD (audit tolerant)\"\nfi\n\necho \"\"\necho \"=== catalog page current state ===\"\nCATALOG_PAGE=\"app/shops/[shopSlug]/catalog/page.tsx\"\nif [ -e \"$CATALOG_PAGE\" ]; then\n  echo \"File exists: $CATALOG_PAGE\"\n  grep -n 'cover_url\\|issue-cover\\|cat-card__cover' \"$CATALOG_PAGE\" 2>/dev/null || echo \"(no matches yet)\"\nelse\n  echo \"WARN: $CATALOG_PAGE not found (audit tolerant -- implement loop will surface)\"\nfi\n\necho \"\"\necho \"=== PDP page (optional) ===\"\nPDP_PAGE=\"app/shops/[shopSlug]/comic/[upc]/page.tsx\"\nif [ -e \"$PDP_PAGE\" ]; then\n  echo \"PDP_PAGE_EXISTS=true\"\n  grep -n 'cover_url\\|issue-cover' \"$PDP_PAGE\" 2>/dev/null || echo \"(no cover refs)\"\nelse\n  echo \"PDP_PAGE_EXISTS=false\"\nfi\nexit 0\n"},{id: probe-cover-api,depends_on: [inspect-current-state],bash: "# set -e DELIBERATELY OMITTED -- best-effort step\nRESULT=$(curl -sf -X POST \\\n  https://api.livesellerpro.app/covers/lookup/batch \\\n  -H 'Content-Type: application/json' \\\n  -H 'X-Shopops-Tenant: bdc' \\\n  -d '{\"items\":[{\"upc\":\"76194138584602011\",\"title\":\"ABSOLUTE BATMAN #20\",\"publisher\":\"DC Comics\"}]}' \\\n  --max-time 30 2>&1)\nEXIT=$?\nif [ $EXIT -eq 0 ] && echo \"$RESULT\" | grep -q '\"coverMap\"'; then\n  echo \"STATUS=ok\"\n  echo \"PROBE_RESPONSE=${RESULT}\"\n  echo \"DETAIL=cover API reachable from Archon container\"\nelif echo \"$RESULT\" | grep -qiE 'could not resolve|timeout|connection refused|403|401'; then\n  echo \"STATUS=skipped_network_blocked\"\n  echo \"DETAIL=${RESULT}\"\n  echo \"WORKAROUND=Builder will write script and skeleton JSON; operator runs backfill locally and commits.\"\nelse\n  echo \"STATUS=failed_unexpected\"\n  echo \"DETAIL=${RESULT}\"\nfi\nexit 0\n"},{id: plan,depends_on: [read-spec,inspect-current-state,probe-cover-api],task_class: medium_work,prompt: "Plan the single-repo storefront cover-render implementation.\n\nWO: WO-STOREFRONT-CATALOG-REAL-COVERS-01\nClass: CODE (frontend-only, Vercel deploy is runtime proof)\nPolish bar: ROUGH OK (Mutant Market is beta tester, not paying)\n\n## Required Output (Markdown, exact headings)\n\n### Files to Create\n- scripts/backfill-seed-covers.mjs (Node ESM, one-shot operator script)\n- __tests__/lib/catalog-cover-fallback.test.ts (>= 4 bun tests)\n- lib/catalog-cover.ts (pure helper module -- exports shouldShowPalette + render\n  decision functions, so tests don't need React DOM)\n\n### Files to Modify\n- lib/seed-data/catalog.json (cover_url populated on >= 70% of items after backfill run)\n- app/shops/[shopSlug]/catalog/page.tsx (render <img> when cover_url truthy, else palette)\n- app/shops/[shopSlug]/comic/[upc]/page.tsx (only if file exists per inspect node + has hero img -- verify before touching)\n\n### Backfill Script Behavior\n- Reads lib/seed-data/catalog.json\n- Batches UPCs into chunks of 50\n- POSTs each chunk to https://api.livesellerpro.app/covers/lookup/batch\n  with header X-Shopops-Tenant: bdc and body\n  { items: [{ upc, title, publisher, series, issue }, ...] }\n- Reads response { ok, coverMap: { [upc]: { tier, url, source } } }\n- For coverMap[upc].url non-empty AND tier != 'placeholder' -> write into JSON\n- Otherwise leave cover_url=null\n- Logs resolved/placeholder/none counts\n- Writes file with 2-space indent + trailing newline (match existing format)\n- Exit 0 success, non-zero on network/auth error\n\n### Render Pattern (catalog/page.tsx)\nInside cat-card__cover div, add img-first then existing palette:\n  <div className=\"cat-card__cover\">\n    {item.cover_url ? (\n      <img src={item.cover_url} alt={item.title}\n           className=\"cat-card__cover-img\" loading=\"lazy\"\n           onError={(e) => { e.currentTarget.style.display = 'none'; }} />\n    ) : null}\n    {!item.cover_url ? (\n      <div className=\"issue-cover\">{/* existing palette content */}</div>\n    ) : null}\n  </div>\nSimpler ternary: render img OR palette, not both. Avoids CSS sibling complexity.\nIf cover_url is set, onError won't trigger re-render to palette (acceptable for ROUGH OK).\n\n### Helper Module (lib/catalog-cover.ts)\nexport function shouldShowPalette(item: { cover_url?: string | null }): boolean {\n  return !item.cover_url;\n}\nexport function getCoverImgProps(item: { cover_url?: string | null; title: string }) {\n  if (!item.cover_url) return null;\n  return { src: item.cover_url, alt: item.title, loading: 'lazy' as const };\n}\n\n### Test File (>= 4 tests, bun-compatible)\nUse `import { describe, it, expect } from 'bun:test'`. Test pure helpers:\n  a. shouldShowPalette returns true when cover_url is null\n  b. shouldShowPalette returns true when cover_url is empty string\n  c. shouldShowPalette returns false when cover_url is a non-empty URL\n  d. getCoverImgProps returns null for null cover_url\n  e. getCoverImgProps returns { src, alt, loading } when cover_url present\n\n### Commit Strategy\n- Branch: wo/storefront-catalog-real-covers-01 (off master)\n- Single commit:\n  feat(storefront): WO-STOREFRONT-CATALOG-REAL-COVERS-01 -- real cover art in catalog\n- PR base: master\n\n### Probe Output (cover API reachability)\n$probe-cover-api.output\n\n### Current State\n$inspect-current-state.output\n\n### Spec\n$read-spec.output\n"},{id: implement,depends_on: [plan],task_class: medium_work,loop: {fresh_context: true,until: COMPLETE,max_iterations: 5,prompt: "Implement WO-STOREFRONT-CATALOG-REAL-COVERS-01.\nCWD is the shopops-storefront repo root.\n\n## Plan\n$plan.output\n\n## Spec\n$read-spec.output\n\n## Probe Result (network reachability of api.livesellerpro.app)\n$probe-cover-api.output\n\n## Execution Rules\n\n1. Read app/shops/[shopSlug]/catalog/page.tsx in full before editing.\n   Note the existing cat-card__cover div structure (lines ~115-135).\n\n2. Create lib/catalog-cover.ts with pure helpers (no React dependency):\n     export function shouldShowPalette(item: { cover_url?: string | null }): boolean\n     export function getCoverImgProps(item: { cover_url?: string | null; title: string })\n\n3. Create scripts/backfill-seed-covers.mjs (Node ESM with shebang #!/usr/bin/env node):\n   - Reads lib/seed-data/catalog.json as JSON\n   - Chunks of 50 items, POSTs to https://api.livesellerpro.app/covers/lookup/batch\n     with header X-Shopops-Tenant: bdc and body { items: [...] }\n   - Builds request body with { upc, title, publisher, series, issue } per item\n   - Reads response.coverMap, writes resolved url back to items where\n     coverMap[upc].url non-empty AND coverMap[upc].tier != 'placeholder'\n   - Logs progress: chunk N/M, resolved=X placeholder=Y none=Z\n   - Writes back to catalog.json with JSON.stringify(data, null, 2) + '\\n'\n   - Use built-in fetch (Node 18+). No external deps.\n   - On non-OK response (status != 200 or !response.ok), log error and exit 1\n     so operator sees the failure.\n\n4. Run the backfill script:\n     node scripts/backfill-seed-covers.mjs\n   If probe-cover-api STATUS=skipped_network_blocked, SKIP this run and instead\n   note in commit message: \"backfill JSON to be run locally by operator before PR\n   merge -- see scripts/backfill-seed-covers.mjs\".\n\n5. After running, verify with python3 (jq not in container):\n     python3 -c \"import json; d=json.load(open('lib/seed-data/catalog.json')); print(sum(1 for x in d if x.get('cover_url')))\"\n   Target: >= 40 (70% of 57 seed items). Acceptable for ROUGH OK: whatever the\n   cascade returned. Log the actual count.\n\n6. Edit app/shops/[shopSlug]/catalog/page.tsx:\n   - Import shouldShowPalette + getCoverImgProps from '@/lib/catalog-cover'\n   - Inside the .map((item) => ...) loop, change cat-card__cover content:\n     {(() => {\n       const imgProps = getCoverImgProps(item);\n       return imgProps ? (\n         <img className=\"cat-card__cover-img\" {...imgProps}\n              onError={(e) => { e.currentTarget.style.display = 'none'; }} />\n       ) : (\n         <div className=\"issue-cover\">{/* existing palette */}</div>\n       );\n     })()}\n   - Keep cornerFlag, hero, palette, strip logic INSIDE the issue-cover branch.\n   - Do NOT remove the deterministic palette helper functions\n     (paletteFor, coverHero, cornerFlag) -- they remain in use for fallback.\n\n7. PDP file: only modify app/shops/[shopSlug]/comic/[upc]/page.tsx IF\n   inspect-current-state output says PDP_PAGE_EXISTS=true AND the file\n   has its own cover render block. If it just routes to catalog or has no\n   cover render, leave it.\n\n8. Create __tests__/lib/catalog-cover-fallback.test.ts with >= 4 tests on\n   the pure helpers (no React mount needed):\n     import { describe, it, expect } from 'bun:test';\n     import { shouldShowPalette, getCoverImgProps } from '@/lib/catalog-cover';\n     ... 4+ assertions per plan.\n\n9. Do NOT push. Do NOT commit. Do NOT run deployment commands.\n\n## Completion Criteria\nOutput <promise>COMPLETE</promise> only when:\n  - lib/catalog-cover.ts exists with shouldShowPalette + getCoverImgProps\n  - scripts/backfill-seed-covers.mjs exists and is executable (chmod +x via git)\n  - lib/seed-data/catalog.json has cover_url populated on >= 40 items\n    (or: skipped with explicit operator-run note if network was blocked)\n  - app/shops/[shopSlug]/catalog/page.tsx imports + uses the helpers\n  - __tests__/lib/catalog-cover-fallback.test.ts has >= 4 tests\n  - bun test __tests__/lib/catalog-cover-fallback.test.ts passes\n"}},{id: verify-grep,depends_on: [implement],bash: "set -euo pipefail\necho \"=== grep assertions ===\"\n\nHELPER=\"lib/catalog-cover.ts\"\nls \"$HELPER\" || (echo \"FAIL: $HELPER missing\" >&2; exit 1)\ngrep -q \"shouldShowPalette\" \"$HELPER\" \\\n  || (echo \"FAIL: shouldShowPalette missing from $HELPER\" >&2; exit 1)\ngrep -q \"getCoverImgProps\" \"$HELPER\" \\\n  || (echo \"FAIL: getCoverImgProps missing from $HELPER\" >&2; exit 1)\n\nSCRIPT=\"scripts/backfill-seed-covers.mjs\"\nls \"$SCRIPT\" || (echo \"FAIL: $SCRIPT missing\" >&2; exit 1)\ngrep -q \"covers/lookup/batch\" \"$SCRIPT\" \\\n  || (echo \"FAIL: $SCRIPT does not reference covers/lookup/batch endpoint\" >&2; exit 1)\ngrep -q \"X-Shopops-Tenant\" \"$SCRIPT\" \\\n  || (echo \"FAIL: $SCRIPT missing X-Shopops-Tenant header\" >&2; exit 1)\n\nCATALOG=\"lib/seed-data/catalog.json\"\nls \"$CATALOG\" || (echo \"FAIL: $CATALOG missing\" >&2; exit 1)\n# python3 replaces jq (no jq in bun container)\nWITH_COVER=$(python3 -c \"import json; d=json.load(open('$CATALOG')); print(sum(1 for x in d if x.get('cover_url')))\")\nTOTAL=$(python3 -c \"import json; print(len(json.load(open('$CATALOG'))))\")\necho \"COVER_URLS_POPULATED=${WITH_COVER}/${TOTAL}\"\n# ROUGH OK: warn if <40 but don't fail; spec Section 10 explicitly allows lower threshold\nif [ \"$WITH_COVER\" -lt 40 ]; then\n  echo \"WARN: cover_url populated on ${WITH_COVER} items (< 40 target)\" >&2\n  echo \"WARN: per WO Section 10, ship at achieved percentage with note in manifest.\" >&2\nfi\n\nPAGE=\"app/shops/[shopSlug]/catalog/page.tsx\"\nls \"$PAGE\" || (echo \"FAIL: $PAGE missing\" >&2; exit 1)\ngrep -q \"cover_url\" \"$PAGE\" \\\n  || (echo \"FAIL: $PAGE does not reference item.cover_url\" >&2; exit 1)\ngrep -q \"catalog-cover\" \"$PAGE\" \\\n  || (echo \"FAIL: $PAGE does not import from lib/catalog-cover\" >&2; exit 1)\n# Palette helpers must still exist for fallback\ngrep -q \"issue-cover\" \"$PAGE\" \\\n  || (echo \"FAIL: issue-cover palette removed from $PAGE -- fallback broken\" >&2; exit 1)\n\nTEST=\"__tests__/lib/catalog-cover-fallback.test.ts\"\nls \"$TEST\" || (echo \"FAIL: $TEST missing\" >&2; exit 1)\nTEST_COUNT=$(grep -cE \"it\\(|test\\(\" \"$TEST\" || echo 0)\necho \"TEST_COUNT=${TEST_COUNT}\"\nif [ \"$TEST_COUNT\" -lt 4 ]; then\n  echo \"FAIL: Expected >= 4 tests in $TEST, found $TEST_COUNT\" >&2\n  exit 1\nfi\n\necho \"=== all grep assertions passed ===\"\n"},{id: verify-tests,depends_on: [implement],bash: "set -euo pipefail\nTEST_FILE=\"__tests__/lib/catalog-cover-fallback.test.ts\"\nif [ ! -f \"$TEST_FILE\" ]; then\n  echo \"FAIL: $TEST_FILE missing\" >&2\n  exit 1\nfi\nbun test \"$TEST_FILE\"\n"},{id: verify-build,depends_on: [verify-grep,verify-tests],bash: "# set -e DELIBERATELY OMITTED -- Next.js build can warn-but-succeed\nOUTPUT=$(bun run build 2>&1 || bun run build 2>&1)\nEXIT=$?\nif [ $EXIT -eq 0 ]; then\n  echo \"STATUS=ok\"\n  echo \"BUILD_RESULT=success\"\nelif echo \"$OUTPUT\" | grep -qi 'No such file\\|command not found'; then\n  echo \"STATUS=skipped_no_build_script\"\n  echo \"DETAIL=No build script available in Archon CI -- Vercel preview is authoritative.\"\nelse\n  echo \"STATUS=failed_unexpected\"\n  echo \"DETAIL=${OUTPUT}\" | tail -40\n  echo \"OPERATOR_NOTE: Build failed in Archon CI but Vercel preview will be authoritative.\"\nfi\nexit 0\n"},{id: commit-and-push,depends_on: [verify-build],bash: "set -euo pipefail\nBASE_BRANCH=\"wo/storefront-catalog-real-covers-01\"\n# Default to unique run-suffixed branch (avoids worktree collisions)\nBRANCH=\"${BASE_BRANCH}-run-$(date +%Y%m%d%H%M%S)\"\ngit checkout -b \"$BRANCH\" 2>/dev/null || git checkout \"$BRANCH\"\n\n# Stage all WO-related files\ngit add lib/catalog-cover.ts\ngit add scripts/backfill-seed-covers.mjs\ngit add lib/seed-data/catalog.json\ngit add \"app/shops/[shopSlug]/catalog/page.tsx\"\ngit add __tests__/lib/catalog-cover-fallback.test.ts\n\n# Optional PDP page if builder touched it\nif [ -f \"app/shops/[shopSlug]/comic/[upc]/page.tsx\" ]; then\n  git add \"app/shops/[shopSlug]/comic/[upc]/page.tsx\" || true\nfi\n\nif git diff --cached --quiet; then\n  echo \"No staged changes; branch already contains requested work\"\nelse\n  git -c user.name=\"John Ranson\" -c user.email=\"admin@bluedevilcollectibles.com\" \\\n    commit -m \"$(printf 'feat(storefront): WO-STOREFRONT-CATALOG-REAL-COVERS-01 -- real cover art in catalog\\n\\nPlugs the existing AutoFix cover resolution pipeline (POST /covers/lookup/batch)\\ninto the storefront catalog so real comic art renders instead of placeholder\\ncolored text plates.\\n\\nWhat changed:\\n  - scripts/backfill-seed-covers.mjs: one-shot script that calls the cover\\n    cascade for every UPC in lib/seed-data/catalog.json and writes resolved\\n    URLs back into the JSON. Operator-run; static after that.\\n  - lib/seed-data/catalog.json: cover_url populated for items the cascade\\n    could resolve (Lunar > comic_covers > PRH-ISBN > fuzzy > ai_pick).\\n  - lib/catalog-cover.ts: pure helpers (shouldShowPalette, getCoverImgProps)\\n    keep render logic out of the page component and testable from bun.\\n  - app/shops/[shopSlug]/catalog/page.tsx: renders <img src={item.cover_url}>\\n    when truthy, falls back to existing deterministic-palette colored plate\\n    when null. onError hides broken images.\\n  - __tests__/lib/catalog-cover-fallback.test.ts: 4+ bun tests on pure helpers.\\n\\nPolish bar: ROUGH OK (Mutant Market is beta tester, not paying -- per plan\\ndocs/plans/2026-06-15-mutant-market-hq-readiness.md).\\n\\nExisting fallback (deterministic palette + first-two-words-of-series hero)\\npreserved intact for items the cascade can'\\''t resolve.\\n\\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>')\"\nfi\n\ngit push -u origin \"$BRANCH\"\necho \"BRANCH=${BRANCH}\"\necho \"BRANCH_SHA=$(git rev-parse HEAD)\"\n"},{id: open-pr,depends_on: [commit-and-push],bash: "set -euo pipefail\n# Read branch from current HEAD (commit-and-push set it as the unique run-suffixed branch)\nBRANCH=\"$(git rev-parse --abbrev-ref HEAD)\"\nREPO=\"bluedevilcollectibles/shopops-storefront\"\nBASE=\"master\"\nTITLE=\"feat(storefront): WO-STOREFRONT-CATALOG-REAL-COVERS-01 -- real cover art in catalog\"\n\nBODY_FILE=$(mktemp)\n{\n  echo \"## Summary\"\n  echo \"Implements **WO-STOREFRONT-CATALOG-REAL-COVERS-01**.\"\n  echo \"\"\n  echo \"Plugs the existing \\`/covers/lookup/batch\\` cascade into the storefront\"\n  echo \"catalog so real cover art renders instead of placeholder colored text plates.\"\n  echo \"\"\n  echo \"## Changes\"\n  echo \"- \\`scripts/backfill-seed-covers.mjs\\` -- one-shot operator script (run once, JSON commits as artifact)\"\n  echo \"- \\`lib/seed-data/catalog.json\\` -- \\`cover_url\\` populated from cascade\"\n  echo \"- \\`lib/catalog-cover.ts\\` -- pure helpers (testable from bun, no React mount)\"\n  echo \"- \\`app/shops/[shopSlug]/catalog/page.tsx\\` -- \\`<img>\\` when \\`cover_url\\` truthy, palette fallback when null\"\n  echo \"- \\`__tests__/lib/catalog-cover-fallback.test.ts\\` -- 4+ bun tests\"\n  echo \"\"\n  echo \"## Polish Bar: ROUGH OK\"\n  echo \"Mutant Market is a beta tester, not paying. Per parent plan\"\n  echo \"\\`docs/plans/2026-06-15-mutant-market-hq-readiness.md\\` storefront polish\"\n  echo \"table item #16.\"\n  echo \"\"\n  echo \"Existing deterministic-palette fallback is preserved for items the\"\n  echo \"cascade can't resolve. No crashes on broken image URLs.\"\n  echo \"\"\n  echo \"## Tests\"\n  echo \"\\`bun test __tests__/lib/catalog-cover-fallback.test.ts\\`\"\n  echo \"\"\n  echo \"## Verify (Vercel preview)\"\n  echo \"Load preview URL \\`/shops/bdc/catalog\\` and visually confirm real cover art.\"\n  echo \"\"\n  echo \"Generated by Archon bdc-storefront-catalog-real-covers workflow.\"\n} > \"$BODY_FILE\"\n\nexisting_pr_url() {\n  gh pr list --repo \"$REPO\" --head \"$BRANCH\" --state open --json url \\\n    --template '{{range .}}{{.url}}{{end}}' 2>/dev/null\n}\nPR_URL=\"$(existing_pr_url)\"\nif [ -n \"$PR_URL\" ]; then\n  echo \"PR_URL=$PR_URL\"\n  exit 0\nfi\n\nfor attempt in 1 2 3 4 5; do\n  if PR_OUT=$(gh pr create --repo \"$REPO\" --base \"$BASE\" --head \"$BRANCH\" \\\n      --title \"$TITLE\" --body-file \"$BODY_FILE\" 2>&1); then\n    echo \"PR_URL=$PR_OUT\"\n    exit 0\n  fi\n  PR_URL=\"$(existing_pr_url)\"\n  if [ -n \"$PR_URL\" ]; then\n    echo \"PR_URL=$PR_URL\"\n    exit 0\n  fi\n  echo \"open-pr attempt $attempt failed: $PR_OUT\" >&2\n  sleep 10\ndone\necho \"open-pr failed after retries; branch pushed but no PR\" >&2\nexit 1\n"},{id: vercel-verify,depends_on: [open-pr],bash: "# set -e DELIBERATELY OMITTED -- Vercel deployments may legitimately be slow/queued\nBRANCH=\"$(git rev-parse --abbrev-ref HEAD)\"\nPROJECT=\"shopops-storefront\"\n\nif [ -z \"${VERCEL_TOKEN:-}\" ]; then\n  echo \"STATUS=skipped_no_vercel_token\"\n  echo \"DETAIL=VERCEL_TOKEN not set in Archon env. Manifest will note PENDING preview check.\"\n  echo \"OPERATOR: Verify Vercel preview manually at https://vercel.com/bluedevilcollectibles/${PROJECT}/deployments\"\n  exit 0\nfi\n\n# Poll Vercel API for latest deployment on this branch (~60s budget,\n# must stay under the DAG executor 120s subprocess timeout)\nfor attempt in 1 2 3; do\n  DEPLOY=$(curl -sf \\\n    \"https://api.vercel.com/v6/deployments?projectId=${PROJECT}&meta-githubCommitRef=${BRANCH}&limit=1\" \\\n    -H \"Authorization: Bearer ${VERCEL_TOKEN}\" 2>&1)\n  # python3 single-line replaces jq for nested JSON parsing\n  STATE=$(echo \"$DEPLOY\" | python3 -c \"import json,sys; d=json.load(sys.stdin); print(d.get('deployments',[{}])[0].get('state','UNKNOWN'))\" 2>/dev/null || echo UNKNOWN)\n  URL=$(echo \"$DEPLOY\" | python3 -c \"import json,sys; d=json.load(sys.stdin); print(d.get('deployments',[{}])[0].get('url',''))\" 2>/dev/null || echo \"\")\n  CREATED=$(echo \"$DEPLOY\" | python3 -c \"import json,sys; d=json.load(sys.stdin); print(d.get('deployments',[{}])[0].get('createdAt',''))\" 2>/dev/null || echo \"\")\n  COMMIT=$(echo \"$DEPLOY\" | python3 -c \"import json,sys; d=json.load(sys.stdin); print(d.get('deployments',[{}])[0].get('meta',{}).get('githubCommitSha',''))\" 2>/dev/null || echo \"\")\n  echo \"attempt=${attempt} state=${STATE} url=${URL}\"\n  if [ \"$STATE\" = \"READY\" ]; then\n    echo \"STATUS=ok\"\n    echo \"VERCEL_URL=https://${URL}\"\n    echo \"VERCEL_STATE=READY\"\n    echo \"VERCEL_CREATED_AT=${CREATED}\"\n    echo \"VERCEL_COMMIT=${COMMIT}\"\n    exit 0\n  fi\n  if [ \"$STATE\" = \"ERROR\" ] || [ \"$STATE\" = \"CANCELED\" ]; then\n    echo \"STATUS=failed_unexpected\"\n    echo \"DETAIL=Vercel deployment state=${STATE}\"\n    exit 0\n  fi\n  sleep 20\ndone\n\necho \"STATUS=skipped_still_building\"\necho \"DETAIL=Vercel did not reach READY within 60s poll. Last state: ${STATE}\"\necho \"OPERATOR: Re-check manually at https://vercel.com/bluedevilcollectibles/${PROJECT}/deployments\"\nexit 0\n"},{id: build-manifest,depends_on: [vercel-verify],task_class: clerical,prompt: "Build the Captain CI manifest v2 for WO-STOREFRONT-CATALOG-REAL-COVERS-01.\nClass: CODE (single-repo, frontend-only, Vercel deploy is runtime proof).\n\n## Required Fields (manifest v2 format, EXACT labels)\n\nWO: WO-STOREFRONT-CATALOG-REAL-COVERS-01\nBuilder: Major Build (Archon bdc-storefront-catalog-real-covers)\n\nFiles modified:\n  shopops-storefront/lib/seed-data/catalog.json\n  shopops-storefront/app/shops/[shopSlug]/catalog/page.tsx\n  [PDP page if touched per implement output]\n\nFiles created:\n  shopops-storefront/scripts/backfill-seed-covers.mjs\n  shopops-storefront/lib/catalog-cover.ts\n  shopops-storefront/__tests__/lib/catalog-cover-fallback.test.ts\n\nTests:\n  [count from verify-tests output] passing / [count] total\n  command: bun test __tests__/lib/catalog-cover-fallback.test.ts\n\nPRs:\n  shopops-storefront (master): [from open-pr.output PR_URL]\n\nMerge ancestors:\n  shopops-storefront master HEAD=[BRANCH_SHA from commit-and-push.output],\n  manifest commit, behind_by: 0\n\nGrep assertions:\n  grep -c 'item.cover_url' app/shops/[shopSlug]/catalog/page.tsx  # >= 1\n  grep -c 'shouldShowPalette\\|getCoverImgProps' lib/catalog-cover.ts  # >= 2\n  python3 -c \"import json; d=json.load(open('lib/seed-data/catalog.json')); print(sum(1 for x in d if x.get('cover_url')))\"\n  [include actual count from verify-grep.output COVER_URLS_POPULATED]\n\nRuntime verification: N/A (CODE class, frontend-only -- Vercel preview is the runtime proof)\n\nVercel deployment:\n  [VERCEL_URL, VERCEL_STATE, VERCEL_CREATED_AT, VERCEL_COMMIT from vercel-verify.output]\n  If STATUS=skipped_* or failed, note that explicitly and ask operator to re-verify.\n\nVALIDATION: PASS (Polish bar: ROUGH OK per WO Section 10 -- Mutant Market beta)\n\n## Inputs\n$read-spec.output\n$inspect-current-state.output\n$probe-cover-api.output\n$plan.output\n$verify-grep.output\n$verify-tests.output\n$verify-build.output\n$commit-and-push.output\n$open-pr.output\n$vercel-verify.output\n"},{id: flip-notion,depends_on: [build-manifest],task_class: clerical,bash: "set -euo pipefail\n\ncapture_node_output() {\n  python3 -c 'import shlex, sys; s=sys.stdin.read(); sys.stdout.write((lambda p: p[0] if len(p)==1 else s)(shlex.split(s)) if len(s)>=2 and s[0]==\"'\"'\"'\" and s.rstrip(\"\\n\").endswith(\"'\"'\"'\") else s)'\n}\n\nMANIFEST=$(capture_node_output <<'BDC_NODE_OUTPUT_MANIFEST'\n$build-manifest.output\nBDC_NODE_OUTPUT_MANIFEST\n)\n\nREAD_SPEC_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_READ_SPEC'\n$read-spec.output\nBDC_NODE_OUTPUT_READ_SPEC\n)\nISSUE_REPO=\"${ISSUE_REPO:-bluedevilcollectibles/bdc-xo}\"\nISSUE_NUM=$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'issue=[0-9]+' | head -1 | cut -d= -f2 || true)\nif [ -z \"$ISSUE_NUM\" ]; then\n  ISSUE_NUM=$(printf '%s\\n' \"$READ_SPEC_OUT\" | sed -n 's/^SPEC_PATH=.*issues\\/\\([0-9][0-9]*\\).*/\\1/p' | head -1)\nfi\nif [ -z \"$ISSUE_NUM\" ]; then\n  WO_ID_FROM_SPEC=$(printf '%s\\n' \"$READ_SPEC_OUT\" | sed -n 's/^WO_ID=//p' | head -1)\n  if [ -n \"$WO_ID_FROM_SPEC\" ]; then\n    ISSUE_NUM=$(gh issue list --repo \"$ISSUE_REPO\" --search \"$WO_ID_FROM_SPEC in:title\" --json number --jq '.[0].number // empty' 2>/dev/null || true)\n  fi\nfi\nif [ -z \"$ISSUE_NUM\" ]; then\n  echo \"flip-notion: no GitHub issue resolved; skipping status:review label + manifest comment.\"\n  exit 0\nfi\n\ngh label create status:review --repo \"$ISSUE_REPO\" --color 0E8A16 --description \"BDC workflow is ready for review\" 2>/dev/null || true\ngh issue edit \"$ISSUE_NUM\" --repo \"$ISSUE_REPO\" --remove-label status:building 2>/dev/null || true\ngh issue edit \"$ISSUE_NUM\" --repo \"$ISSUE_REPO\" --remove-label status:blocked 2>/dev/null || true\ngh issue edit \"$ISSUE_NUM\" --repo \"$ISSUE_REPO\" --add-label status:review\nCOMMENT_FILE=$(mktemp)\nprintf '%s\\n' \"$MANIFEST\" > \"$COMMENT_FILE\"\ngh issue comment \"$ISSUE_NUM\" --repo \"$ISSUE_REPO\" --body-file \"$COMMENT_FILE\"\necho \"flip-notion: $ISSUE_REPO#$ISSUE_NUM -> status:review (manifest posted as comment)\"\n"}]}