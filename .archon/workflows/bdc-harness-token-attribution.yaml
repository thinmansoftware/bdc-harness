{name: bdc-harness-token-attribution,description: "Use when: Executing WO-HARNESS-TOKEN-ATTRIBUTION-01 -- persist real per-node + per-run\ntoken usage (the Claude Agent SDK already returns it) into the existing JSONB columns and\nexpose it via the runs/events API, with a derived Max-20x quota-window line.\nInput: WO_ID = WO-HARNESS-TOKEN-ATTRIBUTION-01 (+ optional NOTION_PAGE_ID).\nDoes:\n  - Reads the WO spec from bdc-xo docs/work-orders/ on main.\n  - Plans + self-reviews the plan (plan-review loop), then implements in\n    packages/workflows (dag-executor.ts) + packages/server (runs API).\n  - Mirrors the EXISTING cost-persistence path for TOKENS in BOTH executors\n    (executeAiNode AND executeLoopNode); extends NodeExecutionResult with tokens?: TokenUsage.\n  - Verifies: bun x tsc --noEmit clean + bun test (8 new scenarios + the two existing\n    regression suites: dag-executor.test.ts, api.workflow-runs.test.ts).\n  - Cross-model diff-review (Codex) before the irreversible commit.\n  - Commits, pushes a feature branch, opens a PR to bdc-harness dev.\n  - Flips Notion to REVIEW (NEVER DONE) with the v2 manifest in Notes.\nRepo: bluedevilcollectibles/bdc-harness (binds via target_repo + bdc-harness- name prefix).\nWO Class: CODE. NO migration. NO web/UI. provider.ts MUST stay untouched.\nparallel_ok: false (touches the shared execution layer of the harness itself).\n",policyFile: harness/policies/agent-behavior.md,model: sonnet,target_repo: bluedevilcollectibles/bdc-harness,inputs: {WO_ID: {default: WO-HARNESS-TOKEN-ATTRIBUTION-01},NOTION_PAGE_ID: {default: 374ef4c9-ce00-81e8-8d45-c6c46f944e4e}},nodes: [{id: preflight-github-auth,load_bearing: true,bash: "set -euo pipefail\nif ! git push --dry-run origin \"HEAD:refs/heads/preflight-auth-probe-$(date +%s)\" 2>&1; then\n  echo \"ERROR: GITHUB auth check failed -- container cannot push to origin.\" >&2\n  echo \"Likely cause: GITHUB_TOKEN missing in executor env, or token lacks repo scope.\" >&2\n  exit 1\nfi\necho \"preflight-github-auth PASS\"\n"},{id: read-spec,depends_on: [preflight-github-auth],bash: "set -euo pipefail\nWO_ID=\"${WO_ID:-WO-HARNESS-TOKEN-ATTRIBUTION-01}\"\n# Specs live in bdc-xo on main (NOT the worktree, which is bdc-harness). Cross-repo via gh api.\n# Rule 5: try docs/work-orders/ direct, then date-prefix glob in docs/superpowers/specs/.\nSPEC_CONTENT=$(gh api \\\n  \"repos/bluedevilcollectibles/bdc-xo/contents/docs/work-orders/${WO_ID}.md?ref=main\" \\\n  --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nif [ -z \"$SPEC_CONTENT\" ]; then\n  SPEC_CONTENT=$(gh api \\\n    \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs/${WO_ID}.md?ref=main\" \\\n    --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  GLOB_PATH=$(gh api \\\n    \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main\" \\\n    --template '{{range .}}{{.path}}{{\"\\n\"}}{{end}}' 2>/dev/null \\\n    | grep \"${WO_ID}.md$\" | head -1 || true)\n  if [ -n \"$GLOB_PATH\" ]; then\n    SPEC_CONTENT=$(gh api \\\n      \"repos/bluedevilcollectibles/bdc-xo/contents/${GLOB_PATH}?ref=main\" \\\n      --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \\\n    --search \"${WO_ID} in:title\" --json number --jq '.[0].number' 2>/dev/null || true)\n  if [ -n \"$ISSUE_NUM\" ] && [ \"$ISSUE_NUM\" != \"null\" ]; then\n    SPEC_CONTENT=$(gh issue view \"$ISSUE_NUM\" --repo bluedevilcollectibles/bdc-xo \\\n      --json body --jq .body 2>/dev/null || true)\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  echo \"Spec not found for ${WO_ID} (tried docs/work-orders/, docs/superpowers/specs/ direct + glob, and GitHub issue search). Spec must be on bdc-xo main before fire.\" >&2\n  exit 1\nfi\nprintf 'WO_ID=%s\\n\\n--- SPEC ---\\n%s\\n' \"$WO_ID\" \"$SPEC_CONTENT\"\n"},{id: fresh-branch,depends_on: [read-spec],bash: "set -euo pipefail\n# bdc-harness INTEGRATION branch is dev, NOT main. Pin the base to dev so the\n# worktree starts from the integration head and the PR targets dev.\nBASE_BRANCH=\"dev\"\ngit fetch origin \"$BASE_BRANCH\" --depth=50 || true\ngit checkout \"$BASE_BRANCH\" 2>/dev/null || echo \"branch held; staying on current HEAD\"\ngit reset --hard \"origin/$BASE_BRANCH\" 2>/dev/null || true\nBRANCH=\"wo/token-attribution-01-run-$(date +%Y%m%d%H%M%S)\"\ngit checkout -b \"$BRANCH\"\necho \"BASE_BRANCH=${BASE_BRANCH}\"\necho \"BRANCH=${BRANCH}\"\n"},{id: plan,persona: war-council-architect,agent: war-council-architect,depends_on: [fresh-branch],task_class: medium_work,prompt: "Read the BDC Work Order spec below and produce a concise, surgical implementation plan.\nYou are READ-ONLY (no file writes). This is a CODE WO that EXTENDS an existing path --\nit is NOT a rewrite. The single biggest risk is scope creep and touching forbidden files.\n\n## What this WO does (one sentence)\nMirror the EXISTING cost-persistence path for TOKENS: per-node tokens into\nremote_agent_workflow_events.data.tokens and a per-run total into\nremote_agent_workflow_runs.metadata.total_tokens, then expose both via the runs/events\nAPI with a derived Max-20x quota-window line. No migration, no web/UI.\n\n## HARD scope boundaries (the plan MUST encode all of these)\n- IN SCOPE: packages/workflows/src/dag-executor.ts AND packages/server (runs/events API +\n  the small derived quota-window summary). Test files for both packages.\n- OUT OF SCOPE -- the plan MUST list these explicitly as out-of-scope:\n  * packages/providers/src/claude/provider.ts -- DO NOT MODIFY (it already emits tokens;\n    it is the read-only contract this WO consumes). The stop condition greps that\n    git diff --name-only origin/dev -- packages/providers/src/claude/provider.ts returns nothing.\n  * packages/web -- NO UI. Display is WO-MC-NEGAN-DIAGNOSTIC-GRAPH-01, a separate WO.\n  * Any new DB table or migration -- both target columns are EXISTING JSONB.\n\n## The exact edit sites (from spec Section 7 -- architect-verified line anchors; the\n## numbers may have drifted, so locate by the named symbol, not the literal line)\n1. TYPE FIRST (blocking, or tsc fails): dag-executor.ts ~:185 extend\n     type NodeExecutionResult = NodeOutput & { costUsd?: number }\n   to\n     type NodeExecutionResult = NodeOutput & { costUsd?: number; tokens?: TokenUsage }\n   TokenUsage is already imported (~:22) -- no new import.\n2. AI-node (executeAiNode) -- mirror cost in FOUR places:\n   a. The node_completed createWorkflowEvent data block (~:1219-1230, next to cost_usd\n      at ~:1226 and model_usage at ~:1229): add ...(nodeTokens ? { tokens: nodeTokens } : {}).\n   b. The THREE return objects that already carry costUsd: completed return (~:1254),\n      user-cancel return (~:1270), catch return (~:1303): add ...(nodeTokens ? { tokens: nodeTokens } : {}).\n   NOTE: ~:1245 emitter.emit spread is OPTIONAL (helps live SSE) and is NOT a required persist site.\n3. LOOP-node (executeLoopNode) -- the SAME gap, FIVE sites (loop nodes are the highest-token\n   consumers -- the diff-repair heavy node this WO exists for):\n   a. declare let loopTotalTokens: TokenUsage | undefined next to loopTotalCostUsd (~:1962).\n   b. accumulate where msg.cost is accumulated (~:2135) -- sum input/output, total when present.\n   c. add ...(loopTotalTokens ? { tokens: loopTotalTokens } : {}) to the loop node_completed\n      event data block (~:2421, next to its cost_usd).\n   d. add the same spread to the loop returns at ~:2442-2447, ~:2502, ~:2513-2517.\n4. RUN AGGREGATE trio: dag-executor.ts ~:2777 declare let totalTokens = 0 next to totalCostUsd;\n   ~:3222 add (guarded) totalTokens += output.tokens.total ?? (input+output); ~:3385 add\n   ...(totalTokens > 0 ? { total_tokens: totalTokens } : {}) to completeWorkflowRun alongside total_cost_usd.\n5. SERVER API: packages/server runs/events read path -- spec Section 7 says GET /api/workflows/runs/:runId\n   spreads the full row (metadata passes through) so JSONB tokens flow with NO change; the\n   builder CONFIRMS this with the integration test rather than assuming. The NEW work is a small\n   DERIVED quotaWindow summary { windowTokens, windowBudget, windowResetAt } on the runs API,\n   using config/env constants MAX20X_WINDOW_TOKENS / MAX20X_WINDOW_HOURS with a clearly-labelled\n   DEFAULT and a comment that this is an ESTIMATE of the Max-20x rate-limit window, not a billed\n   quota. If the window budget is not defensible, ship windowBudget: null (raw-first fallback).\n\n## INVARIANTS THAT MUST NOT BREAK (spec Q6)\n- The cost path: per-node cost_usd persistence + total_cost_usd aggregate MUST still work and\n  total_cost_usd values MUST be byte-identical to pre-change (test scenario 3 + 8 assert this).\n- Absent-usage nodes OMIT tokens (never write 0, never {}). Mirror the cost omit-when-undefined behavior.\n- Resume semantics: a resumed run counts ONLY resumed-portion tokens (mirror the :2776 cost comment);\n  do NOT fabricate pre-resume tokens.\n\n## Required Output (structured Markdown)\n- WO ID\n- Files to modify  (list each exact path)\n- Files to create  (test files)\n- Files explicitly OUT OF SCOPE (provider.ts, packages/web, any migration)\n- Verification commands  (bun x tsc --noEmit; bun test for both packages; the grep assertions)\n- Commit message\n- Push policy  (feature branch + PR to dev; bdc-harness is not a Rule-20 customer repo, no staging gate)\n\n## Spec\n$read-spec.output\n"},{id: plan-review,persona: war-council-architect,agent: war-council-architect,depends_on: [plan],task_class: medium_work,loop: {fresh_context: true,until: PLAN_REVIEW_APPROVED,max_iterations: 3,prompt: "You are the War Council Architect doing an adversarial self-review of the\nimplementation plan, then REVISING it in place. One initial pass + up to 2 repair\nattempts. You are READ-ONLY (no file writes, no shell) -- output goes to STDOUT.\n\n## Prior iteration (read FIRST)\n$LOOP_PREV_OUTPUT\nIf it contains findings (PLAN_REVIEW_PASS=false), resolve every one in the revised plan\nthis iteration. If a finding repeats and you cannot resolve it, escalate (below).\n\n## Inputs\nOriginal plan: $plan.output\nSpec: $read-spec.output\n\n## Attack the plan on these dimensions (token-attribution specific)\n1. Scope creep -- any file not justified by the spec. ESPECIALLY: does the plan touch\n   packages/providers/src/claude/provider.ts? If so it is WRONG (must be untouched).\n   Does it touch packages/web? If so it is WRONG (no UI in this WO).\n2. Missing edit sites -- does the plan cover BOTH executors? executeAiNode AND\n   executeLoopNode each have the gap. A plan that only does executeAiNode is INCOMPLETE\n   and the motivating loop-node case (diff-repair heavy node) goes unmet -- FAIL it.\n3. Type extension first -- does the plan extend NodeExecutionResult with tokens?: TokenUsage\n   BEFORE accessing output.tokens in the aggregate loop? If not, tsc fails -- FAIL it.\n4. Migration -- does the plan propose any new table or migration? It must NOT (both targets\n   are EXISTING JSONB). If it does, FAIL it.\n5. No-regression -- does the plan keep the cost path intact and require the two existing\n   test files (dag-executor.test.ts, api.workflow-runs.test.ts) to still pass?\n6. Omit-when-absent + resume semantics encoded (never write 0; resumed-portion only).\n7. Out-of-scope list present and correct.\n\n## Self-repair (the point -- do not just report)\nIf you find issues AND they are plan-level fixable, REVISE the plan to resolve them and\nemit the corrected plan in full. Do not halt for a human on anything you can fix here.\n\n## Required STDOUT format (emit EXACTLY this shape; fenced so downstream consumes ONLY the plan)\n  PLAN_REVIEW_PASS=<true|false>\n  PLAN_REVIEW_RISK=<LOW|MEDIUM|HIGH>\n\n  === APPROVED_PLAN_BEGIN ===\n  <the FINAL revised plan in full -- this and ONLY this is what implement uses>\n  === APPROVED_PLAN_END ===\n\n  === PLAN_REVIEW_FINDINGS_BEGIN ===\n  <your findings / what you changed and why, or \"(none)\">\n  === PLAN_REVIEW_FINDINGS_END ===\n\nThe APPROVED_PLAN block must always contain a complete, usable plan (even on a passing\nfirst iteration where you changed nothing -- echo the plan there). Keep ALL critique inside\nthe FINDINGS block; never let critique leak into the APPROVED_PLAN block.\n\n## Completion sentinel (success ONLY)\nIf and ONLY if PLAN_REVIEW_PASS=true, emit on its OWN LINE as the LAST line:\n  PLAN_REVIEW_APPROVED\nOn a failing iteration emit instead (never the approved token):\n  PLAN_REVIEW_NEEDS_REVISION\n\n## Escalation (emit instead of approving; never the approved sentinel)\nIf the spec is ambiguous/contradictory, the fix needs ungranted scope, or the same finding\nsurvived a prior attempt -- set PLAN_REVIEW_PASS=false, emit PLAN_REVIEW_NEEDS_REVISION, and\nput this inside the FINDINGS block:\n  ESCALATION_REQUIRED=true\n  ESCALATION_REASON=<ambiguous-spec|new-side-effect-class|loop-exhausted>\n  WO_ID=WO-HARNESS-TOKEN-ATTRIBUTION-01\n  NODE=plan-review\n  ATTEMPTS=<n>/3\n  WHAT_FAILED=<one paragraph>\n  WHAT_WAS_TRIED=<3-6 bullets>\n  LAST_REVIEW_FINDINGS=<exact bullets>\n  SINGLE_DECISION_NEEDED=<one sentence John can answer>\n  SAFE_STATE=<nothing committed/pushed; plan stage only>\n"}},{id: implement,persona: major-build,agent: major-build,depends_on: [plan-review],task_class: medium_work,loop: {fresh_context: true,until: COMPLETE,max_iterations: 5,prompt: "Implement WO-HARNESS-TOKEN-ATTRIBUTION-01 in bluedevilcollectibles/bdc-harness.\nCWD = repo root (the bdc-harness worktree). This is a CODE WO that EXTENDS the existing\ncost-persistence path to ALSO persist TOKENS. It is NOT a rewrite.\n\n## Spec\n$read-spec.output\n\n## Plan (approved by plan-review)\nUse ONLY the text between === APPROVED_PLAN_BEGIN === and === APPROVED_PLAN_END === below.\nIGNORE everything outside those markers (verdict headers, FINDINGS block, sentinels).\n$plan-review.output\n\n## Branch\n$fresh-branch.output\n\n## Files in scope (the ONLY files you may modify)\n- packages/workflows/src/dag-executor.ts\n- packages/server/...  (the runs/events API + the small derived quota-window summary; locate\n  the actual route + db read files by following the spec Section 7 references)\n- the test files for both packages (dag-executor.test.ts and api.workflow-runs.test.ts, plus\n  any new test file you add for the new scenarios)\n\n## Files you MUST NOT touch (FAIL if you find yourself editing these)\n- packages/providers/src/claude/provider.ts  -- it already emits tokens; read-only contract.\n- anything under packages/web  -- no UI in this WO.\n- any db migration  -- both target columns (events.data, runs.metadata) are EXISTING JSONB.\n\n## STEP 0 -- field-availability check FIRST (spec Section 7 requires this)\nConfirm msg.tokens is the field carried from the provider into dag-executor.ts where\nnodeTokens is set (~:966 nodeTokens = msg.tokens). The JSONL logNodeComplete path ALREADY\nlogs tokens -- that proves the data is live in memory before you touch persistence. Do NOT\nmodify provider.ts to \"make tokens appear\"; they already arrive.\n\n## STEP 1 -- TYPE extension (blocking; do this before the aggregate edit or tsc fails)\nExtend, at dag-executor.ts ~:185 (locate by symbol NodeExecutionResult):\n  type NodeExecutionResult = NodeOutput & { costUsd?: number; tokens?: TokenUsage }\nTokenUsage is already imported (~:22). Do NOT add a new import.\n\n## STEP 2 -- executeAiNode (mirror cost in 4 sites)\n- node_completed createWorkflowEvent data block (next to cost_usd / model_usage):\n    ...(nodeTokens ? { tokens: nodeTokens } : {})\n- the THREE return objects that carry costUsd (completed, user-cancel, catch): same spread.\n\n## STEP 3 -- executeLoopNode (the SAME gap; 5 sites -- DO NOT SKIP, this is the\n## highest-token consumer and the motivating case for the whole WO)\n- declare:  let loopTotalTokens: TokenUsage | undefined   (next to loopTotalCostUsd)\n- accumulate where msg.cost is accumulated:\n    if (msg.tokens) {\n      const t = msg.tokens;\n      if (!loopTotalTokens) loopTotalTokens = { input: 0, output: 0 };\n      loopTotalTokens.input += t.input;\n      loopTotalTokens.output += t.output;\n      if (t.total !== undefined) loopTotalTokens.total = (loopTotalTokens.total ?? 0) + t.total;\n    }\n- loop node_completed event data block: ...(loopTotalTokens ? { tokens: loopTotalTokens } : {})\n- the loop return objects that carry costUsd: same spread (each currently returns costUsd: loopTotalCostUsd).\n\n## STEP 4 -- run aggregate trio\n- declare let totalTokens = 0 next to totalCostUsd (~:2777).\n- at the cost-accumulate site (~:3222), guarded:\n    if (output.tokens) totalTokens += (output.tokens.total ?? ((output.tokens.input ?? 0) + (output.tokens.output ?? 0)));\n- at completeWorkflowRun (~:3385), alongside total_cost_usd:\n    ...(totalTokens > 0 ? { total_tokens: totalTokens } : {})\n\n## STEP 5 -- server quota-window summary (the only NEW surface)\n- Add a derived quotaWindow { windowTokens, windowBudget, windowResetAt } to the runs API.\n- windowBudget + window length come from config/env constants MAX20X_WINDOW_TOKENS /\n  MAX20X_WINDOW_HOURS with a clearly-labelled DEFAULT and a code comment that this is an\n  ESTIMATE of the Max-20x rate-limit window, NOT a billed quota.\n- windowTokens = sum of total_tokens across runs whose activity is in the current window.\n- If the budget is not defensible, ship windowBudget: null and still emit windowTokens\n  (raw-first fallback). Do NOT fabricate a precise budget.\n- Confirm (do not assume) the existing GET /api/workflows/runs/:runId already passes metadata\n  through unchanged; if it strips unknown JSONB keys, that is an API-serializer fix (still no migration).\n\n## INVARIANTS (Q6 -- assert these in tests, do not just claim them)\n- The cost path still works; total_cost_usd is byte-identical to pre-change.\n- Absent-usage nodes OMIT tokens (never 0, never {}).\n- Resumed runs count only resumed-portion tokens (mirror :2776 cost semantics).\n\n## TESTS -- write the 8 scenarios from spec Section 11 (real-behavior asserts, not\n## \"did not throw\"; mirror the existing cost-test mock style in dag-executor.test.ts):\n1. Per-node token persistence: data.tokens == {input:1000, output:500, total:1500}.\n2. Omit when absent: data.tokens ABSENT (not 0, not {}).\n3. Per-run aggregate: nodes 1500/800/0(absent) -> metadata.total_tokens === 2300 AND\n   total_cost_usd unchanged from current (assert BOTH -- proves no cost regression).\n4. API exposes tokens: runs/events API response includes data.tokens per event and\n   metadata.total_tokens per run (integration test extending api.workflow-runs.test.ts).\n5. Quota window line: configured budget -> {windowTokens:N, windowBudget:W, windowResetAt};\n   unconfigured -> windowBudget:null with windowTokens still present.\n6. Resume semantics: resumed run's total_tokens excludes pre-resume node tokens.\n7. Loop-node token persistence: executeLoopNode iterations totaling input:2000/output:900 ->\n   data.tokens reflects summed loopTotalTokens.\n8. No regression: dag-executor.test.ts + api.workflow-runs.test.ts still PASS.\n\n## Self-verify BEFORE you finish (run from repo root; all must succeed)\n- bun x tsc --noEmit        (in packages/workflows AND packages/server -- must exit 0)\n- bun test                  (affected packages -- 8 new scenarios pass; the two existing suites pass)\n- grep assertions (spec Section 12):\n    [ $(grep -c \"tokens: nodeTokens\" packages/workflows/src/dag-executor.ts) -ge 2 ]\n    [ $(grep -c \"loopTotalTokens\" packages/workflows/src/dag-executor.ts) -ge 3 ]\n    [ $(grep -c \"total_tokens\" packages/workflows/src/dag-executor.ts) -ge 1 ]\n    [ $(grep -c \"totalTokens\" packages/workflows/src/dag-executor.ts) -ge 2 ]\n    grep -nE \"NodeExecutionResult = NodeOutput &.*tokens\\?: TokenUsage\" packages/workflows/src/dag-executor.ts\n    [ -z \"$(git diff --name-only origin/dev -- packages/providers/src/claude/provider.ts)\" ]\n\n## Execution rules\n- Modify only the in-scope files. Prefer existing repo patterns/helpers.\n- Do not reformat unrelated code. Do not deploy. Do not bypass gates.\n- ASCII only. No emojis, no em-dashes, no smart quotes -- use the ASCII hyphen.\n- Use bun (bun x / bun test), NEVER npm/npx/pnpm/yarn.\n- Do NOT use git commit --allow-empty or any verify-only commit to simulate completion.\n- Stop and report a blocker if the spec is ambiguous or a needed source of truth is missing.\n\n## Commit + push BEFORE exit (durability)\nBRANCH=$(git rev-parse --abbrev-ref HEAD)\ngit add -A\ngit diff --cached --quiet || git -c user.name=\"John Ranson\" \\\n  -c user.email=\"admin@bluedevilcollectibles.com\" \\\n  commit -m \"feat(workflows,server): WO-HARNESS-TOKEN-ATTRIBUTION-01 -- persist per-node + per-run token usage + quota-window API\"\ngit push -u origin \"$BRANCH\" 2>&1 || echo \"WARN: push failed -- backstop node will retry\"\n\nOutput COMPLETE on its own line when tsc is clean, the 8 scenarios pass, the two existing\nsuites still pass, and all grep assertions pass.\n"}},{id: verify-tsc-and-greps,depends_on: [implement],load_bearing: true,bash: "set -euo pipefail\nF=\"packages/workflows/src/dag-executor.ts\"\nif [ ! -f \"$F\" ]; then\n  echo \"ERROR: $F not found in worktree\" >&2\n  exit 1\nfi\n# Spec Section 12 grep assertions (BASH-EXECUTABLE).\n[ \"$(grep -c 'tokens: nodeTokens' \"$F\")\" -ge 2 ] || {\n  echo \"ERROR: 'tokens: nodeTokens' found < 2 times in $F (AI-node persist incomplete; need event data block + >=1 return)\" >&2\n  exit 1\n}\n[ \"$(grep -c 'loopTotalTokens' \"$F\")\" -ge 3 ] || {\n  echo \"ERROR: 'loopTotalTokens' found < 3 times in $F (loop-node persist incomplete; need declare + accumulate + >=1 persist/return)\" >&2\n  exit 1\n}\n[ \"$(grep -c 'total_tokens' \"$F\")\" -ge 1 ] || {\n  echo \"ERROR: 'total_tokens' not found in $F (run-aggregate metadata key missing)\" >&2\n  exit 1\n}\n[ \"$(grep -c 'totalTokens' \"$F\")\" -ge 2 ] || {\n  echo \"ERROR: 'totalTokens' found < 2 times in $F (need declare + accumulate)\" >&2\n  exit 1\n}\ngrep -nE 'NodeExecutionResult = NodeOutput &.*tokens\\?: TokenUsage' \"$F\" || {\n  echo \"ERROR: NodeExecutionResult was not extended with 'tokens?: TokenUsage' (tsc would fail on output.tokens)\" >&2\n  exit 1\n}\n# provider.ts MUST be untouched (spec Q6 + Section 12).\nif [ -n \"$(git diff --name-only origin/dev -- packages/providers/src/claude/provider.ts 2>/dev/null)\" ]; then\n  echo \"ERROR: packages/providers/src/claude/provider.ts was modified -- it MUST stay untouched (spec invariant).\" >&2\n  exit 1\nfi\n# No web/UI changes (spec Section 5).\nif [ -n \"$(git diff --name-only origin/dev -- packages/web 2>/dev/null)\" ]; then\n  echo \"ERROR: packages/web was modified -- this WO has NO UI (display is WO-MC-NEGAN-DIAGNOSTIC-GRAPH-01).\" >&2\n  exit 1\nfi\n# No migration (spec Section 9).\nif git diff --name-only origin/dev 2>/dev/null | grep -Eq 'migrations?/.*\\.(sql|ts)$'; then\n  echo \"ERROR: a migration file was added/modified -- this WO needs NO migration (both targets are EXISTING JSONB).\" >&2\n  exit 1\nfi\n# tsc (best-effort scoped: run in each package if the package dir exists).\nif [ -d packages/workflows ]; then\n  ( cd packages/workflows && bun x tsc --noEmit ) || { echo \"ERROR: tsc --noEmit failed in packages/workflows\" >&2; exit 1; }\nfi\nif [ -d packages/server ]; then\n  ( cd packages/server && bun x tsc --noEmit ) || { echo \"ERROR: tsc --noEmit failed in packages/server\" >&2; exit 1; }\nfi\necho \"verify-tsc-and-greps PASS: type extended, both executors persist tokens, run aggregate present, provider.ts/web/migrations untouched, tsc clean\"\n"},{id: capture-diff,depends_on: [verify-tsc-and-greps],bash: "set -uo pipefail\nmkdir -p \"$ARTIFACTS_DIR\"\nOUT=\"$ARTIFACTS_DIR/diff.patch\"\nBASE_REF=\"origin/dev\"\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\n{\n  echo \"### git diff --stat ($MB..HEAD)\"\n  git diff --stat \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### git diff --name-only ($MB..HEAD)\"\n  git diff --name-only \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### committed diff ($MB..HEAD)\"\n  git diff \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### unstaged working-tree diff (HEAD..worktree)\"\n  git diff HEAD 2>/dev/null || true\n} > \"$OUT\"\necho \"DIFF_BASE=$MB\"\necho \"DIFF_ARTIFACT=$OUT\"\necho \"DIFF_BYTES=$(wc -c < \"$OUT\" 2>/dev/null || echo 0)\"\n"},{id: diff-review,provider: codex,model: gpt-5.5,agent: codex-adversarial-reviewer,depends_on: [capture-diff],task_class: medium_work,prompt: "You are the Codex adversarial diff reviewer. Cross-model review of the diff major-build\nproduced, BEFORE it is committed to a PR. You are READ-ONLY: inspect and report, no edits,\nno state-mutating commands.\n\n## Inputs\nSpec: $read-spec.output\nVerify gate: $verify-tsc-and-greps.output\nDiff provenance: $capture-diff.output\nREAD the captured diff at the DIFF_ARTIFACT path ($ARTIFACTS_DIR/diff.patch). You have no\nBash tool -- do not run git. Use Read/Grep/Glob on the changed files for context.\n\n## Attack what tests + the gate can miss (token-attribution specific)\n1. provider.ts untouched -- confirm packages/providers/src/claude/provider.ts is NOT in the diff.\n2. BOTH executors -- confirm executeLoopNode (not just executeAiNode) persists tokens. The\n   loop node is the motivating heavy-token case; if only the AI node was patched, FLAG it.\n3. Omit-when-absent -- confirm the code writes tokens ONLY when present (never 0, never {}),\n   exactly mirroring cost_usd's omit-when-undefined behavior.\n4. Cost-path regression -- confirm total_cost_usd accumulation/persistence is unchanged and\n   a test asserts byte-identical cost values (scenario 3 / 8).\n5. Type extension -- confirm NodeExecutionResult gained tokens?: TokenUsage (not `any`, not a\n   duplicate import).\n6. Resume semantics -- confirm the aggregate does not fabricate pre-resume tokens.\n7. Quota window -- confirm the budget constant is clearly labelled an ESTIMATE and the\n   raw-first (windowBudget: null) fallback exists; no fabricated precise quota.\n8. Missing tests -- any in-scope behavior with no test asserting real output.\n\n## Output (STDOUT only)\n  DIFF_REVIEW=<satisfied|needs_revision>\n  FINDINGS:\n  - <file:line> <one specific, fixable finding>   (repeat; or \"(none)\")\n  SEMANTIC_RISK=<LOW|MEDIUM|HIGH>\nEvery finding cites a file and the exact problem. Only flag what must change before commit.\n"},{id: diff-repair,persona: major-build,agent: major-build,depends_on: [diff-review],task_class: medium_work,loop: {fresh_context: true,until: __NEVER_EMIT_USE_UNTIL_BASH__,max_iterations: 3,until_bash: "set -uo pipefail\nDONE=\"$ARTIFACTS_DIR/diff-repair-done.flag\"\n[ -f \"$DONE\" ] || { echo \"repair not signalled done\"; exit 1; }\nBASE_REF=\"origin/dev\"\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\nDEBUG_RE='console\\.log\\(|debugger;'\nif { git diff --unified=0 \"$MB\"..HEAD 2>/dev/null; git diff --unified=0 HEAD 2>/dev/null; } \\\n     | grep -E '^\\+' | grep -Eq \"$DEBUG_RE\"; then\n  echo \"debug statement present in feature diff\"; exit 1\nfi\n# provider.ts must STILL be untouched after repair.\nif [ -n \"$(git diff --name-only origin/dev -- packages/providers/src/claude/provider.ts 2>/dev/null)\" ]; then\n  echo \"repair touched provider.ts -- forbidden\"; exit 1\nfi\nexit 0\n",prompt: "You are major-build. The Codex diff reviewer raised findings on your diff. Fix every\nfixable finding in place. You are the BUILDER; Codex does not edit.\n\n## Codex review verdict (read directly)\n$diff-review.output\n\n## Prior repair iteration (if any)\n$LOOP_PREV_OUTPUT\n\n## What to do\n- If DIFF_REVIEW=satisfied with no findings: make no changes; just signal done.\n- Otherwise: resolve each FINDINGS line. Add the missing test, fix the omit-when-absent\n  logic, add the executeLoopNode persist if it was missed, etc. Modify only in-scope files.\n  Do NOT touch provider.ts or packages/web. Do not reformat unrelated code. Do not deploy.\n\n## NEVER FABRICATE A DIFF\nDo NOT regenerate $ARTIFACTS_DIR/diff.patch from already-merged commits, origin/dev, or\nanother branch. The diff artifact must reflect ONLY real changes from THIS run.\n\n## Escalation (write to $ARTIFACTS_DIR/diff-repair-escalation.txt and STOP) if:\n- a finding needs ungranted scope / a new side-effect class\n- the spec is ambiguous about the correct fix\n- the same finding survived a prior attempt and you cannot resolve it\nEscalation block keys:\n  ESCALATION_REQUIRED=true\n  ESCALATION_REASON=<new-side-effect-class|ambiguous-spec|loop-exhausted>\n  WO_ID=WO-HARNESS-TOKEN-ATTRIBUTION-01\n  NODE=diff-repair\n  ATTEMPTS=<n>/3\n  WHAT_FAILED=<one paragraph>\n  WHAT_WAS_TRIED=<3-6 bullets>\n  LAST_REVIEW_FINDINGS=<exact Codex findings>\n  SINGLE_DECISION_NEEDED=<one sentence John can answer>\n  SAFE_STATE=<work is local in the worktree; nothing merged>\n\n## Signal done (the FLAG is the only completion gate -- there is NO text sentinel)\nWhen you have addressed every fixable finding (or there were none) AND introduced no debug\nprints AND provider.ts is still untouched:\n  - Write an empty file at $ARTIFACTS_DIR/diff-repair-done.flag   (the ONLY signal)\nIf you escalated, do NOT write the flag.\n"}},{id: commit-and-push,persona: overseer,depends_on: [diff-repair],load_bearing: true,bash: "set -euo pipefail\nBRANCH=\"$(git rev-parse --abbrev-ref HEAD)\"\ngit add -A\nif ! git diff --cached --quiet; then\n  git -c user.name=\"John Ranson\" -c user.email=\"admin@bluedevilcollectibles.com\" \\\n    commit -m \"chore: backstop commit WO-HARNESS-TOKEN-ATTRIBUTION-01\"\nfi\n# WO-169: real push retry, fail closed (load_bearing node).\nPUSH_OK=false\nfor attempt in 1 2 3; do\n  if git push -u origin \"$BRANCH\" 2>&1; then PUSH_OK=true; break; fi\n  echo \"WARN: push attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PUSH_OK\" = \"false\" ]; then\n  echo \"ERROR: git push failed after 3 attempts -- aborting (load_bearing).\" >&2\n  exit 1\nfi\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nLOCAL_HEAD=\"$(git rev-parse HEAD)\"\nif [ \"$REMOTE_HEAD\" != \"$LOCAL_HEAD\" ]; then\n  echo \"FATAL: branch ${BRANCH} not durably pushed (origin=${REMOTE_HEAD:-<absent>} local=${LOCAL_HEAD})\" >&2\n  exit 1\nfi\necho \"VERIFIED: origin/${BRANCH} == local HEAD (${LOCAL_HEAD})\"\necho \"SHA=${LOCAL_HEAD}\"\necho \"BRANCH=${BRANCH}\"\n"},{id: open-pr,depends_on: [commit-and-push],load_bearing: true,bash: "set -euo pipefail\nWO_ID=\"${WO_ID:-WO-HARNESS-TOKEN-ATTRIBUTION-01}\"\nREPO=\"bluedevilcollectibles/bdc-harness\"\nBRANCH=\"$(git rev-parse --abbrev-ref HEAD)\"\n# bdc-harness INTEGRATION branch is dev (NOT main). PR base = dev.\nBASE=\"dev\"\nEXIST=$(gh pr list --repo \"$REPO\" --head \"$BRANCH\" --state open \\\n  --json url --jq '.[0].url // empty' 2>/dev/null || true)\nif [ -n \"$EXIST\" ]; then echo \"PR_URL=$EXIST\"; exit 0; fi\nfor attempt in 1 2 3; do\n  if URL=$(gh pr create --repo \"$REPO\" --base \"$BASE\" --head \"$BRANCH\" \\\n      --title \"feat(workflows,server): ${WO_ID} -- persist per-node + per-run token usage\" \\\n      --body \"Implements ${WO_ID}. Mirrors the existing cost-persistence path for TOKENS in BOTH executors (executeAiNode + executeLoopNode), extends NodeExecutionResult with tokens?: TokenUsage, aggregates total_tokens into runs.metadata, and adds a derived Max-20x quota-window summary to the runs API. NO migration (events.data + runs.metadata are existing JSONB). provider.ts untouched; no web/UI. Spec: bdc-xo docs/work-orders/${WO_ID}.md\" 2>&1); then\n    echo \"PR_URL=$URL\"; exit 0\n  fi\n  echo \"WARN: gh pr create attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\necho \"ERROR: gh pr create failed after 3 attempts\" >&2; exit 1\n"},{id: build-manifest,depends_on: [open-pr],task_class: clerical,prompt: "Construct the Captain CI v2 completion manifest for WO-HARNESS-TOKEN-ATTRIBUTION-01.\nCODE class, single repo (bdc-harness), server-side TypeScript.\n\n## Inputs\nPlan (approved -- use the APPROVED_PLAN block): $plan-review.output\nImplement output: $implement.output\nVerify gate (tsc + grep assertions): $verify-tsc-and-greps.output\nDiff review (Codex initial): $diff-review.output\nDiff repair: $diff-repair.output\nCommit + push: $commit-and-push.output\nPR: $open-pr.output\n\n## Required manifest fields (verbatim shape -- single fenced block so flip-notion pastes it\n## into the Notion Notes property exactly)\nWO: WO-HARNESS-TOKEN-ATTRIBUTION-01\nBuilder: Devils Cauldron (Archon bdc-harness-token-attribution)\nFiles modified: packages/workflows/src/dag-executor.ts; packages/server/<runs-events-route + db read path> (from implement output)\nFiles created: <new test file(s) from implement output>\nTests: bun x tsc --noEmit PASS (packages/workflows + packages/server); bun test -- 8 new\n  scenarios PASS; existing dag-executor.test.ts + api.workflow-runs.test.ts PASS (no cost regression)\nPRs: <PR_URL from open-pr>, behind_by: 0\nMerge ancestors: bdc-harness dev HEAD, manifest commit, behind_by: 0\nGrep assertions (BASH-EXECUTABLE -- re-runnable from repo root):\n  [ $(grep -c 'tokens: nodeTokens' packages/workflows/src/dag-executor.ts) -ge 2 ]\n  [ $(grep -c 'loopTotalTokens' packages/workflows/src/dag-executor.ts) -ge 3 ]\n  [ $(grep -c 'total_tokens' packages/workflows/src/dag-executor.ts) -ge 1 ]\n  [ $(grep -c 'totalTokens' packages/workflows/src/dag-executor.ts) -ge 2 ]\n  grep -nE 'NodeExecutionResult = NodeOutput &.*tokens\\?: TokenUsage' packages/workflows/src/dag-executor.ts\n  [ -z \"$(git diff --name-only origin/dev -- packages/providers/src/claude/provider.ts)\" ]\nRuntime verification: fire a tiny workflow on dev, query the events API for that run, confirm\n  data.tokens present on a node_completed event and metadata.total_tokens on the run (curl + jq\n  evidence). This is an OPERATOR / Captain-CI step at PR-review -- if the executor could not\n  perform it, state that plainly; do NOT claim a runtime proof that did not happen.\nVercel deployment: N/A (bdc-harness is server tooling, not a Vercel app)\nIn-run review evidence: plan-review verdict (PLAN_REVIEW_PASS + RISK); diff-review-final\n  verdict from $diff-review.output / $diff-repair.output; cross-model reviewer = codex gpt-5.5.\nVALIDATION: PASS\n\nIf any in-run review ended needs_revision or was skipped, VALIDATION cannot be PASS -- say so.\n"},{id: flip-notion,persona: xo,depends_on: [build-manifest],task_class: clerical,prompt: "Flip the Notion Work Order for WO-HARNESS-TOKEN-ATTRIBUTION-01 to REVIEW. Put the manifest\nin the Notes PROPERTY (NOT a page comment -- Captain CI / the Cauldron grader reads Notes).\n\n## Notion page\nPage id: $NOTION_PAGE_ID\nIf the page id is the literal placeholder REPLACE_WITH_NOTION_PAGE_ID (operator did not set it\n-- XO was creating the row in parallel), do NOT guess. Emit an XO_ACTION line asking the\noperator to set Claude Status -> REVIEW, Status -> Review, and paste the manifest into the\nNotes property manually, and STOP.\n\n## Updates (single update if Notion MCP available)\n- Claude Status -> REVIEW\n- Status -> Review\n- Notes -> the manifest below, verbatim\nNEVER set Claude Status or Status to DONE. Only Captain CI / the Cauldron grader closes both\nfields after a VALIDATED verdict.\n\n## Manifest\n$build-manifest.output\n\nIf Notion MCP is not available inside the container, do not invent a workaround. Emit an\nXO_ACTION line asking XO to flip Notion manually with the manifest above.\n"}]}