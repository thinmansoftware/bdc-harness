{name: bdc-author-wo-batch,description: "Use when: Batch-authoring WO specs + Devils Cauldron YAMLs with adversarial 12-check review gate.\nInputs:\n  WO_CONCEPTS_FILE: path in bdc-xo to JSON file: [{wo_id,title,repo,polish_bar,builder,priority,summary}, ...]\n  PLAN_DOC_PATH: path in bdc-xo to source plan doc\n  CALIBRATION_DOC: optional path in bdc-xo to calibration ruling\n  NOTION_DB_ID: Notion DB (default: a6df831c-0b52-449f-8ca4-d77be6b70d0a)\n  DRY_RUN: 'true' = write files + skip Notion filing and PR\nDoes: For each WO concept, adversarially reviews spec+YAML via WO-Lifecycle:Validate 12-check gate,\n      iterates up to 8 times, commits passing WOs to bdc-xo, files to Notion, fails shut on exhaustion.\nRepo: bluedevilcollectibles/bdc-xo (operator selects bdc-xo codebase when firing).\nparallel_ok: true\n",policyFile: harness/policies/agent-behavior.md,model: sonnet,target_repo: bluedevilcollectibles/bdc-xo,inputs: {WO_CONCEPTS_FILE: {default: docs/work-orders/concepts/2026-07-03-storefront-wave1.json},PLAN_DOC_PATH: {default: docs/plans/2026-07-03-storefront-first-class-plan.md},CALIBRATION_DOC: {default: ""},NOTION_DB_ID: {default: a6df831c-0b52-449f-8ca4-d77be6b70d0a},DRY_RUN: {default: "false"}},nodes: [{id: preflight-github-auth,load_bearing: true,bash: "set -euo pipefail\nDRY_RUN=\"${INPUT_DRY_RUN:-${DRY_RUN:-false}}\"\nif [ \"$DRY_RUN\" = \"true\" ]; then\n  echo \"preflight-github-auth: DRY_RUN=true -- skipping auth probe\"\n  exit 0\nfi\nif ! git push --dry-run origin \"HEAD:refs/heads/preflight-auth-probe-$(date +%s)\" 2>&1; then\n  echo \"ERROR: GITHUB auth check failed -- container cannot push to origin.\" >&2\n  echo \"Likely cause: GITHUB_TOKEN missing in executor env, or token lacks repo scope.\" >&2\n  exit 1\nfi\necho \"preflight-github-auth PASS\"\n"},{id: read-inputs,depends_on: [preflight-github-auth],bash: "set -euo pipefail\n# 2026-05-16: read from $INPUT_<NAME> (Cauldron engine injects these from\n# workflow.inputs); fall back to bare $NAME for legacy /workflow run cmd-line\n# arg style. Both work; API payload uses INPUT_ prefix path.\nPLAN_DOC_PATH=\"${INPUT_PLAN_DOC_PATH:-${PLAN_DOC_PATH:-docs/plans/2026-06-15-mutant-market-hq-readiness.md}}\"\nWO_CONCEPTS_FILE=\"${INPUT_WO_CONCEPTS_FILE:-${WO_CONCEPTS_FILE:-}}\"\nCALIBRATION_DOC=\"${INPUT_CALIBRATION_DOC:-${CALIBRATION_DOC:-}}\"\nNOTION_DB_ID=\"${INPUT_NOTION_DB_ID:-${NOTION_DB_ID:-a6df831c-0b52-449f-8ca4-d77be6b70d0a}}\"\nDRY_RUN=\"${INPUT_DRY_RUN:-${DRY_RUN:-false}}\"\n\nif [ -z \"$WO_CONCEPTS_FILE\" ]; then\n  echo \"ERROR: WO_CONCEPTS_FILE is required. Example: WO_CONCEPTS_FILE=memory/wo-batch-concepts.json\" >&2\n  exit 1\nfi\n\n# Read plan doc (try local file first, then gh api cross-repo)\nPLAN_CONTENT=\"\"\nif [ -f \"$PLAN_DOC_PATH\" ]; then\n  PLAN_CONTENT=$(cat \"$PLAN_DOC_PATH\")\nelse\n  PLAN_CONTENT=$(gh api \\\n    \"repos/bluedevilcollectibles/bdc-xo/contents/${PLAN_DOC_PATH}?ref=main\" \\\n    --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)\nfi\n[ -z \"$PLAN_CONTENT\" ] && { echo \"ERROR: Plan doc not found at $PLAN_DOC_PATH\" >&2; exit 1; }\n\n# Read WO concepts JSON\nWO_CONCEPTS=\"\"\nif [ -f \"$WO_CONCEPTS_FILE\" ]; then\n  WO_CONCEPTS=$(cat \"$WO_CONCEPTS_FILE\")\nelse\n  WO_CONCEPTS=$(gh api \\\n    \"repos/bluedevilcollectibles/bdc-xo/contents/${WO_CONCEPTS_FILE}?ref=main\" \\\n    --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)\nfi\n[ -z \"$WO_CONCEPTS\" ] && { echo \"ERROR: WO_CONCEPTS_FILE not found: $WO_CONCEPTS_FILE\" >&2; exit 1; }\n\n# Validate JSON and extract WO IDs\nWO_SUMMARY=$(echo \"$WO_CONCEPTS\" | python3 -c \"\nimport sys, json\ndata = json.load(sys.stdin)\nprint(f'WO_COUNT={len(data)}')\nprint('WO_IDS=' + ','.join(d['wo_id'] for d in data))\nfor d in data:\n    print(f\\\"  {d['wo_id']} | {d.get('polish_bar','?')} | {d.get('builder','Major Build')} | {d.get('summary','')[:60]}\\\")\n\" 2>&1) || { echo \"ERROR: WO_CONCEPTS_FILE is not valid JSON array of {wo_id,...} objects\" >&2; exit 1; }\n\n# Read calibration doc if provided\nCALIBRATION=\"(none)\"\nif [ -n \"$CALIBRATION_DOC\" ]; then\n  if [ -f \"$CALIBRATION_DOC\" ]; then\n    CALIBRATION=$(cat \"$CALIBRATION_DOC\")\n  else\n    CALIBRATION=$(gh api \\\n      \"repos/bluedevilcollectibles/bdc-xo/contents/${CALIBRATION_DOC}?ref=main\" \\\n      --jq .content 2>/dev/null | base64 -d 2>/dev/null || echo \"(calibration not found)\")\n  fi\nfi\n\n# Read archon-yaml-authoring doctrine from bdc-xo wiki if present\nARCHON_DOCTRINE=\"\"\nif [ -f \"xo-wiki/wiki/doctrine/archon-yaml-authoring/_index.md\" ]; then\n  ARCHON_DOCTRINE=$(head -100 \"xo-wiki/wiki/doctrine/archon-yaml-authoring/_index.md\")\nfi\n\nprintf 'NOTION_DB_ID=%s\\nDRY_RUN=%s\\n\\n' \"$NOTION_DB_ID\" \"$DRY_RUN\"\nprintf '%s\\n\\n' \"$WO_SUMMARY\"\nprintf '=== WO CONCEPTS JSON ===\\n%s\\n\\n' \"$WO_CONCEPTS\"\nprintf '=== PLAN DOC (%s) ===\\n%s\\n\\n' \"$PLAN_DOC_PATH\" \"$PLAN_CONTENT\"\nprintf '=== CALIBRATION ===\\n%s\\n\\n' \"$CALIBRATION\"\n# 2026-05-16: don't use `[ ] && cmd` as terminal line under `set -e` --\n# if the test is false (ARCHON_DOCTRINE empty), [ exits 1, becomes the\n# script's exit code, and the whole node dies silently with no stderr.\n# Anchor: Codex diagnosis of post-#77 fast-die-no-stderr symptom.\nif [ -n \"$ARCHON_DOCTRINE\" ]; then\n  printf '=== ARCHON YAML DOCTRINE (excerpt) ===\\n%s\\n\\n' \"$ARCHON_DOCTRINE\"\nfi\n"},{id: author-wo,depends_on: [read-inputs],task_class: medium_work,loop: {fresh_context: true,until: VALIDATE_PASS_ALL,max_iterations: 8,prompt: "You are the BDC WO Batch Authoring Pipeline, alternating between AUTHOR and ADVERSARIAL REVIEWER roles.\nCWD = bdc-xo repo root. You have full file read/write tool access.\n\n## Pipeline Inputs\n$read-inputs.output\n\n## Previous Iteration Results (empty on first iteration)\n$LOOP_PREV_OUTPUT\n\n---\n\n## PHASE 1 -- AUTHOR\n\nFor each WO concept in the JSON array:\n\n**1a. Resume check**: Does `docs/work-orders/<wo_id>.md` AND `yaml-drafts/<wo_id>.yaml` already\nexist on disk? If both exist, SKIP this WO -- it passed review in a prior iteration.\n\n**1b. Draft the WO spec** (12-section wo-recipe.md template):\n```\n## 1. Objective\n## 2. Behavior Source of Truth   <-- must cite concrete file path or WO ID\n## 3. Prior Art Check\n## 4. System Context             <-- list dependencies or state \"standalone\"\n## 5. UI Hierarchy               <-- N/A with one-line reason if not UI\n## 6. Mode Behavior Matrix       <-- N/A with one-line reason if not multi-mode\n## 7. Backend Function Inventory <-- every function labeled EXISTING (file:line) or NEW\n## 8. Data Flow\n## 9. Database Schema References <-- N/A with one-line reason if no DB;\n                                    if DB: cite information_schema query OR migration file\n## 10. Deploy Target\n## 11. Test Scenarios            <-- >= 3 tests, each with Given/When/Then structure\n## 12. Stop Point                <-- CI-executable commands, Given/When/Then\n```\nAdd a \"Grep assertions\" section if the WO touches 2+ repos (Check 8A requirement).\nHonor `polish_bar`:\n- ROUGH: include \"V1 limitations\" section listing explicit exclusions\n- HIGH: full test matrix with edge cases, error paths, concurrency\n\nAlso reference `wo-recipe.md` somewhere in the body (Check 2 requirement).\n\n**1c. Draft the Devils Cauldron YAML** (archon-yaml-authoring 13 hard rules):\n- `model: sonnet` at workflow root\n- `policyFile: harness/policies/agent-behavior.md` at root\n- All file paths RELATIVE TO REPO ROOT (no repo-name prefix)\n- Every `loop:` node declares ALL FOUR fields: `prompt:`, `until:`, `max_iterations:`, `fresh_context:`\n- Final node MUST be `flip-notion` (Archon does not auto-update Notion)\n- NO `curl` to n8n.bluedevilcollectibles.com in bash nodes (hangs in executor subprocess)\n- Bash: use `$WORKFLOW_ID` NOT `${run.id}` (token substituted at YAML-parse time)\n- Bash: NO `set -u` if block references `$WORKFLOW_ID` inline (it's not a runtime env var)\n- All paths relative to the target repo root (worktree IS the repo root)\n\n---\n\n## PHASE 2 -- ADVERSARIAL REVIEW (you are now a blocking reviewer -- no approvals without evidence)\n\nFor EACH drafted spec+YAML pair, apply all 12 checks:\n\n**Check 1**: 8 always-required headers present verbatim:\n  ## 1. Objective, ## 2. Behavior Source of Truth, ## 3. Prior Art Check,\n  ## 7. Backend Function Inventory, ## 8. Data Flow, ## 10. Deploy Target,\n  ## 11. Test Scenarios, ## 12. Stop Point\n  -> BLOCK if any missing.\n\n**Check 2**: Body contains the substring `wo-recipe.md`.\n  -> BLOCK if absent.\n\n**Check 3**: Section 2 references at least one concrete artifact (file path or WO ID).\n  -> BLOCK if Section 2 contains only TBD, \"see body\", or empty text.\n\n**Check 4**: WO ID matches `WO-[A-Z][A-Z0-9-]*-[0-9]+`; consistent across filename, H1, Notion title.\n  -> BLOCK if inconsistent.\n\n**Check 5**: Section 2 cites a real path (e.g. `docs/plans/foo.md`, `research/bar.md`, `WO-XYZ-01`).\n  -> BLOCK if Section 2 is vague without a concrete locator.\n\n**Check 6**: Every function/route/script in Section 7 labeled `EXISTING (file:line)` or `NEW`.\n  -> BLOCK if any name appears without a label.\n\n**Check 7**: Section 9 column/table claims cite `information_schema` query result or migration file.\n  -> BLOCK if Section 9 makes a column claim without citing source.\n\n**Check 8**: Section 11 has >= 3 test scenarios each with Given/When/Then structure.\n  -> BLOCK if fewer than 3, or any test is purely descriptive.\n\n**Check 8A**: If WO's files span 2+ repos -> must have `Grep assertions` block with grep command per repo.\n  -> BLOCK if split-repo WO lacks grep assertions.\n\n**Check 9**: Section 12 stop conditions are CI-executable commands (Given/When/Then).\n  -> BLOCK if any stop condition is vague (\"staging accessible\", \"CI validates\").\n\n**Check 10**: 8 required questions addressed somewhere in body:\n  1. What behavior exists AFTER this WO?\n  2. Where is the source of truth?\n  3. Who owns this system?\n  4. What existing logic is reused?\n  5. What is the exact schema? (N/A if no DB)\n  6. What MUST NEVER break? (invariants)\n  7. How does CI prove it works?\n  8. What happens if it runs twice? (idempotency)\n  -> BLOCK if any unanswered.\n\n**Check 11** (HARDEST -- anti-guess hardening): Every component name, table name, column name,\nroute path in the spec traces to a source file. No invented names.\n  -> BLOCK if any specific claim is not anchored to a real source.\n\n**Check 12**: Section 4 lists dependencies OR explicitly says \"standalone\".\n  -> BLOCK if Section 4 is empty and WO touches more than one subsystem.\n\nOutput per WO: `VALIDATE: PASS` (all 12) or `VALIDATE: FAIL -- Check N: <gap>` for each failure.\n\n---\n\n## PHASE 3 -- FIX OR COMMIT\n\n- **FAIL**: Revise spec + YAML to address each listed gap. Re-run all 12 checks on the revision.\n  If revised passes -> write files; if still fails -> flag for next iteration.\n- **PASS**: Write both files to disk:\n  - `docs/work-orders/<wo_id>.md`\n  - `yaml-drafts/<wo_id>.yaml`\n\n---\n\n## SENTINEL RULE\n\nOutput `<promise>VALIDATE_PASS_ALL</promise>` ONLY when EVERY WO concept has:\n- `docs/work-orders/<wo_id>.md` exists on disk\n- `yaml-drafts/<wo_id>.yaml` exists on disk\n- Final review verdict was VALIDATE: PASS\n\nIf any WO exhausts all remaining iterations without passing, do NOT emit the sentinel.\nInstead output a `BATCH_FAILURE` block:\n```\nBATCH_FAILURE:\n  - WO_ID: <id>\n    failed_checks: [list]\n    critique: <specific gaps that could not be resolved>\n```\n"}},{id: verify-files,depends_on: [author-wo],bash: "set -euo pipefail\n# 2026-05-16: mirror read-inputs dual-path pattern -- engine injects\n# INPUT_<NAME> from YAML defaults; fall back to bare env for legacy.\nWO_CONCEPTS_FILE=\"${INPUT_WO_CONCEPTS_FILE:-${WO_CONCEPTS_FILE:-}}\"\n[ -z \"$WO_CONCEPTS_FILE\" ] && { echo \"ERROR: WO_CONCEPTS_FILE not set\" >&2; exit 1; }\n\n# Get WO IDs from concepts file\nif [ -f \"$WO_CONCEPTS_FILE\" ]; then\n  WO_IDS=$(python3 -c \"\nimport json, sys\ndata = json.load(open('$WO_CONCEPTS_FILE'))\nprint(' '.join(d['wo_id'] for d in data))\n\")\nelse\n  CONCEPTS_JSON=$(gh api \\\n    \"repos/bluedevilcollectibles/bdc-xo/contents/${WO_CONCEPTS_FILE}?ref=main\" \\\n    --jq .content 2>/dev/null | base64 -d 2>/dev/null || echo \"[]\")\n  WO_IDS=$(echo \"$CONCEPTS_JSON\" | python3 -c \"\nimport json, sys\ndata = json.load(sys.stdin)\nprint(' '.join(d['wo_id'] for d in data))\n\")\nfi\n\necho \"=== verify-files: checking WO artifacts ===\"\nPASS=0\nFAIL=0\nfor WO_ID in $WO_IDS; do\n  SPEC=\"docs/work-orders/${WO_ID}.md\"\n  YAML=\"yaml-drafts/${WO_ID}.yaml\"\n  SPEC_OK=0\n  YAML_OK=0\n  [ -f \"$SPEC\" ] && SPEC_OK=1\n  [ -f \"$YAML\" ] && YAML_OK=1\n\n  if [ \"$SPEC_OK\" -eq 1 ] && [ \"$YAML_OK\" -eq 1 ]; then\n    # Structural spot-checks (warns only, not hard failures)\n    grep -q \"## 1. Objective\" \"$SPEC\" \\\n      || echo \"  WARN: $WO_ID spec missing ## 1. Objective header\"\n    grep -q \"## 12. Stop Point\" \"$SPEC\" \\\n      || echo \"  WARN: $WO_ID spec missing ## 12. Stop Point header\"\n    grep -q \"model: sonnet\" \"$YAML\" \\\n      || echo \"  WARN: $WO_ID YAML missing model: sonnet (Rule 1)\"\n    grep -q \"policyFile:\" \"$YAML\" \\\n      || echo \"  WARN: $WO_ID YAML missing policyFile (Rule 6)\"\n    echo \"PASS: $WO_ID (spec + YAML present)\"\n    PASS=$((PASS + 1))\n  else\n    echo \"FAIL: $WO_ID (spec_ok=$SPEC_OK yaml_ok=$YAML_OK)\"\n    FAIL=$((FAIL + 1))\n  fi\ndone\n\necho \"\"\necho \"SUMMARY: $PASS PASS, $FAIL FAIL\"\n[ \"$FAIL\" -eq 0 ] || { echo \"ERROR: $FAIL WO(s) missing artifacts\" >&2; exit 1; }\necho \"verify-files PASS\"\n"},{id: commit-and-push,depends_on: [verify-files],load_bearing: true,bash: "set -euo pipefail\nDRY_RUN=\"${DRY_RUN:-false}\"\nBRANCH=\"wo/author-wo-batch-run-$(date +%Y%m%d%H%M%S)\"\n\n# WO-168 Tier 1: save load-bearing artifacts to host-mounted volume BEFORE\n# any remote operation. If push fails or the worktree is pruned, the bundle\n# on the host disk is the recovery source of truth.\n# Recovery procedure: docs/recovery/host-artifact-recovery.md\nsave_bundle_to_host() {\n  local run_id=\"${WORKFLOW_RUN_ID:-${WORKFLOW_ID:-unknown-$(date +%Y%m%d%H%M%S)}}\"\n  local dest=\"/host-artifacts/${run_id}\"\n  if [ ! -d /host-artifacts ]; then\n    echo \"WARN: /host-artifacts not mounted -- skipping bundle save (recovery from worktree only)\" >&2\n    return 0\n  fi\n  mkdir -p \"$dest\" 2>/dev/null || {\n    echo \"WARN: could not mkdir $dest -- skipping bundle save\" >&2\n    return 0\n  }\n  # git bundle of HEAD captures the entire reachable history of the branch\n  # in a single file -- can be fetched back even after the branch is gone.\n  if git bundle create \"$dest/branch.bundle\" HEAD 2>\"$dest/bundle.err\"; then\n    echo \"  host-artifact: bundle saved $dest/branch.bundle ($(stat -c%s \"$dest/branch.bundle\" 2>/dev/null || echo '?') bytes)\"\n  else\n    echo \"WARN: git bundle create failed -- see $dest/bundle.err\" >&2\n  fi\n  # Human-readable diff stat for quick triage without unpacking the bundle\n  git diff --stat HEAD~1 HEAD > \"$dest/changes.txt\" 2>/dev/null \\\n    || git log -1 --name-status HEAD > \"$dest/changes.txt\" 2>/dev/null \\\n    || echo \"(no diff/log available)\" > \"$dest/changes.txt\"\n  # Recovery breadcrumb: branch name + commit + timestamp\n  {\n    echo \"branch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)\"\n    echo \"sha=$(git rev-parse HEAD 2>/dev/null || echo unknown)\"\n    echo \"saved_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\n    echo \"workflow_run_id=${run_id}\"\n    echo \"recovery_cmd=git fetch ${dest}/branch.bundle main:rescue-${run_id}\"\n  } > \"$dest/MANIFEST.txt\"\n  echo \"  host-artifact: manifest written $dest/MANIFEST.txt\"\n}\n\ngit checkout -b \"$BRANCH\"\ngit add docs/work-orders/ yaml-drafts/ 2>/dev/null || true\n\nif git diff --cached --quiet; then\n  echo \"No staged changes -- WO files may already be committed on a prior run\"\n  echo \"BRANCH=$(git rev-parse --abbrev-ref HEAD)\"\n  echo \"SHA=$(git rev-parse HEAD)\"\n  exit 0\nfi\n\nFILE_COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')\ngit -c user.name=\"John Ranson\" -c user.email=\"admin@bluedevilcollectibles.com\" \\\n  commit -m \"feat(wo-batch): WO-HARNESS-AUTHOR-WO-BATCH-META-01 -- batch author ${FILE_COUNT} WO artifacts\n\nEach WO spec + YAML adversarially reviewed (WO-Lifecycle:Validate 12-check gate) before commit.\nWorkflow: bdc-author-wo-batch. Operator reviews files then promotes to queue.\n\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>\"\n\n# WO-168 Tier 1: bundle BEFORE push so a push failure does not destroy work.\nsave_bundle_to_host\n\nif [ \"$DRY_RUN\" = \"true\" ]; then\n  echo \"DRY_RUN=true -- skipping push (bundle still saved to host)\"\n  echo \"BRANCH=$BRANCH\"\n  echo \"SHA=$(git rev-parse HEAD)\"\n  exit 0\nfi\n\n# Real retry guard (WO-169). 3 attempts, 5s/10s/15s backoff, fail closed.\nPUSH_OK=false\nfor attempt in 1 2 3; do\n  if git push -u origin \"$BRANCH\" 2>&1; then\n    PUSH_OK=true\n    break\n  fi\n  echo \"WARN: push attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PUSH_OK\" = \"false\" ]; then\n  echo \"ERROR: git push failed after 3 attempts -- aborting workflow (load_bearing node).\" >&2\n  exit 1\nfi\necho \"BRANCH=$BRANCH\"\necho \"SHA=$(git rev-parse HEAD)\"\n"},{id: open-pr,depends_on: [commit-and-push],load_bearing: true,bash: "set -euo pipefail\nDRY_RUN=\"${DRY_RUN:-false}\"\nif [ \"$DRY_RUN\" = \"true\" ]; then\n  echo \"STATUS=skipped_dry_run\"\n  exit 0\nfi\n\nBRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo \"\")\nif [ -z \"$BRANCH\" ] || [ \"$BRANCH\" = \"HEAD\" ]; then\n  echo \"ERROR: detached HEAD or unknown branch -- cannot open PR.\" >&2\n  exit 1\nfi\n\nREPO=\"bluedevilcollectibles/bdc-xo\"\nEXIST=$(gh pr list --repo \"$REPO\" --head \"$BRANCH\" --state open \\\n  --json url --jq '.[0].url // empty' 2>/dev/null || true)\nif [ -n \"$EXIST\" ]; then\n  echo \"PR_URL=$EXIST\"\n  exit 0\nfi\n\nBODY_FILE=$(mktemp)\n{\n  echo \"## Summary\"\n  echo \"WO-HARNESS-AUTHOR-WO-BATCH-META-01: batch WO authoring run via bdc-author-wo-batch workflow.\"\n  echo \"\"\n  echo \"Each WO spec + YAML was adversarially reviewed (WO-Lifecycle:Validate.md 12-check gate)\"\n  echo \"before commit. Review files, then promote WOs to queue once satisfied.\"\n  echo \"\"\n  echo \"Generated by bdc-author-wo-batch workflow\"\n} > \"$BODY_FILE\"\n\n# Real retry guard (WO-169). 3 attempts, 5s/10s/15s backoff, fail closed.\nPR_OK=false\nfor attempt in 1 2 3; do\n  if URL=$(gh pr create --repo \"$REPO\" --base main --head \"$BRANCH\" \\\n      --title \"feat(wo-batch): batch WO authoring run -- adversarial review gate applied\" \\\n      --body-file \"$BODY_FILE\" 2>&1); then\n    echo \"PR_URL=$URL\"\n    PR_OK=true\n    break\n  fi\n  # Race-condition recovery: another caller may have opened the PR between\n  # our list check and our create attempt.\n  EXIST=$(gh pr list --repo \"$REPO\" --head \"$BRANCH\" --state open \\\n    --json url --jq '.[0].url // empty' 2>/dev/null || true)\n  if [ -n \"$EXIST\" ]; then\n    echo \"PR_URL=$EXIST\"\n    PR_OK=true\n    break\n  fi\n  echo \"WARN: gh pr create attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PR_OK\" = \"false\" ]; then\n  echo \"ERROR: gh pr create failed after 3 attempts -- aborting workflow (load_bearing node).\" >&2\n  echo \"Branch was pushed; recover manually with: gh pr create --repo $REPO --base main --head $BRANCH\" >&2\n  exit 1\nfi\n"},{id: file-notion,depends_on: [open-pr],task_class: clerical,prompt: "File each passing WO from this batch run to Notion.\n\n## DRY_RUN CHECK\nIf $read-inputs.output contains `DRY_RUN=true`, skip all Notion filing.\nOutput instead:\n  XO_TODO: Operator review complete -> promote WOs to queue manually.\n  XO_TODO_WOS: [list each WO_ID from $read-inputs.output that passed verify-files]\n\n## NOTION FILING (when DRY_RUN=false)\nFor each WO_ID listed as PASS in $verify-files.output:\n1. Read the spec file `docs/work-orders/<WO_ID>.md` to extract the Objective (Section 1) as the Notes summary.\n2. Extract builder, priority from the WO concepts JSON (in $read-inputs.output).\n3. Create Notion page in database `a6df831c-0b52-449f-8ca4-d77be6b70d0a` with:\n   - Task: <WO_ID>\n   - WO ID: <WO_ID>\n   - Status: To Do\n   - Claude Status: QUEUED\n   - Priority: <from concept, default P1>\n   - Builder: <from concept, default Major Build>\n   - Execution State: ACTIVE\n   - Project: <from concept, default Infrastructure>\n   - Notes: first 300 chars of Section 1 Objective + \" WO file: BDC_XO/docs/work-orders/<WO_ID>.md\"\n4. Use the Notion MCP notion-create-pages tool.\n5. Output: NOTION_URL=<url> for each created page.\n\nFor any WO in BATCH_FAILURE (from $author-wo.output): output XO_TODO with critique trail.\n\n## Inputs\n$read-inputs.output\n$author-wo.output\n$verify-files.output\n$commit-and-push.output\n"},{id: build-manifest,depends_on: [file-notion],task_class: clerical,prompt: "Build the Captain CI manifest v2 for WO-HARNESS-AUTHOR-WO-BATCH-META-01.\n\nWO: WO-HARNESS-AUTHOR-WO-BATCH-META-01\nBuilder: Major Build (bdc-author-wo-batch harness workflow)\nFiles created: [list from $verify-files.output -- each PASS: <WO_ID> line maps to 2 files]\nFiles modified: none\nTests: N/A (workflow-only -- adversarial review IS the gate; verify-files confirms artifacts)\nPRs:\n  - bdc-xo: [PR_URL from $open-pr.output, or DRY_RUN=skipped]\nMerge ancestors:\n  - bdc-xo main HEAD: [SHA from $commit-and-push.output], behind_by: 0\nGrep assertions:\n  - bdc-xo: grep -c 'model: sonnet' yaml-drafts/<first_passing_WO_ID>.yaml -> 1\n  - bdc-xo: grep -c '## 12. Stop Point' docs/work-orders/<first_passing_WO_ID>.md -> 1\n  - bdc-harness: grep -n 'bdc-author-wo-batch' .archon/workflows/defaults/bdc-author-wo-batch.yaml -> >= 1\n  - bdc-harness: grep -n 'adversarial' .archon/workflows/defaults/bdc-author-wo-batch.yaml -> >= 1\n  - bdc-harness: grep -n 'max_iterations: 8' .archon/workflows/defaults/bdc-author-wo-batch.yaml -> 1\n  - bdc-harness: grep -n 'until: VALIDATE_PASS_ALL' .archon/workflows/defaults/bdc-author-wo-batch.yaml -> 1\nRuntime verification: N/A (harness workflow YAML; no Hetzner service deploy)\nVercel deployment: N/A (bdc-xo and bdc-harness are not Vercel-deployed repos)\nVALIDATION: PASS\n\nBatch run summary:\n  WOs passed (files on disk): [from $verify-files.output PASS count]\n  WOs filed to Notion: [NOTION_URL lines from $file-notion.output]\n  WOs failed (BATCH_FAILURE): [from $author-wo.output BATCH_FAILURE block, if any]\n  Adversarial review iterations: [from $author-wo.output]\n\nInputs:\n$read-inputs.output\n$author-wo.output\n$verify-files.output\n$commit-and-push.output\n$open-pr.output\n$file-notion.output\n"},{id: flip-notion-meta,depends_on: [build-manifest],task_class: clerical,prompt: "Flip Notion WO-HARNESS-AUTHOR-WO-BATCH-META-01 to REVIEW with manifest in Notes property.\n\nNotion page ID: 35fef4c9-ce00-81f1-aaaa-ded673d03082\nRequired changes:\n- Claude Status -> REVIEW\n- Status -> Review\n- Notes -> $build-manifest.output verbatim\n- claimed_by: Major Build (bdc-author-wo-batch)\n- claimed_at: 2026-05-13\n\nIf Notion MCP unavailable, output:\n  XO_TODO: Flip WO-HARNESS-AUTHOR-WO-BATCH-META-01 to REVIEW; paste manifest into Notes property.\n\nManifest:\n$build-manifest.output\n"}]}