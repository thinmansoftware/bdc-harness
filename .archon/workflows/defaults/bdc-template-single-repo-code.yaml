# TEMPLATE: bdc-template-single-repo-code
# Scenario: Single-repo TypeScript/React/Node WO with bun test runner and Vercel deploy.
# Targets: lspro-react, shopops-storefront, shopops-api (MINUS Rule 19 docker-cp pattern -- see shopops-api template)
# Usage: Copy, rename to bdc-<prefix>-<wo-slug>.yaml, fill [PLACEHOLDERS].
#        Deploy via: bash BDC_XO/scripts/archon-bridge/sync-workflows.sh <filename>
#
# Rule 20 note: lspro-react and shopops-storefront are staging-gate repos.
#   PR base = staging (not main). John promotes staging -> production.
#   For non-staging repos (e.g. bdc-xo), change --base staging -> --base main.

name: bdc-[PREFIX]-[WO-SLUG]
description: |
  Use when: Executing [WO-ID] -- [one-line description].
  Input: WO_ID = [WO-ID].
  Does:
    - Reads spec from bdc-xo docs/work-orders/.
    - Plans + implements in [TARGET_REPO].
    - Verifies: bunx tsc --noEmit + bun test.
    - Commits, pushes feature branch, opens PR to staging.
    - Flips Notion to REVIEW.
  Repo: bluedevilcollectibles/[TARGET_REPO].
  parallel_ok: true.

policyFile: harness/policies/agent-behavior.md
model: sonnet

inputs:
  WO_ID:
    default: "[WO-ID]"

nodes:

  - id: preflight-github-auth
    load_bearing: true
    bash: |
      set -euo pipefail
      if ! git push --dry-run origin "HEAD:refs/heads/preflight-auth-probe-$(date +%s)" 2>&1; then
        echo "ERROR: GITHUB auth check failed." >&2; exit 1
      fi
      echo "preflight-github-auth PASS"

  - id: read-spec
    depends_on: [preflight-github-auth]
    bash: |
      set -euo pipefail
      WO_ID="${WO_ID:-[WO-ID]}"
      SPEC_CONTENT=$(gh api \
        "repos/bluedevilcollectibles/bdc-xo/contents/docs/work-orders/${WO_ID}.md?ref=main" \
        --template '{{.content}}' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
      if [ -z "$SPEC_CONTENT" ]; then
        GLOB_PATH=$(gh api \
          "repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main" \
          --template '{{range .}}{{.path}}{{"\n"}}{{end}}' 2>/dev/null \
          | grep "${WO_ID}.md$" | head -1 || true)
        if [ -n "$GLOB_PATH" ]; then
          SPEC_CONTENT=$(gh api \
            "repos/bluedevilcollectibles/bdc-xo/contents/${GLOB_PATH}?ref=main" \
            --template '{{.content}}' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
        fi
      fi
      if [ -z "$SPEC_CONTENT" ]; then
        ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \
          --search "${WO_ID} in:title" --json number --jq '.[0].number' 2>/dev/null || true)
        if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
          SPEC_CONTENT=$(gh issue view "$ISSUE_NUM" --repo bluedevilcollectibles/bdc-xo \
            --json body --jq .body 2>/dev/null || true)
        fi
      fi
      if [ -z "$SPEC_CONTENT" ]; then
        echo "Spec not found for ${WO_ID}" >&2; exit 1
      fi
      printf 'WO_ID=%s\n\n--- SPEC ---\n%s\n' "$WO_ID" "$SPEC_CONTENT"

  - id: fresh-branch
    depends_on: [read-spec]
    bash: |
      set -euo pipefail
      DEFAULT_BRANCH="$(git remote show origin | sed -n 's,.*HEAD branch: ,,p')"
      git fetch origin "$DEFAULT_BRANCH" --depth=50 || true
      git checkout "$DEFAULT_BRANCH" 2>/dev/null || echo "branch held; staying on current HEAD"
      git reset --hard "origin/$DEFAULT_BRANCH" 2>/dev/null || true
      BRANCH="wo/[wo-slug]-run-$(date +%Y%m%d%H%M%S)"
      git checkout -b "$BRANCH"
      echo "BRANCH=${BRANCH}"

  - id: implement
    depends_on: [fresh-branch]
    loop:
      fresh_context: true
      until: COMPLETE
      max_iterations: 5
      prompt: |
        Implement [WO-ID] in [TARGET_REPO]. CWD = repo root.

        ## Spec
        $read-spec.output

        ## Branch
        $fresh-branch.output

        ## Execution rules
        1. Implement only the files in scope per the spec.
        2. Prefer existing patterns. Do not reformat unrelated code.
        3. After writing code:
           - Run: bunx tsc --noEmit (must exit 0)
           - Run: bun test (no new failures)
        4. Commit:
           git -c user.name="John Ranson" -c user.email="admin@bluedevilcollectibles.com" \
             commit -m "feat([scope]): [WO-ID] -- [short description]"
        5. Push: git push -u origin <branch>
        6. Do NOT open the PR here.

        Output COMPLETE on its own line when done.

  # ascii-gate (Rule 13 mechanical enforcement -- WO-HARNESS-CAULDRON-ASCII-ENFORCEMENT).
  # Fails the build (load_bearing, exit 1) if any source file changed by this run contains
  # a non-ASCII byte. The ASCII-only-source rule is carried in the policyFile every node
  # loads, but Claude/Opus leaks non-ASCII even when told not to, so enforce it mechanically
  # AFTER implement and BEFORE commit/PR. Scope = source files changed since the branch base.
  - id: ascii-gate
    depends_on: [implement]
    load_bearing: true
    bash: |
      set -uo pipefail
      WT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
      cd "$WT"
      BASE_REF="origin/${BASE_BRANCH:-main}"
      BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo "")
      SRC_RE='\.(js|jsx|ts|tsx|mjs|cjs|html|sh|bash|gs|yaml|yml)$'
      if [ -n "$BASE" ] && git rev-parse --verify "$BASE" >/dev/null 2>&1; then
        CHANGED=$( { git diff --name-only "$BASE"..HEAD 2>/dev/null; git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E "$SRC_RE" || true )
      else
        CHANGED=$( { git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E "$SRC_RE" || true )
      fi
      if [ -z "$CHANGED" ]; then
        echo "ascii-gate PASS (no changed source files to scan)"
        exit 0
      fi
      GREP_P_OK=0
      if printf 'a\xe2\x80\x94b\n' | grep -qP "[^\x00-\x7F]" 2>/dev/null; then GREP_P_OK=1; fi
      detect() {
        f="$1"
        if [ "$GREP_P_OK" = "1" ]; then
          grep -lP "[^\x00-\x7F]" "$f" >/dev/null 2>&1 && return 1
        elif command -v perl >/dev/null 2>&1; then
          perl -ne 'exit 1 if /[^\x00-\x7F]/' "$f" || return 1
        else
          LC_ALL=C grep -lP "[^\x00-\x7F]" "$f" >/dev/null 2>&1 && return 1
        fi
        return 0
      }
      HITFILE=$(mktemp)
      printf '%s\n' "$CHANGED" | while IFS= read -r f; do
        [ -z "$f" ] && continue
        [ -f "$f" ] || continue
        if ! detect "$f"; then printf '%s\n' "$f" >> "$HITFILE"; fi
      done
      if [ -s "$HITFILE" ]; then
        echo "ASCII GATE FAILED -- non-ASCII bytes in changed source file(s):" >&2
        cat "$HITFILE" >&2
        echo "--- offending lines (first 5 per file) ---" >&2
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          if [ "$GREP_P_OK" = "1" ]; then
            grep -nP "[^\x00-\x7F]" "$f" 2>/dev/null | head -5 | sed "s|^|${f}:|" >&2
          elif command -v perl >/dev/null 2>&1; then
            perl -ne 'print "'"$f"':$.: $_" if /[^\x00-\x7F]/' "$f" 2>/dev/null | head -5 >&2
          fi
        done < "$HITFILE"
        echo "Fix: em-dash/en-dash -> --, smart quotes -> ' and \", ellipsis -> ..., middot -> | or -, nbsp -> space, Unicode minus -> -. No emojis in source." >&2
        echo "See harness/policies/agent-behavior.md (Code Standards / Rule 13). This gate is load_bearing: the build fails until every changed source file is pure ASCII." >&2
        rm -f "$HITFILE"
        exit 1
      fi
      rm -f "$HITFILE"
      echo "ascii-gate PASS (scanned $(printf '%s\n' "$CHANGED" | grep -c .) changed source file(s), all ASCII)"
      exit 0

  - id: verify-tsc
    depends_on: [ascii-gate]
    bash: |
      set -euo pipefail
      bunx tsc --noEmit
      echo "tsc PASS"

  - id: commit-and-push
    depends_on: [verify-tsc]
    bash: |
      set -euo pipefail
      BRANCH="$(git rev-parse --abbrev-ref HEAD)"
      git add -A
      if ! git diff --cached --quiet; then
        git -c user.name="John Ranson" -c user.email="admin@bluedevilcollectibles.com" \
          commit -m "chore: backstop commit [WO-ID]"
      fi
      git push -u origin "$BRANCH"
      echo "SHA=$(git rev-parse HEAD)"
      echo "BRANCH=${BRANCH}"

  - id: open-pr
    depends_on: [commit-and-push]
    bash: |
      set -euo pipefail
      WO_ID="${WO_ID:-[WO-ID]}"
      REPO="bluedevilcollectibles/[TARGET_REPO]"
      BRANCH="$(git rev-parse --abbrev-ref HEAD)"
      # Rule 20: staging-gate repos use --base staging
      # For non-staging repos, change to --base main
      BASE="staging"
      EXIST=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
        --json url --jq '.[0].url // empty' 2>/dev/null || true)
      if [ -n "$EXIST" ]; then echo "PR_URL=$EXIST"; exit 0; fi
      for attempt in 1 2 3; do
        if URL=$(gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
            --title "feat: ${WO_ID} -- [short description]" \
            --body "Implements ${WO_ID}. Spec: bdc-xo docs/work-orders/${WO_ID}.md" 2>&1); then
          echo "PR_URL=$URL"; exit 0
        fi
        sleep $((attempt * 5))
      done
      echo "ERROR: gh pr create failed after 3 attempts" >&2; exit 1

  - id: flip-notion
    depends_on: [open-pr]
    task_class: clerical
    prompt: |
      Flip Notion [WO-ID] to REVIEW. Manifest in Notes (NOT comment).

      WO: [WO-ID]
      Builder: Devils Cauldron (Archon bdc-[PREFIX]-[WO-SLUG])
      Files modified: [from implement output]
      Files created: [from implement output]
      Tests: bunx tsc --noEmit PASS; bun test no new failures
      PRs: $open-pr.output
      Merge ancestors: [TARGET_REPO] staging HEAD, behind_by: 0
      Grep assertions: [key grep commands from spec stop conditions]
      Runtime verification: N/A (awaiting Vercel deploy after PR merge)
      Vercel deployment: staging.[domain] (Captain CI verifies post-merge)
      VALIDATION: PASS

      Update:
       - Claude Status -> REVIEW
       - Status -> Review
       - Notes -> manifest above verbatim

      PR: $open-pr.output
      Implement: $implement.output
