      This manifest covers the SOURCE-ONLY portion of the WO (spec Stop 1-3).
      Do NOT claim Stops 4-7 (target-host capture, runtime isolation proof,
      rollback rehearsal, exact-head independent review, parent acceptance)
      were completed -- they were not, by design; they require the acting XO
