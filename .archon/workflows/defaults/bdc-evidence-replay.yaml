name: bdc-evidence-replay
description: Detached, local-only test evidence replay for an existing PR.
worktree:
  enabled: true
inputs:
  PR_NUMBER:
    default: ""
  WO_ID:
    default: ""
nodes:
  - id: checkout-replay
    load_bearing: true
    bash: |
      set -euo pipefail
      PR="${PR_NUMBER:-${INPUT_PR_NUMBER:-}}"
      [ -n "$PR" ] || PR="$(printf '%s\n' "${USER_MESSAGE:-}" | sed -nE 's/.*PR_NUMBER=([0-9]+).*/\1/p')"
      [[ "$PR" =~ ^[0-9]+$ ]] || { echo 'PR_NUMBER must be a positive integer' >&2; exit 1; }
      # The engine checkout may be a linked worktree with shared git config.
      # Clone the origin into this run's artifacts; mutate only our own config.
      SOURCE_URL="$(git remote get-url origin)"
      mkdir -p "$ARTIFACTS_DIR/evidence"
      REPLAY_DIR="$ARTIFACTS_DIR/replay-checkout"
      git clone --quiet --no-checkout -- "$SOURCE_URL" "$REPLAY_DIR"
      cd "$REPLAY_DIR"
      git remote set-url --push origin DISABLED-evidence-replay
      git fetch origin "refs/pull/$PR/head"
      git checkout --detach FETCH_HEAD
      pwd > "$ARTIFACTS_DIR/evidence/replay-checkout"
      printf '%s\n' "$PR" > "$ARTIFACTS_DIR/evidence/replay.pr"
      git rev-parse HEAD > "$ARTIFACTS_DIR/run-start-sha.txt"
      gh pr view "$PR" --repo thinmansoftware/bdc-harness --json body,headRefOid > "$ARTIFACTS_DIR/evidence/replay-pr.json"

  - id: read-spec
    depends_on: [checkout-replay]
    bash: |
      set -uo pipefail
      WO_ID="${WO_ID:-${INPUT_WO_ID:-}}"
      if [ -z "$WO_ID" ]; then
        WO_ID="$(python3 -c 'import json,re,sys; body=json.load(open(sys.argv[1]))["body"]; m=re.search(r"^WO:\s*(WO-[A-Z0-9-]+)",body,re.M); print(m[1] if m else "")' "$ARTIFACTS_DIR/evidence/replay-pr.json")"
      fi
      SPEC_CONTENT=""
      SPEC_PATH=""
      if [ -n "$WO_ID" ]; then
      # Specs live in bdc-xo (NOT the target codebase). Cross-repo fetch via gh api.
      # Per YAML Recipe v1 Section 4 / Rule 5: try docs/work-orders/ then docs/superpowers/specs/ glob.
      SPEC_PATH="docs/work-orders/${WO_ID}.md"
      SPEC_CONTENT=$(gh api "repos/thinmansoftware/bdc-xo/contents/${SPEC_PATH}?ref=main" --template '{{.content}}' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
      if [ -z "$SPEC_CONTENT" ]; then
        # Fallback 1: docs/superpowers/specs/${WO_ID}.md direct
        SPEC_PATH="docs/superpowers/specs/${WO_ID}.md"
        SPEC_CONTENT=$(gh api "repos/thinmansoftware/bdc-xo/contents/${SPEC_PATH}?ref=main" --template '{{.content}}' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
      fi
      if [ -z "$SPEC_CONTENT" ]; then
        # Fallback 2: date-prefix glob in docs/superpowers/specs/
        MATCH=$(gh api "repos/thinmansoftware/bdc-xo/contents/docs/superpowers/specs?ref=main" --template '{{range .}}{{.path}}{{"\n"}}{{end}}' 2>/dev/null | grep "${WO_ID}.md$" | head -n 1)
        if [ -n "$MATCH" ]; then
          SPEC_PATH="$MATCH"
          SPEC_CONTENT=$(gh api "repos/thinmansoftware/bdc-xo/contents/${SPEC_PATH}?ref=main" --template '{{.content}}' | tr -d '\n' | base64 -d || true)
        fi
      fi
      if [ -z "$SPEC_CONTENT" ]; then
        # Fallback 4: GitHub issue body (WO-HARNESS-READ-SPEC-ISSUE-BODY-FALLBACK-01)
        ISSUE_NUM=$(printf '%s\n' "${USER_MESSAGE:-}" | grep -Eo 'issue=[0-9]+' | head -n 1 | cut -d= -f2 || true)
        if [ -z "$ISSUE_NUM" ]; then
          ISSUE_NUM=$(gh issue list --repo thinmansoftware/bdc-xo \
            --search "${WO_ID} in:title" --json number,title \
            --jq '.[0].number' 2>/dev/null || true)
        fi
        if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
          SPEC_CONTENT=$(gh issue view "$ISSUE_NUM" --repo thinmansoftware/bdc-xo \
            --json body --jq .body 2>/dev/null || true)
          [ -n "$SPEC_CONTENT" ] && SPEC_PATH="issues/${ISSUE_NUM}"
        fi
      fi
      fi
      printf '%s\n' "$WO_ID" > "$ARTIFACTS_DIR/evidence/replay.wo"
      printf '%s' "$SPEC_CONTENT" > "$ARTIFACTS_DIR/spec.md"
      printf 'WO_ID=%s\nSPEC_PATH=bdc-xo:%s\n\n%s\n' "$WO_ID" "$SPEC_PATH" "$SPEC_CONTENT"

  - id: format-autofix
    depends_on: [read-spec]
    bash: |
      # Dependency anchor only: replay must not rewrite the PR before observing it.
      echo 'replay: no formatting mutation'

  - id: resolve-test-command
    persona: major-build
    load_bearing: true
    depends_on: [format-autofix]
    task_class: clerical
    timeout: 60000
    bash: |
      set -uo pipefail
      # Replay consumers run in the owned clone; feature lanes keep their cwd.
      if [ -n "${ARTIFACTS_DIR:-}" ] && [ -f "$ARTIFACTS_DIR/evidence/replay-checkout" ]; then
        cd "$(cat "$ARTIFACTS_DIR/evidence/replay-checkout")" || exit 1
      fi
      ORIGIN="$(git remote get-url origin 2>/dev/null || true)"
      if ! MAP_RESPONSE="$(timeout 30 gh api 'repos/thinmansoftware/bdc-xo/contents/scripts/cauldron/cauldron-projects.json?ref=main' 2>/dev/null)"; then
        printf 'TEST_COMMAND_SOURCE=wo-spec\nTEST_COMMAND_FALLBACK=unavailable\nTEST_COMMAND_MAP_SHA=\nTEST_COMMAND_B64=\nTEST_TIMEOUT_SECONDS=1500\n'
        exit 0
      fi
      # Structured data only: no shell evaluation or command execution here.
      python3 -c '
      import base64, json, re, sys
      def normalize(value, allow_slug=False):
          if not isinstance(value, str):
              return None
          # Cauldron clones embed a token in origin (https://<token>@github.com/o/r.git or
          # https://x-access-token:<token>@github.com/o/r.git); drop the userinfo first.
          value = re.sub(r"^(https?://)[^/@\s]+@", r"\1", value.strip(), flags=re.I)
          prefix = r"(?:https?://github[.]com/|ssh://git@github[.]com/|git@github[.]com:)"
          if allow_slug:
              prefix += "?"
          match = re.fullmatch(prefix + r"([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+?)(?:[.]git)?/?", value, re.I)
          return match.group(1).lower() if match else None
      reason = "malformed"
      sha = ""
      command = ""
      timeout_seconds = 1500
      try:
          envelope = json.load(sys.stdin)
          revision = envelope.get("sha", "")
          if not isinstance(revision, str) or not re.fullmatch(r"[0-9a-fA-F]{40}", revision):
              raise ValueError("invalid map revision")
          sha = revision.lower()
          content = base64.b64decode("".join(envelope["content"].split()), validate=True)
          projects = json.loads(content)
          if not isinstance(projects, dict):
              raise ValueError("invalid project map")
          slug = normalize(sys.argv[1])
          matches = [value for value in projects.values() if isinstance(value, dict) and slug is not None and normalize(value.get("repo"), True) == slug]
          reason = "invalid-origin" if slug is None else "missing" if not matches else "ambiguous" if len(matches) != 1 else "invalid-command"
          if len(matches) == 1:
              value = matches[0].get("test_timeout_seconds")
              if type(value) is int:
                  timeout_seconds = max(60, min(1700, value))
              candidate = matches[0].get("test_command")
              if isinstance(candidate, str) and candidate.strip() and len(candidate) <= 4096 and "\n" not in candidate and "\r" not in candidate and "\x00" not in candidate:
                  command = candidate
                  reason = ""
      except (ValueError, TypeError, KeyError, AttributeError):
          reason = "malformed"
      print("TEST_TIMEOUT_SECONDS=" + str(timeout_seconds))
      print("TEST_COMMAND_SOURCE=" + ("project-map" if command else "wo-spec"))
      print("TEST_COMMAND_FALLBACK=" + reason)
      print("TEST_COMMAND_MAP_SHA=" + sha)
      print("TEST_COMMAND_B64=" + base64.b64encode(command.encode()).decode())
      ' "$ORIGIN" <<< "$MAP_RESPONSE"


  - id: run-stop-tests
    persona: major-build
    load_bearing: true
    depends_on: [format-autofix, resolve-test-command]
    task_class: clerical
    timeout: 1800000
    bash: |
      set -uo pipefail
      # Replay consumers run in the owned clone; feature lanes keep their cwd.
      if [ -n "${ARTIFACTS_DIR:-}" ] && [ -f "$ARTIFACTS_DIR/evidence/replay-checkout" ]; then
        cd "$(cat "$ARTIFACTS_DIR/evidence/replay-checkout")" || exit 1
      fi

      capture_node_output() {
        python3 -c 'import shlex, sys; s=sys.stdin.read(); sys.stdout.write((lambda p: p[0] if len(p)==1 else s)(shlex.split(s)) if len(s)>=2 and s[0]=="'"'"'" and s.rstrip("\n").endswith("'"'"'") else s)'
      }

      # ---- BEGIN rst core (byte-identical across lanes; extracted by unit test) ----
      # POSIX awk only (the container ships mawk, not gawk): no IGNORECASE, no gensub.
      # rst_class   (spec on stdin -> CODE|INFRA|MIXED|DOCUMENTATION|OPERATOR; default CODE)
      #   Reads the first "WO Class:" / "Class:" line. Doctrine default is CODE (Rule 14).
      rst_class() {
        local c
        c="$(grep -m1 -E '^[[:space:]]*(WO )?[Cc]lass:[[:space:]]*(CODE|INFRA|MIXED|DOCUMENTATION|DOCS|OPERATOR)' | sed -E 's/^[[:space:]]*(WO )?[Cc]lass:[[:space:]]*//' | grep -oE '^[A-Z]+' | head -1 || true)"
        case "$c" in
          CODE|INFRA|MIXED|DOCUMENTATION|OPERATOR) printf '%s' "$c" ;;
          DOCS) printf 'DOCUMENTATION' ;;
          *) printf 'CODE' ;;
        esac
      }
      # inline-flag rejection: -c -e --eval -p --print -r --require -i -m
      rst_has_inline_flag() {
        local t
        for t in "$@"; do
          case "$t" in
            -c|-e|--eval|-p|--print|-r|--require|-i|-m|-c=*|-e=*|--eval=*|-p=*|--print=*|-r=*|--require=*|-i=*|-m=*) return 0 ;;
          esac
        done
        return 1
      }
      # The command check and the execution consume the words of ONE shared quote-aware
      # tokenizer, scripts/lane/rsg-argv.sh (rsg_parse_chain, WO-HARNESS-GREP-STOP-EXTRACTION-
      # SILENT-WAIVE-01), the same file the run-stop-greps node sources. Resolution order:
      # $BDC_RSGARGV_SCRIPT (tests), then the engine per-node copy
      # $ARCHON_LANE_SCRIPTS_DIR/rsg-argv.sh, then the image copy /app/scripts/lane/rsg-argv.sh.
      # When none exists a command that contains a quote character is refused (fail closed) and
      # a command with no quote character is split on whitespace exactly as before.
      RSGARGV_SCRIPT=""
      for rsgargv_candidate in "${BDC_RSGARGV_SCRIPT:-}" "${ARCHON_LANE_SCRIPTS_DIR:+${ARCHON_LANE_SCRIPTS_DIR}/rsg-argv.sh}" /app/scripts/lane/rsg-argv.sh; do
        if [ -n "$rsgargv_candidate" ] && [ -f "$rsgargv_candidate" ]; then RSGARGV_SCRIPT="$rsgargv_candidate"; break; fi
      done
      if [ -n "$RSGARGV_SCRIPT" ]; then
        . "$RSGARGV_SCRIPT"
      else
        printf 'run-stop-tests: rsg-argv.sh missing (tried BDC_RSGARGV_SCRIPT=%s, ARCHON_LANE_SCRIPTS_DIR=%s, /app/scripts/lane/rsg-argv.sh); a command containing a quote character will be refused (fail closed)\n' "${BDC_RSGARGV_SCRIPT:-unset}" "${ARCHON_LANE_SCRIPTS_DIR:-unset}" >&2
        RSG_PARSED=()
        rsg_parse_chain() { RSG_PARSED=(); return 1; }
      fi
      # Segment separator element in RST_WORDS (the one-character string ASCII 0x1E; the same value
      # as RSG_RS in rsg-argv.sh, defined here so the helper-missing path needs no helper).
      RST_RS=$'\036'
      RST_WORDS=()
      # rst_parse_cmd <cmd>   (rc 0 and RST_WORDS filled: one argv word per element, && segments
      #   separated by the single element RST_RS; rc 1 rejects the command). With the helper this
      #   is rsg_parse_chain: single-quoted words are one literal argv word each, double quotes,
      #   backslashes, ; | & ` $ ( ) > < and {{ outside quotes are refused. The chain scanner also
      #   accepts glob characters outside quotes; the rst charset never did, so they are refused
      #   here (checked on the command with its quoted spans removed). Without the helper: any
      #   quote character is refused, otherwise the legacy whitespace split with the legacy
      #   charset ^[A-Za-z0-9@%+=:,./_-]+$ per word.
      rst_parse_cmd() {
        local LC_ALL=C
        local cmd="${1-}" rest seg w more
        local -a out=()
        RST_WORDS=()
        if [ -n "$RSGARGV_SCRIPT" ]; then
          rsg_parse_chain "$cmd" || return 1
          case "$(printf '%s' "$cmd" | sed "s/'[^']*'//g")" in *'*'*|*'?'*|*'['*|*']'*) return 1 ;; esac
          RST_WORDS=("${RSG_PARSED[@]}")
          return 0
        fi
        case "$cmd" in *"'"*|*'"'*|*'\'*) return 1 ;; esac
        case "$cmd" in *'{{'*|*';'*|*'`'*|*'$('*|*'>'*|*'<'*|*'|'*) return 1 ;; esac
        case "${cmd//&&/}" in *'&'*) return 1 ;; esac
        rest="$cmd"
        while :; do
          case "$rest" in
            *'&&'*) seg="${rest%%&&*}"; rest="${rest#*&&}"; more=1 ;;
            *) seg="$rest"; rest=""; more=0 ;;
          esac
          set -f
          set -- $seg
          set +f
          [ $# -gt 0 ] || return 1
          for w in "$@"; do
            [[ "$w" =~ ^[A-Za-z0-9@%+=:,./_-]+$ ]] || return 1
            out+=("$w")
          done
          [ "$more" -eq 1 ] || break
          out+=("$RST_RS")
        done
        RST_WORDS=("${out[@]}")
        return 0
      }
      # rst_has_install_step <word...>   (rc 0 when one parsed segment holds a dependency-install
      #   step: npm|npm.cmd|pnpm|yarn|bun followed by ci|install|i|add)
      rst_has_install_step() {
        local -a a=("$@")
        local i
        for ((i = 0; i + 1 < ${#a[@]}; i++)); do
          case "${a[i]}" in
            npm|npm.cmd|pnpm|yarn|bun)
              case "${a[i+1]}" in ci|install|i|add) return 0 ;; esac
              ;;
          esac
        done
        return 1
      }
      rst_is_repo_script() {
        local p="$1" oldifs seg
        case "$p" in /*|-*) return 1 ;; esac
        case "$p" in *.js|*.mjs|*.cjs|*.ts|*.tsx|*.py|*.sh) ;; *) return 1 ;; esac
        oldifs="$IFS"; IFS=/; set -f; set -- $p; set +f; IFS="$oldifs"
        for seg in "$@"; do
          [ "$seg" = ".." ] && return 1
        done
        return 0
      }
      # rst_argv_looks_runnable <word...>   (rc 0 when the already-parsed argv words of ONE && segment
      #   name an allowlisted runner with its safe arguments; there is no tokenizing here)
      rst_argv_looks_runnable() {
        local runner
        [ $# -ge 2 ] || return 1
        runner="$1"
        shift
        case "$runner" in
          node|npm|npx|bun|bunx|pytest|python|python3|go|cargo|bash|sh|make) ;;
          *) return 1 ;;
        esac
        case "$runner" in
          python|python3)
            if [ "$1" = "-m" ] && { [ "${2:-}" = "pytest" ] || [ "${2:-}" = "unittest" ]; }; then
              shift 2
              rst_has_inline_flag "$@" && return 1
              return 0
            fi
            rst_is_repo_script "$1" || return 1
            rst_has_inline_flag "$@" && return 1
            return 0
            ;;
          node|bash|sh)
            rst_is_repo_script "$1" || return 1
            rst_has_inline_flag "$@" && return 1
            return 0
            ;;
          bun)
            if [ "$1" = "test" ] || [ "$1" = "run" ]; then
              if [ "$1" = "run" ]; then
                [ -n "${2:-}" ] || return 1
                printf '%s' "$2" | grep -qE '^[A-Za-z0-9:_.-]+$' || return 1
              fi
              rst_has_inline_flag "$@" && return 1
              return 0
            fi
            rst_is_repo_script "$1" || return 1
            rst_has_inline_flag "$@" && return 1
            return 0
            ;;
          npm)
            [ "$1" = "test" ] || [ "$1" = "run" ] || return 1
            if [ "$1" = "run" ]; then
              [ -n "${2:-}" ] || return 1
              printf '%s' "$2" | grep -qE '^[A-Za-z0-9:_.-]+$' || return 1
            fi
            rst_has_inline_flag "$@" && return 1
            return 0
            ;;
          npx|bunx)
            printf '%s' "$1" | grep -qE '^[A-Za-z0-9@/._-]+$' || return 1
            rst_has_inline_flag "$@" && return 1
            return 0
            ;;
          pytest|go|cargo|make)
            rst_has_inline_flag "$@" && return 1
            return 0
            ;;
        esac
        return 1
      }
      # rst_command_looks_runnable <cmd>   (rc 0 when the line parses -- through the shared
      #   quote-aware tokenizer, no shell -- to an allowlisted runner FOLLOWED BY AN ARGUMENT -- a
      #   bare "node" or "bun" mentioned in prose is not a command (live false positive, run
      #   f4dabd76) -- with no inline interpreter modes, and is not a dependency-install step).
      #   Interpreters (node|bun|python|python3|bash|sh) must take a relative repo script path (.js
      #   .mjs .cjs .ts .tsx .py .sh), not -c/-e/--eval, and a quoted "-e" is refused like a bare
      #   one because the checks run on the parsed words. python -m pytest|unittest is the only -m
      #   exception. A single-quoted multi-word argument is one argv word. Round-4 metacharacter
      #   rejection still applies (see rst_parse_cmd).
      rst_command_looks_runnable() {
        local cmd="$1" k=0 total
        local -a words=() seg=()
        rst_parse_cmd "$cmd" || return 1
        words=("${RST_WORDS[@]}")
        total=${#words[@]}
        [ "$total" -gt 0 ] || return 1
        # Preserve an optional "cd safe/subdir &&" prefix and declared chains of test runners.
        # Every remaining && segment must itself be argv-runnable.
        if [ "${words[0]}" = "cd" ]; then
          [ "$total" -ge 4 ] && [ "${words[2]}" = "$RST_RS" ] || return 1
          printf '%s' "${words[1]}" | grep -qE '^[A-Za-z0-9_./-]+$' || return 1
          k=3
        fi
        while [ "$k" -lt "$total" ]; do
          seg=()
          while [ "$k" -lt "$total" ] && [ "${words[k]}" != "$RST_RS" ]; do
            seg+=("${words[k]}")
            k=$((k + 1))
          done
          [ "${#seg[@]}" -gt 0 ] || return 1
          if rst_has_install_step "${seg[@]}"; then
            return 1
          fi
          rst_argv_looks_runnable "${seg[@]}" || return 1
          k=$((k + 1))
        done
        return 0
      }
      # rst_extract_commands   (spec on stdin -> one declared test command per line, deduped,
      #   first 8). Ladder, in document order:
      #     A. the template "Stop N (test suite|tests|unit tests|suite ...)" block(s): the
      #        command line(s) up to "Expected:" (backslash joins continuation lines)
      #     B. any backticked runner command inside a "Stop conditions" / "Stop Point" /
      #        "Test scenarios" / "Verification" section, or on any "When:" line
      #     C. the Section 9 "Tests: <n>/<n> (<command>)" parenthesised group(s)
      #   Callers filter with rst_command_looks_runnable (drops prose, placeholders,
      #   install steps).
      rst_extract_commands() {
        awk -v RUNNER='(^|[ /&|;(])(node|bun|bunx|npm|npm[.]cmd|npx|pnpm|yarn|vitest|jest|mocha|pytest|python3?|go|cargo|bash|sh|make|deno|dotnet|mvn|gradle|tap)( |$)' '
          function clean(s) { sub(/^[ \t]+/, "", s); sub(/[ \t]+$/, "", s); gsub(/`/, "", s); sub(/^\$ /, "", s); return s }
          function emit(c) { c = clean(c); if (c != "" && !(c in seen)) { seen[c] = 1; print c } }
          tstate == 1 {
            if ($0 ~ /^[ \t]*```/) next
            line = clean($0)
            if (line == "") next
            if (line ~ /^[Ee]xpected:/) { if (tcmd != "") emit(tcmd); tcmd = ""; tstate = 0; next }
            if (line ~ /^[*]*[Ss]top [0-9A-Za-z.]+/) { if (tcmd != "") emit(tcmd); tcmd = ""; tstate = 0 }
            else { tcmd = (tcmd == "" ? line : tcmd " " line); sub(/[ \t]*\\$/, "", tcmd); next }
          }
          tstate == 0 && /^[ \t]*[*]*[Ss]top [0-9A-Za-z.]+[ \t]*\(([Tt]est|[Uu]nit|[Ss]uite)/ { tstate = 1; tcmd = ""; next }
          /^#+ / { insec = ($0 ~ /[Ss]top [Cc]ondition|[Ss]top [Pp]oint|[Tt]est [Ss]cenario|[Tt]est [Pp]lan|[Vv]erification/) ? 1 : 0 }
          insec || $0 ~ /^[ \t]*-?[ \t]*[*]*[Ww]hen[*]*:/ {
            s = $0
            while (match(s, /`[^`]+`/)) {
              g = substr(s, RSTART + 1, RLENGTH - 2); s = substr(s, RSTART + RLENGTH)
              if (g ~ RUNNER) emit(g)
            }
          }
          /^[ \t]*Tests:[ \t]/ {
            s = $0
            while (match(s, /\([^)]*\)/)) {
              g = substr(s, RSTART + 1, RLENGTH - 2); s = substr(s, RSTART + RLENGTH)
              if (g ~ RUNNER) emit(g)
            }
          }
          END { if (tstate == 1 && tcmd != "") emit(tcmd) }
        ' | head -n 8
      }
      # rst_rescue_subdir <cmd>   (-> cmd, or "cd <dir> && <cmd>" when the command's first
      #   relative path does not exist at the worktree root but exists in exactly one
      #   depth-1 directory -- shopops specs write "node tests/x.js" meaning shopops-api/).
      #   Works on the parsed argv words, so a quoted multi-word argument is never split
      #   or mistaken for a path.
      rst_rescue_subdir() {
        local cmd="$1" tok p="" d hit="" n=0
        case "$cmd" in cd\ *|*'&& cd '*) printf '%s' "$cmd"; return 0 ;; esac
        rst_parse_cmd "$cmd" || { printf '%s' "$cmd"; return 0; }
        for tok in "${RST_WORDS[@]}"; do
          case "$tok" in
            "$RST_RS"|-*|*://*|*'='*|*' '*|*$'\t'*) continue ;;
            */*) p="${tok#./}"; break ;;
          esac
        done
        if [ -z "$p" ] || [ -e "$p" ]; then printf '%s' "$cmd"; return 0; fi
        for d in */; do
          d="${d%/}"
          case "$d" in node_modules|.git|dist|build) continue ;; esac
          if [ -e "$d/$p" ]; then hit="$d"; n=$((n + 1)); fi
        done
        if [ "$n" -eq 1 ]; then printf 'cd %s && %s' "$hit" "$cmd"; else printf '%s' "$cmd"; fi
      }
      # rst_tests_in_diff <base-sha>   (-> one test command per line derived from the test
      #   files this run created or modified since <base-sha>, plus untracked test files;
      #   empty when the diff touched no test files). Runner choice: *.test.* / *.spec.* /
      #   __tests__/ -> vitest if the root package.json declares vitest, jest if jest, else
      #   bun test; <dir>/tests/test_*.js -> "cd <dir> && node tests/<file>"; *.py -> pytest.
      #   Fixtures, helpers, run_all.js, snapshots and data files are excluded.
      rst_tests_in_diff() {
        local base="$1" files f js_runner="" bun_files="" py_files=""
        files="$( { git diff --name-only "$base" -- 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u \
          | grep -E '(^|/)(tests?|__tests__|spec)/|\.(test|spec)\.[cm]?[jt]sx?$|(^|/)test_[^/]*\.(js|mjs|cjs|py|sh)$' \
          | grep -vE '(^|/)(fixtures?|helpers?|__snapshots__|__mocks__|setup)/|(^|/)(run_all|_[^/]*|setup[^/]*|conftest)\.[a-z]+$|\.(json|md|txt|csv|snap|sql|yaml|yml|html)$' || true)"
        [ -n "$files" ] || return 0
        if [ -f package.json ]; then
          if grep -q '"vitest"' package.json; then js_runner="npx vitest run"
          elif grep -q '"jest"' package.json; then js_runner="npx jest"
          fi
        fi
        [ -n "$js_runner" ] || js_runner="bun test"
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          [ -e "$f" ] || continue
          case "$f" in
            *.py) py_files="${py_files:+$py_files }$f" ;;
            *.test.*|*.spec.*|*__tests__/*) bun_files="${bun_files:+$bun_files }$f" ;;
            */tests/test_*.js|*/tests/test_*.mjs|*/tests/test_*.cjs) printf 'cd %s && node tests/%s\n' "${f%%/tests/*}" "${f##*/tests/}" ;;
            tests/test_*.js|tests/test_*.mjs|tests/test_*.cjs) printf 'node %s\n' "$f" ;;
            */tests/test_*.sh) printf 'cd %s && bash tests/%s\n' "${f%%/tests/*}" "${f##*/tests/}" ;;
            tests/test_*.sh|tests/*.test.sh|tests/*_test.sh) printf 'bash %s\n' "$f" ;;
            *) ;;
          esac
        done <<<"$files"
        [ -n "$bun_files" ] && printf '%s %s\n' "$js_runner" "$bun_files"
        [ -n "$py_files" ] && printf 'pytest %s\n' "$py_files"
        return 0
      }
      # rst_repo_test_script   (-> the repo's own canonical test command when the root
      #   package.json declares a "test" script: "bun run test" when a bun lockfile is
      #   present, else "npm test"; empty otherwise). Last rung of the ladder: a CODE WO
      #   whose spec names no command and whose diff touched no test file still gets
      #   real numbers from the repo's suite instead of N/A.
      rst_repo_test_script() {
        [ -f package.json ] || return 0
        python3 -c 'import json,sys; d=json.load(open("package.json")); s=d.get("scripts",{}); sys.exit(0 if isinstance(s,dict) and s.get("test") else 1)' 2>/dev/null || return 0
        if [ -f bun.lock ] || [ -f bun.lockb ]; then printf 'bun run test\n'; else printf 'npm test\n'; fi
      }
      # rst_parse_counts   (test-runner output on stdin -> "<passed> <total>", or empty)
      #   Sums every recognised summary line (a chained "a && b && c" command prints
      #   several). Recognised: shopops run_all "Passed: N  Failed: M  Total: T" and
      #   per-file "Tests: P/T"; jest "Tests: N failed, M passed, T total"; vitest
      #   "Tests  N failed | M passed (T)"; bun "N pass" / "M fail"; TAP and node:test
      #   "# pass N" / "pass N"; mocha "N passing" / "M failing"; pytest "N passed, M
      #   failed in Xs". Fallback: count "PASS:"/"ok" vs "FAIL:"/"not ok" lines. ANSI
      #   colour codes are stripped first (vitest).
      rst_parse_counts() {
        local esc raw counts
        esc="$(printf '\033')"
        # Bun --filter prefixes each workspace test line; normalize parser input only.
        raw="$(sed -E "s/${esc}\[[0-9;]*[A-Za-z]//g" | sed -E 's/^(@[A-Za-z0-9_-][A-Za-z0-9_.-]*\/)?[A-Za-z0-9_-][A-Za-z0-9_.-]*:test[[:blank:]]+\|[[:blank:]]*//')"
        counts="$(printf '%s\n' "$raw" | awk '
          /^[ \t]*Passed: [0-9]+[ \t]+Failed: [0-9]+[ \t]+Total: [0-9]+/ { p += $2; t += $6; hit = 1; next }
          /^[ \t]*Tests: [0-9]+\/[0-9]+[ \t]*$/ { split($2, a, "/"); p += a[1]; t += a[2]; hit = 1; next }
          /^[ \t]*Tests:.*[0-9]+ total/ { for (i = 1; i < NF; i++) { if ($(i+1) == "passed," || $(i+1) == "passed") p += $i; if ($(i+1) == "total") t += $i }; hit = 1; next }
          /^[ \t]*Tests[ \t]+.*[0-9]+ passed.*\([0-9]+\)[ \t]*$/ { for (i = 1; i < NF; i++) { if ($(i+1) == "passed") p += $i }; m = $NF; gsub(/[()]/, "", m); t += m; hit = 1; next }
          /^[ \t]*[0-9]+ pass[ \t]*$/ { p += $1; t += $1; hit = 1; next }
          /^[ \t]*[0-9]+ fail[ \t]*$/ { t += $1; hit = 1; next }
          /(^|[^A-Za-z0-9])pass [0-9]+[ \t]*$/ { p += $NF; t += $NF; hit = 1; next }
          /(^|[^A-Za-z0-9])fail [0-9]+[ \t]*$/ { t += $NF; hit = 1; next }
          /^[ \t]*[0-9]+ passing/ { p += $1; t += $1; hit = 1; next }
          /^[ \t]*[0-9]+ failing/ { t += $1; hit = 1; next }
          /^=+ .*[0-9]+ (passed|failed).* in [0-9.]+s/ { for (i = 1; i < NF; i++) { w = $(i+1); gsub(/,/, "", w); if (w == "passed") { p += $i; t += $i } else if (w == "failed" || w == "error" || w == "errors") t += $i }; hit = 1; next }
          END { if (hit) print p, t }
        ')"
        if [ -z "$counts" ]; then
          local pass fail
          pass="$(printf '%s\n' "$raw" | grep -cE '^(PASS|ok)([: ]|$)' || true)"
          fail="$(printf '%s\n' "$raw" | grep -cE '^(FAIL|not ok)([: ]|$)' || true)"
          pass="${pass:-0}"; fail="${fail:-0}"
          if [ "$pass" -gt 0 ] || [ "$fail" -gt 0 ]; then
            counts="$pass $((pass + fail))"
          fi
        fi
        printf '%s' "$counts"
      }
      # Remove production credentials and switches before any test command is spawned.
      # Preserve _TEST_ names: CI supplies disposable fixtures; production never uses them.
      rst_scrub_env() {
        local name
        for name in $(env | sed -n 's/=.*//p'); do
          case "$name" in
            *_TEST_*) continue ;;
            OVERSEER_*|MERGE_MANAGER_*|ARCHON_*|DUTY_OFFICER_*|TASKMASTER_*|DISPATCH_*|SMART_CAULDRON_*|BOARD_*|GITHUB_APP_*|GH_TOKEN|GITHUB_TOKEN|GH_AUTH_TOKEN_INTERNAL|TELEGRAM_*)
              unset "$name"
              ;;
          esac
        done
      }
      # Split declared semicolon segments outside literal single-quoted arguments.
      # Each resulting segment still passes the existing argv allowlist (no shell eval).
      rst_split_segments() {
        local line c part="" quoted=0 i
        while IFS= read -r line; do
          part=""; quoted=0
          for ((i=0; i<${#line}; i++)); do
            c="${line:i:1}"
            if [ "$c" = "'" ]; then quoted=$((1 - quoted)); fi
            if [ "$c" = ";" ] && [ "$quoted" -eq 0 ]; then
              printf '%s\n' "$part"; part=""
            else part+="$c"; fi
          done
          printf '%s\n' "$part"
        done
      }
      # rst_run_commands <commands-file> <log>   (runs each command line in the CWD under a
      #   1500 s budget as the parsed argv words of the shared tokenizer -- no bash -c -- appends
      #   every command's output to <log> under a "### run-stop-tests:" header, and prints
      #   "<exit> <passed> <total>" -- exit is the first nonzero exit, counts are summed across
      #   commands; "<exit>  " (empty counts) when nothing parsed). Optional "cd <dir> &&" is
      #   performed in-process; remaining && segments run sequentially. pipefail is
      #   unused (pipes are already rejected).
      rst_run_commands() {
        local cmds="$1" log="$2" cmd seg rc exit_code=0 p=0 t=0 hit=0 c
        local saved_pwd d k total piece piece_counts piece_cmd env_reason="" word needs_postgres
        local -a words=() segw=()
        rst_scrub_env
        saved_pwd="$(pwd)"
        seg="$(mktemp)"
        while IFS= read -r cmd; do
          [ -z "$cmd" ] && continue
          printf '### run-stop-tests: %s\n' "$cmd" >> "$log"
          cd "$saved_pwd" || continue
          : > "$seg"
          rc=0
          if ! rst_command_looks_runnable "$cmd"; then
            printf 'rst_run_commands: refusing non-runnable command\n' > "$seg"
            rc=1
          else
            rst_parse_cmd "$cmd" || true
            words=("${RST_WORDS[@]}")
            needs_postgres=0
            for word in "${words[@]}"; do
              case "$word" in --postgres|--postgres=*) needs_postgres=1 ;; esac
            done
            if [ "$needs_postgres" -eq 1 ] && [ "${BDC_BUILDER_POSTGRES:-}" != "1" ]; then
              env_reason="postgres capability absent in this lane"
              printf '### skipped: %s\n' "$env_reason" >> "$log"
              continue
            fi
            total=${#words[@]}
            k=0
            if [ "$total" -gt 0 ] && [ "${words[0]}" = "cd" ]; then
              d="${words[1]}"
              k=3
              if ! cd "$d"; then
                printf 'rst_run_commands: cd %s failed\n' "$d" > "$seg"
                rc=1
              fi
            fi
            if [ "$rc" -eq 0 ]; then
              while :; do
                segw=()
                while [ "$k" -lt "$total" ] && [ "${words[k]}" != "$RST_RS" ]; do
                  segw+=("${words[k]}")
                  k=$((k + 1))
                done
                set -- "${segw[@]}"
                if [ $# -eq 0 ]; then rc=1; break; fi
                # Rewrite npx/npm to bun only after the original argv passed the allowlist.
                # When the real binary is on PATH, leave the command unchanged.
                if [ "$1" = "npx" ] && ! command -v "${RST_NPX_BIN:-npx}" >/dev/null 2>&1; then
                  if command -v bunx >/dev/null 2>&1; then
                    shift
                    set -- bunx "$@"
                    printf 'rst_run_commands: npx not found, running as: %s\n' "$*" >> "$seg"
                  elif command -v bun >/dev/null 2>&1; then
                    shift
                    set -- bun x "$@"
                    printf 'rst_run_commands: npx not found, running as: %s\n' "$*" >> "$seg"
                  fi
                elif [ "$1" = "npm" ] && ! command -v "${RST_NPM_BIN:-npm}" >/dev/null 2>&1 && command -v bun >/dev/null 2>&1; then
                  if [ "${2:-}" = "test" ]; then
                    shift 2
                    set -- bun run test "$@"
                    printf 'rst_run_commands: npm not found, running as: %s\n' "$*" >> "$seg"
                  elif [ "${2:-}" = "run" ] && [ -n "${3:-}" ]; then
                    shift 2
                    set -- bun run "$@"
                    printf 'rst_run_commands: npm not found, running as: %s\n' "$*" >> "$seg"
                  fi
                fi
                piece="$(mktemp)"
                piece_cmd="${segw[*]}"
                timeout "$(rst_timeout)" "$@" > "$piece" 2>&1 < /dev/null
                rc=$?
                piece_counts="$(rst_parse_counts < "$piece")"
                cat "$piece" >> "$seg"
                printf 'TESTS_COMMAND_RESULT=%s => exit %s, %s/%s\n' "$piece_cmd" "$rc" "${piece_counts%% *}" "${piece_counts##* }" >> "$log"
                rm -f "$piece"
                [ "$rc" -ne 0 ] && break
                k=$((k + 1))
                [ "$k" -ge "$total" ] && break
              done
            fi
          fi
          cat "$seg" >> "$log"
          printf '### exit %s\n' "$rc" >> "$log"
          [ "$rc" -ne 0 ] && [ "$exit_code" -eq 0 ] && exit_code="$rc"
          c="$(rst_parse_counts < "$seg")"
          if [ -n "$c" ]; then p=$((p + ${c%% *})); t=$((t + ${c##* })); hit=1; fi
        done < "$cmds"
        cd "$saved_pwd" || true
        rm -f "$seg"
        if [ "$hit" -eq 1 ]; then printf '%s %s %s' "$exit_code" "$p" "$t"; else printf '%s  ' "$exit_code"; fi
        [ -z "$env_reason" ] || printf '\t%s' "$env_reason"
        return 0
      }
      # rst_report <class> <cmd> <exit> <counts> [env_reason] [log_path]
      #   A declared environment probe wins over blocked reasons; absent capability is
      #   not repairable, even if another declared command failed or timed out.
      #   Status law: passed only when the command exited 0 AND passed == total > 0.
      #   Any nonzero exit, any failing test, or 0 tests ran is "failed". A
      #   spec-declared command that exited nonzero with no parseable counts is
      #   also "failed" (the required command failed; do not treat it as an
      #   unparseable rung). Other unparseable output is "counts_unparsed"
      #   (fail-closed downstream on CODE/MIXED). A CODE or MIXED spec with no
      #   runnable test command AND no test files in the diff is
      #   "no_command_declared" (spec + build defect).
      rst_report() {
        local class="$1" cmd="$2" exit_code="$3" counts="$4" env_reason="${5:-}" status line p t reason
        if [ -n "$env_reason" ]; then
          line="${counts:-0 0}"
          line="${line/ /\/} ($cmd) -- ENVIRONMENT UNAVAILABLE: $env_reason"
          printf 'TESTS_ENV_REASON=%s\nTESTS_STATUS=env_unavailable\nTESTS_LINE=%s\n' "$env_reason" "$line"
          return 0
        fi
        reason="$(rst_failure_reason "$exit_code" "${6:-/dev/null}" "$cmd")"
        if [ -n "$reason" ]; then
          printf 'TESTS_STATUS=blocked\nTESTS_LINE=BLOCKED (%s)\nTESTS_BLOCKED_REASON=%s\n' "$reason" "$reason"
          return 0
        fi
        if [ -z "$cmd" ]; then
          case "$class" in
            CODE|MIXED) status="no_command_declared"; line="N/A ($class spec declares no executable test command and the diff touched no test files -- Rule 10 defect)" ;;
            *) status="not_required"; line="N/A ($class class, no test command declared)" ;;
          esac
        elif [ -z "$counts" ]; then
          if [ "$exit_code" -ne 0 ] && [ "${SOURCE:-}" = "spec_declared" ]; then
            status="failed"
            line="N/A (spec-declared test command exited $exit_code with no parseable counts: $cmd) -- FAILED"
          else
            status="counts_unparsed"
            line="N/A (test command exited $exit_code but pass/total could not be parsed from its output: $cmd)"
          fi
        else
          p="${counts%% *}"; t="${counts##* }"
          if [ "$exit_code" -ne 0 ] || [ "$t" -eq 0 ] || [ "$p" -lt "$t" ]; then
            status="failed"
            line="$p/$t ($cmd) -- FAILED, exit $exit_code"
          else
            status="passed"
            line="$p/$t ($cmd)"
          fi
        fi
        printf 'TESTS_STATUS=%s\nTESTS_LINE=%s\n' "$status" "$line"
      }

      # Project-map values are clamped separately; direct fixture overrides may be <60.
      rst_timeout() {
        local value="${RST_TIMEOUT_SECONDS:-1500}"
        if ! [[ "$value" =~ ^[0-9]+$ ]]; then value=1500; fi
        value="$(printf '%s' "$value" | sed 's/^0*//')"
        if [ -z "$value" ]; then value=1500
        elif [ "${#value}" -gt 4 ] || [ "$value" -gt 1700 ]; then value=1700; fi
        printf '%s' "$value"
      }
      rst_failure_reason() {
        local rc="$1" log="${2:-/dev/null}" cmd="${3:-}" tool
        if [ "$rc" -eq 124 ]; then printf 'timeout:%ss' "$(rst_timeout)"; return; fi
        if grep -q 'outside of the test runner' "$log" && [[ "$(command -v node)" == *bun-node-fallback-bin/* || "$(command -v node)" == */bun ]]; then
          printf 'runner_mismatch:node-is-bun'; return
        fi
        if [ "$rc" -eq 127 ] || grep -q 'failed to run command' "$log"; then
          tool="$(sed -nE 's/.*failed to run command [^A-Za-z0-9_/.-]*([A-Za-z0-9_/.-]+).*/\1/p' "$log" | head -1)"
          [ -n "$tool" ] || tool="${cmd%% *}"
          printf 'missing_tool:%s' "${tool:-unknown}"
        fi
      }
      # Same canonical-block selection and required stage keys as parse-stages.
      # An absent plan is empty; an ambiguous or invalid declared plan fails closed.
      rst_stage_plan() {
        python3 -c '
      import re, sys
      spec = sys.stdin.read()
      candidates = [(m.start(), m.group(1)) for m in re.finditer(r"```ya?ml\s*\n(.*?)\n```", spec, re.S) if re.search(r"^stages:", m.group(1), re.M)]
      if not candidates:
          m = re.search(r"^stages:[^\n]*(?:\n(?:[ \t-][^\n]*|))*(?:\n|$)", spec, re.M)
          if m: candidates = [(0, m.group())]
      if not candidates: sys.exit(0)
      markers = [r"^\s*##+\s+Canonical\s+stages\b", r"^\s*##+\s+Stages\b", r"<!--\s*canonical-stages\s*-->", r"<!--\s*stages:\s*canonical\s*-->"]
      chosen = next((body for marker in markers for offset, body in candidates if re.search(marker, spec[max(0, offset-600):offset], re.I|re.M)), None)
      if chosen is None:
          if len(candidates) != 1: sys.exit("stage_plan_invalid: ambiguous canonical stages")
          chosen = candidates[0][1]
      import yaml
      data = yaml.safe_load(chosen)
      stages = data.get("stages") if isinstance(data, dict) else None
      if not isinstance(stages, list) or not stages: sys.exit("stage_plan_invalid: empty stages")
      seen = set()
      lines = []
      for st in stages:
          if not isinstance(st, dict) or any(k not in st for k in ["id","repo","target_branch","in_scope_files","verify_commands","readiness_bar"]): sys.exit("stage_plan_invalid: required key missing")
          sid, repo, commands = st["id"], st["repo"], st["verify_commands"]
          if not isinstance(sid,str) or not re.fullmatch(r"[A-Za-z0-9_.-]+",sid) or sid in seen: sys.exit("stage_plan_invalid: invalid or duplicate id")
          seen.add(sid)
          if not isinstance(repo,str) or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+",repo): sys.exit("stage_plan_invalid: invalid repo")
          if not isinstance(commands,list) or not commands: sys.exit("stage_plan_invalid: empty verify_commands")
          for cmd in commands:
              if not isinstance(cmd,str) or not cmd.strip() or any(c in cmd for c in "\t\r\n\x00"): sys.exit("stage_plan_invalid: invalid command")
              lines.append("\t".join([sid,repo,cmd,str(st["target_branch"])]))
      print("\n".join(lines))' | sed 's/\r$//'
      }
      # Shared directory resolution for execution and assertion-guard coverage.
      rst_stage_dir() {
        local sid="$1" repo="$2" dir origin
        dir="$(printf '%s\n' "${RST_STAGE_WORKTREES:-}" | tr ';' '\n' | sed -n "s/^${sid}=//p" | head -1)"
        origin="$(git remote get-url origin 2>/dev/null | sed -E 's#.*github.com[:/]##; s/[.]git$//')"
        if [ -z "$dir" ] && [ "$repo" = "$origin" ]; then dir="$(pwd)"; fi
        printf '%s\n' "$dir"
      }
      # Replays only the persisted plan; no spec extraction occurs in a repair or final run.
      rst_execute_saved() {
        local evidence="$1" class="$2" cmds log result rc counts joined report reason="" env_reason="" overall_env_reason="" overall=passed p=0 t=0
        local sid repo cmd dir stage_status stage_line lines="" blocked="" stage_cmds
        cmds="$evidence/stop-tests.commands"; log="$evidence/stop-tests.log"
        if [ -s "$evidence/stop-tests.stages" ]; then
          stage_cmds="$(mktemp)"
          while IFS= read -r sid; do
            repo="$(awk -F '\t' -v id="$sid" '$1==id {print $2; exit}' "$evidence/stop-tests.stages")"
            awk -F '\t' -v id="$sid" '$1==id {print $3}' "$evidence/stop-tests.stages" > "$stage_cmds"
            dir="$(rst_stage_dir "$sid" "$repo")"
            if [ -z "$dir" ] || [ ! -d "$dir" ]; then
              stage_status=blocked; reason="stage_repo_absent:$repo"; stage_line="$sid: BLOCKED ($reason)"
            else
              joined="$(paste -sd ';' "$stage_cmds" | sed 's/;/; /g')"
              local stage_log
              stage_log="$(mktemp)"
              result="$(cd "$dir" && rst_run_commands "$stage_cmds" "$stage_log")"
              cat "$stage_log" >> "$log"
              env_reason=""
              case "$result" in *$'\t'*) env_reason="${result#*$'\t'}"; result="${result%%$'\t'*}" ;; esac
              rc="${result%% *}"; counts="${result#* }"; counts="$(echo "$counts" | xargs)"
              report="$(SOURCE=spec_declared rst_report "$class" "$joined" "$rc" "$counts" "$env_reason" "$stage_log")"
              stage_status="$(echo "$report" | sed -n 's/^TESTS_STATUS=//p')"
              reason="$(echo "$report" | sed -n 's/^TESTS_BLOCKED_REASON=//p')"
              stage_line="$sid: $(echo "$report" | sed -n 's/^TESTS_LINE=//p')"
              if [ -n "$counts" ]; then p=$((p+${counts%% *})); t=$((t+${counts##* })); fi
              rm -f "$stage_log"
            fi
            if [ "$stage_status" = env_unavailable ]; then
              overall=env_unavailable
              [ -n "$overall_env_reason" ] || overall_env_reason="$(echo "$report" | sed -n 's/^TESTS_ENV_REASON=//p')"
            elif [ "$stage_status" = blocked ]; then
              [ "$overall" = env_unavailable ] || overall=blocked
              [ -n "$blocked" ] || blocked="$reason"
            elif [ "$stage_status" != passed ] && [ "$overall" != blocked ] && [ "$overall" != env_unavailable ]; then overall=failed; fi
            printf 'TESTS_STAGE_LINE=%s\n' "$stage_line"
            lines="${lines:+$lines | }$stage_line"
          done < <(cut -f1 "$evidence/stop-tests.stages" | awk '!seen[$0]++')
          rm -f "$stage_cmds"
          [ -z "$overall_env_reason" ] || printf 'TESTS_ENV_REASON=%s\n' "$overall_env_reason"
          printf 'TESTS_STATUS=%s\nTESTS_LINE=%s\nTESTS_BLOCKED_REASON=%s\nTESTS_PASSED=%s\nTESTS_TOTAL=%s\nTESTS_EXIT=%s\n' "$overall" "$lines" "$blocked" "$p" "$t" "$([ "$overall" = passed ] && echo 0 || echo 1)"
        else
          joined="$(paste -sd ';' "$cmds" | sed 's/;/; /g')"
          local command_log
          command_log="$(mktemp)"
          result="$(rst_run_commands "$cmds" "$command_log")"
          cat "$command_log" >> "$log"
          env_reason=""
          case "$result" in *$'\t'*) env_reason="${result#*$'\t'}"; result="${result%%$'\t'*}" ;; esac
          rc="${result%% *}"; counts="${result#* }"; counts="$(echo "$counts" | xargs)"
          SOURCE=spec_declared rst_report "$class" "$joined" "$rc" "$counts" "$env_reason" "$command_log"
          printf 'TESTS_EXIT=%s\nTESTS_PASSED=%s\nTESTS_TOTAL=%s\n' "$rc" "${counts%% *}" "${counts##* }"
          rm -f "$command_log"
        fi
        printf 'TESTS_CLASS=%s\n' "$class"
        grep '^TESTS_COMMAND_RESULT=' "$log" || true
      }
      # Persist executable functions before the agent runs. Both consumers source this
      # snapshot, so the embedded rst/trg cores have one byte-identical copy per lane.
      rst_save_core() {
        { declare -f $(compgen -A function | grep -E '^(rst_|trg_|_?rsg_)'); declare -p RSGARGV_SCRIPT RST_RS RST_WORDS RSG_US RSG_RS RSG_PARSED; } > "$1/stop-tests.core.sh"
      }
      # ---- END rst core ----

      # ---- BEGIN trg core (byte-identical across lanes; extracted by unit test) ----
      # Allow only build-changed product source and new product helpers.
      # One infrastructure classifier governs the freeze, new files and listing.
      trg_guard() {
        local mode="$1" root="$2" snapshot="$3" sid repo command target dir
        local -a roots=("$root" "${BASE_BRANCH:-master}")
        local -a declared=()
        if [ ! -s "$(dirname "$snapshot")/stop-tests.stages" ] && [ -f "$(dirname "$snapshot")/stop-tests.commands" ]; then
          while IFS= read -r command; do
            declared+=("$root" "$command")
          done < "$(dirname "$snapshot")/stop-tests.commands"
        fi
        if [ -s "$(dirname "$snapshot")/stop-tests.stages" ]; then
          while IFS=$'\t' read -r sid repo command target; do
            dir="$(cd "$root" && rst_stage_dir "$sid" "$repo")" || return 1
            # Remember present roots; checks revisit saved roots if mappings vanish.
            if [ -n "$dir" ]; then
              dir="$(cd "$root" && cd "$dir" 2>/dev/null && pwd)" || continue
              roots+=("$dir" "$target")
              declared+=("$dir" "$command")
