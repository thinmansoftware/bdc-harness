# TEMPLATE: bdc-template-shopops-api
# Scenario: shopops-api WO -- Node.js Express routes, Docker runtime verification (Rule 19).
#
# Rule 19 CRITICAL: shopops-api uses COPY . /app at image build time (no source mount).
#   Source changes need a rebuild + restart. Every WO MUST include:
#   docker exec shopops-api grep -n '<line from fix>' /app/<path>
#   in the manifest to prove the running container has the new code.
#
# Container is on Hetzner. Read-only SSH is NOT hookify-blocked.
# Destructive SSH (restart, docker cp to production) requires John's approval.
# Rule 20: shopops is a staging-gate repo -- PR targets staging, not main.

name: bdc-[PREFIX]-[WO-SLUG]
description: |
  Use when: Executing [WO-ID] -- [one-line description].
  Input: WO_ID = [WO-ID].
  Does:
    - Reads spec from bdc-xo docs/work-orders/.
    - Implements in shopops-api (routes, middleware, or service layer).
    - Verifies: node tests/run_all.js passes.
    - Commits, pushes, opens PR to staging.
    - Provides docker exec grep evidence per Rule 19.
    - Flips Notion to REVIEW.
  Repo: bluedevilcollectibles/shopops.
  parallel_ok: false.  # shopops-api routes: serialize to prevent merge conflicts

policyFile: harness/policies/agent-behavior.md
model: sonnet

inputs:
  WO_ID:
    default: "[WO-ID]"

nodes:

  - id: preflight-github-auth
    load_bearing: true
    bash: |
      set -euo pipefail
      if ! git push --dry-run origin "HEAD:refs/heads/preflight-auth-probe-$(date +%s)" 2>&1; then
        echo "ERROR: GITHUB auth check failed." >&2; exit 1
      fi
      echo "preflight-github-auth PASS"

  - id: read-spec
    depends_on: [preflight-github-auth]
    bash: |
      set -euo pipefail
      WO_ID="${WO_ID:-[WO-ID]}"
      SPEC_CONTENT=$(gh api \
        "repos/bluedevilcollectibles/bdc-xo/contents/docs/work-orders/${WO_ID}.md?ref=main" \
        --template '{{.content}}' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
      if [ -z "$SPEC_CONTENT" ]; then
        GLOB_PATH=$(gh api \
          "repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main" \
          --template '{{range .}}{{.path}}{{"\n"}}{{end}}' 2>/dev/null \
          | grep "${WO_ID}.md$" | head -1 || true)
        if [ -n "$GLOB_PATH" ]; then
          SPEC_CONTENT=$(gh api \
            "repos/bluedevilcollectibles/bdc-xo/contents/${GLOB_PATH}?ref=main" \
            --template '{{.content}}' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
        fi
      fi
      if [ -z "$SPEC_CONTENT" ]; then
        echo "Spec not found for ${WO_ID}" >&2; exit 1
      fi
      printf 'WO_ID=%s\n\n--- SPEC ---\n%s\n' "$WO_ID" "$SPEC_CONTENT"

  - id: fresh-branch
    depends_on: [read-spec]
    bash: |
      set -euo pipefail
      git fetch origin staging --depth=50 || true
      git checkout staging 2>/dev/null || echo "staging branch held; staying"
      git reset --hard origin/staging 2>/dev/null || true
      BRANCH="wo/[wo-slug]-run-$(date +%Y%m%d%H%M%S)"
      git checkout -b "$BRANCH"
      echo "BRANCH=${BRANCH}"

  - id: implement
    depends_on: [fresh-branch]
    loop:
      fresh_context: true
      until: COMPLETE
      max_iterations: 5
      prompt: |
        Implement [WO-ID] in shopops-api. CWD = shopops repo root.

        ## Spec
        $read-spec.output

        ## Branch
        $fresh-branch.output

        ## Execution rules
        1. No new routes in server.js (Rule 13). New API routes go in routes/ or middleware/.
        2. New routes must send X-Shopops-Tenant header from apiFetch.
        3. After writing code, run: node tests/run_all.js
           All tests must pass. Fix failures before emitting COMPLETE.
        4. Rule 19 -- shopops-api rebuild required: Note the exact file + line number
           of your key change. The runtime-verify node will grep for it via docker exec.
        5. Commit + push:
           git -c user.name="John Ranson" -c user.email="admin@bluedevilcollectibles.com" \
             commit -m "feat(shopops-api): [WO-ID] -- [short description]"
           git push -u origin <branch>
        6. Output: RULE19_FILE=<relative/path/to/changed/file>
                   RULE19_GREP=<exact string to grep for proof>
           Then output COMPLETE on its own line.

  # ascii-gate (Rule 13 mechanical enforcement -- WO-HARNESS-CAULDRON-ASCII-ENFORCEMENT).
  # Fails the build (load_bearing, exit 1) if any source file changed by this run contains
  # a non-ASCII byte. The ASCII-only-source rule is carried in the policyFile every node
  # loads, but Claude/Opus leaks non-ASCII even when told not to, so enforce it mechanically
  # AFTER implement and BEFORE commit/PR. Scope = source files changed since the branch base.
  - id: ascii-gate
    depends_on: [implement]
    load_bearing: true
    bash: |
      set -uo pipefail
      WT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
      cd "$WT"
      BASE_REF="origin/${BASE_BRANCH:-main}"
      BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo "")
      SRC_RE='\.(js|jsx|ts|tsx|mjs|cjs|html|sh|bash|gs|yaml|yml)$'
      if [ -n "$BASE" ] && git rev-parse --verify "$BASE" >/dev/null 2>&1; then
        CHANGED=$( { git diff --name-only "$BASE"..HEAD 2>/dev/null; git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E "$SRC_RE" || true )
      else
        CHANGED=$( { git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E "$SRC_RE" || true )
      fi
      if [ -z "$CHANGED" ]; then
        echo "ascii-gate PASS (no changed source files to scan)"
        exit 0
      fi
      # Portable non-ASCII detector. grep -P is not present in every build image (and errors
      # under a non-UTF-8 locale), so probe it once, then prefer perl, then a locale-safe
      # od byte-scan that works everywhere (the final fallback never uses grep -P).
      GREP_P_OK=0
      if printf 'a\xe2\x80\x94b\n' | grep -qP "[^\x00-\x7F]" 2>/dev/null; then GREP_P_OK=1; fi
      detect() {
        # returns 0 if file is clean, 1 if it contains a non-ASCII byte
        f="$1"
        if [ "$GREP_P_OK" = "1" ]; then
          grep -lP "[^\x00-\x7F]" "$f" >/dev/null 2>&1 && return 1
        elif command -v perl >/dev/null 2>&1; then
          perl -ne 'exit 1 if /[^\x00-\x7F]/' "$f" || return 1
        else
          # Locale-independent: any byte >= 0x80 is non-ASCII. od is in coreutils everywhere.
          od -An -tu1 "$f" 2>/dev/null | tr ' ' '\n' | grep -qE '^(12[89]|1[3-9][0-9]|2[0-4][0-9]|25[0-5])$' && return 1
        fi
        return 0
      }
      HITFILE=$(mktemp)
      printf '%s\n' "$CHANGED" | while IFS= read -r f; do
        [ -z "$f" ] && continue
        [ -f "$f" ] || continue
        if ! detect "$f"; then printf '%s\n' "$f" >> "$HITFILE"; fi
      done
      if [ -s "$HITFILE" ]; then
        echo "ASCII GATE FAILED -- non-ASCII bytes in changed source file(s):" >&2
        cat "$HITFILE" >&2
        echo "--- offending lines (first 5 per file) ---" >&2
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          if [ "$GREP_P_OK" = "1" ]; then
            grep -nP "[^\x00-\x7F]" "$f" 2>/dev/null | head -5 | sed "s|^|${f}:|" >&2
          elif command -v perl >/dev/null 2>&1; then
            perl -ne 'print "'"$f"':$.: $_" if /[^\x00-\x7F]/' "$f" 2>/dev/null | head -5 >&2
          else
            echo "${f}: (install grep -P or perl in the image for line-level detail)" >&2
          fi
        done < "$HITFILE"
        echo "Fix: em-dash/en-dash -> --, smart quotes -> ' and \", ellipsis -> ..., middot -> | or -, nbsp -> space, Unicode minus -> -. No emojis in source." >&2
        echo "See harness/policies/agent-behavior.md (Code Standards / Rule 13). This gate is load_bearing: the build fails until every changed source file is pure ASCII." >&2
        rm -f "$HITFILE"
        exit 1
      fi
      rm -f "$HITFILE"
      echo "ascii-gate PASS (scanned $(printf '%s\n' "$CHANGED" | grep -c .) changed source file(s), all ASCII)"
      exit 0

  - id: verify-tests
    depends_on: [ascii-gate]
    bash: |
      set -euo pipefail
      node tests/run_all.js
      echo "tests PASS"

  - id: commit-and-push
    depends_on: [verify-tests]
    bash: |
      set -euo pipefail
      BRANCH="$(git rev-parse --abbrev-ref HEAD)"
      git add -A
      if ! git diff --cached --quiet; then
        git -c user.name="John Ranson" -c user.email="admin@bluedevilcollectibles.com" \
          commit -m "chore: backstop commit [WO-ID]"
      fi
      git push -u origin "$BRANCH"
      echo "SHA=$(git rev-parse HEAD)"
      echo "BRANCH=${BRANCH}"

  - id: open-pr
    depends_on: [commit-and-push]
    bash: |
      set -euo pipefail
      WO_ID="${WO_ID:-[WO-ID]}"
      REPO="bluedevilcollectibles/shopops"
      BRANCH="$(git rev-parse --abbrev-ref HEAD)"
      EXIST=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
        --json url --jq '.[0].url // empty' 2>/dev/null || true)
      if [ -n "$EXIST" ]; then echo "PR_URL=$EXIST"; exit 0; fi
      for attempt in 1 2 3; do
        if URL=$(gh pr create --repo "$REPO" --base staging --head "$BRANCH" \
            --title "feat(shopops-api): ${WO_ID} -- [short description]" \
            --body "Implements ${WO_ID}. Spec: bdc-xo docs/work-orders/${WO_ID}.md

      NOTE: shopops-api requires docker rebuild+restart after merge (Rule 19).
      Runtime verification: docker exec shopops-api grep -n '...' /app/..." 2>&1); then
          echo "PR_URL=$URL"; exit 0
        fi
        sleep $((attempt * 5))
      done
      echo "ERROR: gh pr create failed after 3 attempts" >&2; exit 1

  - id: flip-notion
    depends_on: [open-pr]
    task_class: clerical
    bash: |
      set -euo pipefail

      capture_node_output() {
        python3 -c 'import shlex, sys; s=sys.stdin.read(); sys.stdout.write((lambda p: p[0] if len(p)==1 else s)(shlex.split(s)) if len(s)>=2 and s[0]=="'"'"'" and s.rstrip("\n").endswith("'"'"'") else s)'
      }

      MANIFEST=$(capture_node_output <<'BDC_NODE_OUTPUT_MANIFEST'
      $open-pr.output
      BDC_NODE_OUTPUT_MANIFEST
      )

      READ_SPEC_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_READ_SPEC'
      $read-spec.output
      BDC_NODE_OUTPUT_READ_SPEC
      )
      ISSUE_REPO="${ISSUE_REPO:-bluedevilcollectibles/bdc-xo}"
      ISSUE_NUM=$(printf '%s\n' "${USER_MESSAGE:-}" | grep -Eo 'issue=[0-9]+' | head -1 | cut -d= -f2 || true)
      if [ -z "$ISSUE_NUM" ]; then
        ISSUE_NUM=$(printf '%s\n' "$READ_SPEC_OUT" | sed -n 's/^SPEC_PATH=.*issues\/\([0-9][0-9]*\).*/\1/p' | head -1)
      fi
      if [ -z "$ISSUE_NUM" ]; then
        WO_ID_FROM_SPEC=$(printf '%s\n' "$READ_SPEC_OUT" | sed -n 's/^WO_ID=//p' | head -1)
        if [ -n "$WO_ID_FROM_SPEC" ]; then
          ISSUE_NUM=$(gh issue list --repo "$ISSUE_REPO" --search "$WO_ID_FROM_SPEC in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
        fi
      fi
      if [ -z "$ISSUE_NUM" ]; then
        echo "flip-notion: no GitHub issue resolved; skipping status:review label + manifest comment."
        exit 0
      fi

      gh label create status:review --repo "$ISSUE_REPO" --color 0E8A16 --description "BDC workflow is ready for review" 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --remove-label status:building 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --remove-label status:blocked 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --add-label status:review
      COMMENT_FILE=$(mktemp)
      printf '%s\n' "$MANIFEST" > "$COMMENT_FILE"
      gh issue comment "$ISSUE_NUM" --repo "$ISSUE_REPO" --body-file "$COMMENT_FILE"
      echo "flip-notion: $ISSUE_REPO#$ISSUE_NUM -> status:review (manifest posted as comment)"
