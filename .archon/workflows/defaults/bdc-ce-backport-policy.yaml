name: bdc-ce-backport-policy
description: |
  Use when: Shipping WO-RELEASE-CE-BACKPORT-POLICY-01 -- Captain CI enforces every CE hotfix
  has a backport PR to main.
  Input: WO_ID = WO-RELEASE-CE-BACKPORT-POLICY-01.
  Does: Implements a Captain CI check in lspro-react `.github/workflows/ce-backport-check.yml`
        that runs when a PR merges into release/ce from a hotfix/ce/* branch -- verifies a
        backport PR to main exists or a waiver is recorded. Opens PR.
  Repo: bluedevilcollectibles/lspro-react. Cross-repo spec from bdc-xo.

policyFile: harness/policies/agent-behavior.md
model: sonnet

nodes:
  - id: read-spec
    bash: |
      set -euo pipefail
      WO_ID="${WO_ID:-WO-RELEASE-CE-BACKPORT-POLICY-01}"
      SPEC_PATH="docs/superpowers/specs/ce-release-branch/work-orders/${WO_ID}.md"
      SPEC=$(gh api "repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main" --jq .content 2>/dev/null | base64 -d 2>/dev/null || true)
      if [ -z "$SPEC" ]; then
        # Fallback 4: GitHub issue body (WO-HARNESS-READ-SPEC-ISSUE-BODY-FALLBACK-01)
        ISSUE_NUM=$(printf '%s\n' "${USER_MESSAGE:-}" | grep -Eo 'issue=[0-9]+' | head -n 1 | cut -d= -f2 || true)
        if [ -z "$ISSUE_NUM" ]; then
          ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \
            --search "${WO_ID} in:title" --json number,title \
            --jq '.[0].number' 2>/dev/null || true)
        fi
        if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
          SPEC=$(gh issue view "$ISSUE_NUM" --repo bluedevilcollectibles/bdc-xo \
            --json body --jq .body 2>/dev/null || true)
          [ -n "$SPEC" ] && SPEC_PATH="issues/${ISSUE_NUM}"
        fi
      fi
      if [ -z "$SPEC" ]; then echo "Spec not found (tried docs/work-orders/, docs/superpowers/specs/ direct, date-prefix glob, and GitHub issue search)" >&2; exit 1; fi
      printf 'WO_ID=%s\nSPEC_PATH=bdc-xo:%s\nWORKFLOW_ID=%s\n\n' "$WO_ID" "$SPEC_PATH" "$WORKFLOW_ID"
      printf -- '%s\n' "$SPEC"

  # post-started node REMOVED 2026-05-12 - n8n webhook hangs from Archon executor subprocess
  # (see WO-HARNESS-N8N-WEBHOOK-EGRESS-FIX-01). Builder-status feed is optional bookkeeping;
  # flip-notion is the canonical close action.

  - id: implement
    depends_on: [read-spec]
    task_class: medium_work
    loop:
      fresh_context: true
      until: COMPLETE
      max_iterations: 5
      prompt: |
        Implement CE backport policy as a Captain CI GitHub Actions workflow.

        ## Spec
        $read-spec.output

        ## Required files
        - `.github/workflows/ce-backport-check.yml`
          - Triggers: pull_request_target on closed events targeting release/ce
          - Only runs when the merged branch matches `hotfix/ce/*`
          - Logic:
            1. Get the merged commit SHA
            2. Use `gh pr list --base main --search "<commit-sha-or-cherry-pick-ref>"` to find a backport PR
            3. If none found AND no `ce-backport-waiver` label on the original PR, fail the check + comment on the merged PR with instructions
            4. If found, post comment with backport PR URL + pass
          - Required permissions: `pull-requests: write`, `contents: read`
        - `docs/CE-BACKPORT-POLICY.md` -- short policy doc pointing to bdc-xo governance

        ## Rules
        - Use only `gh` CLI (preinstalled in GitHub-hosted runners) + standard bash.
        - The check is INFORMATIONAL (not blocking) for now -- comment-only; if we want hard-block later, separate WO.
        - Do NOT modify any other workflow files.

        Output <promise>COMPLETE</promise> when both files exist + `yamllint .github/workflows/ce-backport-check.yml` passes (or skipped if yamllint not present).

  - id: verify
    depends_on: [implement]
    bash: |
      set -euo pipefail
      ls .github/workflows/ce-backport-check.yml
      ls docs/CE-BACKPORT-POLICY.md
      grep -E "hotfix/ce" .github/workflows/ce-backport-check.yml >/dev/null || { echo "FAIL: hotfix/ce pattern missing" >&2; exit 1; }

  - id: commit-and-push
    depends_on: [verify]
    bash: |
      set -euo pipefail
      BRANCH="wo/release-ce-backport-policy-01"
      # Idempotent checkout: handle retry-into-existing-worktree case + worktree-locked-branch case
      if git show-ref --quiet "refs/heads/$BRANCH"; then
        if git worktree list --porcelain | grep -q "branch refs/heads/$BRANCH" && \
           [ "$(git rev-parse --abbrev-ref HEAD)" != "$BRANCH" ]; then
          BRANCH="${BRANCH}-run-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
        else
          git checkout "$BRANCH"
        fi
      else
        git checkout -b "$BRANCH"
      fi
      git add .github/workflows/ce-backport-check.yml docs/CE-BACKPORT-POLICY.md
      # Idempotent commit: skip if branch already contains the work (retry-safe).
      if git diff --cached --quiet; then
        echo "No staged changes; branch already contains requested work"
      else
        git -c user.name="John Ranson" -c user.email="admin@bluedevilcollectibles.com" \
          commit -m "feat(ci): WO-RELEASE-CE-BACKPORT-POLICY-01 -- CE hotfix backport policy check

        Adds .github/workflows/ce-backport-check.yml. Runs when a PR is merged into release/ce
        from a hotfix/ce/* branch. Checks for a backport PR to main, comments instructions if missing.
        Informational (non-blocking) for v1; can be promoted to required check later.

        Co-Authored-By: Claude Opus 4.7 (1M context) <noreply@anthropic.com>"
      fi
      git push -u origin "$BRANCH"
      echo "BRANCH=${BRANCH}"

  - id: open-pr
    depends_on: [commit-and-push]
    bash: |
      set -euo pipefail
      # Hardcoded -- must match commit-and-push BRANCH literal. See WO-HARNESS-OPEN-PR-BRANCH-INTERPOLATION-FIX-01.
      BRANCH="wo/release-ce-backport-policy-01"
      REPO="bluedevilcollectibles/lspro-react"
      BASE="main"
      TITLE="feat(ci): WO-RELEASE-CE-BACKPORT-POLICY-01 -- CE hotfix backport check"
      BODY="Implements WO-RELEASE-CE-BACKPORT-POLICY-01. CE hotfixes that merge to release/ce without a backport PR to main now get a CI comment with instructions.  Generated with Claude Code"
      # Idempotent PR creation: check first, then create with retries, re-check after each failed attempt.
      # See WO-HARNESS-OPEN-PR-GRAPHQL-NO-COMMITS-FIX-01 -- gh pr create can server-side-succeed even when client returns error,
      # and the GitHub PR API needs multi-minute window to resolve newly-pushed refs.
      existing_pr_url() {
        gh pr list --repo "$REPO" --head "$BRANCH" --state open --json url --jq '.[0].url // empty' 2>/dev/null
      }
      PR_URL="$(existing_pr_url)"
      if [ -n "$PR_URL" ]; then
        echo "PR_URL=$PR_URL"
        exit 0
      fi
      for attempt in 1 2 3 4 5; do
        if PR_OUT=$(gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" --body "$BODY" 2>&1); then
          echo "PR_URL=$PR_OUT"
          exit 0
        fi
        PR_URL="$(existing_pr_url)"
        if [ -n "$PR_URL" ]; then
          echo "PR_URL=$PR_URL"
          exit 0
        fi
        echo "open-pr attempt $attempt failed: $PR_OUT" >&2
        sleep 10
      done
      echo "open-pr failed after retries; branch pushed at $BRANCH but no PR exists" >&2
      exit 1

  - id: build-manifest
    depends_on: [open-pr]
    task_class: clerical
    prompt: |
      Manifest v2 for WO-RELEASE-CE-BACKPORT-POLICY-01.
      WO, Builder, Files created, PR URL, VALIDATION: PASS.
      Inputs: $read-spec.output $verify.output $commit-and-push.output $open-pr.output

  # post-completed node REMOVED 2026-05-12 - n8n webhook hangs from Archon executor subprocess
  # (see WO-HARNESS-N8N-WEBHOOK-EGRESS-FIX-01). Builder-status feed is optional bookkeeping;
  # flip-notion below is the canonical close action.

  - id: flip-notion
    depends_on: [build-manifest]
    task_class: clerical
    bash: |
      set -euo pipefail

      capture_node_output() {
        python3 -c 'import shlex, sys; s=sys.stdin.read(); sys.stdout.write((lambda p: p[0] if len(p)==1 else s)(shlex.split(s)) if len(s)>=2 and s[0]=="'"'"'" and s.rstrip("\n").endswith("'"'"'") else s)'
      }

      MANIFEST=$(capture_node_output <<'BDC_NODE_OUTPUT_MANIFEST'
      $build-manifest.output
      BDC_NODE_OUTPUT_MANIFEST
      )

      READ_SPEC_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_READ_SPEC'
      $read-spec.output
      BDC_NODE_OUTPUT_READ_SPEC
      )
      ISSUE_REPO="${ISSUE_REPO:-bluedevilcollectibles/bdc-xo}"
      ISSUE_NUM=$(printf '%s\n' "${USER_MESSAGE:-}" | grep -Eo 'issue=[0-9]+' | head -1 | cut -d= -f2 || true)
      if [ -z "$ISSUE_NUM" ]; then
        ISSUE_NUM=$(printf '%s\n' "$READ_SPEC_OUT" | sed -n 's/^SPEC_PATH=.*issues\/\([0-9][0-9]*\).*/\1/p' | head -1)
      fi
      if [ -z "$ISSUE_NUM" ]; then
        WO_ID_FROM_SPEC=$(printf '%s\n' "$READ_SPEC_OUT" | sed -n 's/^WO_ID=//p' | head -1)
        if [ -n "$WO_ID_FROM_SPEC" ]; then
          ISSUE_NUM=$(gh issue list --repo "$ISSUE_REPO" --search "$WO_ID_FROM_SPEC in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
        fi
      fi
      if [ -z "$ISSUE_NUM" ]; then
        echo "flip-notion: no GitHub issue resolved; skipping status:review label + manifest comment."
        exit 0
      fi

      gh label create status:review --repo "$ISSUE_REPO" --color 0E8A16 --description "BDC workflow is ready for review" 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --remove-label status:building 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --remove-label status:blocked 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --add-label status:review
      COMMENT_FILE=$(mktemp)
      printf '%s\n' "$MANIFEST" > "$COMMENT_FILE"
      gh issue comment "$ISSUE_NUM" --repo "$ISSUE_REPO" --body-file "$COMMENT_FILE"
      echo "flip-notion: $ISSUE_REPO#$ISSUE_NUM -> status:review (manifest posted as comment)"
