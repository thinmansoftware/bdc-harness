name: bdc-lspro-pulllist-scout-locg-import
description: |
  Use when: Executing WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01.
  Repo: bluedevilcollectibles/lspro-react (branch: promotion/v2)
  Does: Wires Scout-first LOCG import for pull list subscribers in
  PullListCommandCenter.tsx SubscribersTab. Reads source files before planning
  to ensure correct component tree hierarchy. Commits, pushes, opens a PR
  targeting staging (Rule 20 gate), and builds a Captain CI manifest.
  NOT for: Other PullListCommandCenter tabs, scout-service backend changes,
  or doctrine updates.

policyFile: harness/policies/agent-behavior.md
model: sonnet

nodes:
  # Pre-flight: fail closed if container lacks GITHUB auth (WO-169, 2026-05-16).
  - id: preflight-github-auth
    persona: major-build
    load_bearing: true
    bash: |
      set -euo pipefail
      if ! git push --dry-run origin "HEAD:refs/heads/preflight-auth-probe-$(date +%s)" 2>&1; then
        echo "ERROR: GITHUB auth check failed -- container cannot push to origin." >&2
        echo "Likely cause: GITHUB_TOKEN missing in executor env, or token lacks repo scope." >&2
        exit 1
      fi
      echo "preflight-github-auth PASS"

  - id: read-spec
    persona: xo
    depends_on: [preflight-github-auth]
    bash: |
      set -euo pipefail
      WO_ID="WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01"
      SPEC_PATH="docs/work-orders/${WO_ID}.md"
      SPEC_CONTENT=$(gh api "repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main" --template '{{.content}}' 2>/dev/null | tr -d '\n' | base64 -d 2>/dev/null || true)
      if [ -z "$SPEC_CONTENT" ]; then
        MATCH=$(gh api "repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main" --template '{{range .}}{{.path}}{{"\n"}}{{end}}' 2>/dev/null | grep "${WO_ID}.md$" | head -n 1)
        if [ -n "$MATCH" ]; then
          SPEC_PATH="$MATCH"
          SPEC_CONTENT=$(gh api "repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main" --template '{{.content}}' | tr -d '\n' | base64 -d || true)
        fi
      fi
      if [ -z "$SPEC_CONTENT" ]; then
        ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \
          --search "${WO_ID} in:title" --json number,title \
          --jq '.[0].number' 2>/dev/null || true)
        if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
          SPEC_CONTENT=$(gh issue view "$ISSUE_NUM" --repo bluedevilcollectibles/bdc-xo \
            --json body --jq .body 2>/dev/null || true)
          [ -n "$SPEC_CONTENT" ] && SPEC_PATH="issues/${ISSUE_NUM}"
        fi
      fi
      if [ -z "$SPEC_CONTENT" ]; then
        echo "Spec not found for ${WO_ID} (tried docs/work-orders/, docs/superpowers/specs/ glob, and GitHub issue search)" >&2
        exit 1
      fi
      printf 'WO_ID=%s\nSPEC_PATH=bdc-xo:%s\n\n' "$WO_ID" "$SPEC_PATH"
      printf '%s\n' "$SPEC_CONTENT"

  - id: read-source-files
    persona: major-build
    depends_on: [read-spec]
    task_class: medium_work
    prompt: |
      Read the source files relevant to WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01 before planning.
      This WO is in the bluedevilcollectibles/lspro-react repo. CWD is the lspro-react worktree root.

      ## Files to read (find exact paths first)
      Run these discovery commands:
      ```bash
      find src -name 'PullListCommandCenter*' 2>/dev/null | head -10
      find src -name 'SubscribersTab*' 2>/dev/null | head -10
      find src -name 'locg*' -o -name 'LOCG*' 2>/dev/null | head -10
      find src -name 'scout*' -o -name 'Scout*' 2>/dev/null | head -10
      ```

      Then read:
      - PullListCommandCenter.tsx (focus on SubscribersTab import section)
      - SubscribersTab.tsx (if it exists as a separate file)
      - Any existing LOCG import service/hook in src/services/ or src/hooks/

      ## Required Output
      Return a summary covering:
      - Exact file paths found (relative to CWD)
      - Component tree hierarchy for PullListCommandCenter -> SubscribersTab
        (not a flat feature list -- include parent/child component relationships)
      - Existing LOCG fetch or import mechanism (or confirmation it is missing)
      - Scout API endpoint used for LOCG data (if wired anywhere)
      - Props/state shape that SubscribersTab currently expects
      - Any existing import-trigger button or handler in SubscribersTab

      ## WO Spec
      $read-spec.output

  - id: plan
    persona: war-council-architect
    depends_on: [read-source-files]
    agent: war-council-architect
    task_class: medium_work
    prompt: |
      Read the BDC Work Order spec and source file audit below, then produce a concise
      implementation plan for wiring Scout-first LOCG import in SubscribersTab.

      ## Required Output
      Return structured Markdown with these headings:
      - WO ID
      - Component tree (parent->child hierarchy, not flat list)
      - Files to modify (exact relative paths)
      - Files to create
      - Files explicitly out of scope
      - Scout API endpoint and request shape
      - State/prop changes required in SubscribersTab
      - Verification commands
      - Commit message
      - Push policy (lspro-react is a Rule 20 staging-gate repo)
      - Staging gate required: true

      ## BDC Push Policy
      lspro-react is a Rule 20 staging-gate repo:
      - Feature branch plus PR targeting staging branch.
      - staging_gate_required: true

      ## Spec
      $read-spec.output

      ## Source Audit
      $read-source-files.output

  - id: implement
    persona: major-build
    depends_on: [plan]
    agent: major-build
    task_class: medium_work
    loop:
      prompt: |
        Implement the approved plan for WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01.

        ## Spec
        $read-spec.output

        ## Source Audit
        $read-source-files.output

        ## Plan
        $plan.output

        ## Execution Rules
        - Modify only the files identified as in scope by the spec and plan.
        - Follow the component tree hierarchy from the plan -- do NOT add LOCG import
          logic to a parent component if the plan places it in SubscribersTab.
        - Prefer existing React hooks, service call patterns, and TypeScript types.
        - Do not reformat unrelated code.
        - Do not deploy.
        - Do not bypass approval gates.
        - Stop and report a blocker if the Scout API endpoint is unreachable or
          the spec is ambiguous about the import trigger (button vs auto-load).

        ## Commit-and-push BEFORE exit (Patch 2, 2026-05-16)
        When your implementation is complete, BEFORE emitting the sentinel, run:

        ```bash
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        WO_ID="WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01"
        git add -A
        git diff --cached --quiet || git commit -m "feat: implement ${WO_ID}

        Wire Scout-first LOCG import in PullListCommandCenter SubscribersTab.

        Co-Authored-By: Claude (Cauldron major-build) <noreply@anthropic.com>"
        git push -u origin "$BRANCH" 2>&1 || echo "WARN: push failed -- operator must recover from worktree"
        ```

        ## Completion Criteria + Sentinel Emission
        Output ALL THREE sentinels on their own lines at the very end when all spec stop
        conditions are met OR a true blocker is identified with evidence:

        COMPLETE
        BUILD_COMPLETE
        <promise>COMPLETE</promise>

        If a true blocker is found, end with: BLOCKED: <one-sentence reason>
      until: COMPLETE
      max_iterations: 3
      fresh_context: true

  - id: war-council-validator
    persona: captain-ci-validator
    depends_on: [implement]
    task_class: medium_work
    prompt: |
      Invoke or emulate the war-council-validator review for WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01.

      ## Inputs
      Spec:
      $read-spec.output

      Plan:
      $plan.output

      Implementation output:
      $implement.output

      Git diff:
      Run `git diff --stat` and `git diff --check`, then inspect PullListCommandCenter.tsx
      and SubscribersTab.tsx (or equivalent) for the LOCG import wiring.

      ## Required Output
      Return either:
      - satisfied: with evidence that Scout-first LOCG import is wired in SubscribersTab
        and the component tree hierarchy matches the plan
      - needs_revision: with exact file/path/behavior findings

  - id: decide-push-target
    persona: major-build
    depends_on: [war-council-validator]
    task_class: clerical
    prompt: |
      Decide the push target for WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01.

      ## Branch Name Derivation Rules
      Derive from the WO ID ONLY. Do NOT copy the current git branch name.
      WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01 -> feat/wo-lspro-pulllist-scout-locg-import-01
      The branch MUST NOT start with archon/thread- or contain -thread- anywhere.

      ## Repo Policy
      Target repo: bluedevilcollectibles/lspro-react
      This repo is in the Rule 20 staging-gate list.

      Output:
      push_target: feature-branch:feat/wo-lspro-pulllist-scout-locg-import-01
      pr_required: true
      staging_gate_required: true
      repo: bluedevilcollectibles/lspro-react

      CRITICAL: emit a `repo:` line in every output case.

  - id: commit-and-push
    persona: overseer
    depends_on: [decide-push-target]
    load_bearing: true
    bash: |
      set -euo pipefail
      DECIDE_OUTPUT=$decide-push-target.output
      PLAN_OUTPUT=$plan.output
      echo "$DECIDE_OUTPUT"
      if printf '%s\n' "$DECIDE_OUTPUT" | grep -q '^out_of_scope: true'; then
        echo "Out of scope for bdc-lspro-pulllist-scout-locg-import; failing closed." >&2
        exit 1
      fi
      # WO-HARNESS-PUSH-TARGET-EXTRACTION-HARDENING-01: tolerant multi-strategy
      # push_target extraction. The old line-anchored sed broke a 2nd time
      # (run e5110df1, fable tier, 2026-08-01) after PR #165's first whitespace
      # patch -- the ^...$ anchor requires the WHOLE line to be exactly
      # "push_target: feature-branch: <token>", so any markdown fence, list
      # bullet, blockquote, backtick, or trailing prose a model tier adds makes
      # BRANCH come back empty and the node exit 1 with a message that lied
      # ("absent" when the field was present but merely styled differently).
      # Fix: pre-strip backticks, then (1) fast path -- the exact
      # whitespace-tolerant anchor (unchanged behavior for well-formed output,
      # zero regression); (2) fallback -- scan ANYWHERE for
      # "push_target: feature-branch: <token>", stopping at the first whitespace
      # so trailing prose is tolerated. Failure now distinguishes "field absent"
      # from "field present but unparseable". Extraction is a pure read of the
      # decide output (no state mutation), so re-running the node is
      # side-effect-free. BRANCH_PATTERN validation below is unchanged and still
      # runs after extraction.
      DECIDE_OUTPUT_CLEAN=$(printf '%s\n' "$DECIDE_OUTPUT" | tr -d '`')
      BRANCH=$(printf '%s\n' "$DECIDE_OUTPUT_CLEAN" | sed -n 's/^[[:space:]]*push_target:[[:space:]]*feature-branch:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' | head -n 1)
      if [ -z "$BRANCH" ]; then
        BRANCH=$(printf '%s\n' "$DECIDE_OUTPUT_CLEAN" \
          | { grep -oE 'push_target:[[:space:]]*feature-branch:[[:space:]]*[^[:space:]]+' || true; } \
          | head -n 1 \
          | sed -E 's/^.*feature-branch:[[:space:]]*//')
      fi
      if [ -z "$BRANCH" ]; then
        if printf '%s\n' "$DECIDE_OUTPUT_CLEAN" | grep -q 'push_target'; then
          PUSH_TARGET_EXCERPT=$(printf '%s\n' "$DECIDE_OUTPUT_CLEAN" | grep 'push_target' | head -n 1 | cut -c1-200)
          echo "push_target field present but unparseable: ${PUSH_TARGET_EXCERPT}" >&2
        else
          echo "push_target field absent from decide-push-target output." >&2
        fi
        exit 1
      fi
      BRANCH_PATTERN='^(feat/[A-Za-z0-9_-]+|fix/[A-Za-z0-9_-]+|wip/[A-Za-z0-9_-]+)$'
      if ! printf '%s\n' "$BRANCH" | grep -Eq "$BRANCH_PATTERN"; then
        echo "Malformed branch name: $BRANCH does not match required pattern feat/|fix/|wip/" >&2
        exit 1
      fi
      # DEFECT FIX 2026-07-27 (anchor: WO-CRM-SUPABASE-CONVERGENCE-01, run d982e84e).
      # The old line was:
      #   THREAD_ID=$(git rev-parse --abbrev-ref HEAD | sed 's|archon/thread-||')
      # That sed only strips a PREFIX. When HEAD is NOT archon/thread-<hash> -- e.g. a run
      # resumed on an existing feature branch, as happens when a WO converges an existing
      # PR -- nothing is stripped and THREAD_ID becomes the ENTIRE branch name, producing
      # a nested double-suffix ref like:
      #   feat/wo-crm-supabase-convergence-01-thread-feat/wo-xo-crm-minimum-complete-journey-01
      # which then opened a SECOND, spurious PR. BRANCH is validated; THREAD_ID never was.
      CURRENT_REF=$(git rev-parse --abbrev-ref HEAD)
      case "$CURRENT_REF" in
        archon/thread-*)
          THREAD_ID=${CURRENT_REF#archon/thread-}
          ;;
        *)
          THREAD_ID=$(git rev-parse --short=8 HEAD 2>/dev/null || echo "nohead")
          echo "commit-and-push: HEAD is '${CURRENT_REF}' (not archon/thread-*); using commit-derived THREAD_ID=${THREAD_ID}" >&2
          ;;
      esac
      if ! printf '%s\n' "$THREAD_ID" | grep -Eq '^[A-Za-z0-9_-]+$'; then
        echo "ERROR: refusing to push -- derived THREAD_ID '${THREAD_ID}' is not a bare [A-Za-z0-9_-] token (would create a malformed branch)." >&2
        exit 1
      fi
      UNIQUE_BRANCH="${BRANCH}-thread-${THREAD_ID}"
      git status --short
      DIRTY=$(git status --porcelain)
      if [ -z "$DIRTY" ]; then
        if git rev-parse --quiet --verify "origin/${UNIQUE_BRANCH}" >/dev/null 2>&1 && \
           [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${UNIQUE_BRANCH}")" ]; then
          echo "Backstop no-op: implement loop already committed + pushed (HEAD matches)."
          echo "unique_branch=${UNIQUE_BRANCH}"
          exit 0
        fi
        if git rev-parse --quiet --verify "origin/${UNIQUE_BRANCH}" >/dev/null 2>&1; then
          COMMITS_AHEAD=$(git rev-list --count "origin/${UNIQUE_BRANCH}..HEAD" 2>/dev/null || echo 0)
        else
          COMMITS_AHEAD=$(git rev-list --count HEAD --not --remotes=origin 2>/dev/null || echo 0)
        fi
        if [ "$COMMITS_AHEAD" = "0" ]; then
          LOCAL_HEAD=$(git rev-parse HEAD)
          RECOVERED=$(git ls-remote origin 2>/dev/null \
            | awk -v sha="$LOCAL_HEAD" '$1 == sha {sub(/^refs\/heads\//, "", $2); print $2}' \
            | head -1)
          if [ -n "$RECOVERED" ]; then
            echo "Recovered push target from remote: $RECOVERED"
            # DEFECT FIX 2026-07-27 (anchor: bdc-crm PR #4, run f8ef4b92).
            # This recovery block adopts ANY remote ref whose HEAD SHA matches local HEAD.
            # If a PRIOR run pushed a malformed branch name, this block finds it, adopts it,
            # and pushes to it again -- propagating the corruption forward and opening a new
            # spurious PR each time. The bug feeds on its own output. Observed names:
            #   feat/wo-crm-supabase-convergence-01-thread-wo-crm-supabase-convergence-01'
            # (note the nested WO id AND the trailing quote). Validate before adopting.
            if printf '%s\n' "$RECOVERED" | grep -Eq '^(feat|fix|wip)/[A-Za-z0-9_-]+-thread-[A-Za-z0-9_-]+$'; then
              UNIQUE_BRANCH="$RECOVERED"
            else
              echo "WARN: recovered remote ref '${RECOVERED}' is malformed -- refusing to adopt it; keeping ${UNIQUE_BRANCH}" >&2
            fi
          else
            echo "No changed files and no commits ahead of origin/${UNIQUE_BRANCH} -- implement loop did not produce work" >&2
            exit 1
          fi
        else
          echo "Backstop: $COMMITS_AHEAD commit(s) ahead of origin -- pushing pre-committed work."
        fi
      else
        CHANGED_FILES=$(printf '%s\n' "$DIRTY" | awk '{print substr($0,4)}')
        AUTO_TOLERATED='^(bun\.lock|package-lock\.json|yarn\.lock|pnpm-lock\.yaml|\.bun-tag|node_modules/)$'
        printf '%s\n' "$CHANGED_FILES" | while IFS= read -r path; do
          if [ -z "$path" ]; then continue; fi
          if printf '%s\n' "$path" | grep -Eq "$AUTO_TOLERATED"; then
            echo "Auto-tolerated change (lockfile/managed): $path"
            git add -- "$path"
            continue
          fi
          if ! printf '%s\n' "$PLAN_OUTPUT" | grep -F -- "$path" >/dev/null; then
            echo "Changed file was not listed in plan output: $path" >&2
            exit 1
          fi
          git add -- "$path"
        done
        if git diff --cached --quiet; then
          echo "No changes staged; nothing for backstop to commit." >&2
          exit 0
        fi
        COMMIT_MESSAGE=$(printf '%s\n' "$PLAN_OUTPUT" | sed -n 's/^Commit message: //p' | head -n 1)
        if [ -z "$COMMIT_MESSAGE" ]; then
          COMMIT_MESSAGE="feat: WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01 implementation"
        fi
        git commit -m "$COMMIT_MESSAGE"
      fi
      PUSH_OK=false
      for attempt in 1 2 3; do
        if git push origin HEAD:"${UNIQUE_BRANCH}" 2>&1; then
          PUSH_OK=true
          break
        fi
        echo "WARN: push attempt $attempt failed; retrying after $((attempt * 5))s..." >&2
        sleep $((attempt * 5))
      done
      if [ "$PUSH_OK" = "false" ]; then
        echo "ERROR: git push failed after 3 attempts -- aborting workflow (load_bearing node)." >&2
        exit 1
      fi
      echo "unique_branch=${UNIQUE_BRANCH}"

  - id: open-pr-if-needed
    persona: major-build
    depends_on: [commit-and-push]
    task_class: clerical
    load_bearing: true
    bash: |
      set -euo pipefail
      DECIDE_OUTPUT=$decide-push-target.output
      PLAN_OUTPUT=$plan.output
      IMPLEMENT_OUTPUT=$implement.output
      VALIDATOR_OUTPUT=$war-council-validator.output
      COMMIT_PUSH_OUTPUT=$commit-and-push.output
      if ! printf '%s\n' "$DECIDE_OUTPUT" | grep -q '^pr_required: true'; then
        echo "PR not required; skipping."
        exit 0
      fi
      UNIQUE_BRANCH=$(printf '%s\n' "$COMMIT_PUSH_OUTPUT" | sed -n 's/^unique_branch=//p' | head -n 1)
      if [ -z "$UNIQUE_BRANCH" ]; then
        echo "UNIQUE_BRANCH not found in commit-and-push output." >&2
        exit 1
      fi
      REPO=$(printf '%s\n' "$DECIDE_OUTPUT" | sed -n 's/^repo: //p' | head -n 1)
      if [ -z "$REPO" ] || [ "$REPO" = "unknown" ]; then
        echo "ERROR: decide-push-target did not emit a valid 'repo: <owner>/<repo>'." >&2
        exit 1
      fi
      STAGING_GATE=$(printf '%s\n' "$DECIDE_OUTPUT" | grep -c '^staging_gate_required: true' 2>/dev/null || true)
      STAGING_GATE="${STAGING_GATE:-0}"
      if [ "$STAGING_GATE" -ge 1 ] 2>/dev/null; then
        BASE_BRANCH="staging"
      else
        BASE_BRANCH=""
      fi
      TITLE=$(printf '%s\n' "$PLAN_OUTPUT" | sed -n 's/^Commit message: //p' | head -n 1)
      if [ -z "$TITLE" ]; then
        TITLE="feat: WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01 -- Scout-first LOCG import in SubscribersTab"
      fi
      BODY_FILE=$(mktemp)
      {
        echo "## Summary"
        echo "$PLAN_OUTPUT"
        echo
        echo "## Validation"
        echo "Agent self-verifies in implement loop; PR-time gates handle final validation."
        echo
        echo "## Implement output"
        echo "$IMPLEMENT_OUTPUT"
        echo
        echo "## Validator"
        echo "$VALIDATOR_OUTPUT"
      } > "$BODY_FILE"
      PR_OK=false
      for attempt in 1 2 3; do
        if gh pr create --repo "$REPO" --title "$TITLE" --body-file "$BODY_FILE" --head "$UNIQUE_BRANCH" ${BASE_BRANCH:+--base "$BASE_BRANCH"} 2>&1; then
          PR_OK=true
          break
        fi
        if [ -n "$UNIQUE_BRANCH" ]; then
          EXIST=$(gh pr list --repo "$REPO" --head "$UNIQUE_BRANCH" --state open \
            --json url --jq '.[0].url // empty' 2>/dev/null || true)
          if [ -n "$EXIST" ]; then
            echo "PR_URL=$EXIST"
            PR_OK=true
            break
          fi
        fi
        echo "WARN: gh pr create attempt $attempt failed; retrying after $((attempt * 5))s..." >&2
        sleep $((attempt * 5))
      done
      if [ "$PR_OK" = "false" ]; then
        echo "ERROR: gh pr create failed after 3 attempts -- aborting workflow (load_bearing node)." >&2
        exit 1
      fi

  - id: build-manifest
    persona: major-build
    depends_on: [open-pr-if-needed]
    task_class: clerical
    prompt: |
      Construct the Captain CI completion manifest for WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01.

      ## Inputs
      Spec:
      $read-spec.output

      Plan:
      $plan.output

      Implementation:
      $implement.output

      Validator:
      $war-council-validator.output

      ## Required Manifest Fields
      - WO: WO-LSPRO-PULLLIST-SCOUT-LOCG-IMPORT-01
      - Builder: major-build (Cauldron)
      - Files modified (exact paths)
      - Files created
      - Component tree hierarchy (parent->child) that was implemented
      - Tests (count passing / count total with command)
      - PRs (repo PR URL)
      - Merge ancestors (repo main HEAD, manifest commit, behind_by)
      - Grep assertions (rerunnable grep proving Scout LOCG call in SubscribersTab)
      - Runtime verification (N/A for lspro-react -- Vercel pipeline handles)
      - Vercel deployment (staging URL, state, commit)
      - VALIDATION: PASS

  - id: flip-notion
    persona: xo
    depends_on: [build-manifest]
    task_class: clerical
    bash: |
      set -euo pipefail

      capture_node_output() {
        python3 -c 'import shlex, sys; s=sys.stdin.read(); sys.stdout.write((lambda p: p[0] if len(p)==1 else s)(shlex.split(s)) if len(s)>=2 and s[0]=="'"'"'" and s.rstrip("\n").endswith("'"'"'") else s)'
      }

      MANIFEST=$(capture_node_output <<'BDC_NODE_OUTPUT_MANIFEST'
      $build-manifest.output
      BDC_NODE_OUTPUT_MANIFEST
      )

      READ_SPEC_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_READ_SPEC'
      $read-spec.output
      BDC_NODE_OUTPUT_READ_SPEC
      )
      ISSUE_REPO="${ISSUE_REPO:-bluedevilcollectibles/bdc-xo}"
      ISSUE_NUM=$(printf '%s\n' "${USER_MESSAGE:-}" | grep -Eo 'issue=[0-9]+' | head -1 | cut -d= -f2 || true)
      if [ -z "$ISSUE_NUM" ]; then
        ISSUE_NUM=$(printf '%s\n' "$READ_SPEC_OUT" | sed -n 's/^SPEC_PATH=.*issues\/\([0-9][0-9]*\).*/\1/p' | head -1)
      fi
      if [ -z "$ISSUE_NUM" ]; then
        WO_ID_FROM_SPEC=$(printf '%s\n' "$READ_SPEC_OUT" | sed -n 's/^WO_ID=//p' | head -1)
        if [ -n "$WO_ID_FROM_SPEC" ]; then
          ISSUE_NUM=$(gh issue list --repo "$ISSUE_REPO" --search "$WO_ID_FROM_SPEC in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
        fi
      fi
      if [ -z "$ISSUE_NUM" ]; then
        echo "flip-notion: no GitHub issue resolved; skipping status:review label + manifest comment."
        exit 0
      fi

      gh label create status:review --repo "$ISSUE_REPO" --color 0E8A16 --description "BDC workflow is ready for review" 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --remove-label status:building 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --remove-label status:blocked 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --add-label status:review
      COMMENT_FILE=$(mktemp)
      printf '%s\n' "$MANIFEST" > "$COMMENT_FILE"
      gh issue comment "$ISSUE_NUM" --repo "$ISSUE_REPO" --body-file "$COMMENT_FILE"
      echo "flip-notion: $ISSUE_REPO#$ISSUE_NUM -> status:review (manifest posted as comment)"
