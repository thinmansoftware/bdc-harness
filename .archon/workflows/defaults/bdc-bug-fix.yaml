name: bdc-bug-fix
description: |
  Use when: Executing a BDC bug-class Work Order from an approved spec.
  Input: WO_ID in the environment or user message, plus repo context from Overlord.
  Does: Reads the BDC WO spec, writes a failing test that reproduces the bug, implements a fix, verifies all tests pass, commits, pushes, opens PRs, and builds a Captain CI manifest.
  NOT for: Features, doctrine-only updates, cleanup sweeps, infrastructure deploys, or P0 incidents requiring emergency hotfixes.

policyFile: harness/policies/agent-behavior.md
model: claude-sonnet-4-5

nodes:
  - id: read-spec
    persona: xo
    bash: |
      set -euo pipefail
      WO_ID="${WO_ID:-}"
      if [ -z "$WO_ID" ]; then
        WO_ID=$(printf '%s\n' "$USER_MESSAGE" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)
      fi
      if [ -z "$WO_ID" ]; then
        echo "WO_ID missing. Provide WO_ID in environment or user message." >&2
        exit 1
      fi
      # Try direct path first, then date-prefixed glob (specs are commonly named YYYY-MM-DD-WO-...md)
      # CWD is the bdc-xo repo root (Archon worktree), so paths are relative -- no BDC_XO/ prefix.
      SPEC_PATH="docs/superpowers/specs/${WO_ID}.md"
      if [ ! -f "$SPEC_PATH" ]; then
        SPEC_PATH=$(ls docs/superpowers/specs/*${WO_ID}.md 2>/dev/null | head -n 1 || true)
      fi
      if [ -z "$SPEC_PATH" ] || [ ! -f "$SPEC_PATH" ]; then
        # Fallback 3: GitHub issue body (WO-HARNESS-READ-SPEC-ISSUE-BODY-FALLBACK-01)
        ISSUE_NUM=$(printf '%s\n' "${USER_MESSAGE:-}" | grep -Eo 'issue=[0-9]+' | head -n 1 | cut -d= -f2 || true)
        if [ -z "$ISSUE_NUM" ]; then
          ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \
            --search "${WO_ID} in:title" --json number,title \
            --jq '.[0].number' 2>/dev/null || true)
        fi
        SPEC_CONTENT=""
        if [ -n "$ISSUE_NUM" ] && [ "$ISSUE_NUM" != "null" ]; then
          SPEC_CONTENT=$(gh issue view "$ISSUE_NUM" --repo bluedevilcollectibles/bdc-xo \
            --json body --jq .body 2>/dev/null || true)
        fi
        if [ -z "$SPEC_CONTENT" ]; then
          echo "Spec not found for WO_ID=${WO_ID} (tried docs/superpowers/specs/${WO_ID}.md, date-prefix glob, and GitHub issue search)" >&2
          exit 1
        fi
        printf 'WO_ID=%s\nSPEC_PATH=bdc-xo:issues/%s\n\n' "$WO_ID" "$ISSUE_NUM"
        printf '%s\n' "$SPEC_CONTENT"
        exit 0
      fi
      printf 'WO_ID=%s\nSPEC_PATH=%s\n\n' "$WO_ID" "$SPEC_PATH"
      cat "$SPEC_PATH"

  - id: post-started
    persona: xo
    depends_on: [read-spec]
    bash: |
      set -euo pipefail
      WO_ID=$(printf '%s\n' "$read-spec.output" | sed -n 's/^WO_ID=//p' | head -n 1)
      curl -sS -X POST "https://n8n.bluedevilcollectibles.com/webhook/builder-status" \
        -H "Content-Type: application/json" \
        -d "{\"action\":\"started\",\"wo_id\":\"${WO_ID}\",\"builder\":\"Builder-4\",\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

  - id: reproduce
    persona: major-build
    depends_on: [read-spec]
    task_class: medium_work
    prompt: |
      Read the BDC Work Order spec below and produce a failing test that reproduces the bug.

      ## Required Output
      Return a test file content in Markdown code block with:
      1. Clear description of what the test is checking
      2. The test code that WILL FAIL before any fix is applied
      3. The expected error or assertion failure when test runs
      4. The file path where this test should be placed

      The test must demonstrate the bug in its current form. The test must fail if you run it now against the unfixed code.

      ## Spec
      $read-spec.output

  - id: verify-test-fails
    persona: major-build
    depends_on: [reproduce]
    bash: |
      set -euo pipefail
      # Extract test file path and command from reproduce output
      # The test MUST fail before the fix. If test passes, reproduction is wrong.
      echo "Extracting test file path and run command from reproduce output..."
      TEST_PATH=$(printf '%s\n' "$reproduce.output" | grep -Eo '\`[^`]+\.(test\.(ts|js|py)|spec\.(ts|js|py))[^`]*\`' | head -n 1 | sed 's/`//g' || echo "")
      if [ -z "$TEST_PATH" ]; then
        echo "Could not extract test file path from reproduce output. Look for test file references." >&2
        exit 1
      fi
      echo "Test file: $TEST_PATH"

      # Detect test runner and run the specific test
      if [ -f package.json ] && grep -q '"test"' package.json; then
        echo "Running test via bun test..."
        if bun test -- "$TEST_PATH" 2>&1; then
          echo "ERROR: Test passed, but it MUST fail before the fix is applied!" >&2
          exit 1
        fi
      elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
        echo "Running test via pytest..."
        if pytest "$TEST_PATH" -v 2>&1; then
          echo "ERROR: Test passed, but it MUST fail before the fix is applied!" >&2
          exit 1
        fi
      else
        echo "Could not detect test runner. Assuming bun test..." >&2
        if bun test -- "$TEST_PATH" 2>&1; then
          echo "ERROR: Test passed, but it MUST fail before the fix is applied!" >&2
          exit 1
        fi
      fi
      echo "Confirmed: test fails as expected before fix."

  - id: plan-fix
    persona: war-council-architect
    depends_on: [verify-test-fails]
    task_class: medium_work
    prompt: |
      Given the reproduction from the bug investigation, plan the minimal fix to address the root cause.

      ## Required Output
      Return structured Markdown with these headings:
      - Root cause analysis
      - Fix strategy (minimal, surgical approach)
      - Files to modify
      - Files to create
      - Verification commands (run the test again)
      - Commit message
      - Push policy (same as feature-development: staging gate for Rule 20 repos)

      ## BDC Push Policy
      Hardcoded Rule 20 staging-gate repos:
      - bluedevilcollectibles/lspro-react
      - bluedevilcollectibles/shopops-storefront
      - bluedevilcollectibles/shopops

      For those repos, use a feature branch plus PR and require the staging gate.
      For other code repos, use feature branch plus PR without staging gate.

      ## Spec
      $read-spec.output

      ## Reproduction
      $reproduce.output

  - id: implement-fix
    persona: major-build
    depends_on: [plan-fix]
    task_class: medium_work
    model: opus[1m]
    loop:
      prompt: |
        Implement the approved fix plan for this BDC bug Work Order.

        ## Spec
        $read-spec.output

        ## Plan
        $plan-fix.output

        ## Reproduction Test Path
        $reproduce.output

        ## Execution Rules
        - Modify only the files identified as in scope by the plan.
        - Prefer existing repo patterns and helpers.
        - Do not reformat unrelated code.
        - Do not deploy.
        - Do not bypass approval gates.
        - Stop and report a blocker if the plan is ambiguous or a needed source of truth is missing.

        ## Loop Completion Criteria
        After each implementation attempt:
        1. Run the reproduction test (the one that was failing before the fix)
        2. If test PASSES, output <promise>COMPLETE</promise>
        3. If test FAILS, output the error and iterate

        You are in loop iteration $LOOP_ITERATION.
      until: COMPLETE
      max_iterations: 5
      fresh_context: true

  # ascii-gate (Rule 13 mechanical enforcement -- WO-HARNESS-CAULDRON-ASCII-ENFORCEMENT).
  # Fails the build (load_bearing, exit 1) if any source file changed by this run contains
  # a non-ASCII byte. The ASCII-only-source rule is carried in the policyFile every node
  # loads, but Claude/Opus leaks non-ASCII even when told not to, so enforce it mechanically
  # AFTER the fix and BEFORE the validator/commit/PR chain (war-council-validator also
  # depends_on ascii-gate, so a violation blocks the whole downstream chain). Scope = source
  # files changed since the branch base.
  - id: ascii-gate
    persona: major-build
    depends_on: [implement-fix]
    load_bearing: true
    bash: |
      set -uo pipefail
      WT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
      cd "$WT"
      BASE_REF="origin/${BASE_BRANCH:-main}"
      BASE=$(git merge-base HEAD "$BASE_REF" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo "")
      SRC_RE='\.(js|jsx|ts|tsx|mjs|cjs|html|sh|bash|gs|yaml|yml)$'
      if [ -n "$BASE" ] && git rev-parse --verify "$BASE" >/dev/null 2>&1; then
        CHANGED=$( { git diff --name-only "$BASE"..HEAD 2>/dev/null; git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E "$SRC_RE" || true )
      else
        CHANGED=$( { git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E "$SRC_RE" || true )
      fi
      if [ -z "$CHANGED" ]; then
        echo "ascii-gate PASS (no changed source files to scan)"
        exit 0
      fi
      GREP_P_OK=0
      if printf 'a\xe2\x80\x94b\n' | grep -qP "[^\x00-\x7F]" 2>/dev/null; then GREP_P_OK=1; fi
      detect() {
        f="$1"
        if [ "$GREP_P_OK" = "1" ]; then
          grep -lP "[^\x00-\x7F]" "$f" >/dev/null 2>&1 && return 1
        elif command -v perl >/dev/null 2>&1; then
          perl -ne 'exit 1 if /[^\x00-\x7F]/' "$f" || return 1
        else
          # Locale-independent: any byte >= 0x80 is non-ASCII. od is in coreutils everywhere
          # (LC_ALL=C grep -P errors out: "-P supports only unibyte and UTF-8 locales").
          od -An -tu1 "$f" 2>/dev/null | tr ' ' '\n' | grep -qE '^(12[89]|1[3-9][0-9]|2[0-4][0-9]|25[0-5])$' && return 1
        fi
        return 0
      }
      detect_text() {
        text="$1"
        if [ "$GREP_P_OK" = "1" ]; then
          printf '%s\n' "$text" | grep -qP "[^\x00-\x7F]" 2>/dev/null && return 1
        elif command -v perl >/dev/null 2>&1; then
          printf '%s\n' "$text" | perl -ne 'exit 1 if /[^\x00-\x7F]/' || return 1
        else
          printf '%s\n' "$text" | od -An -tu1 2>/dev/null | tr ' ' '\n' | grep -qE '^(12[89]|1[3-9][0-9]|2[0-4][0-9]|25[0-5])$' && return 1
        fi
        return 0
      }
      report_whole_file() {
        f="$1"
        if [ "$GREP_P_OK" = "1" ]; then
          grep -nP "[^\x00-\x7F]" "$f" 2>/dev/null | head -5 | sed "s|^|${f}:|" >> "$DETAILFILE"
        elif command -v perl >/dev/null 2>&1; then
          perl -ne 'print "'"$f"':$.: $_" if /[^\x00-\x7F]/' "$f" 2>/dev/null | head -5 >> "$DETAILFILE"
        fi
      }
      scan_added_lines() {
        f="$1"
        base="$2"
        current_file=''
        new_line=0
        git -c core.pager=cat diff -U0 --no-color --find-renames "$base" -- 2>/dev/null | while IFS= read -r line; do
          case "$line" in
            @@*)
              if [ "$current_file" = "$f" ]; then
                parsed=$(printf '%s\n' "$line" | sed -n 's/^@@ [^+]*+\([0-9][0-9]*\)\(,[0-9][0-9]*\)\? @@.*/\1/p')
                case "$parsed" in
                  ''|*[!0-9]*) new_line=0 ;;
                  *) new_line=$parsed ;;
                esac
              else
                new_line=0
              fi
              ;;
            '+++'*)
              current_file=${line#+++ }
              current_file=${current_file#b/}
              [ "$current_file" = "/dev/null" ] && current_file=''
              ;;
            +*)
              [ "$current_file" = "$f" ] || continue
              text=${line#+}
              if ! detect_text "$text"; then
                printf '%s\n' "$f" >> "$HITFILE"
                printf '%s:%s:%s\n' "$f" "$new_line" "$text" >> "$DETAILFILE"
              fi
              if [ "$new_line" -gt 0 ] 2>/dev/null; then new_line=$((new_line + 1)); fi
              ;;
          esac
        done
      }
      HITFILE=$(mktemp)
      DETAILFILE=$(mktemp)
      trap 'rm -f "$HITFILE" "$DETAILFILE"' EXIT
      printf '%s\n' "$CHANGED" | while IFS= read -r f; do
        [ -z "$f" ] && continue
        [ -f "$f" ] || continue
        if git ls-files --others --exclude-standard -- "$f" | grep -Fxq "$f"; then
          if ! detect "$f"; then
            printf '%s\n' "$f" >> "$HITFILE"
            report_whole_file "$f"
          fi
        elif [ -n "$BASE" ]; then
          scan_added_lines "$f" "$BASE"
        elif ! detect "$f"; then
          printf '%s\n' "$f" >> "$HITFILE"
          report_whole_file "$f"
        fi
      done
      if [ -s "$HITFILE" ]; then
        echo "ASCII GATE FAILED -- non-ASCII bytes in changed source file(s):" >&2
        LC_ALL=C sort -u "$HITFILE" >&2
        if [ -s "$DETAILFILE" ]; then
          echo "--- offending lines (first 5 per file) ---" >&2
          awk -F: '!seen[$1]++ { count[$1]=0 } count[$1] < 5 { print; count[$1]++ }' "$DETAILFILE" >&2
        fi
        echo "Fix: em-dash/en-dash -> --, smart quotes -> ' and \", ellipsis -> ..., middot -> | or -, nbsp -> space, Unicode minus -> -. No emojis in source." >&2
        echo "See harness/policies/agent-behavior.md (Code Standards / Rule 13). This gate is load_bearing: the build fails until every changed source file is pure ASCII." >&2
        exit 1
      fi
      echo "ascii-gate PASS (scanned $(printf '%s\n' "$CHANGED" | grep -c .) changed source file(s), all ASCII)"
      exit 0
  - id: verify-test-passes
    persona: major-build
    depends_on: [implement-fix]
    bash: |
      set -euo pipefail
      echo "Verifying the reproduction test now passes after the fix..."
      TEST_PATH=$(printf '%s\n' "$reproduce.output" | grep -Eo '\`[^`]+\.(test\.(ts|js|py)|spec\.(ts|js|py))[^`]*\`' | head -n 1 | sed 's/`//g' || echo "")
      if [ -z "$TEST_PATH" ]; then
        echo "Could not extract test file path from reproduce output." >&2
        exit 1
      fi

      if [ -f package.json ] && grep -q '"test"' package.json; then
        bun test -- "$TEST_PATH"
      elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
        pytest "$TEST_PATH" -v
      else
        bun test -- "$TEST_PATH"
      fi
      echo "Test passes after fix."

  - id: verify-build
    persona: major-build
    depends_on: [implement-fix]
    bash: |
      set -euo pipefail
      if [ -f package.json ]; then
        if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
          bun run build
        else
          echo "No package build script; skipping build."
        fi
      elif [ -f tests/run_all.js ]; then
        node tests/run_all.js
      else
        echo "No recognized build command; record as not applicable in manifest."
      fi

  - id: verify-types
    persona: major-build
    depends_on: [implement-fix]
    bash: |
      set -euo pipefail
      if [ -f tsconfig.json ]; then
        bunx tsc --noEmit
      else
        echo "No tsconfig.json; skipping TypeScript check."
      fi

  - id: verify-other-tests
    persona: major-build
    depends_on: [implement-fix]
    bash: |
      set -euo pipefail
      echo "Running full test suite to check for regressions..."
      if [ -f package.json ] && node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
        bun test
      elif find . -path ./.git -prune -o \( -name '*test*' -o -name '*spec*' \) -type f -print -quit | grep -q .; then
        echo "Test files detected but no bun test script was found." >&2
        exit 1
      else
        echo "No test files detected; record as not applicable in manifest."
      fi

  - id: war-council-validator
    persona: captain-ci-validator
    depends_on: [verify-test-passes, verify-build, verify-types, verify-other-tests, ascii-gate]
    task_class: medium_work
    prompt: |
      Invoke or emulate the war-council-validator review for this Work Order.

      ## Validator Agent
      war-council-validator

      ## Inputs
      Spec:
      $read-spec.output

      Fix Plan:
      $plan-fix.output

      Implementation output:
      $implement-fix.output

      Reproduction test status:
      $verify-test-passes.output

      Build verification:
      $verify-build.output

      Type checking:
      $verify-types.output

      Regression test suite:
      $verify-other-tests.output

      Git diff:
      Run `git diff --stat` and `git diff --check`, then inspect the relevant changed files.

      ## Critical Question for Bug Fixes
      Does the fix address the ROOT CAUSE of the bug, or does it mask the symptom?
      A fix that hides the real problem is worse than no fix at all.

      ## Required Output
      Return either:
      - satisfied: with evidence that the spec deliverables were met and root cause was addressed
      - needs_revision: with exact file/path/behavior findings

  - id: decide-push-target
    persona: major-build
    depends_on: [war-council-validator]
    task_class: clerical
    prompt: |
      Decide the push target for this BDC bug Work Order.

      ## Inputs
      Spec:
      $read-spec.output

      Validator:
      $war-council-validator.output

      ## Required Repo Policy
      Extract the target repository from the spec content. Look for any of these patterns (in priority order):
      1. `target_repo: <owner>/<repo>` (YAML field)
      2. `**Target repo:** \`<owner>/<repo>\`` (Markdown bold)
      3. `Target repo: <owner>/<repo>` (plain header)
      4. `**Target Repo:** \`<owner>/<repo>\`` (Markdown bold, capital R)

      The target repo is where the PR must be opened (NOT the worktree's git origin -- Rule 29).

      Match the extracted repo against this hardcoded staging-gate list:
      - bluedevilcollectibles/lspro-react
      - bluedevilcollectibles/shopops-storefront
      - bluedevilcollectibles/shopops

      If the repo matches one of those entries, output:
      push_target: feature-branch:<spec-derived-branch-name>
      pr_required: true
      staging_gate_required: true
      repo: <owner>/<repo>

      If the repo is bdc-xo non-doctrine code or another code repo, output:
      push_target: feature-branch:<spec-derived-branch-name>
      pr_required: true
      staging_gate_required: false
      repo: <owner>/<repo>

      If this is doc-only or other non-code work, output:
      out_of_scope: true
      reason: use appropriate workflow for this work class
      repo: unknown

      CRITICAL: You MUST emit a `repo:` line in every output case. If no target_repo is
      parseable from the spec, emit `repo: unknown` and a WARNING line explaining what is missing.

  - id: commit-and-push
    persona: overseer
    depends_on: [decide-push-target]
    bash: |
      set -euo pipefail
      echo "$decide-push-target.output"
      if printf '%s\n' "$decide-push-target.output" | grep -q '^out_of_scope: true'; then
        echo "Out of scope for bdc-bug-fix; failing closed." >&2
        exit 1
      fi
      # WO-HARNESS-PUSH-TARGET-EXTRACTION-HARDENING-01: tolerant multi-strategy
      # push_target extraction. The old line-anchored sed broke a 2nd time
      # (run e5110df1, fable tier, 2026-08-01) after PR #165's first whitespace
      # patch -- the ^...$ anchor requires the WHOLE line to be exactly
      # "push_target: feature-branch: <token>", so any markdown fence, list
      # bullet, blockquote, backtick, or trailing prose a model tier adds makes
      # BRANCH come back empty and the node exit 1 with a message that lied
      # ("absent" when the field was present but merely styled differently).
      # Fix: pre-strip backticks, then (1) fast path -- the exact
      # whitespace-tolerant anchor (unchanged behavior for well-formed output,
      # zero regression); (2) fallback -- scan ANYWHERE for
      # "push_target: feature-branch: <token>", stopping at the first whitespace
      # so trailing prose is tolerated. Failure now distinguishes "field absent"
      # from "field present but unparseable". Extraction is a pure read of the
      # decide output (no state mutation), so re-running the node is
      # side-effect-free. BRANCH_PATTERN validation below is unchanged and still
      # runs after extraction.
      DECIDE_OUTPUT_CLEAN=$(printf '%s\n' "$decide-push-target.output" | tr -d '`')
      BRANCH=$(printf '%s\n' "$DECIDE_OUTPUT_CLEAN" | sed -n 's/^[[:space:]]*push_target:[[:space:]]*feature-branch:[[:space:]]*\([^[:space:]]*\)[[:space:]]*$/\1/p' | head -n 1)
      if [ -z "$BRANCH" ]; then
        BRANCH=$(printf '%s\n' "$DECIDE_OUTPUT_CLEAN" \
          | { grep -oE 'push_target:[[:space:]]*feature-branch:[[:space:]]*[^[:space:]]+' || true; } \
          | head -n 1 \
          | sed -E 's/^.*feature-branch:[[:space:]]*//')
      fi
      if [ -z "$BRANCH" ]; then
        if printf '%s\n' "$DECIDE_OUTPUT_CLEAN" | grep -q 'push_target'; then
          PUSH_TARGET_EXCERPT=$(printf '%s\n' "$DECIDE_OUTPUT_CLEAN" | grep 'push_target' | head -n 1 | cut -c1-200)
          echo "push_target field present but unparseable: ${PUSH_TARGET_EXCERPT}" >&2
        else
          echo "push_target field absent from decide-push-target output." >&2
        fi
        exit 1
      fi
      # WO-HARNESS-YAML-USE-THREAD-BRANCH-NOT-FEATURE-BRANCH-01
      # Engine already provides a unique archon/thread-<hash> branch per run.
      # Derive a unique remote push target from it instead of clobbering a shared name.
      # DEFECT FIX 2026-07-27 (anchor: WO-CRM-SUPABASE-CONVERGENCE-01, run d982e84e).
      # The old line was:
      #   THREAD_ID=$(git rev-parse --abbrev-ref HEAD | sed 's|archon/thread-||')
      # That sed only strips a PREFIX. When HEAD is NOT archon/thread-<hash> -- e.g. a run
      # resumed on an existing feature branch, as happens when a WO converges an existing
      # PR -- nothing is stripped and THREAD_ID becomes the ENTIRE branch name, producing
      # a nested double-suffix ref like:
      #   feat/wo-crm-supabase-convergence-01-thread-feat/wo-xo-crm-minimum-complete-journey-01
      # which then opened a SECOND, spurious PR. BRANCH is validated; THREAD_ID never was.
      CURRENT_REF=$(git rev-parse --abbrev-ref HEAD)
      case "$CURRENT_REF" in
        archon/thread-*)
          THREAD_ID=${CURRENT_REF#archon/thread-}
          ;;
        *)
          THREAD_ID=$(git rev-parse --short=8 HEAD 2>/dev/null || echo "nohead")
          echo "commit-and-push: HEAD is '${CURRENT_REF}' (not archon/thread-*); using commit-derived THREAD_ID=${THREAD_ID}" >&2
          ;;
      esac
      if ! printf '%s\n' "$THREAD_ID" | grep -Eq '^[A-Za-z0-9_-]+$'; then
        echo "ERROR: refusing to push -- derived THREAD_ID '${THREAD_ID}' is not a bare [A-Za-z0-9_-] token (would create a malformed branch)." >&2
        exit 1
      fi
      UNIQUE_BRANCH="${BRANCH}-thread-${THREAD_ID}"
      git status --short
      DIRTY=$(git status --porcelain)
      if [ -z "$DIRTY" ]; then
        # Already fully synced: implement loop committed + pushed to origin
        if git rev-parse --quiet --verify "origin/${UNIQUE_BRANCH}" >/dev/null 2>&1 && \
           [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/${UNIQUE_BRANCH}")" ]; then
          echo "Backstop no-op: implement loop already committed + pushed to origin/${UNIQUE_BRANCH} (HEAD matches)."
          echo "unique_branch=${UNIQUE_BRANCH}"
          exit 0
        fi
        # WO-HARNESS-COMMIT-AND-PUSH-BACKSTOP-FALSE-NEGATIVE-01: clean tree != no work.
        # Count commits ahead to distinguish pre-committed work from true no-op.
        if git rev-parse --quiet --verify "origin/${UNIQUE_BRANCH}" >/dev/null 2>&1; then
          COMMITS_AHEAD=$(git rev-list --count "origin/${UNIQUE_BRANCH}..HEAD" 2>/dev/null || echo 0)
        else
          COMMITS_AHEAD=$(git rev-list --count HEAD --not --remotes=origin 2>/dev/null || echo 0)
        fi
        if [ "$COMMITS_AHEAD" = "0" ]; then
          echo "No changed files and no commits ahead of origin/${UNIQUE_BRANCH} -- implement loop did not produce work" >&2
          exit 1
        fi
        echo "Backstop: $COMMITS_AHEAD commit(s) ahead of origin -- pushing pre-committed work."
      else
        CHANGED_FILES=$(printf '%s\n' "$DIRTY" | awk '{print substr($0,4)}')
        while IFS= read -r path; do
          if [ -z "$path" ]; then
            continue
          fi
          if ! printf '%s\n' "$plan-fix.output" | grep -F -- "$path" >/dev/null; then
            echo "Changed file was not listed in plan output: $path" >&2
            exit 1
          fi
          git add -- "$path"
        done < <(printf '%s\n' "$CHANGED_FILES")
        if git diff --cached --quiet; then
          echo "No changes staged; cannot commit." >&2
          exit 1
        fi
        COMMIT_MESSAGE=$(printf '%s\n' "$plan-fix.output" | sed -n 's/^Commit message: //p' | head -n 1)
        if [ -z "$COMMIT_MESSAGE" ]; then
          WO_ID=$(printf '%s\n' "$read-spec.output" | sed -n 's/^WO_ID=//p' | head -n 1)
          COMMIT_MESSAGE="fix: ${WO_ID} bug fix"
        fi
        git commit -m "$COMMIT_MESSAGE"
      fi
      # WO-HARNESS-YAML-USE-THREAD-BRANCH-NOT-FEATURE-BRANCH-01: push via refspec
      # so the local archon/thread-<hash> branch lands on a unique remote name
      # (UNIQUE_BRANCH) and does not collide with other parallel runs.
      git push origin HEAD:"${UNIQUE_BRANCH}"
      echo "unique_branch=${UNIQUE_BRANCH}"

  - id: open-pr-if-needed
    persona: major-build
    depends_on: [commit-and-push]
    task_class: clerical
    bash: |
      set -euo pipefail
      if ! printf '%s\n' "$decide-push-target.output" | grep -q '^pr_required: true'; then
        echo "PR not required; skipping."
        exit 0
      fi
      # WO-HARNESS-YAML-USE-THREAD-BRANCH-NOT-FEATURE-BRANCH-01: read the unique
      # remote branch the commit-and-push node pushed to; gh pr create must use
      # --head to target that branch rather than the (local) archon/thread-<hash>.
      UNIQUE_BRANCH=$(printf '%s\n' "$commit-and-push.output" | sed -n 's/^unique_branch=//p' | head -n 1)
      if [ -z "$UNIQUE_BRANCH" ]; then
        echo "UNIQUE_BRANCH not found in commit-and-push output." >&2
        exit 1
      fi
      # Rule 29: extract explicit repo from decide-push-target output.
      REPO=$(printf '%s\n' "$decide-push-target.output" | sed -n 's/^repo: //p' | head -n 1)
      if [ -z "$REPO" ] || [ "$REPO" = "unknown" ]; then
        echo "ERROR: decide-push-target did not emit a valid 'repo: <owner>/<repo>'." >&2
        echo "Fix the spec to include 'target_repo:' or '**Target repo:**' and re-run." >&2
        exit 1
      fi
      TITLE=$(printf '%s\n' "$plan-fix.output" | sed -n 's/^Commit message: //p' | head -n 1)
      if [ -z "$TITLE" ]; then
        TITLE="BDC bug fix Work Order"
      fi
      BODY_FILE=$(mktemp)
      {
        echo "## Summary"
        echo "$plan-fix.output"
        echo
        echo "## Test Verification"
        echo "Failing test before fix:"
        echo "$verify-test-fails.output"
        echo
        echo "Passing test after fix:"
        echo "$verify-test-passes.output"
        echo
        echo "## Validation"
        echo "$verify-build.output"
        echo "$verify-types.output"
        echo "$verify-other-tests.output"
        echo
        echo "## Root Cause Review"
        echo "$war-council-validator.output"
      } > "$BODY_FILE"
      gh pr create --repo "$REPO" --title "$TITLE" --body-file "$BODY_FILE" --head "$UNIQUE_BRANCH"

  - id: build-manifest
    persona: major-build
    depends_on: [open-pr-if-needed]
    task_class: clerical
    prompt: |
      Construct the Captain CI completion manifest for this BDC bug Work Order.

      ## CRITICAL: Test Before/After Status
      This manifest MUST include:
      1. Path to the reproduction test file
      2. Test status BEFORE the fix: FAILING
      3. Test status AFTER the fix: PASSING
      4. Evidence from test runs

      ## Inputs
      Spec:
      $read-spec.output

      Fix Plan:
      $plan-fix.output

      Reproduction:
      $reproduce.output

      Test verification (before):
      $verify-test-fails.output

      Test verification (after):
      $verify-test-passes.output

      Implementation:
      $implement-fix.output

      Build verification:
      $verify-build.output

      Type checking:
      $verify-types.output

      Regression tests:
      $verify-other-tests.output

      Root cause validator:
      $war-council-validator.output

      ## Required Manifest Fields
      - WO ID
      - Test file path (the reproduction test)
      - Test status before fix (FAILING)
      - Test status after fix (PASSING)
      - Files created
      - Files modified
      - Root cause analysis (from validator)
      - Routes added (if applicable)
      - Migrations (if applicable)
      - Tests passed count
      - Commit SHA
      - Validation evidence by WO class
      - PR URL, if opened
      - Staging gate status, if required

  - id: post-completed
    persona: xo
    depends_on: [build-manifest]
    bash: |
      set -euo pipefail
      WO_ID=$(printf '%s\n' "$read-spec.output" | sed -n 's/^WO_ID=//p' | head -n 1)
      DETAIL=$(printf '%s\n' "$build-manifest.output" | python -c "import json,sys; print(json.dumps(sys.stdin.read()))")
      curl -sS -X POST "https://n8n.bluedevilcollectibles.com/webhook/builder-status" \
        -H "Content-Type: application/json" \
        -d "{\"action\":\"completed\",\"wo_id\":\"${WO_ID}\",\"builder\":\"Builder-4\",\"detail\":${DETAIL}}"

  - id: review-issue
    persona: xo
    depends_on: [post-completed]
    task_class: clerical
    bash: |
      set -euo pipefail

      capture_node_output() {
        python3 -c 'import shlex, sys; s=sys.stdin.read(); sys.stdout.write((lambda p: p[0] if len(p)==1 else s)(shlex.split(s)) if len(s)>=2 and s[0]=="'"'"'" and s.rstrip("\n").endswith("'"'"'") else s)'
      }

      MANIFEST=$(capture_node_output <<'BDC_NODE_OUTPUT_MANIFEST'
      $post-completed.output
      BDC_NODE_OUTPUT_MANIFEST
      )

      READ_SPEC_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_READ_SPEC'
      $read-spec.output
      BDC_NODE_OUTPUT_READ_SPEC
      )
      ISSUE_REPO="${ISSUE_REPO:-bluedevilcollectibles/bdc-xo}"
      ISSUE_NUM=$(printf '%s\n' "${USER_MESSAGE:-}" | grep -Eo 'issue=[0-9]+' | head -1 | cut -d= -f2 || true)
      if [ -z "$ISSUE_NUM" ]; then
        ISSUE_NUM=$(printf '%s\n' "$READ_SPEC_OUT" | sed -n 's/^SPEC_PATH=.*issues\/\([0-9][0-9]*\).*/\1/p' | head -1)
      fi
      if [ -z "$ISSUE_NUM" ]; then
        WO_ID_FROM_SPEC=$(printf '%s\n' "$READ_SPEC_OUT" | sed -n 's/^WO_ID=//p' | head -1)
        if [ -n "$WO_ID_FROM_SPEC" ]; then
          ISSUE_NUM=$(gh issue list --repo "$ISSUE_REPO" --search "$WO_ID_FROM_SPEC in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
        fi
      fi
      if [ -z "$ISSUE_NUM" ]; then
        echo "review-issue: no GitHub issue resolved; skipping status:review label."
        exit 0
      fi

      gh label create status:review --repo "$ISSUE_REPO" --color 0E8A16 --description "BDC workflow is ready for review" 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --remove-label status:building 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --remove-label status:blocked 2>/dev/null || true
      gh issue edit "$ISSUE_NUM" --repo "$ISSUE_REPO" --add-label status:review
      COMMENT_FILE=$(mktemp)
      printf '%s\n' "$MANIFEST" > "$COMMENT_FILE"
      gh issue comment "$ISSUE_NUM" --repo "$ISSUE_REPO" --body-file "$COMMENT_FILE"
      echo "review-issue: $ISSUE_REPO#$ISSUE_NUM -> status:review (manifest posted as comment)"
