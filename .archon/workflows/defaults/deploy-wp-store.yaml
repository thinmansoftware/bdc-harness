schema_version: '1'
id: deploy-wp-store
name: deploy-wp-store
model: sonnet
description: |
  On-demand WordPress + WooCommerce store provisioning for a single tenant on Hetzner.
  PHASE 1 -- MANUAL John-gated path only.
  Self-serve fast-lane is OUT OF SCOPE here (requires remote state backend WO first).

  Gate sequence (reuses Cauldron deployment-factory pattern):
    validate-request -> preflight -> idempotency-gate -> generate-tfvars
    -> tf-fmt-check -> tf-init -> tf-validate -> tf-plan -> PAUSE(John approves)
    -> tf-apply -> wp-bootstrap -> evidence-canary -> provisioning-receipt
    -> PAUSE(prod cutover, optional)
inputs:
  tenant_slug:
    default: bdc-woo-dev
  primary_domain:
    default: woo-dev.comicstoreos.com
  cloudflare_zone_id:
    default: 36f4ad27d9dcfd9b47c2f8b9e5198c7b
  php_version:
    default: '8.2'
  wc_version:
    default: 9.0.0
  mysql_version:
    default: '8.0'
  container_memory_limit:
    default: 256m
  container_cpu_quota:
    default: '0.25'
  traefik_priority:
    default: '10'
  enable_wc_rest_keys:
    default: 'true'
secrets:
- name: CLOUDFLARE_API_TOKEN
  description: Cloudflare API token with DNS edit permissions.
- name: WP_ADMIN_USER
  description: WordPress admin username.
- name: WP_ADMIN_EMAIL
  description: WordPress admin email.
- name: AGE_RECIPIENT
  description: John age public key for vault encryption (e.g. age1xxxxxx).
- name: HETZNER_SSH_KEY
  description: SSH private key for claude@hetzner (claude_exec). Mounted at /tmp/claude_exec_key.
nodes:
- id: validate-request
  name: Validate Request
  bash: |
    set -euo pipefail
    echo "[validate] Validating WP Store Factory request..."
    echo "[validate] tenant_slug    = ${input.tenant_slug}"
    echo "[validate] primary_domain = ${input.primary_domain}"
    echo "[validate] wc_version     = ${input.wc_version}"

    # Validate tenant_slug format
    if ! echo "${input.tenant_slug}" | grep -qP '^[a-z0-9][a-z0-9-]{1,48}[a-z0-9]$'; then
      echo "[validate] ERROR: tenant_slug '${input.tenant_slug}' is invalid." >&2
      echo "[validate] Must be 2-50 chars, lowercase alphanumeric + hyphens, no leading/trailing hyphens." >&2
      exit 1
    fi

    # Validate primary_domain looks like a domain
    if ! echo "${input.primary_domain}" | grep -qP '^[a-zA-Z0-9][a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$'; then
      echo "[validate] ERROR: primary_domain '${input.primary_domain}' is not a valid FQDN." >&2
      exit 1
    fi

    # Validate wc_version is semver
    if ! echo "${input.wc_version}" | grep -qP '^\d+\.\d+\.\d+$'; then
      echo "[validate] ERROR: wc_version '${input.wc_version}' must be semver (e.g. 9.0.0)." >&2
      exit 1
    fi

    echo "[validate] Request validation PASSED."
- id: preflight
  name: Hetzner Preflight
  depends_on:
  - validate-request
  env:
    HETZNER_HOST: 5.78.86.90
    HETZNER_USER: claude
    SSH_KEY_PATH: /tmp/claude_exec_key
  bash: |
    set -euo pipefail

    # --- ssh key bootstrap (nodes are isolated; key+vars must be set per-node) ---
    export SSH_KEY_PATH=/tmp/claude_exec_key
    export HETZNER_HOST=5.78.86.90
    export HETZNER_USER=claude
    if [ ! -f /tmp/claude_exec_key ]; then printf '%s' "$HETZNER_SSH_KEY_B64" | base64 -d > /tmp/claude_exec_key; chmod 600 /tmp/claude_exec_key; fi
    # --- end ssh key bootstrap ---


    # env: blocks do NOT substitute ${input.X}; build the path from the injected INPUT_ env var
    # and EXPORT it so hetzner-preflight.sh (which requires it) sees it.
    export PREFLIGHT_ARTIFACT_PATH="/.archon/workspaces/bluedevilcollectibles/${INPUT_TENANT_SLUG}-wp-store/preflight.env"

    # Write SSH private key from secret to expected path; export SSH vars so the
    # called script (hetzner-preflight.sh) inherits them rather than its /run/secrets default.
    export SSH_KEY_PATH=/tmp/claude_exec_key
    export HETZNER_HOST=5.78.86.90
    export HETZNER_USER=claude
    printf '%s' "$HETZNER_SSH_KEY_B64" | base64 -d > /tmp/claude_exec_key
    chmod 600 /tmp/claude_exec_key

    # Create workspace dir for preflight artifact
    mkdir -p "$(dirname "${PREFLIGHT_ARTIFACT_PATH}")"

    # This box's Traefik does HTTP-only routing (entrypoint 'web' :80, NO certresolver/:443);
    # TLS is terminated by Cloudflare (orange-cloud). The factory's auto-detect script assumes
    # Traefik-terminated TLS, which does not exist here -- so we write the verified artifact
    # directly with this box's real values instead of running hetzner-preflight.sh.
    # Verify SSH + age reachability first (the parts of preflight that still matter).
    SSH="ssh -i ${SSH_KEY_PATH} -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 ${HETZNER_USER}@${HETZNER_HOST}"
    NET=$($SSH 'docker network inspect web --format "{{.Name}}" 2>/dev/null' || echo "")
    if [ "$NET" != "web" ]; then echo "[preflight] ERROR: traefik network 'web' not found" >&2; exit 1; fi
    AGE_PRESENT=$($SSH 'command -v age >/dev/null 2>&1 && echo yes || echo age-missing')
    if [ "$AGE_PRESENT" = "age-missing" ]; then echo "[preflight] ERROR: age not installed on host" >&2; exit 1; fi
    DOCKER_ROOT_DIR=$($SSH 'docker info 2>/dev/null | grep "Docker Root Dir" | awk "{print \$NF}"' || echo "/var/lib/docker")

    {
      printf 'TRAEFIK_NETWORK=%s\n' "web"
      printf 'TRAEFIK_CERTRESOLVER=%s\n' "none"
      printf 'TRAEFIK_ENTRYPOINT=%s\n' "web"
      printf 'TRAEFIK_TLS=%s\n' "cloudflare"
      printf 'DOCKER_ROOT_DIR=%s\n' "${DOCKER_ROOT_DIR}"
      printf 'AGE_PRESENT=%s\n' "yes"
    } > "${PREFLIGHT_ARTIFACT_PATH}"

    echo "[preflight] Wrote artifact (Cloudflare-TLS / Traefik-HTTP-only):"
    cat "${PREFLIGHT_ARTIFACT_PATH}"
  timeout: 600000
- id: idempotency-gate
  name: Idempotency Gate
  depends_on:
  - preflight
  env:
    SSH_KEY_PATH: /tmp/claude_exec_key
  bash: |
    set -euo pipefail

    # --- ssh key bootstrap (nodes are isolated; key+vars must be set per-node) ---
    export SSH_KEY_PATH=/tmp/claude_exec_key
    export HETZNER_HOST=5.78.86.90
    export HETZNER_USER=claude
    if [ ! -f /tmp/claude_exec_key ]; then printf '%s' "$HETZNER_SSH_KEY_B64" | base64 -d > /tmp/claude_exec_key; chmod 600 /tmp/claude_exec_key; fi
    # --- end ssh key bootstrap ---

    CONTAINER_NAME="${input.tenant_slug}-wordpress"
    WORKSPACE="/.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store"
    STATE_PATH="${WORKSPACE}/terraform-state/${input.tenant_slug}-dev.tfstate"

    echo "[idempotency] Checking if ${CONTAINER_NAME} already exists..."
    EXISTS=$(ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
      claude@5.78.86.90 \
      "docker inspect ${CONTAINER_NAME} --format '{{.State.Status}}' 2>/dev/null || echo 'not_found'")
    # Strip ALL whitespace/newlines (ssh output can carry a leading newline -> false 'exists')
    EXISTS=$(printf '%s' "$EXISTS" | tr -d '[:space:]')

    echo "[idempotency] Container status: ${EXISTS}"

    if [ "$EXISTS" != "not_found" ] && [ "$EXISTS" != "" ]; then
      # Container is present -- check whether Terraform state is also present.
      if [ -f "${STATE_PATH}" ]; then
        # Both container and state exist: already fully provisioned.
        echo "[idempotency] Container ${CONTAINER_NAME} exists (status: ${EXISTS}) AND state file found."
        echo "[idempotency] ALREADY_PROVISIONED: Tenant ${input.tenant_slug} is live at https://${input.primary_domain}"
        echo "[idempotency] Aborting to prevent data loss. Re-fire does not recreate the stack."
        echo "ALREADY_PROVISIONED"
        mkdir -p "${WORKSPACE}"
        touch "${WORKSPACE}/already-provisioned.flag"
        exit 0
      else
        # Container exists but state file is missing (state lost or first apply
        # was interrupted before state could be written). Terraform must import
        # the existing Docker resources before planning to avoid duplicate creation.
        echo "[idempotency] Container ${CONTAINER_NAME} exists (status: ${EXISTS}) but state file is MISSING."
        echo "[idempotency] Reconciliation required: writing needs-tf-import.flag."
        echo "[idempotency] Workflow will proceed to generate-tfvars -> tf-init -> tf-import before plan."
        echo "[idempotency] NOTE: credential files on Hetzner host (/opt/bdc/tenants/${input.tenant_slug}/secrets/)"
        echo "[idempotency]   must match the password used when the container was originally provisioned."
        echo "[idempotency]   Restore from vault before approving the plan."
        mkdir -p "${WORKSPACE}"
        printf 'NEEDS_TF_IMPORT\n' > "${WORKSPACE}/needs-tf-import.flag"
        # Do NOT exit -- continue to generate-tfvars -> tf-init -> tf-import.
      fi
    fi

    # Check for partial prior run (state file exists but container missing)
    if [ -f "${STATE_PATH}" ]; then
      echo "[idempotency] WARN: State file exists but container not found -- possible partial prior run."
      echo "[idempotency] Flagging for state reconcile before tf-init."
      echo "PARTIAL_STATE_DETECTED" > "${WORKSPACE}/partial-state.flag"
    fi

    echo "[idempotency] OK: Proceeding with provisioning (container does not yet exist)."
  timeout: 600000
- id: generate-tfvars
  name: Generate tfvars
  depends_on:
  - idempotency-gate
  env:
    SSH_KEY_PATH: /tmp/claude_exec_key
    AGE_RECIPIENT: ${AGE_RECIPIENT}
  bash: |
    set -euo pipefail

    # --- ssh key bootstrap (nodes are isolated; key+vars must be set per-node) ---
    export SSH_KEY_PATH=/tmp/claude_exec_key
    export HETZNER_HOST=5.78.86.90
    export HETZNER_USER=claude
    if [ ! -f /tmp/claude_exec_key ]; then printf '%s' "$HETZNER_SSH_KEY_B64" | base64 -d > /tmp/claude_exec_key; chmod 600 /tmp/claude_exec_key; fi
    # --- end ssh key bootstrap ---


    # Halt cleanly if idempotency gate detected an existing tenant
    AP_FLAG="/.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store/already-provisioned.flag"
    if [ -f "${AP_FLAG}" ]; then
      echo "[HALT] Tenant ${input.tenant_slug} is already provisioned -- stopping at idempotency gate. No provisioning work performed."
      exit 1
    fi

    WORKSPACE="/.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store"
    TFVARS_PATH="${WORKSPACE}/generated.tfvars"
    STATE_DIR="${WORKSPACE}/terraform-state"
    PREFLIGHT_PATH="${WORKSPACE}/preflight.env"
    SLUG="${input.tenant_slug}"

    # Create workspace and state dir BEFORE terraform init (fix: state dir must exist)
    mkdir -p "${WORKSPACE}" "${STATE_DIR}"

    # Source preflight artifact for verified Traefik values
    source "${PREFLIGHT_PATH}"

    IMPORT_FLAG="${WORKSPACE}/needs-tf-import.flag"

    if [ -f "${IMPORT_FLAG}" ]; then
      # Reconciliation path: container exists but state is missing.
      # The running containers were initialized with passwords that match the
      # existing credential files on the Hetzner host.  Generating new passwords
      # and overwriting those files would corrupt the live containers on restart.
      # Verify the files are present; do NOT regenerate or overwrite them.
      echo "[generate-tfvars] RECONCILIATION MODE: existing containers detected (needs-tf-import.flag present)."
      echo "[generate-tfvars] Skipping password generation -- preserving existing credential files on Hetzner host."
      ROOT_OK=$(ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
        claude@5.78.86.90 \
        "test -f /opt/bdc/tenants/${SLUG}/secrets/mysql-root-pwd && echo OK || echo MISSING")
      WP_OK=$(ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
        claude@5.78.86.90 \
        "test -f /opt/bdc/tenants/${SLUG}/secrets/mysql-wp-pwd && echo OK || echo MISSING")
      if [ "${ROOT_OK}" = "MISSING" ] || [ "${WP_OK}" = "MISSING" ]; then
        echo "[generate-tfvars] ERROR: Credential file(s) missing on Hetzner host." >&2
        echo "[generate-tfvars]   mysql-root-pwd: ${ROOT_OK}   mysql-wp-pwd: ${WP_OK}" >&2
        echo "[generate-tfvars]   Restore from vault: age -d -i <identity> /opt/bdc/tenants/${SLUG}/mysql-secrets.enc" >&2
        echo "[generate-tfvars]   Write restored values to /opt/bdc/tenants/${SLUG}/secrets/{mysql-root-pwd,mysql-wp-pwd} (chmod 600)." >&2
        exit 1
      fi
      echo "[generate-tfvars] Credential files verified present on Hetzner host -- proceeding to tf-init."
      # Write a placeholder secrets env so downstream steps do not fail on a missing file.
      # wp-bootstrap is not executed in the reconciliation path (container already provisioned).
      SECRETS_ENV="${WORKSPACE}/.generated-secrets.env"
      printf '# RECONCILIATION MODE -- passwords not regenerated; existing Hetzner credential files preserved\n' \
        > "${SECRETS_ENV}"
      chmod 600 "${SECRETS_ENV}"
    else
      # Fresh provisioning path: generate passwords and write credential files.

      # Generate random passwords (hex, 32 chars = 16 bytes)
      MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)
      MYSQL_WP_PASSWORD=$(openssl rand -hex 16)

      # Generate WP admin password (alphanumeric, 32 chars)
      WP_ADMIN_PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)

      # Store generated passwords in runner workspace (chmod 600, not in git).
      # These are read by wp-bootstrap; they are NOT exported as TF_VAR_*.
      SECRETS_ENV="${WORKSPACE}/.generated-secrets.env"
      printf 'MYSQL_ROOT_PASSWORD=%s\nMYSQL_WP_PASSWORD=%s\nWP_ADMIN_PASS=%s\n' \
        "${MYSQL_ROOT_PASSWORD}" "${MYSQL_WP_PASSWORD}" "${WP_ADMIN_PASS}" \
        > "${SECRETS_ENV}"
      chmod 600 "${SECRETS_ENV}"

      # Write credential files to Hetzner host BEFORE terraform apply.
      # MySQL containers use MYSQL_ROOT_PASSWORD_FILE / MYSQL_PASSWORD_FILE and
      # WordPress uses WORDPRESS_DB_PASSWORD_FILE -- all bind-mount these paths.
      # The password values never pass through Terraform; only the file paths are
      # recorded in Terraform state, satisfying SC-3b / WO no-creds-in-state req.
      echo "[generate-tfvars] Writing MySQL credential files to Hetzner host..."
      ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
        claude@5.78.86.90 \
        "mkdir -p /opt/bdc/tenants/${SLUG}/secrets && chmod 700 /opt/bdc/tenants/${SLUG}/secrets"
      printf '%s' "${MYSQL_ROOT_PASSWORD}" | \
        ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
        claude@5.78.86.90 \
        "cat > /opt/bdc/tenants/${SLUG}/secrets/mysql-root-pwd \
         && chmod 600 /opt/bdc/tenants/${SLUG}/secrets/mysql-root-pwd"
      printf '%s' "${MYSQL_WP_PASSWORD}" | \
        ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
        claude@5.78.86.90 \
        "cat > /opt/bdc/tenants/${SLUG}/secrets/mysql-wp-pwd \
         && chmod 600 /opt/bdc/tenants/${SLUG}/secrets/mysql-wp-pwd"
      echo "[generate-tfvars] Credential files written: /opt/bdc/tenants/${SLUG}/secrets/{mysql-root-pwd,mysql-wp-pwd}"

      # Write age-encrypted backup of MySQL credentials to vault (secrets-doctrine).
      # Docker MySQL requires plaintext _FILE bind-mounts so we cannot age-encrypt
      # the files MySQL reads directly.  Instead we write a separate encrypted
      # backup so the passwords can be recovered if the Hetzner host files are lost.
      # Uses the same AGE_RECIPIENT (John's age public key) as the WC keys vault.
      if [ -n "${AGE_RECIPIENT:-}" ]; then
        echo "[generate-tfvars] Writing age-encrypted MySQL credential backup to vault..."
        printf 'mysql_root_password=%s\nmysql_wp_password=%s\n' \
          "${MYSQL_ROOT_PASSWORD}" "${MYSQL_WP_PASSWORD}" | \
          ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
          claude@5.78.86.90 \
          "age -r '${AGE_RECIPIENT}' > /opt/bdc/tenants/${SLUG}/mysql-secrets.enc \
           && chmod 600 /opt/bdc/tenants/${SLUG}/mysql-secrets.enc"
        echo "[generate-tfvars] MySQL vault backup written: /opt/bdc/tenants/${SLUG}/mysql-secrets.enc"
        echo "[generate-tfvars] Recover with: age -d -i <identity> /opt/bdc/tenants/${SLUG}/mysql-secrets.enc"
      else
        echo "[generate-tfvars] WARN: AGE_RECIPIENT not set -- mysql-secrets.enc encrypted backup skipped." >&2
      fi
    fi

    # Write non-secret tfvars (traefik vars sourced from verified preflight).
    # mysql_root_password and mysql_wp_password are intentionally absent --
    # they are provided via host bind-mounted files, not Terraform variables.
    cat > "${TFVARS_PATH}" <<TFVARS
    product                = "wp_store"
    tenant_slug            = "${input.tenant_slug}"
    primary_domain         = "${input.primary_domain}"
    cloudflare_zone_id     = "${input.cloudflare_zone_id}"
    php_version            = "${input.php_version}"
    wc_version             = "${input.wc_version}"
    mysql_version          = "${input.mysql_version}"
    container_memory_limit = "${input.container_memory_limit}"
    container_cpu_quota    = "${input.container_cpu_quota}"
    traefik_network        = "${TRAEFIK_NETWORK}"
    traefik_certresolver   = "${TRAEFIK_CERTRESOLVER}"
    traefik_entrypoint     = "${TRAEFIK_ENTRYPOINT}"
    enable_wc_rest_keys    = ${input.enable_wc_rest_keys}
    traefik_priority       = ${input.traefik_priority}
    TFVARS
    chmod 600 "${TFVARS_PATH}"

    echo "[generate-tfvars] Generated tfvars at: ${TFVARS_PATH}"
    echo "[generate-tfvars] State dir: ${STATE_DIR}"
    echo "[generate-tfvars] Traefik network: ${TRAEFIK_NETWORK}"
    echo "[generate-tfvars] Traefik certresolver: ${TRAEFIK_CERTRESOLVER}"
    echo "[generate-tfvars] Traefik entrypoint: ${TRAEFIK_ENTRYPOINT}"
    echo "[generate-tfvars] Credential handling complete."
  timeout: 600000
- id: tf-fmt-check
  name: Terraform fmt check
  depends_on:
  - generate-tfvars
  bash: |
    set -euo pipefail
    echo "[tf-fmt] Running terraform fmt -check on wp-store root..."
    terraform -chdir=infra/terraform/roots/wp-store fmt -check -recursive
    echo "[tf-fmt] Format check PASSED."
- id: tf-init
  name: Terraform init
  depends_on:
  - tf-fmt-check
  env:
    TF_VAR_cloudflare_api_token: ${CLOUDFLARE_API_TOKEN}
    CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    SSH_KEY_PATH: /tmp/claude_exec_key
  bash: |
    set -euo pipefail

    # --- ssh key bootstrap (nodes are isolated; key+vars must be set per-node) ---
    export SSH_KEY_PATH=/tmp/claude_exec_key
    export HETZNER_HOST=5.78.86.90
    export HETZNER_USER=claude
    if [ ! -f /tmp/claude_exec_key ]; then printf '%s' "$HETZNER_SSH_KEY_B64" | base64 -d > /tmp/claude_exec_key; chmod 600 /tmp/claude_exec_key; fi
    # --- end ssh key bootstrap ---

    WORKSPACE="/.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store"
    STATE_PATH="${WORKSPACE}/terraform-state/${input.tenant_slug}-dev.tfstate"

    # Sub-step (a): Configure SSH known_hosts for Terraform docker SSH provider
    # This must run before 'terraform init' downloads the docker provider and
    # it tries to connect to verify the Docker daemon is reachable.
    echo "[tf-init] Configuring SSH known_hosts for Hetzner host..."
    mkdir -p ~/.ssh
    chmod 700 ~/.ssh
    # ssh-keyscan adds the host key; StrictHostKeyChecking=accept-new as fallback
    ssh-keyscan -H 5.78.86.90 >> ~/.ssh/known_hosts 2>/dev/null || true
    # Ensure ~/.ssh/config has an entry with IdentityFile for the docker SSH provider
    if ! grep -q "5.78.86.90" ~/.ssh/config 2>/dev/null; then
      cat >> ~/.ssh/config <<EOF

    Host 5.78.86.90
      IdentityFile ${SSH_KEY_PATH}
      StrictHostKeyChecking accept-new
      ConnectTimeout 10
    EOF
      chmod 600 ~/.ssh/config
    fi
    echo "[tf-init] SSH known_hosts configured."

    # Sub-step (b): terraform init with tenant-scoped backend state path
    echo "[tf-init] Initializing Terraform with backend state at: ${STATE_PATH}"
    terraform -chdir=infra/terraform/roots/wp-store init \
      -backend-config="path=${STATE_PATH}" \
      -input=false

    echo "[tf-init] Init PASSED."
  timeout: 600000
- id: tf-import
  name: Terraform import (reconcile)
  depends_on:
  - tf-init
  env:
    TF_VAR_cloudflare_api_token: ${CLOUDFLARE_API_TOKEN}
    CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    TF_VAR_wp_admin_email: ${WP_ADMIN_EMAIL}
    TF_VAR_wp_admin_user: ${WP_ADMIN_USER}
    SSH_KEY_PATH: /tmp/claude_exec_key
  bash: |
    set -euo pipefail

    # --- ssh key bootstrap (nodes are isolated; key+vars must be set per-node) ---
    export SSH_KEY_PATH=/tmp/claude_exec_key
    export HETZNER_HOST=5.78.86.90
    export HETZNER_USER=claude
    if [ ! -f /tmp/claude_exec_key ]; then printf '%s' "$HETZNER_SSH_KEY_B64" | base64 -d > /tmp/claude_exec_key; chmod 600 /tmp/claude_exec_key; fi
    # --- end ssh key bootstrap ---

    WORKSPACE="/.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store"
    SLUG="${input.tenant_slug}"
    IMPORT_FLAG="${WORKSPACE}/needs-tf-import.flag"
    TFVARS_PATH="${WORKSPACE}/generated.tfvars"

    if [ ! -f "${IMPORT_FLAG}" ]; then
      echo "[tf-import] No import flag -- skipping (clean provisioning path)."
      exit 0
    fi

    echo "[tf-import] Import flag found -- reconciling existing Docker resources into Terraform state."
    echo "[tf-import] IMPORTANT: credential files at /opt/bdc/tenants/${SLUG}/secrets/ on the"
    echo "[tf-import]   Hetzner host MUST match the passwords used when the containers were"
    echo "[tf-import]   originally provisioned. Restore from vault before approving the plan."

    # Import WordPress container (by container name)
    echo "[tf-import] Importing ${SLUG}-wordpress container..."
    terraform -chdir=infra/terraform/roots/wp-store import \
      -var-file="${TFVARS_PATH}" \
      "module.wp_docker_store.docker_container.wordpress" "${SLUG}-wordpress" \
      2>&1 || echo "[tf-import] WARN: WordPress container import failed or already in state."

    # Import MySQL container (by container name)
    echo "[tf-import] Importing ${SLUG}-mysql container..."
    terraform -chdir=infra/terraform/roots/wp-store import \
      -var-file="${TFVARS_PATH}" \
      "module.wp_docker_store.docker_container.mysql" "${SLUG}-mysql" \
      2>&1 || echo "[tf-import] WARN: MySQL container import failed or already in state."

    # Import Docker network (requires network ID, not name)
    echo "[tf-import] Resolving ${SLUG}-wp-net network ID..."
    NET_ID=$(ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
      claude@5.78.86.90 \
      "docker network inspect ${SLUG}-wp-net --format '{{.Id}}' 2>/dev/null || echo ''")
    if [ -n "${NET_ID}" ]; then
      terraform -chdir=infra/terraform/roots/wp-store import \
        -var-file="${TFVARS_PATH}" \
        "module.wp_docker_store.docker_network.wp_net" "${NET_ID}" \
        2>&1 || echo "[tf-import] WARN: Network import failed or already in state."
    else
      echo "[tf-import] WARN: ${SLUG}-wp-net network not found -- may need manual import."
    fi

    # Import Docker volumes (by volume name)
    echo "[tf-import] Importing ${SLUG}-wp-content volume..."
    terraform -chdir=infra/terraform/roots/wp-store import \
      -var-file="${TFVARS_PATH}" \
      "module.wp_docker_store.docker_volume.wp_content" "${SLUG}-wp-content" \
      2>&1 || echo "[tf-import] WARN: wp-content volume import failed or already in state."

    echo "[tf-import] Importing ${SLUG}-mysql-data volume..."
    terraform -chdir=infra/terraform/roots/wp-store import \
      -var-file="${TFVARS_PATH}" \
      "module.wp_docker_store.docker_volume.mysql_data" "${SLUG}-mysql-data" \
      2>&1 || echo "[tf-import] WARN: mysql-data volume import failed or already in state."

    # DNS record requires Cloudflare record ID -- cannot be discovered automatically.
    echo "[tf-import] NOTE: Cloudflare DNS record import requires the record ID from the CF API."
    echo "[tf-import]   If the DNS record exists, tf-plan may show a create that CF will treat"
    echo "[tf-import]   as an upsert (no duplicate). Manual import if needed:"
    echo "[tf-import]   terraform import module.wp_docker_store.cloudflare_dns_record.wp_a_record <zone_id>/<record_id>"

    rm -f "${IMPORT_FLAG}"
    echo "[tf-import] Import reconciliation COMPLETE. Review tf-plan output carefully."
  timeout: 600000
- id: tf-validate
  name: Terraform validate
  depends_on:
  - tf-import
  env:
    TF_VAR_cloudflare_api_token: ${CLOUDFLARE_API_TOKEN}
    CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    TF_VAR_wp_admin_email: ${WP_ADMIN_EMAIL}
    TF_VAR_wp_admin_user: ${WP_ADMIN_USER}
  bash: |
    set -euo pipefail
    echo "[tf-validate] Running terraform validate..."
    terraform -chdir=infra/terraform/roots/wp-store validate
    echo "[tf-validate] Validation PASSED."
  timeout: 600000
- id: tf-plan
  name: Terraform plan
  depends_on:
  - tf-validate
  env:
    TF_VAR_cloudflare_api_token: ${CLOUDFLARE_API_TOKEN}
    CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    TF_VAR_wp_admin_email: ${WP_ADMIN_EMAIL}
    TF_VAR_wp_admin_user: ${WP_ADMIN_USER}
  bash: |
    set -euo pipefail
    WORKSPACE="/.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store"
    TFVARS_PATH="${WORKSPACE}/generated.tfvars"
    PLAN_PATH="${WORKSPACE}/tfplan-${input.tenant_slug}.bin"
    PLAN_TXT_PATH="${WORKSPACE}/tfplan-${input.tenant_slug}.txt"

    echo "[tf-plan] Running terraform plan..."
    terraform -chdir=infra/terraform/roots/wp-store plan \
      -var-file="${TFVARS_PATH}" \
      -out="${PLAN_PATH}" \
      -no-color \
      2>&1 | tee "${PLAN_TXT_PATH}"

    # Safety check: warn if plan contains destroy operations (should not for new tenants)
    if grep -q "will be destroyed\|must be replaced" "${PLAN_TXT_PATH}"; then
      echo "[tf-plan] WARNING: Plan contains DESTROY or REPLACE operations." >&2
      echo "[tf-plan] For a new tenant, no destructive operations should appear." >&2
      echo "[tf-plan] John must review carefully before approving." >&2
    fi

    echo "[tf-plan] Plan saved to: ${PLAN_PATH}"
    echo "[tf-plan] Human-readable plan at: ${PLAN_TXT_PATH}"
    echo ""
    echo "=== PLAN SUMMARY (last 20 lines) ==="
    tail -20 "${PLAN_TXT_PATH}"
    echo "=== END PLAN SUMMARY ==="
  timeout: 600000
- id: pause-plan-approval
  name: 'PAUSE: John approves plan'
  depends_on:
  - tf-plan
  approval:
    message: |
      Terraform plan is ready for review.

      Plan output: /.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store/tfplan-${input.tenant_slug}.txt

      Review the plan for:
        - Resources to add: WP container, MySQL container, internal network, 2 volumes, DNS A record
        - NO destroy operations (new tenant -- nothing should be destroyed)
        - Correct tenant_slug: ${input.tenant_slug}
        - Correct primary_domain: ${input.primary_domain}
        - No credentials visible (sensitive values show as "(sensitive)")

      Approve to proceed with 'terraform apply'.
- id: tf-apply
  name: Terraform apply
  depends_on:
  - pause-plan-approval
  env:
    TF_VAR_cloudflare_api_token: ${CLOUDFLARE_API_TOKEN}
    CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
    TF_VAR_wp_admin_email: ${WP_ADMIN_EMAIL}
    TF_VAR_wp_admin_user: ${WP_ADMIN_USER}
  bash: |
    set -euo pipefail
    WORKSPACE="/.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store"
    PLAN_PATH="${WORKSPACE}/tfplan-${input.tenant_slug}.bin"

    echo "[tf-apply] Applying saved plan: ${PLAN_PATH}"
    terraform -chdir=infra/terraform/roots/wp-store apply \
      -input=false \
      "${PLAN_PATH}"

    echo "[tf-apply] Apply COMPLETE."

    # Capture outputs for downstream steps (receipt)
    OUTPUTS=$(terraform -chdir=infra/terraform/roots/wp-store output -json 2>/dev/null || echo "{}")
    echo "$OUTPUTS" > "${WORKSPACE}/tf-outputs.json"
    echo "[tf-apply] Terraform outputs saved to: ${WORKSPACE}/tf-outputs.json"
  timeout: 600000
- id: wp-bootstrap
  name: wp-cli bootstrap
  depends_on:
  - tf-apply
  env:
    SSH_KEY_PATH: /tmp/claude_exec_key
  bash: |
    set -euo pipefail

    # --- ssh key bootstrap (nodes are isolated; key+vars must be set per-node) ---
    export SSH_KEY_PATH=/tmp/claude_exec_key
    export HETZNER_HOST=5.78.86.90
    export HETZNER_USER=claude
    if [ ! -f /tmp/claude_exec_key ]; then printf '%s' "$HETZNER_SSH_KEY_B64" | base64 -d > /tmp/claude_exec_key; chmod 600 /tmp/claude_exec_key; fi
    # --- end ssh key bootstrap ---

    WORKSPACE="/.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store"
    SECRETS_ENV="${WORKSPACE}/.generated-secrets.env"

    source "${SECRETS_ENV}"

    CONTAINER="${input.tenant_slug}-wordpress"
    echo "[bootstrap] Waiting for WordPress container to be ready..."

    # Wait for container to be in running state
    RETRIES=0
    until ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
      claude@5.78.86.90 \
      "docker inspect ${CONTAINER} --format '{{.State.Running}}' 2>/dev/null" \
      | grep -q "true" || [ "$RETRIES" -ge 30 ]; do
      echo "[bootstrap] Waiting for ${CONTAINER} to start (attempt $((RETRIES+1))/30)..."
      sleep 5
      RETRIES=$((RETRIES+1))
    done

    echo "[bootstrap] Running bootstrap-wp.sh inside container ${CONTAINER}..."
    echo "[bootstrap] Secrets passed via -e env vars. Script streamed via stdin."

    # Stream bootstrap script into container via SSH docker exec
    # stdout = WC keys (captured); stderr = bootstrap logs (shown in workflow)
    WC_KEYS=$(ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
      claude@5.78.86.90 \
      "docker exec -i \
        -e WP_ADMIN_USER='${WP_ADMIN_USER}' \
        -e WP_ADMIN_PASS='${WP_ADMIN_PASS}' \
        -e WP_ADMIN_EMAIL='${WP_ADMIN_EMAIL}' \
        -e WC_VERSION='${input.wc_version}' \
        -e TENANT_SLUG='${input.tenant_slug}' \
        -e PRIMARY_DOMAIN='${input.primary_domain}' \
        -e ENABLE_WC_REST_KEYS='${input.enable_wc_rest_keys}' \
        '${CONTAINER}' bash -s" \
      < scripts/bootstrap-wp.sh)

    echo "[bootstrap] Bootstrap stdout captured (length: ${#WC_KEYS})."

    # Write keys to vault via SSH pipe (pipe-secrets doctrine)
    if [ "$WC_KEYS" = "KEYS_ALREADY_EXIST" ] || [ -z "$WC_KEYS" ]; then
      echo "[bootstrap] No new keys to write to vault."
    else
      echo "[bootstrap] Writing WC keys to vault via SSH pipe..."
      # Step 1: stream write-vault.sh to a temp file on Hetzner (no secrets in this transfer)
      VAULT_SCRIPT_TMP="/tmp/wv-${input.tenant_slug}-$$.sh"
      ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
        claude@5.78.86.90 \
        "cat > ${VAULT_SCRIPT_TMP} && chmod 700 ${VAULT_SCRIPT_TMP}" \
        < scripts/write-vault.sh

      # Step 2: pipe WC keys to the uploaded script via stdin; delete script after use
      printf '%s' "${WC_KEYS}" | \
        ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
        claude@5.78.86.90 \
        "TENANT_SLUG='${input.tenant_slug}' AGE_RECIPIENT='${AGE_RECIPIENT}' \
         bash ${VAULT_SCRIPT_TMP}; rm -f ${VAULT_SCRIPT_TMP}"

      echo "[bootstrap] Vault write complete."

      # Save WC keys temporarily for evidence-canary SC-1 verification
      # The canary step reads and then deletes this file.
      WC_CANARY_PATH="${WORKSPACE}/wc-canary-keys.tmp"
      printf '%s' "${WC_KEYS}" > "${WC_CANARY_PATH}"
      chmod 600 "${WC_CANARY_PATH}"
      echo "[bootstrap] WC canary keys saved at ${WC_CANARY_PATH} (deleted by evidence-canary)."
    fi

    echo "[bootstrap] Bootstrap DONE."
  timeout: 600000
- id: evidence-canary
  name: Evidence and canary check
  depends_on:
  - wp-bootstrap
  env:
    SSH_KEY_PATH: /tmp/claude_exec_key
  bash: |
    set -euo pipefail

    # --- ssh key bootstrap (nodes are isolated; key+vars must be set per-node) ---
    export SSH_KEY_PATH=/tmp/claude_exec_key
    export HETZNER_HOST=5.78.86.90
    export HETZNER_USER=claude
    if [ ! -f /tmp/claude_exec_key ]; then printf '%s' "$HETZNER_SSH_KEY_B64" | base64 -d > /tmp/claude_exec_key; chmod 600 /tmp/claude_exec_key; fi
    # --- end ssh key bootstrap ---

    WORKSPACE="/.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store"
    SLUG="${input.tenant_slug}"
    DOMAIN="${input.primary_domain}"

    echo "=== EVIDENCE: Container status (SC-2) ==="
    CONTAINERS=$(ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
      claude@5.78.86.90 \
      "docker ps --format '{{.Names}}\t{{.Status}}' | grep -E '${SLUG}-(wordpress|mysql)'" || echo "NOT_FOUND")
    echo "${CONTAINERS}"

    if ! echo "${CONTAINERS}" | grep -q "${SLUG}-wordpress"; then
      echo "[canary] ERROR: ${SLUG}-wordpress container not found in 'docker ps'" >&2
      exit 1
    fi
    if ! echo "${CONTAINERS}" | grep -q "${SLUG}-mysql"; then
      echo "[canary] ERROR: ${SLUG}-mysql container not found in 'docker ps'" >&2
      exit 1
    fi
    echo "[canary] SC-2 PASS: Both containers running."

    echo "=== EVIDENCE: docker logs (last 20 lines) ==="
    ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
      claude@5.78.86.90 \
      "docker logs --tail 20 ${SLUG}-wordpress 2>&1" || true

    echo "=== EVIDENCE: Vault file (SC-3a) ==="
    VAULT_OK=$(ssh -i "${SSH_KEY_PATH}" -o StrictHostKeyChecking=accept-new \
      claude@5.78.86.90 \
      "test -f /opt/bdc/tenants/${SLUG}/secrets.enc && echo OK || echo MISSING")
    echo "Vault status: ${VAULT_OK}"
    if [ "${VAULT_OK}" = "MISSING" ]; then
      echo "[canary] ERROR: SC-3a FAILED -- vault file /opt/bdc/tenants/${SLUG}/secrets.enc is MISSING." >&2
      exit 1
    fi
    echo "[canary] SC-3a PASS: Vault file exists."

    echo "=== EVIDENCE: No credentials in Terraform state (SC-3b) ==="
    STATE_PATH="${WORKSPACE}/terraform-state/${SLUG}-dev.tfstate"
    # Check for both WC keys and MySQL inline passwords.
    # MYSQL_ROOT_PASSWORD= (without _FILE) would indicate the old insecure pattern;
    # with the _FILE convention only MYSQL_ROOT_PASSWORD_FILE= (a path) appears in state.
    CRED_CHECK=$(grep -ic \
      "consumer_secret\|admin_password\|MYSQL_ROOT_PASSWORD=[^F]\|MYSQL_PASSWORD=[^F]" \
      "${STATE_PATH}" 2>/dev/null || true)
    if [ "${CRED_CHECK:-0}" -gt 0 ]; then
      echo "[canary] ERROR: SC-3b FAILED -- credentials found in Terraform state!" >&2
      exit 1
    fi
    echo "Credential check in state: CLEAN (0 matches)"
    echo "[canary] SC-3b PASS: No credentials in state."

    echo "=== EVIDENCE: WC REST API canary (SC-1) ==="
    echo "[canary] Waiting 20 seconds for TLS provisioning to complete..."
    sleep 20

    WC_CANARY_PATH="${WORKSPACE}/wc-canary-keys.tmp"
    if [ -f "${WC_CANARY_PATH}" ]; then
      WC_KEYS_PAIR=$(cat "${WC_CANARY_PATH}")
      CK=$(printf '%s' "${WC_KEYS_PAIR}" | cut -d: -f1)
      CS=$(printf '%s' "${WC_KEYS_PAIR}" | cut -d: -f2-)
      rm -f "${WC_CANARY_PATH}"
      echo "[canary] SC-1: probing WC REST API with generated consumer credentials..."
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
        --max-time 30 \
        -u "${CK}:${CS}" \
        "https://${DOMAIN}/wp-json/wc/v3/products" || echo "000")
      echo "[canary] WC REST API response code: ${HTTP_CODE}"
      if [ "${HTTP_CODE}" = "200" ]; then
        echo "[canary] SC-1 PASS: WC REST API returned HTTP 200 with valid consumer credentials."
      elif [ "${HTTP_CODE}" = "000" ]; then
        echo "[canary] FAIL: Could not reach ${DOMAIN} -- TLS may still be provisioning." >&2
        exit 1
      else
        echo "[canary] FAIL: SC-1 requires HTTP 200 with valid credentials; got HTTP ${HTTP_CODE}." >&2
        exit 1
      fi
    else
      # No canary key file (KEYS_ALREADY_EXIST path) -- run unauthenticated probe
      echo "[canary] No WC canary key file found (keys pre-existed). Running unauthenticated probe..."
      HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
        --max-time 30 \
        "https://${DOMAIN}/wp-json/wc/v3/products" || echo "000")
      echo "[canary] Unauthenticated probe: HTTP ${HTTP_CODE}"
      if [ "${HTTP_CODE}" = "401" ]; then
        echo "[canary] SC-1 PARTIAL: WC REST endpoint live (401 = auth required). Manual key verification required."
      elif [ "${HTTP_CODE}" = "000" ]; then
        echo "[canary] FAIL: Could not reach ${DOMAIN}. SC-1 NOT verified." >&2
        exit 1
      else
        echo "[canary] FAIL: Unexpected HTTP ${HTTP_CODE} from WC REST endpoint. SC-1 NOT verified." >&2
        exit 1
      fi
    fi

    echo "[canary] Evidence collection COMPLETE."
  timeout: 600000
- id: provisioning-receipt
  name: Provisioning receipt
  depends_on:
  - evidence-canary
  bash: |
    set -euo pipefail
    WORKSPACE="/.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store"
    SLUG="${input.tenant_slug}"
    DOMAIN="${input.primary_domain}"
    TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    TS_SAFE=$(echo "${TIMESTAMP}" | tr ':' '-')
    RECEIPT_PATH="${WORKSPACE}/provisioning-receipt-${TS_SAFE}-${SLUG}.md"

    # Read terraform outputs
    TF_OUTPUTS=$(cat "${WORKSPACE}/tf-outputs.json" 2>/dev/null || echo "{}")
    PLAN_SUMMARY=$(tail -10 "${WORKSPACE}/tfplan-${SLUG}.txt" 2>/dev/null || echo "(plan file not found)")

    cat > "${RECEIPT_PATH}" <<RECEIPT
    # Provisioning Receipt -- ${SLUG}

    **WO:** WO-INFRA-WP-STORE-FACTORY-01
    **Tenant:** ${SLUG}
    **Primary domain:** ${DOMAIN}
    **Store URL:** https://${DOMAIN}
    **Apply timestamp:** ${TIMESTAMP}
    **Phase:** 1 -- Manual John-gated path

    ## Terraform plan summary

    \`\`\`
    ${PLAN_SUMMARY}
    \`\`\`

    ## Resources created

    | Resource | Name |
    |----------|------|
    | WordPress container | ${SLUG}-wordpress |
    | MySQL container | ${SLUG}-mysql |
    | WP content volume | ${SLUG}-wp-content |
    | MySQL data volume | ${SLUG}-mysql-data |
    | Tenant network | ${SLUG}-wp-net |
    | Cloudflare DNS A record | ${DOMAIN} -> 5.78.86.90 |

    ## WooCommerce REST API

    - Endpoint: https://${DOMAIN}/wp-json/wc/v3/
    - WC version: ${input.wc_version}
    - Consumer key/secret: age-encrypted at /opt/bdc/tenants/${SLUG}/secrets.enc

    ## Vault path

    /opt/bdc/tenants/${SLUG}/secrets.enc (age-encrypted, key held by John)

    ## CI stop condition status

    | SC | Description | Status |
    |----|-------------|--------|
    | SC-1 | WC REST returns 200 with valid keys | See evidence-canary logs |
    | SC-2 | Both containers running | Verified in evidence-canary |
    | SC-3a | Vault file exists | Verified in evidence-canary |
    | SC-3b | No creds in Terraform state | Verified in evidence-canary |
    | SC-4 | Re-fire returns already_provisioned | Tested by idempotency gate |
    | SC-5 | Receipt artifact exists | This file |

    ## Terraform outputs

    \`\`\`json
    ${TF_OUTPUTS}
    \`\`\`

    ## Capacity notes

    - Current CX32 safe ceiling: ~8 tenants (256m WP + 256m MySQL each).
    - At 6 tenants, evaluate CX32 -> CX52 upgrade.
    - Self-serve fast-lane requires WP-STORE-FACTORY-REMOTE-STATE-01 first.
    RECEIPT

    echo "[receipt] Provisioning receipt written to: ${RECEIPT_PATH}"
    echo "RECEIPT_PATH=${RECEIPT_PATH}"
- id: pause-prod-cutover
  name: 'PAUSE: Prod/custom-domain cutover (optional)'
  depends_on:
  - provisioning-receipt
  approval:
    message: |
      Provisioning complete for tenant: ${input.tenant_slug}
      Store URL: https://${input.primary_domain}

      Receipt: /.archon/workspaces/bluedevilcollectibles/${input.tenant_slug}-wp-store/

      If this store needs a custom domain cutover (e.g. from comicstoreos.com subdomain
      to client's own domain), configure DNS and Traefik here before approving.
      For bdc-woo-dev (dev/test store), approve to finish.

      Manual verification:
        curl -s -o /dev/null -w "%{http_code}" https://${input.primary_domain}/wp-json/wc/v3/products
        (expect 200 with valid consumer key/secret from vault)
