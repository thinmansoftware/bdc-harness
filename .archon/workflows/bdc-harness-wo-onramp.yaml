{name: bdc-harness-wo-onramp,description: "Use when: Firing any BDC product Work Order through Devils Cauldron. This is\nthe canonical on-ramp atom - it authors a tailored child YAML from the approved\nWO spec, adversarially reviews it, gets operator approval, registers the child\nworkflow in Archon, fires it against the target codebase, verifies binding, and\nbuilds the Captain CI v2 manifest.\nInputs:\n  USER_MESSAGE: WO_ID (e.g. WO-SHOPOPS-PULLLIST-EXPORT-01) plus optional\n                --project <repo> override. WO spec must exist on bdc-xo/main.\nDoes: preflight -> normalize-spec -> generate-yaml (loop) -> validate-yaml ->\n      adversarial-review -> prefire-plan -> approval-gate -> register-yaml ->\n      fire-child -> verify-binding -> build-manifest -> flip-notion.\nNOT for: Doctrine-only WOs (use bdc-doctrine-update). Batch authoring\n      (use bdc-author-wo-batch). WO authoring from scratch (use bdc-wo-author).\nparallel_ok: false\n",policyFile: harness/policies/agent-behavior.md,model: sonnet,interactive: true,inputs: {NOTION_DB_ID: {default: a6df831c-0b52-449f-8ca4-d77be6b70d0a}},nodes: [{id: preflight,load_bearing: true,bash: "set -euo pipefail\n\necho \"=== preflight: checking gh auth ===\"\nif ! gh auth status 2>&1 | grep -q 'Logged in'; then\n  echo \"ERROR: gh CLI not authenticated. Run 'gh auth login' or set GITHUB_TOKEN.\" >&2\n  exit 1\nfi\necho \"gh auth: OK\"\n\necho \"=== preflight: checking bdc-xo reachability ===\"\nif ! gh api repos/bluedevilcollectibles/bdc-xo --jq .id >/dev/null 2>&1; then\n  echo \"ERROR: cannot reach bluedevilcollectibles/bdc-xo via gh api.\" >&2\n  echo \"Check GITHUB_TOKEN scope (needs repo read on bdc-xo).\" >&2\n  exit 1\nfi\necho \"bdc-xo reachable: OK\"\n\necho \"=== preflight: checking ARCHON_OPERATOR_TOKEN ===\"\nif [ -z \"${ARCHON_OPERATOR_TOKEN:-}\" ]; then\n  echo \"ERROR: ARCHON_OPERATOR_TOKEN not set in executor env.\" >&2\n  echo \"Add it to the harness container env and retry.\" >&2\n  exit 1\nfi\necho \"ARCHON_OPERATOR_TOKEN: present\"\n\necho \"=== preflight: checking git push auth (dry-run) ===\"\nPROBE_REF=\"refs/heads/preflight-auth-probe-$(date +%s)\"\nif ! git push --dry-run origin \"HEAD:${PROBE_REF}\" 2>&1; then\n  echo \"ERROR: git push dry-run failed - container cannot push to origin.\" >&2\n  echo \"Likely cause: GITHUB_TOKEN missing push scope or wrong remote.\" >&2\n  exit 1\nfi\necho \"git push auth: OK\"\n\necho \"preflight PASS\"\n"},{id: fetch-spec,load_bearing: true,depends_on: [preflight],bash: "set -euo pipefail\nDEST=\"$ARTIFACTS_DIR/source-spec.md\"\nMETA=\"$ARTIFACTS_DIR/source-spec.meta\"\n\n# Parse WO_ID from USER_MESSAGE\nWO_ID=$(printf '%s\\n' \"$USER_MESSAGE\" | grep -Eo 'WO-[A-Z][A-Z0-9-]+-[0-9]+' | head -n 1 || true)\nif [ -z \"$WO_ID\" ]; then\n  echo \"ERROR: no WO_ID matching WO-[A-Z][A-Z0-9-]+-[0-9]+ in USER_MESSAGE\" >&2\n  exit 1\nfi\n\n# Parse --project override (optional)\nTARGET_HINT=$(printf '%s\\n' \"$USER_MESSAGE\" | grep -Eo -- '--project[[:space:]]+[A-Za-z0-9._-]+' | head -n 1 | awk '{print $2}' || true)\n\nSPEC_CONTENT=\"\"\nSPEC_PATH=\"\"\n\n# 1) docs/work-orders/<WO_ID>.md\nSPEC_PATH=\"docs/work-orders/${WO_ID}.md\"\nSPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\n\n# 2) docs/superpowers/specs/<WO_ID>.md\nif [ -z \"$SPEC_CONTENT\" ]; then\n  SPEC_PATH=\"docs/superpowers/specs/${WO_ID}.md\"\n  SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nfi\n\n# 3) date-prefix glob in docs/superpowers/specs/\nif [ -z \"$SPEC_CONTENT\" ]; then\n  MATCH=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main\" --template '{{range .}}{{.path}}{{\"\\n\"}}{{end}}' 2>/dev/null | grep \"${WO_ID}.md$\" | head -n 1 || true)\n  if [ -n \"$MATCH\" ]; then\n    SPEC_PATH=\"$MATCH\"\n    SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\n  fi\nfi\n\n# 4) GitHub issue body fallback\nif [ -z \"$SPEC_CONTENT\" ]; then\n  ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo --search \"${WO_ID} in:title\" --json number --jq '.[0].number' 2>/dev/null || true)\n  if [ -n \"$ISSUE_NUM\" ] && [ \"$ISSUE_NUM\" != \"null\" ]; then\n    SPEC_CONTENT=$(gh issue view \"$ISSUE_NUM\" --repo bluedevilcollectibles/bdc-xo --json body --jq .body 2>/dev/null || true)\n    [ -n \"$SPEC_CONTENT\" ] && SPEC_PATH=\"bdc-xo:issues/${ISSUE_NUM}\"\n  fi\nfi\n\nif [ -z \"$SPEC_CONTENT\" ]; then\n  echo \"ERROR: SPEC_MISSING ${WO_ID} not found in bdc-xo (docs/work-orders, docs/superpowers/specs direct, date-glob, issue search)\" >&2\n  exit 1\nfi\n\n# Write canonical artifact\nprintf '%s\\n' \"$SPEC_CONTENT\" > \"$DEST\"\n{\n  echo \"WO_ID=${WO_ID}\"\n  echo \"SPEC_PATH=bdc-xo:${SPEC_PATH}\"\n  echo \"TARGET_HINT=${TARGET_HINT:-unknown}\"\n  echo \"SPEC_BYTES=$(wc -c < \"$DEST\")\"\n} > \"$META\"\n\necho \"fetch-spec: wrote $(wc -c < \"$DEST\") bytes to $DEST\"\necho \"WO_ID=${WO_ID}\"\necho \"SPEC_PATH=bdc-xo:${SPEC_PATH}\"\necho \"TARGET_HINT=${TARGET_HINT:-unknown}\"\necho \"SPEC_ARTIFACT=$DEST\"\necho \"FETCH_OK=true\"\n"},{id: normalize-spec,agent: xo,context: fresh,depends_on: [fetch-spec],prompt: "You are the BDC on-ramp spec normalizer. The spec has ALREADY been fetched by\nthe fetch-spec bash node and written to a file. Read ONLY that file and emit a\nnormalized block. Do NOT attempt any gh/repo access - you have no shell.\n\n## Inputs\nfetch-spec output: $fetch-spec.output\nThe raw spec is in the file referenced by SPEC_ARTIFACT (read it with your Read tool).\nWO_ID and TARGET_HINT are in the fetch-spec output above.\n\n## Step 1 - Read the spec artifact\nRead the file at the SPEC_ARTIFACT path from fetch-spec output (typically\n$ARTIFACTS_DIR/source-spec.md). That file IS the WO spec body. If you cannot\nread it or it is empty, output `SPEC_MISSING: artifact unreadable` and stop.\n\n## Step 2 - Determine TARGET_REPO\nPrefer the TARGET_HINT from fetch-spec output if not \"unknown\". Otherwise parse\nthe spec body for `target_repo:`, `**Target repo:**`, or `Target Repo:` lines.\nDefault to `unknown` if not parseable.\n\n## Step 3 - Extract fields from the spec body\n- TARGET_REPO: short repo name (e.g. shopops)\n- TARGET_REPO_FULL: bluedevilcollectibles/<TARGET_REPO> (add org prefix if missing)\n- RULE20_STAGING_GATE: true if TARGET_REPO_FULL is one of:\n  bluedevilcollectibles/lspro-react, bluedevilcollectibles/shopops-storefront,\n  bluedevilcollectibles/shopops. Otherwise false.\n- WO_CLASS: CODE, INFRA, or MIXED (from spec Class field; default CODE)\n- BUSINESS_RISK_INVARIANT: the single most critical must-not-break invariant.\n  Derive from the Stop Point / Behavior Source of Truth / any \"MUST NEVER break\"\n  statement. One sentence, specific to THIS WO. Never emit the literal words\n  \"placeholder\", \"TODO\", \"one sentence\", or \"<BUSINESS_RISK...\".\n- IN_SCOPE_FILES: in-scope files (comma-separated)\n- VERIFY_COMMANDS: stop-condition commands (newline-separated)\n\n## Required Output Format (emit exactly, no markdown fences)\n\n```\n=== NORMALIZE-SPEC OUTPUT ===\nWO_ID=<id>\nTARGET_REPO=<repo-short-name-or-unknown>\nTARGET_REPO_FULL=<bluedevilcollectibles/repo-or-unknown>\nRULE20_STAGING_GATE=<true|false>\nWO_CLASS=<CODE|INFRA|MIXED>\nBUSINESS_RISK_INVARIANT=<one sentence>\nIN_SCOPE_FILES=<comma-separated or \"(see spec)\">\nVERIFY_COMMANDS=<newline-separated commands or \"(see spec)\">\n\n=== SPEC_CONTENT ===\n<full spec body verbatim from the artifact>\n```\n"},{id: assert-spec-resolved,load_bearing: true,depends_on: [normalize-spec],bash: "set -euo pipefail\nNORM_OUT=$normalize-spec.output\n\nif printf '%s\\n' \"$NORM_OUT\" | grep -qE '^SPEC_MISSING:'; then\n  MSG=$(printf '%s\\n' \"$NORM_OUT\" | grep '^SPEC_MISSING:' | head -1)\n  echo \"ERROR: normalize-spec could not retrieve spec: $MSG\" >&2\n  exit 1\nfi\n\nSPEC_LEN=$(printf '%s\\n' \"$NORM_OUT\" | awk '/=== SPEC_CONTENT ===/,0' | wc -c || echo 0)\nif [ \"${SPEC_LEN:-0}\" -lt 200 ]; then\n  echo \"ERROR: SPEC_CONTENT section missing or too short (${SPEC_LEN} chars)\" >&2\n  exit 1\nfi\n\nBRI=$(printf '%s\\n' \"$NORM_OUT\" | sed -n 's/^BUSINESS_RISK_INVARIANT=//p' | head -1)\nif [ -z \"$BRI\" ]; then\n  echo \"ERROR: BUSINESS_RISK_INVARIANT missing from normalize-spec output\" >&2\n  exit 1\nfi\nfor BAD in placeholder TODO unknown \"BUSINESS_RISK_INVARIANT\" \"invariant here\" \"one sentence\"; do\n  if printf '%s\\n' \"$BRI\" | grep -qi \"$BAD\"; then\n    echo \"ERROR: BUSINESS_RISK_INVARIANT is a placeholder: $BRI\" >&2\n    exit 1\n  fi\ndone\nif [ \"${#BRI}\" -lt 20 ]; then\n  echo \"ERROR: BUSINESS_RISK_INVARIANT too short (${#BRI} chars): $BRI\" >&2\n  exit 1\nfi\n\necho \"SPEC_RESOLVED=true\"\necho \"BRI ok: $BRI\"\n"},{id: yaml-author,agent: major-build,depends_on: [assert-spec-resolved],loop: {fresh_context: true,until: YAML_READY,max_iterations: 4,until_bash: "set -uo pipefail\nFEEDBACK=\"$ARTIFACTS_DIR/yaml-author-validation.txt\"\n: > \"$FEEDBACK\"\n\n# Resolve the draft filename: prefer a single *.yaml.draft in CWD.\nDRAFT=$(ls -1 *.yaml.draft 2>/dev/null | head -n 1 || true)\nif [ -z \"$DRAFT\" ] || [ ! -f \"$DRAFT\" ]; then\n  echo \"FAIL: no .yaml.draft file found in CWD\" >> \"$FEEDBACK\"\n  cat \"$FEEDBACK\"\n  exit 1\nfi\n\nERRORS=0\nNORM_OUT=$normalize-spec.output\nBUSINESS_RISK_INVARIANT=$(printf '%s\\n' \"$NORM_OUT\" | sed -n 's/^BUSINESS_RISK_INVARIANT=//p' | head -n 1)\nif [ -z \"$BUSINESS_RISK_INVARIANT\" ]; then\n  echo \"FAIL: BUSINESS_RISK_INVARIANT missing from normalize-spec output\" >> \"$FEEDBACK\"\n  ERRORS=$((ERRORS+1))\nfi\n\n# Rule 1: model: sonnet at root\ngrep -Eq '^model:[[:space:]]*sonnet$' \"$DRAFT\" || { echo \"FAIL Rule 1: missing 'model: sonnet' at root\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1)); }\n\n# Rule 6: policyFile at root\ngrep -Eq '^policyFile:[[:space:]]*harness/policies/agent-behavior\\.md$' \"$DRAFT\" || { echo \"FAIL Rule 6: missing 'policyFile: harness/policies/agent-behavior.md' at root\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1)); }\n\n# Rule 4/9: no BDC_XO/ prefix in paths\nif grep -E 'BDC_XO/' \"$DRAFT\" | grep -qv '#'; then echo \"FAIL Rule 4/9: BDC_XO/ prefix found (paths must be repo-root-relative)\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1)); fi\n\n# Rule 10: every loop: has until, max_iterations, fresh_context\nLOOP_COUNT=$(grep -c '^[[:space:]]*loop:' \"$DRAFT\" 2>/dev/null || echo 0)\nif [ \"$LOOP_COUNT\" -gt 0 ]; then\n  UNTIL_COUNT=$(grep -c '[[:space:]]*until:' \"$DRAFT\" 2>/dev/null || echo 0)\n  MAXITER_COUNT=$(grep -c '[[:space:]]*max_iterations:' \"$DRAFT\" 2>/dev/null || echo 0)\n  FC_COUNT=$(grep -c '[[:space:]]*fresh_context:' \"$DRAFT\" 2>/dev/null || echo 0)\n  if [ \"$UNTIL_COUNT\" -lt \"$LOOP_COUNT\" ] || [ \"$MAXITER_COUNT\" -lt \"$LOOP_COUNT\" ] || [ \"$FC_COUNT\" -lt \"$LOOP_COUNT\" ]; then\n    echo \"FAIL Rule 10: loop blocks missing until/max_iterations/fresh_context (loops=$LOOP_COUNT until=$UNTIL_COUNT maxiter=$MAXITER_COUNT fc=$FC_COUNT)\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1));\n  fi\nfi\n\n# Rule 7: flip-notion node present\ngrep -q 'id: flip-notion' \"$DRAFT\" || { echo \"FAIL Rule 7: flip-notion node not found\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1)); }\n\n# business-risk-gate present\ngrep -q 'id: business-risk-gate' \"$DRAFT\" || { echo \"FAIL: business-risk-gate node not found (required)\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1)); }\n\n# business-risk-gate must be load_bearing: true\nif grep -q 'id: business-risk-gate' \"$DRAFT\"; then\n  if ! awk '/id: business-risk-gate/{f=1} f && /load_bearing: true/{print; f=0}' \"$DRAFT\" | grep -q '.'; then\n    echo \"FAIL: business-risk-gate missing load_bearing: true\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1));\n  fi\n  if [ -n \"$BUSINESS_RISK_INVARIANT\" ] && ! grep -Fq \"$BUSINESS_RISK_INVARIANT\" \"$DRAFT\"; then\n    echo \"FAIL: business-risk-gate does not include BUSINESS_RISK_INVARIANT verbatim: $BUSINESS_RISK_INVARIANT\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1));\n  fi\nfi\n\n# Rule 11: no n8n webhook calls\nif grep -E 'n8n\\.bluedevilcollectibles\\.com' \"$DRAFT\" | grep -qv '#'; then echo \"FAIL Rule 11: n8n webhook call found (hangs in executor subprocess)\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1)); fi\n\n# Conservative dev-error substring bans (defense-in-depth, loop-only).\n# These tokens never legitimately appear in a healthy child YAML (verified\n# against the canonical base patterns), so banning them as substrings is safe\n# and catches sloppiness early. We deliberately do NOT ban \"{{\", \"}}\",\n# \"template\", or \"one sentence\" here -- those appear legitimately in base-pattern\n# prompt: bodies (e.g. gh api --template '{{.content}}', <one sentence John can\n# answer>). Placeholder detection for THOSE is structural (the bun check below),\n# not substring. See WO-CAULDRON-ONRAMP-ATOM-DEFECTS-6-7 + war-council verdict\n# 2026-06-07: a substring scan has a hard false-positive ceiling against the\n# canonical patterns; structural-position validation is the only sound design.\nfor BAD in \"TODO\" \"FIXME\" \"TBD\" \"REPLACE_ME\" \"lorem ipsum\"; do\n  if grep -qi \"$BAD\" \"$DRAFT\" 2>/dev/null; then echo \"FAIL: child YAML contains dev-error token: $BAD\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1)); break; fi\ndone\n\n# Structural placeholder + YAML-parse check (single bun invocation).\n# Parses the draft and validates the FILLED STRUCTURAL POSITIONS the author was\n# told to substitute -- NOT rendered text. Checks ONLY root scalars + inputs.WO_ID.default;\n# never traverses nodes[] or prompt: bodies (where legit <...> instruction tokens live).\nSTRUCT_ERR=$(DRAFT=\"$DRAFT\" bun -e '\n  const fs = require(\"fs\");\n  let obj;\n  try { obj = Bun.YAML.parse(fs.readFileSync(process.env.DRAFT, \"utf8\")); }\n  catch (e) { console.log(\"YAML parse failed: \" + e.message); process.exit(0); }\n  if (obj === null || typeof obj !== \"object\") { console.log(\"draft is not a YAML mapping\"); process.exit(0); }\n  const fails = [];\n  // (a) root model must be a real Claude model (ROOT ONLY -- node-level codex models are legitimate)\n  const model = obj.model;\n  if (!model || !/^(sonnet|opus|haiku|claude-[A-Za-z0-9._-]+)$/.test(String(model))) {\n    fails.push(\"root model: is missing or not a real model (got: \" + String(model) + \")\");\n  }\n  // (b) inputs.WO_ID.default must be a real WO_ID -- no angle bracket, no template phrase\n  const wid = obj && obj.inputs && obj.inputs.WO_ID ? obj.inputs.WO_ID.default : undefined;\n  if (wid === undefined || wid === null) { fails.push(\"inputs.WO_ID.default is missing\"); }\n  else if (String(wid).includes(\"<\") || String(wid).includes(\"normalize-spec\")) { fails.push(\"inputs.WO_ID.default is an unfilled stub: \" + String(wid)); }\n  // (c) root name must be a real slug -- no angle bracket\n  const nm = obj.name;\n  if (nm === undefined || nm === null) { fails.push(\"root name: is missing\"); }\n  else if (String(nm).includes(\"<\")) { fails.push(\"root name: is an unfilled stub: \" + String(nm)); }\n  // (e) exact-match the atom-own author-facing stub strings against top-level scalar values ONLY\n  const stubs = [\"<WO_ID from normalize-spec>\",\"<bdc-slug>\",\"<bluedevilcollectibles/repo>\",\"<one sentence, verbatim from spec>\",\"<slug>\",\"<WO_ID>\",\"<true|false>\"];\n  for (const [k, v] of Object.entries(obj)) {\n    if (v === null || typeof v === \"object\") continue;\n    if (stubs.includes(String(v))) { fails.push(\"top-level field \" + k + \" is an unfilled stub: \" + String(v)); }\n  }\n  if (fails.length) { console.log(fails.join(\"; \")); }\n' 2>&1 || true)\nif [ -n \"$STRUCT_ERR\" ]; then\n  echo \"FAIL: structural validation: $STRUCT_ERR\" >> \"$FEEDBACK\"; ERRORS=$((ERRORS+1));\nfi\n\nif [ \"$ERRORS\" -gt 0 ]; then\n  echo \"\" >> \"$FEEDBACK\"\n  echo \"$ERRORS validation error(s). Fix every line above and re-draft.\" >> \"$FEEDBACK\"\n  echo \"=== yaml-author validation FAILED ($ERRORS errors) ===\"\n  cat \"$FEEDBACK\"\n  exit 1\nfi\n\n# Defect 6b skew-detection: record the exact draft this gate validated (name + sha256)\n# so assert-yaml-ready can confirm it scans the SAME content. If the agent rewrites\n# the file after this gate passes, assert-yaml-ready will surface the drift.\nDRAFT_SHA=$(sha256sum \"$DRAFT\" 2>/dev/null | awk '{print $1}' || echo \"unknown\")\n{\n  echo \"DRAFT_FILE=$DRAFT\"\n  echo \"DRAFT_SHA=$DRAFT_SHA\"\n} > \"$ARTIFACTS_DIR/yaml-author-validated.txt\"\n\necho \"ARTIFACTS_DIR=$ARTIFACTS_DIR\" >> \"$FEEDBACK\"\necho \"YAML_READY=true (draft: $DRAFT sha: $DRAFT_SHA)\"\nexit 0\n",prompt: "You are major-build. Author a tailored child workflow YAML for the Work\nOrder in the normalized spec below, then write it to disk. You have full\nwrite tools -- you MUST actually create the file.\n\n## STEP 0 -- Read prior-iteration validation feedback FIRST\nRun this before anything else:\n  cat \"$ARTIFACTS_DIR/yaml-author-validation.txt\" 2>/dev/null || echo \"(no prior feedback -- first iteration)\"\nIf the file lists failures, FIX EVERY ONE of them in this iteration. Do not\nrepeat a mistake the previous iteration already made.\n\n## GUARD -- fail closed if spec is incomplete\nCheck the normalized spec input. If any of these, emit YAML_DRAFT_FAILURE\nwith a reason and STOP (do NOT draft, do NOT emit YAML_READY):\n1. SPEC_MISSING present -> reason=spec-not-retrieved\n2. BUSINESS_RISK_INVARIANT missing/empty/placeholder -> reason=placeholder-invariant\n3. SPEC_CONTENT < 200 chars -> reason=spec-too-short\n\n## Inputs\nNormalized spec: $normalize-spec.output\n\n## Base pattern\nUse bdc-feature-development.yaml as the structural base:\npreflight-github-auth (load_bearing) -> read-spec -> plan -> implement\n(loop, major-build, fresh_context: true, until: COMPLETE, max_iterations: 5)\n-> war-council-validator -> business-risk-gate -> decide-push-target ->\ncommit-and-push (load_bearing) -> open-pr-if-needed (load_bearing) ->\nbuild-manifest (trigger_rule: all_done) -> flip-notion.\n\n## Tailoring requirements\n\n1. Bake in WO_ID at root so the child needs no USER_MESSAGE at fire time:\n   inputs:\n     WO_ID:\n       default: \"<WO_ID from normalize-spec>\"\n\n2. Add a business-risk-gate node (load_bearing: true) before decide-push-target\n   that fails closed if the WO's BUSINESS_RISK_INVARIANT is violated. Put the\n   ACTUAL invariant text from normalize-spec into the node -- never the literal\n   words \"placeholder\", \"TODO\", \"one sentence\", or \"<BUSINESS_RISK...\".\n\n3. If RULE20_STAGING_GATE=true: decide-push-target and commit-and-push must use\n   --base staging for the PR.\n\n4. Child YAML filename: lowercase the WO_ID, replace WO- prefix with bdc-,\n   replace underscores with hyphens. Write to <slug>.yaml.draft in CWD.\n\n## Hard rules the child YAML MUST satisfy (validated by until_bash after you finish)\n- model: sonnet at root (a real model string -- the structural gate checks root model:)\n- policyFile: harness/policies/agent-behavior.md at root\n- every loop: has prompt + until + max_iterations + fresh_context\n- paths repo-root-relative (no BDC_XO/ prefix)\n- no n8n webhook calls\n- flip-notion final node; business-risk-gate present and load_bearing: true\n- business-risk-gate includes BUSINESS_RISK_INVARIANT verbatim\n- root name: is the real child slug (NOT \"<slug>\" / \"<bdc-slug>\")\n- inputs.WO_ID.default is the real WO_ID (NOT \"<WO_ID>\" / \"<WO_ID from normalize-spec>\")\n- no dev-error tokens: TODO, FIXME, TBD, REPLACE_ME, lorem ipsum\n- SUBSTITUTE every author-facing field: never leave one of the atom's OWN template\n  stubs as a literal top-level value -- \"<one sentence, verbatim from spec>\",\n  \"<bdc-slug>\", \"<bluedevilcollectibles/repo>\", \"<WO_ID from normalize-spec>\",\n  \"<slug>\", \"<WO_ID>\", \"<true|false>\" must be replaced with the real value.\n\n## What is NOT a placeholder (do NOT strip these)\nAngle-bracket output-format instructions INSIDE prompt: node bodies are legitimate\nand REQUIRED -- the canonical base pattern uses them (e.g. \"<one sentence John can\nanswer>\", \"<true|false>\", \"<file:line>\" inside a node's prompt telling its agent\nwhat shape to output). Go-template tokens in bash nodes (\"--template '{{.content}}'\")\nare also legitimate. The gate is STRUCTURAL: it only rejects unfilled values in the\nroot scalars + inputs.WO_ID.default. It does NOT scan prompt: bodies. So copy the\nbase pattern's prompt instructions faithfully -- do not mangle them to dodge a\nsubstring. Just make sure the child's OWN identifying fields are real.\n\n## Required self-check before emitting the sentinel\nBefore you emit YAML_READY, inspect the draft yourself and confirm:\n- id: business-risk-gate is present and load_bearing: true is in that node\n- the exact BUSINESS_RISK_INVARIANT line from normalize-spec appears verbatim\n- root model:, root name:, and inputs.WO_ID.default are all REAL values (no angle brackets)\n- none of the atom's own template stubs (listed above) survive as literal top-level values\nIf any check fails, fix the draft in this same iteration. Do not emit\nYAML_READY for an unchecked or known-bad draft.\n\n## Output\n1. WRITE the file <slug>.yaml.draft to disk (you have write tools -- use them).\n2. Emit this footer, substituting EVERY field with the REAL value (never leave\n   an angle-bracket instruction as the literal value -- the structural gate\n   rejects an unfilled field):\n   === YAML-AUTHOR RESULT ===\n   YAML_FILENAME=the.slug.yaml.draft\n   WO_SLUG=the-bdc-slug\n   WO_ID=the real WO_ID from normalize-spec\n   TARGET_REPO_FULL=bluedevilcollectibles/the-repo\n   RULE20_STAGING_GATE=true or false\n   BUSINESS_RISK_INVARIANT=paste the exact invariant text from normalize-spec output, verbatim\n3. Emit the sentinel YAML_READY on its own line.\n\nThe until_bash gate validates your draft after this iteration. If it fails,\nyou will see the errors in the feedback file next iteration -- fix them.\n"}},{id: assert-yaml-ready,load_bearing: true,depends_on: [yaml-author],bash: "set -euo pipefail\nAUTHOR_OUT=$yaml-author.output\nNORM_OUT=$normalize-spec.output\n\nYAML_FILENAME=$(printf '%s\\n' \"$AUTHOR_OUT\" | sed -n 's/^YAML_FILENAME=//p' | head -n 1)\nWO_SLUG=$(printf '%s\\n' \"$AUTHOR_OUT\" | sed -n 's/^WO_SLUG=//p' | head -n 1)\n\n# Fall back to globbing if the footer was malformed\nif [ -z \"$YAML_FILENAME\" ] || [ ! -f \"$YAML_FILENAME\" ]; then\n  YAML_FILENAME=$(ls -1 *.yaml.draft 2>/dev/null | head -n 1 || true)\nfi\nif [ -z \"$YAML_FILENAME\" ] || [ ! -f \"$YAML_FILENAME\" ]; then\n  echo \"ERROR: yaml-author produced no .yaml.draft file -- run failed clean (no dead-end).\" >&2\n  printf '%s\\n' \"$AUTHOR_OUT\" | grep -q 'YAML_DRAFT_FAILURE' && echo \"yaml-author hit YAML_DRAFT_FAILURE.\" >&2\n  exit 1\nfi\n\n# Defect 6b skew-detection: confirm we are scanning the SAME draft the loop validated.\n# The loop wrote name+sha to yaml-author-validated.txt on its passing iteration. If the\n# current file differs, the agent rewrote it after the loop gate -- surface it as a WARNING\n# (do NOT skip: this node is defense-in-depth and must still scan the current content).\nVALIDATED_FILE=\"$ARTIFACTS_DIR/yaml-author-validated.txt\"\nif [ -f \"$VALIDATED_FILE\" ]; then\n  PREV_SHA=$(sed -n 's/^DRAFT_SHA=//p' \"$VALIDATED_FILE\" | head -n 1)\n  CUR_SHA=$(sha256sum \"$YAML_FILENAME\" 2>/dev/null | awk '{print $1}' || echo \"unknown\")\n  if [ -n \"$PREV_SHA\" ] && [ \"$PREV_SHA\" != \"unknown\" ] && [ \"$CUR_SHA\" != \"$PREV_SHA\" ]; then\n    echo \"WARNING: draft changed after the loop gate passed (loop sha=$PREV_SHA current sha=$CUR_SHA) -- re-validating current content\" >&2\n  fi\nfi\n\n# Hard re-check: node-presence musts (key-name presence -- reliable substring check)\ngrep -q 'id: business-risk-gate' \"$YAML_FILENAME\" || { echo \"ERROR: business-risk-gate missing\" >&2; exit 1; }\ngrep -q 'id: flip-notion' \"$YAML_FILENAME\" || { echo \"ERROR: flip-notion missing\" >&2; exit 1; }\n\n# Structural placeholder + YAML-parse check -- SAME logic as the loop until_bash (Finding-A parity).\n# Parses the draft and validates FILLED STRUCTURAL POSITIONS (root scalars + inputs.WO_ID.default).\n# Never scans nodes[] or prompt: bodies -- legit <...> instruction tokens live there.\n# Substring scanning has a hard false-positive ceiling against the canonical base patterns\n# (which contain {{ }}, \"template\", and bare <one sentence>); structural validation is the\n# only sound design. See WO-CAULDRON-ONRAMP-ATOM-DEFECTS-6-7 + war-council verdict 2026-06-07.\nSTRUCT_ERR=$(YAML_FILENAME=\"$YAML_FILENAME\" bun -e '\n  const fs = require(\"fs\");\n  let obj;\n  try { obj = Bun.YAML.parse(fs.readFileSync(process.env.YAML_FILENAME, \"utf8\")); }\n  catch (e) { console.log(\"draft does not parse as YAML: \" + e.message); process.exit(0); }\n  if (obj === null || typeof obj !== \"object\") { console.log(\"draft is not a YAML mapping\"); process.exit(0); }\n  const fails = [];\n  const model = obj.model;\n  if (!model || !/^(sonnet|opus|haiku|claude-[A-Za-z0-9._-]+)$/.test(String(model))) {\n    fails.push(\"root model: missing or not a real model (got: \" + String(model) + \")\");\n  }\n  const wid = obj && obj.inputs && obj.inputs.WO_ID ? obj.inputs.WO_ID.default : undefined;\n  if (wid === undefined || wid === null) { fails.push(\"inputs.WO_ID.default missing\"); }\n  else if (String(wid).includes(\"<\") || String(wid).includes(\"normalize-spec\")) { fails.push(\"inputs.WO_ID.default unfilled stub: \" + String(wid)); }\n  const nm = obj.name;\n  if (nm === undefined || nm === null) { fails.push(\"root name: missing\"); }\n  else if (String(nm).includes(\"<\")) { fails.push(\"root name: unfilled stub: \" + String(nm)); }\n  const stubs = [\"<WO_ID from normalize-spec>\",\"<bdc-slug>\",\"<bluedevilcollectibles/repo>\",\"<one sentence, verbatim from spec>\",\"<slug>\",\"<WO_ID>\",\"<true|false>\"];\n  for (const [k, v] of Object.entries(obj)) {\n    if (v === null || typeof v === \"object\") continue;\n    if (stubs.includes(String(v))) { fails.push(\"top-level field \" + k + \" unfilled stub: \" + String(v)); }\n  }\n  if (fails.length) { console.log(fails.join(\"; \")); }\n' 2>&1 || true)\nif [ -n \"$STRUCT_ERR\" ]; then\n  echo \"ERROR: structural validation failed: $STRUCT_ERR\" >&2\n  exit 1\nfi\n\n# (d) business-risk-gate must contain the BUSINESS_RISK_INVARIANT verbatim (the one check\n# the old gate got right -- kept in both gates per war-council verdict).\nBRI=$(printf '%s\\n' \"$NORM_OUT\" | sed -n 's/^BUSINESS_RISK_INVARIANT=//p' | head -n 1)\nif [ -n \"$BRI\" ] && ! grep -Fq \"$BRI\" \"$YAML_FILENAME\"; then\n  echo \"ERROR: child YAML does not include BUSINESS_RISK_INVARIANT verbatim: $BRI\" >&2\n  exit 1\nfi\n\necho \"YAML_VALID=true\"\necho \"YAML_FILENAME=$YAML_FILENAME\"\necho \"WO_SLUG=$WO_SLUG\"\necho \"assert-yaml-ready PASS\"\n"},{id: war-council-review,agent: war-council-architect,context: fresh,depends_on: [assert-yaml-ready],prompt: "You are the War Council Architect. Review the drafted child workflow YAML for\nSTRUCTURAL and ARCHITECTURAL soundness. You are read-only -- you critique, you\ndo not edit. The builder (major-build) already authored it and it passed\nmechanical validation; your job is the judgment layer the validator cannot do.\n\n## Inputs\nNormalized spec: $normalize-spec.output\nyaml-author output: $yaml-author.output\nassert-yaml-ready output: $assert-yaml-ready.output\n\nRead the YAML at YAML_FILENAME (from assert-yaml-ready output).\n\n## Review dimensions\n1. Node DAG shape: do depends_on edges form a sensible order? Any orphan nodes?\n2. Does the implement loop's scope match the spec's in-scope files (no creep)?\n3. Is the business-risk-gate placed where it actually guards the risk surface\n   (before the push, not after)?\n4. Rule 20: if the target repo is customer-facing, is staging enforced correctly?\n5. Does flip-notion target the CHILD product WO (not the on-ramp's own WO)?\n\n## Output\n=== WAR-COUNCIL-REVIEW ===\nSTRUCTURE_OK=<true|false>\nCONCERNS:\n<bullet list of structural issues, or \"(none)\">\nRECOMMENDATION=<PROCEED|REVISE>\n\nThis is advisory context for the overseer and the operator. It does not block\nby itself -- the overseer's adversarial pass and the operator's approval are the\ngates.\n"},{id: adversarial-review,agent: overseer-opus,effort: xhigh,context: fresh,depends_on: [war-council-review],prompt: "You are an adversarial YAML reviewer with no benefit of the doubt. Score the\nchild workflow YAML drafted by generate-yaml on 8 criteria (1-10 each).\nAny score below 7 fails the review.\n\n## Inputs\nNormalized spec: $normalize-spec.output\nyaml-author output: $yaml-author.output\nassert-yaml-ready output: $assert-yaml-ready.output\n\nRead the YAML file at path YAML_FILENAME from assert-yaml-ready output.\n\n## 8 Scoring Criteria\n\n1. **Spec fidelity** (1-10): Does the child YAML implement what the WO spec actually requires?\n   Check: does it hardcode the correct WO_ID? Does IN_SCOPE_FILES match the plan node's scope?\n   Score <7 if child YAML adds out-of-scope work or omits any in-scope file.\n\n2. **Business-risk-gate correctness** (1-10): Does the business-risk-gate node's invariant\n   match BUSINESS_RISK_INVARIANT from the spec exactly (or closely)? Is it load_bearing: true?\n   Does it fail closed (set -euo pipefail; exit 1 path exists)?\n   Score <7 if invariant is generic/wrong or the node lacks fail-closed logic.\n\n3. **Rule 20 compliance** (1-10): If RULE20_STAGING_GATE=true, does the child YAML enforce\n   staging branch as PR base? If false, does it correctly skip that gate?\n   Score <7 if the gate is wrong direction.\n\n4. **Loop correctness** (1-10): Every loop: block has prompt, until, max_iterations (<=5),\n   fresh_context: true. Sentinel is specific (not just \"DONE\").\n   Score <7 if any loop block is missing a required sibling.\n\n5. **Load-bearing correctness** (1-10): preflight-github-auth, commit-and-push,\n   open-pr-if-needed, business-risk-gate are all load_bearing: true. No swallow patterns\n   (`|| echo \"STATUS=failed\"`) on those nodes.\n   Score <7 if any load-bearing node can silently succeed on failure.\n\n6. **Path hygiene** (1-10): All file paths relative to repo root. No BDC_XO/ prefix.\n   No n8n webhook URLs. No absolute paths unless in `/host-artifacts/`.\n   Score <7 if any violation found.\n\n7. **Flip-notion correctness** (1-10): flip-notion is the final node, depends on build-manifest,\n   flips the product WO (not the on-ramp's own WO), and includes manifest paste.\n   Score <7 if flip-notion targets the wrong WO or is not final.\n\n8. **Idempotency** (1-10): Running the child YAML twice on the same WO produces no duplicate\n   commits, no duplicate Notion pages, no duplicate PRs. The implement loop has a\n   \"spec already implemented?\" guard or uses git diff to detect no-op.\n   Score <7 if second run would create duplicates without guards.\n\n## Required Output Format\n\n```\n=== ADVERSARIAL-REVIEW SCORES ===\n1. Spec fidelity: <score>/10 - <one-line finding>\n2. Business-risk-gate: <score>/10 - <one-line finding>\n3. Rule 20 compliance: <score>/10 - <one-line finding>\n4. Loop correctness: <score>/10 - <one-line finding>\n5. Load-bearing correctness: <score>/10 - <one-line finding>\n6. Path hygiene: <score>/10 - <one-line finding>\n7. Flip-notion correctness: <score>/10 - <one-line finding>\n8. Idempotency: <score>/10 - <one-line finding>\n\nRISK=<LOW|MEDIUM|HIGH>\nADV_PASS=<true|false>\nRECOMMENDATION=<PROCEED|REVISE>\n\nUNRESOLVED CONCERNS:\n<bullet list of any score <7 with specific fix required, or \"(none)\" if all >= 7>\n```\n\nRISK=HIGH if any score <= 5. RISK=MEDIUM if any score is 6. RISK=LOW if all >= 7.\nADV_PASS=true only if ALL 8 scores >= 7.\nRECOMMENDATION=PROCEED only if ADV_PASS=true.\n"},{id: prefire-plan,depends_on: [adversarial-review],bash: "set -euo pipefail\nNORM_OUT=$normalize-spec.output\nAUTHOR_OUT=$yaml-author.output\nASSERT_OUT=$assert-yaml-ready.output\nADV_OUT=$adversarial-review.output\n\nWO_ID=$(printf '%s\\n' \"$NORM_OUT\" | sed -n 's/^WO_ID=//p' | head -n 1)\nTARGET_REPO=$(printf '%s\\n' \"$NORM_OUT\" | sed -n 's/^TARGET_REPO=//p' | head -n 1)\nTARGET_REPO_FULL=$(printf '%s\\n' \"$NORM_OUT\" | sed -n 's/^TARGET_REPO_FULL=//p' | head -n 1)\nRULE20_STAGING_GATE=$(printf '%s\\n' \"$NORM_OUT\" | sed -n 's/^RULE20_STAGING_GATE=//p' | head -n 1)\nWO_CLASS=$(printf '%s\\n' \"$NORM_OUT\" | sed -n 's/^WO_CLASS=//p' | head -n 1)\nBUSINESS_RISK_INVARIANT=$(printf '%s\\n' \"$NORM_OUT\" | sed -n 's/^BUSINESS_RISK_INVARIANT=//p' | head -n 1)\nWO_SLUG=$(printf '%s\\n' \"$AUTHOR_OUT\" | sed -n 's/^WO_SLUG=//p' | head -n 1)\nYAML_FILENAME=$(printf '%s\\n' \"$ASSERT_OUT\" | sed -n 's/^YAML_FILENAME=//p' | head -n 1)\nADV_PASS=$(printf '%s\\n' \"$ADV_OUT\" | sed -n 's/^ADV_PASS=//p' | head -n 1)\nRISK=$(printf '%s\\n' \"$ADV_OUT\" | sed -n 's/^RISK=//p' | head -n 1)\n\nAPI_BASE=\"${ARCHON_API_BASE:-https://archon.bluedevilcollectibles.com}\"\nHARNESS_REPO=\"bluedevilcollectibles/bdc-harness\"\nARCHON_HEADERS=(-H \"x-archon-operator-token: ${ARCHON_OPERATOR_TOKEN}\")\nif [ -n \"${CF_ACCESS_CLIENT_ID:-}\" ] && [ -n \"${CF_ACCESS_CLIENT_SECRET:-}\" ]; then\n  ARCHON_HEADERS+=(-H \"CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}\")\n  ARCHON_HEADERS+=(-H \"CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}\")\nfi\n\nDUPLICATE_CHECK=\"clean\"\nRUNS_JSON=$(curl -fsS --max-time 15 \"${ARCHON_HEADERS[@]}\" \\\n  \"${API_BASE}/api/workflows/runs?limit=30\" 2>/dev/null || true)\nif [ -n \"$RUNS_JSON\" ]; then\n  API_DUP=$(printf '%s\\n' \"$RUNS_JSON\" | WO_ID=\"$WO_ID\" python3 -c \"\n  import json, os, sys\n  wo_id = os.environ.get('WO_ID', '')\n  try:\n      data = json.load(sys.stdin)\n  except Exception:\n      sys.exit(0)\n  runs = data if isinstance(data, list) else data.get('runs', [])\n  for run in runs:\n      status = str(run.get('status', '')).lower()\n      msg = str(run.get('initial_message', '') or run.get('message', ''))\n      if wo_id and wo_id in msg and status in {'running', 'pending', 'queued'}:\n          print(str(run.get('id', 'unknown')) + '|' + status)\n          break\n  \" 2>/dev/null || true)\n  if [ -n \"$API_DUP\" ]; then\n    DUPLICATE_CHECK=\"DUPLICATE_RUN_DETECTED: ${API_DUP}\"\n  fi\nelse\n  DUPLICATE_CHECK=\"UNVERIFIED(api-unreachable)\"\nfi\n\nif ! printf '%s\\n' \"$DUPLICATE_CHECK\" | grep -q 'DUPLICATE_RUN_DETECTED'; then\n  SAFE_SLUG=$(printf '%s\\n' \"$WO_ID\" | tr '[:upper:]' '[:lower:]' | sed 's/^wo-/bdc-/; s/[^a-z0-9._-]/-/g')\n  PR_DUP=$(gh pr list --repo \"$HARNESS_REPO\" --state open --search \"$WO_ID in:title,body\" --json number,headRefName,title \\\n    --jq '.[] | select((.headRefName | contains(\"'\"$SAFE_SLUG\"'\")) or (.title | contains(\"'\"$WO_ID\"'\"))) | \"#\"+(.number|tostring)+\"|\"+.headRefName' 2>/dev/null | head -n 1 || true)\n  BRANCH_DUP=\"\"\n  for BRANCH_NAME in $(gh api \"repos/${HARNESS_REPO}/branches\" --paginate --jq '.[].name' 2>/dev/null | grep -F \"$SAFE_SLUG\" || true); do\n    BRANCH_DATE=$(gh api \"repos/${HARNESS_REPO}/commits/${BRANCH_NAME}\" --jq .commit.committer.date 2>/dev/null || echo \"\")\n    if [ -n \"$BRANCH_DATE\" ] && BRANCH_DATE=\"$BRANCH_DATE\" python3 -c \"import datetime, os, sys; d=datetime.datetime.fromisoformat(os.environ['BRANCH_DATE'].replace('Z','+00:00')); sys.exit(0 if datetime.datetime.now(datetime.timezone.utc)-d <= datetime.timedelta(days=7) else 1)\"; then\n      BRANCH_DUP=\"$BRANCH_NAME\"\n      break\n    fi\n  done\n  if [ -n \"$PR_DUP\" ]; then\n    DUPLICATE_CHECK=\"DUPLICATE_RUN_DETECTED: git-pr|${PR_DUP}\"\n  elif [ -n \"$BRANCH_DUP\" ]; then\n    DUPLICATE_CHECK=\"DUPLICATE_RUN_DETECTED: git-branch|${BRANCH_DUP}\"\n  elif printf '%s\\n' \"$DUPLICATE_CHECK\" | grep -q '^UNVERIFIED'; then\n    DUPLICATE_CHECK=\"${DUPLICATE_CHECK}; git-fallback-clean\"\n  fi\nfi\n\ncat <<PACKET\n=== PRE-FIRE PACKET ===\nWO_ID=${WO_ID}\nTARGET_REPO=${TARGET_REPO}\nTARGET_REPO_FULL=${TARGET_REPO_FULL}\nWO_SLUG=${WO_SLUG}\nYAML_FILENAME=${YAML_FILENAME}\nRULE20_STAGING_GATE=${RULE20_STAGING_GATE}\nWO_CLASS=${WO_CLASS}\nBUSINESS_RISK_INVARIANT=${BUSINESS_RISK_INVARIANT}\nADV_PASS=${ADV_PASS}\nRISK=${RISK}\nDUPLICATE_CHECK=${DUPLICATE_CHECK}\n\nWhat approval authorizes (two side effects):\n  1. Register ${YAML_FILENAME} to .archon/workflows/defaults/ on bdc-harness dev,\n     hot-reload it with PUT /api/workflows/${WO_SLUG}, then verify GET /api/workflows\n  2. POST /api/conversations to fire ${WO_SLUG} against ${TARGET_REPO_FULL}\n\nAdversarial review summary:\n${ADV_OUT}\nPACKET\n\necho \"\"\necho \"If ADV_PASS=false, the approval-gate message will show \\\"ADV_PASS=false - type 'override adv' to proceed anyway.\\\"\"\n"},{id: approval-gate,depends_on: [prefire-plan],approval: {message: "Review the pre-fire packet above.\n\nTwo side effects will be authorized:\n  1. Persist the child YAML to bdc-harness dev, then hot-reload it with PUT /api/workflows/:name\n  2. Fire the child workflow against the target codebase via POST /api/conversations\n\nIf ADV_PASS=false is shown in the packet, type \"override adv\" to proceed anyway.\nIf DUPLICATE_RUN_DETECTED is shown, type \"fire anyway\" to override.\n\n- \"approved\" / \"proceed\" / \"yes\" / \"fire\" -> proceed\n- \"no\" / \"reject\" / \"stop\" -> halt (child YAML is still on disk, register/fire skipped)\n",capture_response: true,on_reject: {prompt: "The operator rejected the pre-fire packet. Summarize what was rejected and\nwhat would need to change before re-submitting. Do not re-fire automatically.\nOutput: OPERATOR_REJECTED: <reason from approval response>\n",max_attempts: 2}}},{id: register-yaml,load_bearing: true,depends_on: [approval-gate],bash: "set -euo pipefail\nPREFIRE=$prefire-plan.output\nAPPROVAL=$approval-gate.output\n\nWO_ID=$(printf '%s\\n' \"$PREFIRE\" | sed -n 's/^WO_ID=//p' | head -n 1)\nWO_SLUG=$(printf '%s\\n' \"$PREFIRE\" | sed -n 's/^WO_SLUG=//p' | head -n 1)\nYAML_FILENAME=$(printf '%s\\n' \"$PREFIRE\" | sed -n 's/^YAML_FILENAME=//p' | head -n 1)\nTARGET_REPO_FULL=$(printf '%s\\n' \"$PREFIRE\" | sed -n 's/^TARGET_REPO_FULL=//p' | head -n 1)\nADV_PASS=$(printf '%s\\n' \"$PREFIRE\" | sed -n 's/^ADV_PASS=//p' | head -n 1)\n\n# Guard: approval required\nif ! printf '%s\\n' \"$APPROVAL\" | grep -iqE 'approved|proceed|^yes|fire'; then\n  echo \"register-yaml: approval not granted (got: $APPROVAL) - halting\" >&2\n  exit 1\nfi\n\n# Guard: ADV_PASS check (bypass only if operator typed \"override adv\")\nif [ \"$ADV_PASS\" != \"true\" ]; then\n  if ! printf '%s\\n' \"$APPROVAL\" | grep -iq 'override adv'; then\n    echo \"ERROR: ADV_PASS=false and operator did not type 'override adv' - halting\" >&2\n    exit 1\n  fi\n  echo \"WARN: adversarial review failed but operator overrode with 'override adv'\"\nfi\n\n# Guard: duplicate run override\nDUP_LINE=$(printf '%s\\n' \"$PREFIRE\" | grep -E '^DUPLICATE_CHECK=' | head -n 1 || true)\nif printf '%s\\n' \"$DUP_LINE\" | grep -q 'DUPLICATE_RUN_DETECTED'; then\n  if ! printf '%s\\n' \"$APPROVAL\" | grep -iq 'fire anyway'; then\n    echo \"ERROR: DUPLICATE_RUN_DETECTED and operator did not type 'fire anyway' - halting\" >&2\n    exit 1\n  fi\n  echo \"WARN: operator overrode duplicate run detection with 'fire anyway'\"\nfi\n\nif [ -z \"$YAML_FILENAME\" ] || [ ! -f \"$YAML_FILENAME\" ]; then\n  echo \"ERROR: YAML draft file '$YAML_FILENAME' not found on disk\" >&2\n  exit 1\nfi\n\nDEST_PATH=\".archon/workflows/defaults/${WO_SLUG}.yaml\"\nYAML_CONTENT=$(base64 < \"$YAML_FILENAME\" | tr -d '\\n')\nCOMMIT_MSG=\"feat(on-ramp): register ${WO_SLUG} child workflow via bdc-harness-wo-onramp\"\nHARNESS_REPO=\"bluedevilcollectibles/bdc-harness\"\nAPI_BASE=\"${ARCHON_API_BASE:-https://archon.bluedevilcollectibles.com}\"\nARCHON_HEADERS=(-H \"x-archon-operator-token: ${ARCHON_OPERATOR_TOKEN}\")\nCF_ACCESS_ENABLED=false\nif [ -n \"${CF_ACCESS_CLIENT_ID:-}\" ] && [ -n \"${CF_ACCESS_CLIENT_SECRET:-}\" ]; then\n  ARCHON_HEADERS+=(-H \"CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}\")\n  ARCHON_HEADERS+=(-H \"CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}\")\n  CF_ACCESS_ENABLED=true\nfi\ncase \"$API_BASE\" in\n  http://localhost:*|http://127.0.0.1:*|http://archon-app:*|http://app:*) API_IS_LOCAL=true ;;\n  *) API_IS_LOCAL=false ;;\nesac\n\nrequire_hot_reload_auth() {\n  if [ \"$API_IS_LOCAL\" = \"true\" ] || [ \"$CF_ACCESS_ENABLED\" = \"true\" ]; then\n    return 0\n  fi\n  echo \"ERROR: hot-reload PUT requires CF Access service-token env vars from outside the container.\" >&2\n  echo \"Set CF_ACCESS_CLIENT_ID and CF_ACCESS_CLIENT_SECRET, or set ARCHON_API_BASE to a localhost/container URL reachable from this executor.\" >&2\n  exit 1\n}\nrequire_hot_reload_auth\n\necho \"=== register-yaml: Step 1 - GET /api/codebases to resolve default_cwd ===\"\nCODEBASES=$(curl -fsS --max-time 15 \\\n  \"${ARCHON_HEADERS[@]}\" \\\n  \"${API_BASE}/api/codebases\" 2>/dev/null || echo '{}')\nDEFAULT_CWD=$(printf '%s\\n' \"$CODEBASES\" \\\n  | python3 -c \"import sys,json; data=json.load(sys.stdin); cbs=data if isinstance(data,list) else data.get('codebases',[]); [print(cb.get('default_cwd',cb.get('cwd',''))) for cb in cbs if 'bdc-harness' in (cb.get('name','') or '') or (cb.get('name','') or '')==('bluedevilcollectibles/bdc-harness')]\" \\\n  2>/dev/null || echo \"\")\necho \"DEFAULT_CWD=${DEFAULT_CWD:-<not found>}\"\n\necho \"=== register-yaml: Step 2 - primary: gh api PUT /contents ===\"\n# Check for existing file SHA (needed for idempotent PUT)\nEXISTING_SHA=$(gh api \"repos/${HARNESS_REPO}/contents/${DEST_PATH}?ref=dev\" \\\n  --jq .sha 2>/dev/null || echo \"\")\n\nPUT_BODY=\"{\\\"message\\\":\\\"${COMMIT_MSG}\\\",\\\"content\\\":\\\"${YAML_CONTENT}\\\",\\\"branch\\\":\\\"dev\\\"}\"\nif [ -n \"$EXISTING_SHA\" ]; then\n  PUT_BODY=\"{\\\"message\\\":\\\"${COMMIT_MSG}\\\",\\\"content\\\":\\\"${YAML_CONTENT}\\\",\\\"sha\\\":\\\"${EXISTING_SHA}\\\",\\\"branch\\\":\\\"dev\\\"}\"\nfi\n\nPRIMARY_OK=false\nif gh api -X PUT \"repos/${HARNESS_REPO}/contents/${DEST_PATH}\" \\\n    --input - <<< \"$PUT_BODY\" --jq .commit.sha 2>/dev/null; then\n  PRIMARY_OK=true\n  echo \"Primary gh api PUT: OK\"\nfi\n\nif [ \"$PRIMARY_OK\" = \"false\" ]; then\n  echo \"=== register-yaml: Step 3 - fallback: branch -> PUT -> PR -> merge ===\"\n  FALLBACK_BRANCH=\"on-ramp/register-${WO_SLUG}-$(date +%Y%m%d%H%M%S)\"\n\n  # Create branch off dev\n  DEV_SHA=$(gh api \"repos/${HARNESS_REPO}/git/refs/heads/dev\" --jq .object.sha 2>/dev/null || echo \"\")\n  if [ -z \"$DEV_SHA\" ]; then\n    echo \"ERROR: cannot resolve dev branch SHA in ${HARNESS_REPO}\" >&2\n    exit 1\n  fi\n  gh api -X POST \"repos/${HARNESS_REPO}/git/refs\" \\\n    -f ref=\"refs/heads/${FALLBACK_BRANCH}\" \\\n    -f sha=\"$DEV_SHA\" 2>&1 || { echo \"ERROR: fallback branch creation failed\" >&2; exit 1; }\n\n  # PUT file on fallback branch\n  FALLBACK_BODY=\"{\\\"message\\\":\\\"${COMMIT_MSG}\\\",\\\"content\\\":\\\"${YAML_CONTENT}\\\",\\\"branch\\\":\\\"${FALLBACK_BRANCH}\\\"}\"\n  REGISTERED_SHA=$(gh api -X PUT \"repos/${HARNESS_REPO}/contents/${DEST_PATH}\" \\\n    --input - <<< \"$FALLBACK_BODY\" --jq .commit.sha 2>/dev/null || echo \"\")\n  if [ -z \"$REGISTERED_SHA\" ]; then\n    echo \"ERROR: fallback PUT /contents failed\" >&2\n    exit 1\n  fi\n\n  # Open PR and merge\n  PR_NUM=$(gh pr create --repo \"$HARNESS_REPO\" \\\n    --base dev --head \"$FALLBACK_BRANCH\" \\\n    --title \"$COMMIT_MSG\" \\\n    --body \"Auto-generated by bdc-harness-wo-onramp register-yaml fallback path. WO: ${WO_ID}\" \\\n    --json number --jq .number 2>/dev/null || echo \"\")\n  if [ -z \"$PR_NUM\" ]; then\n    echo \"ERROR: fallback PR create failed; deleting ${FALLBACK_BRANCH} to avoid a dangling branch\" >&2\n    gh api -X DELETE \"repos/${HARNESS_REPO}/git/refs/heads/${FALLBACK_BRANCH}\" >/dev/null 2>&1 || true\n    exit 1\n  fi\n\n  MERGE_OK=false\n  if gh pr merge \"$PR_NUM\" --repo \"$HARNESS_REPO\" --squash --delete-branch 2>/dev/null; then\n    MERGE_OK=true\n  elif gh api -X PUT \"repos/${HARNESS_REPO}/pulls/${PR_NUM}/merge\" \\\n      -f merge_method=squash >/dev/null 2>&1; then\n    MERGE_OK=true\n    gh api -X DELETE \"repos/${HARNESS_REPO}/git/refs/heads/${FALLBACK_BRANCH}\" >/dev/null 2>&1 || true\n  fi\n\n  if [ \"$MERGE_OK\" != \"true\" ]; then\n    echo \"ERROR: fallback PR #${PR_NUM} could not be squash-merged to dev; closing PR and deleting ${FALLBACK_BRANCH}\" >&2\n    gh pr close \"$PR_NUM\" --repo \"$HARNESS_REPO\" --delete-branch >/dev/null 2>&1 || true\n    gh api -X DELETE \"repos/${HARNESS_REPO}/git/refs/heads/${FALLBACK_BRANCH}\" >/dev/null 2>&1 || true\n    exit 1\n  fi\n\n  echo \"Fallback PR #${PR_NUM} squash-merged to dev and branch deleted\"\nfi\n\nDEV_FILE_SHA=$(gh api \"repos/${HARNESS_REPO}/contents/${DEST_PATH}?ref=dev\" --jq .sha 2>/dev/null || echo \"\")\nif [ -z \"$DEV_FILE_SHA\" ]; then\n  echo \"ERROR: ${DEST_PATH} is not present on dev after register commit path; refusing hot-reload\" >&2\n  exit 1\nfi\necho \"Dev branch contains ${DEST_PATH}: ${DEV_FILE_SHA}\"\n\necho \"=== register-yaml: Step 4 - PUT /api/workflows/<name> ===\"\nCWD_PARAM=\"\"\n[ -n \"$DEFAULT_CWD\" ] && CWD_PARAM=\"?cwd=$(DEFAULT_CWD=\"$DEFAULT_CWD\" python3 -c \"import os,urllib.parse; print(urllib.parse.quote(os.environ['DEFAULT_CWD'], safe=''))\")\"\n\nBODY_FILE=$(mktemp)\nif ! YAML_PATH=\"$YAML_FILENAME\" bun -e \"const fs=require('fs'); const data=Bun.YAML.parse(fs.readFileSync(process.env.YAML_PATH,'utf8')); process.stdout.write(JSON.stringify({definition:data}));\" > \"$BODY_FILE\" 2>/tmp/on-ramp-hot-register-bun.err; then\n  echo \"ERROR: failed to build hot-register PUT body from ${YAML_FILENAME}\" >&2\n  sed 's/^/    /' /tmp/on-ramp-hot-register-bun.err >&2 || true\n  rm -f \"$BODY_FILE\" /tmp/on-ramp-hot-register-bun.err\n  exit 1\nfi\nrm -f /tmp/on-ramp-hot-register-bun.err\n\nRESP_FILE=$(mktemp)\nset +e\nHTTP_CODE=$(curl -sS -o \"$RESP_FILE\" -w \"%{http_code}\" --max-time 30 \\\n  -X PUT \\\n  \"${ARCHON_HEADERS[@]}\" \\\n  -H \"Content-Type: application/json\" \\\n  --data-binary \"@${BODY_FILE}\" \\\n  \"${API_BASE}/api/workflows/${WO_SLUG}${CWD_PARAM}\" 2>/dev/null)\nCURL_EXIT=$?\nset -e\nrm -f \"$BODY_FILE\"\n\nif [ \"$CURL_EXIT\" -ne 0 ] || [ \"$HTTP_CODE\" -lt 200 ] || [ \"$HTTP_CODE\" -ge 300 ]; then\n  echo \"ERROR: hot-reload PUT /api/workflows/${WO_SLUG} failed with HTTP ${HTTP_CODE}\" >&2\n  sed 's/^/    /' \"$RESP_FILE\" >&2 || true\n  rm -f \"$RESP_FILE\"\n  exit 1\nfi\nrm -f \"$RESP_FILE\"\necho \"Hot-reload PUT accepted for ${WO_SLUG} (HTTP ${HTTP_CODE})\"\n\necho \"=== register-yaml: Step 5 - poll GET /api/workflows until registered (60s max) ===\"\nREGISTERED=false\nfor i in $(seq 1 12); do\n  FOUND=$(curl -fsS --max-time 10 \\\n    \"${ARCHON_HEADERS[@]}\" \\\n    \"${API_BASE}/api/workflows\" 2>/dev/null \\\n    | python3 -c \"import sys,json; data=json.load(sys.stdin); ws=data if isinstance(data,list) else data.get('workflows',[]); [print('found') for w in ws if (w.get('workflow',w)).get('name','')==('${WO_SLUG}')] \" \\\n    2>/dev/null || echo \"\")\n  if [ \"$FOUND\" = \"found\" ]; then\n    REGISTERED=true\n    echo \"Workflow ${WO_SLUG} registered after $((i*5))s\"\n    break\n  fi\n  echo \"Polling... attempt $i/12\"\n  sleep 5\ndone\n\nif [ \"$REGISTERED\" = \"false\" ]; then\n  echo \"ERROR: ${WO_SLUG} did not appear in /api/workflows after 60s\" >&2\n  echo \"The YAML is on dev and the hot-reload PUT returned success, but GET /api/workflows did not show it.\" >&2\n  echo \"Investigate loader validation errors before firing the child workflow.\" >&2\n  exit 1\nfi\n\n# Resolve registered SHA\nREGISTERED_SHA=$(gh api \"repos/${HARNESS_REPO}/contents/${DEST_PATH}?ref=dev\" \\\n  --jq .sha 2>/dev/null || echo \"unknown\")\n\necho \"REGISTERED_OK=true\"\necho \"REGISTERED_SHA=${REGISTERED_SHA}\"\necho \"WO_ID=${WO_ID}\"\necho \"TARGET_REPO_FULL=${TARGET_REPO_FULL}\"\necho \"WO_SLUG=${WO_SLUG}\"\necho \"DEFAULT_CWD=${DEFAULT_CWD:-unknown}\"\necho \"DEST_PATH=${DEST_PATH}\"\n"},{id: fire-child,load_bearing: true,depends_on: [register-yaml],bash: "set -euo pipefail\nREG_OUT=$register-yaml.output\nAPPROVAL=$approval-gate.output\n\n# Re-check approval in case trigger_rule brings us here unexpectedly\nif ! printf '%s\\n' \"$APPROVAL\" | grep -iqE 'approved|proceed|^yes|fire'; then\n  echo \"fire-child: approval not granted - skipping fire\" >&2\n  exit 1\nfi\n\nWO_ID=$(printf '%s\\n' \"$REG_OUT\" | sed -n 's/^WO_ID=//p' | head -n 1)\nWO_SLUG=$(printf '%s\\n' \"$REG_OUT\" | sed -n 's/^WO_SLUG=//p' | head -n 1)\nTARGET_REPO_FULL=$(printf '%s\\n' \"$REG_OUT\" | sed -n 's/^TARGET_REPO_FULL=//p' | head -n 1)\nTARGET_REPO=$(printf '%s\\n' \"$TARGET_REPO_FULL\" | sed 's|bluedevilcollectibles/||')\n\nif [ -z \"$WO_SLUG\" ] || [ -z \"$TARGET_REPO_FULL\" ]; then\n  echo \"ERROR: WO_SLUG or TARGET_REPO_FULL missing from register-yaml output\" >&2\n  exit 1\nfi\n\nREGISTERED_OK=$(printf '%s\\n' \"$REG_OUT\" | sed -n 's/^REGISTERED_OK=//p' | head -n 1)\nif [ \"$REGISTERED_OK\" != \"true\" ]; then\n  echo \"ERROR: register-yaml did not emit REGISTERED_OK=true - aborting fire\" >&2\n  exit 1\nfi\n\nFIRE_MESSAGE=\"Execute ${WO_ID} --project ${TARGET_REPO}\"\necho \"Firing: workflowName=${WO_SLUG} message='${FIRE_MESSAGE}' repo=${TARGET_REPO_FULL}\"\n\nRESPONSE=$(curl -fsS -X POST \\\n  \"https://archon.bluedevilcollectibles.com/api/conversations\" \\\n  -H \"Content-Type: application/json\" \\\n  -H \"x-archon-operator-token: ${ARCHON_OPERATOR_TOKEN}\" \\\n  --max-time 30 \\\n  -d \"{\n    \\\"workflowName\\\": \\\"${WO_SLUG}\\\",\n    \\\"message\\\": \\\"${FIRE_MESSAGE}\\\",\n    \\\"inputs\\\": {\\\"WO_ID\\\": \\\"${WO_ID}\\\"}\n  }\" 2>&1)\n\nRUN_ID=$(printf '%s\\n' \"$RESPONSE\" \\\n  | python3 -c \"import sys, json; d=json.load(sys.stdin); print(d.get('id') or d.get('conversation_id') or d.get('run_id') or 'unknown')\" \\\n  2>/dev/null || echo \"parse_failed\")\n\nif [ \"$RUN_ID\" = \"parse_failed\" ] || [ \"$RUN_ID\" = \"unknown\" ]; then\n  echo \"WARN: could not parse run ID from response: $RESPONSE\" >&2\nfi\n\necho \"FIRE_OK=true\"\necho \"RUN_ID=${RUN_ID}\"\necho \"WO_ID=${WO_ID}\"\necho \"WO_SLUG=${WO_SLUG}\"\necho \"TARGET_REPO=${TARGET_REPO}\"\necho \"TARGET_REPO_FULL=${TARGET_REPO_FULL}\"\necho \"FIRE_RESPONSE=${RESPONSE}\"\n"},{id: verify-binding,load_bearing: true,depends_on: [fire-child],bash: "set -euo pipefail\nFIRE_OUT=$fire-child.output\n\nRUN_ID=$(printf '%s\\n' \"$FIRE_OUT\" | sed -n 's/^RUN_ID=//p' | head -n 1)\nWO_ID=$(printf '%s\\n' \"$FIRE_OUT\" | sed -n 's/^WO_ID=//p' | head -n 1)\nWO_SLUG=$(printf '%s\\n' \"$FIRE_OUT\" | sed -n 's/^WO_SLUG=//p' | head -n 1)\nEXPECTED_REPO=$(printf '%s\\n' \"$FIRE_OUT\" | sed -n 's/^TARGET_REPO_FULL=//p' | head -n 1)\n\necho \"=== verify-binding: polling for run (RUN_ID=${RUN_ID}) up to 90s ===\"\n\nBINDING_OK=false\nBOUND_REPO=\"\"\n\nfor i in $(seq 1 18); do\n  RUNS_JSON=$(curl -fsS --max-time 15 \\\n    \"https://archon.bluedevilcollectibles.com/api/workflows/runs?limit=50\" \\\n    -H \"x-archon-operator-token: ${ARCHON_OPERATOR_TOKEN}\" 2>/dev/null || echo '{}')\n\n  MATCH=$(printf '%s\\n' \"$RUNS_JSON\" \\\n    | RUN_ID=\"${RUN_ID}\" WO_ID=\"${WO_ID}\" WO_SLUG=\"${WO_SLUG}\" python3 -c \"\n    import sys,json,os\n    data=json.load(sys.stdin)\n    runs=data if isinstance(data,list) else data.get('runs',[])\n    run_id=os.environ.get('RUN_ID',''); wo_id=os.environ.get('WO_ID',''); wo_slug=os.environ.get('WO_SLUG','')\n    next((print(str(r.get('codebase','') or r.get('repo','') or r.get('repository','') or '')+'|'+r.get('status','unknown')) for r in runs if str(r.get('id',''))==run_id or wo_id in (r.get('initial_message','') or r.get('message','') or '') or wo_slug in (r.get('workflow_name','') or r.get('workflowName',''))), None)\n    \" 2>/dev/null || echo \"\")\n\n  if [ -n \"$MATCH\" ]; then\n    BOUND_REPO=$(printf '%s\\n' \"$MATCH\" | cut -d'|' -f1)\n    RUN_STATUS=$(printf '%s\\n' \"$MATCH\" | cut -d'|' -f2)\n    echo \"Run found: bound_repo=${BOUND_REPO} status=${RUN_STATUS}\"\n\n    # Normalize repo: add org prefix if missing\n    BOUND_NORMALIZED=\"$BOUND_REPO\"\n    if ! printf '%s\\n' \"$BOUND_REPO\" | grep -q '/'; then\n      BOUND_NORMALIZED=\"bluedevilcollectibles/${BOUND_REPO}\"\n    fi\n\n    if [ \"$BOUND_NORMALIZED\" = \"$EXPECTED_REPO\" ]; then\n      BINDING_OK=true\n      echo \"Binding verified: $BOUND_NORMALIZED == $EXPECTED_REPO\"\n      break\n    else\n      echo \"ERROR: binding mismatch - bound to ${BOUND_NORMALIZED}, expected ${EXPECTED_REPO}\" >&2\n      echo \"Cancel guidance: curl -X DELETE https://archon.bluedevilcollectibles.com/api/workflows/runs/${RUN_ID}\" >&2\n      echo \"BINDING_OK=false\"\n      echo \"BOUND_REPO=${BOUND_NORMALIZED}\"\n      echo \"EXPECTED_REPO=${EXPECTED_REPO}\"\n      echo \"RUN_ID=${RUN_ID}\"\n      exit 1\n    fi\n  fi\n\n  echo \"Polling... attempt $i/18 (5s)\"\n  sleep 5\ndone\n\nif [ \"$BINDING_OK\" = \"false\" ]; then\n  echo \"ERROR: run not found in /api/workflows/runs after 90s (RUN_ID=${RUN_ID} WO_ID=${WO_ID})\" >&2\n  echo \"Possible causes: API endpoint mismatch, run not started, codebase not selected.\" >&2\n  exit 1\nfi\n\necho \"BINDING_OK=true\"\necho \"BOUND_REPO=${BOUND_REPO}\"\necho \"EXPECTED_REPO=${EXPECTED_REPO}\"\necho \"RUN_ID=${RUN_ID}\"\necho \"WO_ID=${WO_ID}\"\n"},{id: build-manifest,agent: major-build,trigger_rule: all_done,depends_on: [verify-binding],prompt: "Build the Captain CI v2 completion manifest for WO-CAULDRON-ONRAMP-ATOM-01\n(the on-ramp's own Work Order - NOT the child product WO).\n\n## Inputs\nNormalize-spec: $normalize-spec.output\nyaml-author: $yaml-author.output\nassert-yaml-ready: $assert-yaml-ready.output\nAdversarial-review: $adversarial-review.output\nPrefire-plan: $prefire-plan.output\nApproval-gate: $approval-gate.output\nRegister-yaml: $register-yaml.output\nFire-child: $fire-child.output\nVerify-binding: $verify-binding.output\n\n## Required v2 Manifest Format\n\n```\nWO: WO-CAULDRON-ONRAMP-ATOM-01\nBuilder: Major Build (bdc-harness-wo-onramp)\nFiles modified: (none - on-ramp is orchestration only)\nFiles created: .archon/workflows/defaults/<WO_SLUG>.yaml (bdc-harness repo)\nTests: N/A - adversarial-review 8-criteria gate IS the test (scores surfaced below)\nPRs: (register-yaml commits directly to bdc-harness dev; no PR for YAML registration)\nMerge ancestors: (bdc-harness dev HEAD after register-yaml PUT; child product WO PR TBD by child run)\nGrep assertions:\n  bdc-harness: gh api repos/bluedevilcollectibles/bdc-harness/contents/.archon/workflows/defaults/<WO_SLUG>.yaml?ref=dev --jq .size -> > 0\n  bdc-harness: grep -c \"^model:[ ]sonnet$\" .archon/workflows/defaults/<WO_SLUG>.yaml -> 1\n  bdc-harness: grep -c \"^policyFile:\" .archon/workflows/defaults/<WO_SLUG>.yaml -> 1\n  bdc-harness: grep -c \"id: business-risk-gate\" .archon/workflows/defaults/<WO_SLUG>.yaml -> 1\n  bdc-harness: grep -c \"id: flip-notion\" .archon/workflows/defaults/<WO_SLUG>.yaml -> 1\nRuntime verification:\n  Archon API: curl -s https://archon.bluedevilcollectibles.com/api/workflows | python3 -c \"import sys,json; ws=[w for w in json.load(sys.stdin).get('workflows',[]) if (w.get('workflow',w)).get('name')=='<WO_SLUG>']; print('FOUND' if ws else 'MISSING')\" -> FOUND\n  Fire: RUN_ID=<from fire-child> BINDING_OK=<from verify-binding> BOUND_REPO=<from verify-binding>\nVercel deployment: N/A (no Vercel-deployed repo touched)\nAdversarial review scores:\n<paste full SCORES block from adversarial-review>\nADV_PASS=<from adversarial-review>\nVALIDATION: PASS\n```\n\nSubstitute all <placeholders> with real values from the node outputs above.\nIf BINDING_OK=false or REGISTERED_OK != true, change VALIDATION to BLOCKED with reason.\n"},{id: flip-notion,agent: xo,depends_on: [build-manifest],when: "$verify-binding.output =~ 'BINDING_OK=true'",prompt: "## GUARD: Only flip if run succeeded end-to-end\nCheck build-manifest output for VALIDATION: PASS.\nIf VALIDATION: BLOCKED or FAIL -> output XO_TODO: do not flip WO-CAULDRON-ONRAMP-ATOM-01 and stop.\n\nFlip the on-ramp's OWN Work Order (WO-CAULDRON-ONRAMP-ATOM-01) to REVIEW\nin Notion. Do NOT touch the child product WO - the child run's own flip-notion\nnode will handle that at the end of its execution.\n\n## Required Notion changes for WO-CAULDRON-ONRAMP-ATOM-01\n- Claude Status -> REVIEW\n- Status -> Review\n- Notes -> paste the manifest from build-manifest output verbatim\n- claimed_by: Major Build (bdc-harness-wo-onramp)\n- claimed_at: today's date (2026-05-29)\n\n## Manifest\n$build-manifest.output\n\n## Procedure\n1. Search Notion DB ${INPUT_NOTION_DB_ID} for page with WO ID = WO-CAULDRON-ONRAMP-ATOM-01.\n2. If found: use notion-update-page to set Claude Status=REVIEW, Status=Review,\n   and append the manifest to the Notes property.\n3. If Notion MCP is unavailable or search returns no result, output:\n   XO_TODO: Flip WO-CAULDRON-ONRAMP-ATOM-01 to REVIEW; paste the manifest from\n   build-manifest output into Notes. DB: ${INPUT_NOTION_DB_ID}.\n"}]}