{name: bdc-feature-development-codex,description: "Codex-implement variant of bdc-feature-development. Identical DAG; implement +\ndiff-repair use Codex gpt-5.5 instead of Claude. Fire when Claude usage is capped.\nAll other nodes (plan, review, validator, manifest, notion) are unchanged.\n",policyFile: harness/policies/agent-behavior.md,provider: codex,model: gpt-5.5,nodes: [{id: preflight-github-auth,persona: major-build,load_bearing: true,bash: "set -euo pipefail\nif ! git push --dry-run origin \"HEAD:refs/heads/preflight-auth-probe-$(date +%s)\" 2>&1; then\n  echo \"ERROR: GITHUB auth check failed -- container cannot push to origin.\" >&2\n  echo \"Likely cause: GITHUB_TOKEN missing in executor env, or token lacks repo scope.\" >&2\n  exit 1\nfi\necho \"preflight-github-auth PASS\"\n"},{id: read-spec,persona: xo,depends_on: [preflight-github-auth],bash: "set -euo pipefail\nWO_ID=\"${WO_ID:-}\"\nif [ -z \"$WO_ID\" ]; then\n  WO_ID=$(printf '%s\\n' \"$USER_MESSAGE\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)\nfi\nif [ -z \"$WO_ID\" ]; then\n  echo \"WO_ID missing. Provide WO_ID in environment or user message.\" >&2\n  exit 1\nfi\n# Specs live in bdc-xo (NOT the target codebase). Cross-repo fetch via gh api.\n# Per YAML Recipe v1 Section 4 / Rule 5: try docs/work-orders/ then docs/superpowers/specs/ glob.\nSPEC_PATH=\"docs/work-orders/${WO_ID}.md\"\nSPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nif [ -z \"$SPEC_CONTENT\" ]; then\n  # Fallback 1: docs/superpowers/specs/${WO_ID}.md direct\n  SPEC_PATH=\"docs/superpowers/specs/${WO_ID}.md\"\n  SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  # Fallback 2: date-prefix glob in docs/superpowers/specs/\n  MATCH=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main\" --template '{{range .}}{{.path}}{{\"\\n\"}}{{end}}' 2>/dev/null | grep \"${WO_ID}.md$\" | head -n 1)\n  if [ -n \"$MATCH\" ]; then\n    SPEC_PATH=\"$MATCH\"\n    SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' | tr -d '\\n' | base64 -d || true)\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  # Fallback 4: GitHub issue body (WO-HARNESS-READ-SPEC-ISSUE-BODY-FALLBACK-01)\n  ISSUE_NUM=$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'issue=[0-9]+' | head -n 1 | cut -d= -f2 || true)\n  if [ -z \"$ISSUE_NUM\" ]; then\n    ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \\\n      --search \"${WO_ID} in:title\" --json number,title \\\n      --jq '.[0].number' 2>/dev/null || true)\n  fi\n  if [ -n \"$ISSUE_NUM\" ] && [ \"$ISSUE_NUM\" != \"null\" ]; then\n    SPEC_CONTENT=$(gh issue view \"$ISSUE_NUM\" --repo bluedevilcollectibles/bdc-xo \\\n      --json body --jq .body 2>/dev/null || true)\n    [ -n \"$SPEC_CONTENT\" ] && SPEC_PATH=\"issues/${ISSUE_NUM}\"\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then echo \"Spec not found (tried docs/work-orders/, docs/superpowers/specs/ direct, date-prefix glob, and GitHub issue search)\" >&2; exit 1; fi\n# Fix-A (2026-05-30, Codex FINDING_1): capture an IMMUTABLE run-start base SHA of the\n# assigned worktree BEFORE any node mutates/commits/pushes. assert-implement-produced-work\n# compares HEAD against THIS, so a real build that checkpoint-push already committed+pushed\n# is still detected as REAL_BUILD (post-push CHANGED/AHEAD are 0 and would misread otherwise).\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nRUN_START_SHA=$(git -C \"$WT\" rev-parse HEAD 2>/dev/null || echo unknown)\nmkdir -p \"$ARTIFACTS_DIR\" 2>/dev/null || true\nprintf '%s\\n' \"$RUN_START_SHA\" > \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || true\nprintf 'WO_ID=%s\\nSPEC_PATH=bdc-xo:%s\\nRUN_START_SHA=%s\\n\\n' \"$WO_ID\" \"$SPEC_PATH\" \"$RUN_START_SHA\"\nprintf '%s\\n' \"$SPEC_CONTENT\"\n"},{id: check-already-satisfied,persona: war-council-architect,agent: war-council-architect,provider: claude,model: sonnet,depends_on: [read-spec],task_class: clerical,prompt: "You decide ONE thing: are this WO's deliverables ALREADY fully present in the\nCURRENT worktree's HEAD, such that a build would produce no changes? You are\nREAD-ONLY. Judge ONLY against this worktree (you are cd'd into it; use plain git\nand Read/Grep/Glob on local files). Do NOT consult origin/main or other worktrees.\n\n## Spec\n$read-spec.output\n\n## How to decide\n- Extract the spec's Stop Point / verification commands / grep assertions / named\n  deliverable files.\n- Check whether those deliverables ALREADY exist and satisfy the assertions IN THIS\n  worktree (the files exist with the required content; grep assertions already pass).\n- This is a HIGH BAR. Only conclude already-satisfied if you are confident a fresh\n  implementation would change nothing. ANY doubt -> proceed (false).\n\n## Output (exactly one of these on its own last line)\n- If every deliverable is already present and satisfied in this worktree:\n    ALREADY_SATISFIED=true\n  followed by: SATISFIED_EVIDENCE=<one line naming the deliverables + how verified>\n- Otherwise (work is needed, OR you cannot confirm with high confidence):\n    ALREADY_SATISFIED=false\nDefault to false. Skipping a build that was actually needed is far worse than\nrunning a redundant build that the downstream no-op guard will catch.\n"},{id: gate-already-satisfied,depends_on: [check-already-satisfied],bash: "set -uo pipefail\nCAS=$check-already-satisfied.output\nif printf '%s\\n' \"$CAS\" | grep -qE '^ALREADY_SATISFIED=true'; then\n  echo \"ALREADY_SATISFIED=true\"\n  echo \"PRECHECK_VERDICT=already-satisfied\"\n  printf '%s\\n' \"$CAS\" | grep '^SATISFIED_EVIDENCE=' | head -1 || true\n  echo \"Note: WO appears already implemented in this worktree; the build chain will\"\n  echo \"produce no diff and the run will resolve as a verified no-op (not a failure).\"\nelse\n  echo \"ALREADY_SATISFIED=false\"\n  echo \"PRECHECK_VERDICT=needs-build\"\nfi\nexit 0\n"},{id: plan,persona: war-council-architect,depends_on: [gate-already-satisfied],agent: war-council-architect,task_class: medium_work,prompt: "Read the BDC Work Order spec below and produce a concise implementation plan.\n\n## Idempotency note\nPre-check verdict (from gate-already-satisfied): $gate-already-satisfied.output\nIf PRECHECK_VERDICT=already-satisfied, the deliverables already exist in this\nworktree. Produce a minimal plan that VERIFIES the existing state rather than\nre-creating it; implement will correctly make no changes and emit ALREADY_SATISFIED.\n\n## Required Output\nReturn structured Markdown with these headings:\n- WO ID\n- Files to modify\n- Files to create\n- Files explicitly out of scope\n- Verification commands\n- Commit message\n- Push policy\n- Staging gate required\n\n## BDC Push Policy\nHardcoded Rule 20 staging-gate repos:\n- bluedevilcollectibles/lspro-react\n- bluedevilcollectibles/shopops-storefront\n- bluedevilcollectibles/shopops\n\nFor those repos, use a feature branch plus PR and require the staging gate.\nFor bdc-xo non-doctrine code and any other repo, use feature branch plus PR without staging gate.\nDoc-only and doctrine-only WOs are out of scope for this workflow.\n\n## Spec\n$read-spec.output\n"},{id: plan-review,persona: war-council-architect,agent: war-council-architect,depends_on: [plan],task_class: medium_work,loop: {fresh_context: true,until: PLAN_REVIEW_APPROVED,max_iterations: 3,prompt: "You are the War Council Architect doing an adversarial self-review of the\nimplementation plan, then REVISING it in place. Iteration-driven self-repair:\none initial pass + up to 2 repair attempts. You are READ-ONLY (no file writes,\nno shell) -- everything you produce goes to STDOUT.\n\n## Prior iteration (read FIRST)\nYour previous iteration's full output (empty on the first pass):\n$LOOP_PREV_OUTPUT\nIf it contains findings (PLAN_REVIEW=needs_revision), you MUST resolve every one\nin the revised plan this iteration. If a finding repeats and you cannot resolve\nit, escalate (below) instead of looping again.\n\n## Inputs\nOriginal plan: $plan.output\nSpec: $read-spec.output\n\n## Attack the plan on these dimensions\n1. Scope creep -- any file not justified by the spec.\n2. Missing files -- in-scope work the plan omits.\n3. Unsafe assumptions -- \"assume X exists\" without verification.\n4. Rule 20 staging gate -- if target repo is lspro-react / shopops-storefront /\n   shopops, plan MUST require --base staging. If not those, must NOT.\n5. Out-of-scope list present and correct.\n\n## Self-repair (the point -- do not just report)\nIf you find issues AND they are plan-level fixable, REVISE the plan to resolve\nthem and emit the corrected plan in full. Do not halt for a human on anything\nyou can fix here.\n\n## Required STDOUT format (this is the only handoff -- emit EXACTLY this shape)\nThe blocks are fenced so downstream nodes consume ONLY the approved plan, never\nyour critique. Emit, in this order:\n\n  PLAN_REVIEW_PASS=<true|false>\n  PLAN_REVIEW_RISK=<LOW|MEDIUM|HIGH>\n\n  === APPROVED_PLAN_BEGIN ===\n  <the FINAL revised plan in full -- this and ONLY this is what implement uses>\n  === APPROVED_PLAN_END ===\n\n  === PLAN_REVIEW_FINDINGS_BEGIN ===\n  <your findings / what you changed and why, or \"(none)\">\n  === PLAN_REVIEW_FINDINGS_END ===\n\nThe APPROVED_PLAN block must always contain a complete, usable plan (even on a\npassing first iteration where you changed nothing -- echo the original plan there).\nKeep ALL critique inside the FINDINGS block; never let critique leak into the\nAPPROVED_PLAN block.\n\n## Completion sentinel (success ONLY)\nIf and ONLY if PLAN_REVIEW_PASS=true (scope contained, no in-scope file missing,\nRule 20 gate correct), emit on its OWN LINE as the LAST line:\n  PLAN_REVIEW_APPROVED\nOn a failing iteration emit instead (never the approved token):\n  PLAN_REVIEW_NEEDS_REVISION\nEmitting PLAN_REVIEW_APPROVED is the gate that lets the run proceed to implement,\nso emit it ONLY when PLAN_REVIEW_PASS=true.\n\n## Escalation (emit instead of approving; do NOT emit the approved sentinel)\nIf the spec is ambiguous/contradictory, the fix needs a new side-effect class or\nungranted scope, or the same finding survived a prior attempt and you cannot\nresolve it -- set PLAN_REVIEW_PASS=false, emit PLAN_REVIEW_NEEDS_REVISION, and put\nthis block inside the FINDINGS block:\n  ESCALATION_REQUIRED=true\n  ESCALATION_REASON=<ambiguous-spec|new-side-effect-class|loop-exhausted>\n  WO_ID=<id>\n  NODE=plan-review\n  ATTEMPTS=<n>/3\n  WHAT_FAILED=<one paragraph>\n  WHAT_WAS_TRIED=<3-6 bullets>\n  LAST_REVIEW_FINDINGS=<exact bullets>\n  SINGLE_DECISION_NEEDED=<one sentence John can answer>\n  SAFE_STATE=<nothing committed/pushed; plan stage only>\n"}},{id: implement,provider: codex,model: gpt-5.5,depends_on: [plan-review],task_class: medium_work,loop: {prompt: "Implement the approved plan for this BDC feature Work Order.\n\n## Spec\n$read-spec.output\n\n## Plan (approved by plan-review)\nUse ONLY the text between the === APPROVED_PLAN_BEGIN === and\n=== APPROVED_PLAN_END === markers below as the plan. IGNORE everything outside\nthose markers (verdict headers, the PLAN_REVIEW_FINDINGS block, sentinels) --\nthat is reviewer metadata, not the plan.\n$plan-review.output\n\n## WORKTREE PINNING (Fix A, 2026-05-30 -- anchor run 04daeafc)\nYou run inside ONE assigned git worktree. ALL of your work and ALL of your\ncompletion judgments MUST happen inside it. Resolve it first:\n  WT=$(git rev-parse --show-toplevel)\nThen:\n- Make EVERY git/grep/diff/log call relative to THIS worktree (you are already\n  cd'd into it; use plain `git ...`, or `git -C \"$WT\" ...`).\n- You MUST NOT read, grep, `git -C`, or judge \"already done\" against any OTHER\n  location: not the shared `source/` checkout, not `origin/main`, not another\n  thread's worktree (e.g. `.../worktrees/archon/thread-<other>`). Whether the WO\n  is satisfied is decided ONLY by the state of THIS worktree's HEAD + working tree.\n- If you believe the WO is already implemented, that conclusion is only valid if\n  it is true IN THIS WORKTREE. If the work exists only on origin/main or another\n  thread, it is NOT present here -- treat the WO as needing implementation here,\n  OR emit `ALREADY_SATISFIED` (see Completion) only after confirming the\n  deliverables are reachable from THIS worktree's HEAD.\nAnchor: run 04daeafc judged \"already done\" against a sibling worktree + origin/main,\nmade an empty verify-only commit on the wrong thread, and emitted a fraudulent\nCOMPLETE. The review pipeline inspected THIS worktree (correctly empty) and blocked.\n\n## Execution Rules\n- Modify only the files identified as in scope by the spec.\n- Prefer existing repo patterns and helpers.\n- Do not reformat unrelated code.\n- Do not deploy.\n- Do not bypass approval gates.\n- Do NOT use `git commit --allow-empty` or any empty/verify-only commit to\n  simulate completion. A commit must contain real, in-scope file changes.\n- Stop and report a blocker if the spec is ambiguous or a needed source of truth is missing.\n\n## Commit-and-push BEFORE exit (Patch 2, 2026-05-16)\nWhen your implementation is complete, BEFORE emitting the sentinel below, run:\n\n```bash\nBRANCH=$(git rev-parse --abbrev-ref HEAD)\n# Re-derive WO_ID locally (don't interpolate spec output - quote-safety)\nWO_ID=\"${WO_ID:-$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)}\"\ngit add -A\ngit diff --cached --quiet || git commit -m \"feat: implement ${WO_ID}\n\nImplementation per WO spec. Self-verified within implement loop.\nWorkflow-time verify-* removed 2026-05-16 (Patch 1); PR-time gates handle validation.\n\nCo-Authored-By: Claude (Cauldron major-build) <noreply@anthropic.com>\"\ngit push -u origin \"$BRANCH\" 2>&1 || echo \"WARN: push failed - operator must recover from worktree\"\n```\n\nWhy: workflow-time verify-* gates were removed (Patch 1). Even with them gone, if any\ndownstream node fails (sentinel mismatch, war-council-validator timeout, etc.), the\ntraditional commit-and-push node may be skipped. Committing + pushing HERE makes your\nwork durable regardless of what happens after this iteration ends.\n\nWorst case: the downstream commit-and-push node runs and is a no-op because HEAD is\nalready pushed. Best case: your work is on origin even if everything else fails.\n\n## Completion Criteria + Sentinel Emission (Patch 3, 2026-05-16; Fix A 2026-05-30)\nBefore emitting any completion sentinel, run this self-check IN THIS WORKTREE:\n  WT=$(git rev-parse --show-toplevel)\n  CHANGED=$(git -C \"$WT\" status --porcelain | wc -l)\n  AHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null \\\n          || git -C \"$WT\" rev-list --count HEAD --not --remotes 2>/dev/null || echo 0)\nThen choose EXACTLY ONE ending:\n\n1. REAL BUILD (you made in-scope changes): only if CHANGED>0 OR AHEAD>0 with real\n   file changes. Emit, each on its own line:\n     COMPLETE\n     BUILD_COMPLETE\n     <promise>COMPLETE</promise>\n\n2. ALREADY SATISFIED (the WO's deliverables are ALREADY reachable from THIS\n   worktree's HEAD and you correctly made no changes): emit BOTH lines, each on\n   its own line:\n     ALREADY_SATISFIED: <one sentence: which deliverables already exist in this worktree HEAD>\n     COMPLETE\n   The COMPLETE line is REQUIRED here ONLY to let the until:COMPLETE loop exit -- do\n   NOT also emit BUILD_COMPLETE or <promise>COMPLETE</promise>, and do NOT make an\n   empty commit. assert-implement-produced-work re-checks the worktree: because it\n   is genuinely clean, it reclassifies this to ALREADY_SATISFIED (a verified no-op,\n   NOT a fraudulent build). This is the SINGLE no-op completion contract -- see also\n   the \"Loop exit\" section below, which says the same thing.\n\n3. TRUE BLOCKER (spec ambiguous / missing source of truth / cannot proceed):\n     BLOCKED: <one-sentence reason>\n\nANTI-FRAUD RULE: you may emit the case-1 BUILD sentinels (BUILD_COMPLETE +\n<promise>COMPLETE</promise>) ONLY if you made real in-scope edits (CHANGED>0 OR\nAHEAD>0). If you did no work because it was already done, that is case 2\n(ALREADY_SATISFIED: + a bare COMPLETE to exit the loop), NOT case 1 -- do not claim\na build you did not do. The downstream guard re-checks the worktree and will catch a\nbare COMPLETE with no ALREADY_SATISFIED and no real changes as FALSE_COMPLETE.\n\nReason: BDC YAMLs have used different sentinel strings over time. Emitting all three\ncase-1 sentinels guarantees the loop's `until:` matcher finds one.\n\n## Loop exit -- the no-op contract (stated once; matches case 2 above)\nThe loop's `until:` matches COMPLETE. A real build emits the three case-1 sentinels.\nA genuine no-op (already satisfied in THIS worktree) emits exactly:\n  ALREADY_SATISFIED: <which deliverables already exist in this worktree HEAD>\n  COMPLETE\nThat bare COMPLETE is what lets the loop exit; assert-implement-produced-work sees\nthe clean worktree + the ALREADY_SATISFIED line and reclassifies to ALREADY_SATISFIED\n(verified no-op, not a fraudulent build). NEVER emit COMPLETE if you simply failed to\ndo needed work (no ALREADY_SATISFIED line + clean worktree => FALSE_COMPLETE).\n",until: COMPLETE,max_iterations: 5,fresh_context: true}},{id: checkpoint-push,persona: overseer,depends_on: [implement],bash: "set -uo pipefail\n\nWO_ID=\"${WO_ID:-unknown}\"\nWIP_BRANCH=\"wip/${WO_ID}-$(date +%Y%m%d%H%M%S)\"\n\ngit add -A 2>/dev/null || true\n\nif git diff --cached --quiet 2>/dev/null; then\n  echo \"checkpoint-push: nothing staged -- no commit needed\"\n  exit 0\nfi\n\ngit commit -m \"wip: checkpoint after implement loop -- ${WO_ID}\n\nCauldron resilience checkpoint. Not the final commit.\nWill be superseded by backstop commit-and-push node.\n\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>\" \\\n  2>/dev/null || { echo \"WARN: checkpoint commit failed -- continuing\" >&2; exit 0; }\n\nif git push -u origin \"HEAD:${WIP_BRANCH}\" 2>/dev/null; then\n  echo \"checkpoint-push: WIP branch pushed -- ${WIP_BRANCH}\"\n  echo \"CHECKPOINT_BRANCH=${WIP_BRANCH}\"\n  echo \"CHECKPOINT_SHA=$(git rev-parse HEAD)\"\nelse\n  echo \"WARN: checkpoint push failed -- work is local only; backstop will retry\" >&2\nfi\nexit 0\n"},{id: assert-implement-produced-work,persona: overseer,depends_on: [checkpoint-push],load_bearing: true,bash: "set -uo pipefail\nIMPL=$implement.output\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\n# Codex FINDING_1 fix: compare against the IMMUTABLE run-start SHA (captured by\n# read-spec BEFORE checkpoint-push committed+pushed), NOT post-push upstream state.\n# After checkpoint-push, @{upstream}..HEAD is 0 even for a real build -- that false-\n# negative is what would have misrouted every legitimate build to BLOCKED.\nBASE=$(cat \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || echo \"\")\nHEAD_NOW=$(git -C \"$WT\" rev-parse HEAD 2>/dev/null || echo \"\")\nCHANGED=$(git -C \"$WT\" status --porcelain 2>/dev/null | grep -c . || echo 0)\n# commits since run start (real work this run produced, even after a checkpoint push)\nif [ -n \"$BASE\" ] && [ \"$BASE\" != \"unknown\" ] && [ -n \"$HEAD_NOW\" ]; then\n  AHEAD=$(git -C \"$WT\" rev-list --count \"${BASE}..HEAD\" 2>/dev/null || echo 0)\nelse\n  # fallback: no base captured -> use any-uncommitted OR diff vs upstream\n  AHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null || echo 0)\nfi\nHAS_WORK=false\nif [ \"${CHANGED:-0}\" -gt 0 ] || [ \"${AHEAD:-0}\" -gt 0 ]; then HAS_WORK=true; fi\n\nSAID_COMPLETE=false\nif printf '%s\\n' \"$IMPL\" | grep -qE '^(COMPLETE|BUILD_COMPLETE)$|<promise>COMPLETE</promise>'; then SAID_COMPLETE=true; fi\nSAID_ALREADY=false\nif printf '%s\\n' \"$IMPL\" | grep -qE '^ALREADY_SATISFIED:'; then SAID_ALREADY=true; fi\n\necho \"WORKTREE=$WT\"\necho \"CHANGED_FILES=$CHANGED\"\necho \"COMMITS_AHEAD=$AHEAD\"\necho \"IMPL_SAID_COMPLETE=$SAID_COMPLETE\"\necho \"IMPL_SAID_ALREADY_SATISFIED=$SAID_ALREADY\"\n\nif [ \"$HAS_WORK\" = \"true\" ]; then\n  echo \"BUILD_OUTCOME=REAL_BUILD\"\n  echo \"assert-implement-produced-work: real changes present -- proceeding to review chain\"\n  exit 0\nfi\n\n# No work in this worktree.\n# Codex FINDING_3 interaction: implement now emits BOTH \"ALREADY_SATISFIED:\" AND\n# COMPLETE in the genuine no-op case (COMPLETE is required to exit the until:COMPLETE\n# loop). So ALREADY_SATISFIED WINS whenever the agent declared it AND the worktree is\n# genuinely clean -- the clean worktree is the truth check that makes this non-fraudulent.\nif [ \"$SAID_ALREADY\" = \"true\" ]; then\n  echo \"BUILD_OUTCOME=ALREADY_SATISFIED\"\n  echo \"assert-implement-produced-work: implement reported ALREADY_SATISFIED and worktree is genuinely clean -- legitimate no-op\"\n  exit 0\nfi\n\n# No work, and implement did NOT declare already-satisfied, yet it claimed COMPLETE\n# (or emitted nothing usable): false/fraudulent completion.\necho \"BUILD_OUTCOME=FALSE_COMPLETE\"\necho \"ERROR: implement emitted COMPLETE but produced ZERO real changes in the assigned worktree (CHANGED=$CHANGED AHEAD=$AHEAD).\" >&2\necho \"This is a false/fraudulent completion (anchor 04daeafc). Downstream gate will PAUSE for correction, not commit.\" >&2\nexit 0\n"},{id: ascii-autofix,persona: major-build,depends_on: [assert-implement-produced-work],bash: "set -uo pipefail\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\ncd \"$WT\"\nif ! command -v python3 >/dev/null 2>&1; then\n  echo \"ascii-autofix: WARN -- python3 not found, skipping normalization\"\n  exit 0\nfi\n# Resolve BASE the SAME way ascii-gate does: immutable run-start SHA first,\n# then merge-base origin/BASE_BRANCH, then HEAD~1.\nBASE=$(cat \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || echo \"\")\nif [ -z \"$BASE\" ] || [ \"$BASE\" = \"unknown\" ] || ! git rev-parse --verify \"$BASE\" >/dev/null 2>&1; then\n  BASE_REF=\"origin/${BASE_BRANCH:-main}\"\n  BASE=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"\")\nfi\n# Run the total fixer; prefix every output line for node log clarity.\npython3 harness/scripts/ascii-autofix.py \"$BASE\" 2>&1 | while IFS= read -r line; do\n  echo \"ascii-autofix: $line\"\ndone\nexit 0\n"},{id: ascii-gate,depends_on: [ascii-autofix],persona: major-build,load_bearing: true,bash: "set -uo pipefail\n# Scope to source files changed by THIS run. Base = the immutable run-start SHA\n# captured by read-spec (NOT a $RUN_START_SHA env var -- that token is substituted\n# at parse time and is never exported to bash; read it from the artifact like the\n# other nodes do). Fall back to origin/BASE_BRANCH merge-base if the artifact is gone.\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\ncd \"$WT\"\nBASE=$(cat \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || echo \"\")\nif [ -z \"$BASE\" ] || [ \"$BASE\" = \"unknown\" ] || ! git rev-parse --verify \"$BASE\" >/dev/null 2>&1; then\n  BASE_REF=\"origin/${BASE_BRANCH:-main}\"\n  BASE=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"\")\nfi\nSRC_RE='\\.(js|jsx|ts|tsx|mjs|cjs|html|sh|bash|gs|yaml|yml)$'\n# Generated/bundled artifacts are NOT hand-authored source -- they legitimately\n# embed other files' content (e.g. bundled-defaults.generated.ts inlines every\n# workflow YAML, including ones with valid non-ASCII prose). Scanning them makes\n# the gate fail on pre-existing bytes the current WO never wrote. Exclude them so\n# the gate only judges what THIS run actually authored. (Anchor 2026-06-24:\n# WO-HARNESS-CAULDRON-PR-MANIFEST-AUTOFILL-01 was killed by 89 pre-existing\n# non-ASCII lines in bundled-defaults.generated.ts identical to those on dev.)\nEXCLUDE_RE='(\\.generated\\.(ts|js)$|bundled-defaults\\.generated\\.|/__snapshots__/|\\.snap$)'\nif [ -n \"$BASE\" ] && git rev-parse --verify \"$BASE\" >/dev/null 2>&1; then\n  CHANGED=$( { git diff --name-only \"$BASE\"..HEAD 2>/dev/null; git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E \"$SRC_RE\" | grep -vE \"$EXCLUDE_RE\" || true )\nelse\n  CHANGED=$( { git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E \"$SRC_RE\" | grep -vE \"$EXCLUDE_RE\" || true )\nfi\nif [ -z \"$CHANGED\" ]; then\n  echo \"ascii-gate PASS (no changed source files to scan)\"\n  exit 0\nfi\n# Portable non-ASCII detector. grep -P is not present in every build image, so probe\n# it once and fall back to perl, then to an LC_ALL=C byte-class grep.\nGREP_P_OK=0\nif printf 'a\\xe2\\x80\\x94b\\n' | grep -qP \"[^\\x00-\\x7F]\" 2>/dev/null; then GREP_P_OK=1; fi\ndetect() {\n  f=\"$1\"\n  if [ \"$GREP_P_OK\" = \"1\" ]; then\n    grep -lP \"[^\\x00-\\x7F]\" \"$f\" >/dev/null 2>&1 && return 1\n  elif command -v perl >/dev/null 2>&1; then\n    perl -ne 'exit 1 if /[^\\x00-\\x7F]/' \"$f\" || return 1\n  else\n    # Locale-independent: any byte >= 0x80 is non-ASCII. od is in coreutils everywhere\n    # (LC_ALL=C grep -P errors out: \"-P supports only unibyte and UTF-8 locales\").\n    od -An -tu1 \"$f\" 2>/dev/null | tr ' ' '\\n' | grep -qE '^(12[89]|1[3-9][0-9]|2[0-4][0-9]|25[0-5])$' && return 1\n  fi\n  return 0\n}\n# Accumulate offending files to a temp file (the while loop is fed by a pipe and\n# would otherwise run in a subshell where a HITS shell var could not persist).\nHITFILE=$(mktemp)\nprintf '%s\\n' \"$CHANGED\" | while IFS= read -r f; do\n  [ -z \"$f\" ] && continue\n  [ -f \"$f\" ] || continue\n  if ! detect \"$f\"; then printf '%s\\n' \"$f\" >> \"$HITFILE\"; fi\ndone\nif [ -s \"$HITFILE\" ]; then\n  echo \"ASCII GATE FAILED -- non-ASCII bytes in changed source file(s):\" >&2\n  cat \"$HITFILE\" >&2\n  echo \"--- offending lines (first 5 per file) ---\" >&2\n  while IFS= read -r f; do\n    [ -z \"$f\" ] && continue\n    if [ \"$GREP_P_OK\" = \"1\" ]; then\n      grep -nP \"[^\\x00-\\x7F]\" \"$f\" 2>/dev/null | head -5 | sed \"s|^|${f}:|\" >&2\n    elif command -v perl >/dev/null 2>&1; then\n      perl -ne 'print \"'\"$f\"':$.: $_\" if /[^\\x00-\\x7F]/' \"$f\" 2>/dev/null | head -5 >&2\n    fi\n  done < \"$HITFILE\"\n  echo \"Fix: em-dash/en-dash -> --, smart quotes -> ' and \\\", ellipsis -> ..., middot -> | or -, nbsp -> space, Unicode minus -> -. No emojis in source.\" >&2\n  echo \"See harness/policies/agent-behavior.md (Code Standards / Rule 13). This gate is load_bearing: the build fails until every changed source file is pure ASCII.\" >&2\n  rm -f \"$HITFILE\"\n  exit 1\nfi\nrm -f \"$HITFILE\"\necho \"ascii-gate PASS (scanned $(printf '%s\\n' \"$CHANGED\" | grep -c .) changed source file(s), all ASCII)\"\nexit 0\n"},{id: war-council-validator,provider: claude,model: sonnet,persona: captain-ci-validator,depends_on: [ascii-gate],task_class: medium_work,prompt: "Invoke or emulate the war-council-validator review for this Work Order.\n\n## Validator Agent\nwar-council-validator\n\n## Inputs\nSpec:\n$read-spec.output\n\nPlan (approved -- reviewed + revised by plan-review):\n$plan-review.output\n\nImplementation output:\n$implement.output\n\nGit diff:\nRun `git diff --stat` and `git diff --check`, then inspect the relevant changed files.\n\n## Required Output\nReturn either:\n- satisfied: with evidence that the spec deliverables and stop conditions were met\n- needs_revision: with exact file/path/behavior findings\n"},{id: capture-diff,depends_on: [war-council-validator],bash: "set -uo pipefail\nmkdir -p \"$ARTIFACTS_DIR\"\nOUT=\"$ARTIFACTS_DIR/diff.patch\"\nBASE_REF=\"origin/${BASE_BRANCH:-main}\"\n# NF2: when there is no merge-base and no HEAD~1 (single-commit / no-base repo),\n# fall back to the empty-tree hash, NOT HEAD. HEAD..HEAD is an EMPTY diff (reviewer\n# sees nothing); empty-tree..HEAD shows all committed content as added (meaningful).\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\n{\n  echo \"### git diff --stat ($MB..HEAD)\"\n  git diff --stat \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### git diff --name-only ($MB..HEAD)\"\n  git diff --name-only \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### committed diff ($MB..HEAD)\"\n  git diff \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### unstaged working-tree diff (HEAD..worktree)\"\n  git diff HEAD 2>/dev/null || true\n} > \"$OUT\"\necho \"DIFF_BASE=$MB\"\necho \"DIFF_COMMAND=git diff $MB..HEAD (+ git diff HEAD for unstaged)\"\necho \"DIFF_ARTIFACT=$OUT\"\necho \"DIFF_BYTES=$(wc -c < \"$OUT\" 2>/dev/null || echo 0)\"\n"},{id: diff-review,provider: claude,model: sonnet,agent: claude-adversarial-reviewer,depends_on: [capture-diff],task_class: medium_work,prompt: "You are the Claude adversarial diff reviewer. Cross-model review of the diff that\nmajor-build just produced, BEFORE it is committed. You are READ-ONLY: you inspect\nand report. You do NOT edit, write, or run commands that mutate state.\n\n## Inputs\nSpec: $read-spec.output\nValidator verdict: $war-council-validator.output\nDiff provenance: $capture-diff.output\n(DIFF_BASE, DIFF_COMMAND, DIFF_ARTIFACT above tell you exactly what diff to read.)\n\n## Inspect the ACTUAL diff (read-only)\nREAD the captured diff at the DIFF_ARTIFACT path from $capture-diff.output (it is\n$ARTIFACTS_DIR/diff.patch). That file IS the diff -- you have no Bash tool, so do\nNOT try to run git yourself. Also use Read/Grep/Glob on the changed files (listed\nunder \"### git diff --name-only\" in the artifact) for fuller context. Focus on what\ntests + the validator can miss:\n1. Contract drift -- response shapes, column counts, export schemas, API signatures\n   changed in a way the spec did not authorize.\n2. Unverified claims -- code asserts behavior that no test actually exercises.\n3. Unsafe customer/billing/export behavior -- e.g. an export path that could emit a\n   customer-reserved unit, a billing write without an idempotency guard.\n4. Missing tests -- in-scope behavior with no test asserting real output (not just\n   \"ran without throwing\").\n\n## Output (STDOUT only -- you cannot write files)\nEmit exactly:\n  DIFF_REVIEW=<satisfied|needs_revision>\n  FINDINGS:\n  - <file:line> <one specific, fixable finding>   (repeat; or \"(none)\")\n  SEMANTIC_RISK=<LOW|MEDIUM|HIGH>\nBe specific: every finding cites a file and the exact problem. \"Looks fine\" is not\nacceptable; \"could be better\" is not a finding. Only flag what must change before commit.\n"},{id: classify-diff-review,depends_on: [diff-review],trigger_rule: all_done,bash: "set -uo pipefail\nREVIEW=$diff-review.output\nverdict=$(printf '%s\\n' \"$REVIEW\" | grep -oE 'DIFF_REVIEW=(satisfied|needs_revision)' | tail -n 1 | sed 's/DIFF_REVIEW=//')\n# Fail OPEN to needs_revision: if the sentinel is missing/unparseable, run the repair\n# loop (safer to over-repair than to skip a real finding). This is the OPPOSITE of the\n# fail-closed classifiers -- here \"unknown\" must still get a repair+re-review pass.\n[ -z \"$verdict\" ] && verdict=needs_revision\nprintf '{\"verdict\":\"%s\"}\\n' \"$verdict\"\n"},{id: diff-repair,provider: codex,model: gpt-5.5,depends_on: [diff-review,classify-diff-review],when: "$classify-diff-review.output.verdict == 'needs_revision'",task_class: medium_work,loop: {fresh_context: true,until: __NEVER_EMIT_USE_UNTIL_BASH__,max_iterations: 20,until_bash: "set -uo pipefail\n# MECHANICAL invariants ONLY. This does NOT prove Codex is satisfied --\n# diff-review-final (a real re-review) does that. Complete when the repair node\n# signalled done AND the feature diff has no obvious mechanical defects.\nDONE=\"$ARTIFACTS_DIR/diff-repair-done.flag\"\n[ -f \"$DONE\" ] || { echo \"repair not signalled done\"; exit 1; }\n# F4: implement already committed, so `git diff --cached` is empty. Check the\n# real feature diff: merge-base..HEAD (committed) PLUS HEAD..worktree (unstaged).\n# NF2: empty-tree fallback (not HEAD) so a single-commit/no-base repo still\n# produces a non-empty committed diff to scan for debug prints.\nBASE_REF=\"origin/${BASE_BRANCH:-main}\"\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\nDEBUG_RE='console\\.log\\(|debugger;|binding\\.pry|import pdb'\nif { git diff --unified=0 \"$MB\"..HEAD 2>/dev/null; git diff --unified=0 HEAD 2>/dev/null; } \\\n     | grep -E '^\\+' | grep -Eq \"$DEBUG_RE\"; then\n  echo \"debug statement present in feature diff\"; exit 1\nfi\nexit 0\n",prompt: "You are major-build. The Codex diff reviewer raised findings on your diff.\nFix every fixable finding in place. You are the BUILDER; Codex does not edit.\n\n## Codex review verdict (read directly -- prompt substitution, not shell)\n$diff-review.output\n\n## Prior repair iteration (if any)\n$LOOP_PREV_OUTPUT\n\n## What to do\n- If DIFF_REVIEW=satisfied with no findings: make no changes; just signal done.\n- Otherwise: resolve each FINDINGS line. Add the missing test, fix the contract\n  drift, close the unsafe path. Modify only in-scope files. Do not reformat\n  unrelated code. Do not deploy.\n\n## NEVER FABRICATE A DIFF (Fix C, 2026-05-30 -- anchor run 04daeafc)\nIf the captured diff is empty / header-only because the WO appears already\nimplemented on origin/main or in other commits, you MUST NOT regenerate or\nreconstruct $ARTIFACTS_DIR/diff.patch (or diff-final.patch) from those\nalready-merged commits, from origin/main, or from any other branch/worktree.\nThe diff artifact must reflect ONLY real, uncommitted-or-this-worktree changes.\nManufacturing a reviewable artifact from already-merged work is fraud -- it tricks\nthe final reviewer into certifying changes this run did not make.\nIf the diff is genuinely empty because there is nothing to repair (the WO is\nalready satisfied or implement produced no changes), do NOT write the done.flag\nand do NOT fabricate -- instead write the escalation block (below) with\nESCALATION_REASON=already-implemented-no-diff and STOP. diff-review-final will\nsee the empty diff and the run will pause for correction (not silently pass).\nAnchor: run 04daeafc's diff-repair tried to \"regenerate diff.patch with the actual\nimplementation content from those commits\" -- exactly the fraud this rule forbids.\n\n## Escalation (ONLY these -- else fix and let the loop continue)\nWrite the escalation block to $ARTIFACTS_DIR/diff-repair-escalation.txt and STOP if:\n- a finding requires a new side-effect class / scope the lane was not granted\n- a finding requires human-only authority (deploy, prod write, customer comms,\n  irreversible/destructive op) where safe behavior is not already encoded\n- the spec is ambiguous about the correct fix\n- the same finding survived a prior repair attempt and you cannot resolve it\nEscalation block (exact keys):\n  ESCALATION_REQUIRED=true\n  ESCALATION_REASON=<new-side-effect-class|human-only-authority|ambiguous-spec|loop-exhausted|already-implemented-no-diff>\n  WO_ID=<id>\n  NODE=diff-repair\n  ATTEMPTS=<n>/3\n  WHAT_FAILED=<one paragraph>\n  WHAT_WAS_TRIED=<3-6 bullets>\n  LAST_REVIEW_FINDINGS=<exact Codex findings>\n  SINGLE_DECISION_NEEDED=<one sentence John can answer>\n  SAFE_STATE=<work is local in the worktree; nothing committed or pushed yet>\n\n## Signal done (the FLAG is the only gate -- there is NO completion token)\nThe loop completes ONLY via until_bash, which checks that the done.flag exists\nAND the feature diff has no debug prints. There is NO text sentinel that finishes\nthis loop (loop.until is set to a token you must NEVER emit) -- do not try to\nemit one. When you have addressed every fixable finding (or there were none) AND\nintroduced no debug prints:\n  - Write an empty file at $ARTIFACTS_DIR/diff-repair-done.flag   (the ONLY signal)\nIf you escalated or could not resolve a finding, do NOT write the flag: the loop\nwill exhaust max_iterations and fail closed, and diff-review-final adjudicates the\nunresolved state. The flag means \"repair pass complete\", not \"semantically\ncertified\" -- diff-review-final re-checks semantics next.\n"}},{id: capture-diff-final,depends_on: [diff-repair],trigger_rule: all_done,bash: "set -uo pipefail\nmkdir -p \"$ARTIFACTS_DIR\"\nOUT=\"$ARTIFACTS_DIR/diff-final.patch\"\nBASE_REF=\"origin/${BASE_BRANCH:-main}\"\n# NF2: when there is no merge-base and no HEAD~1 (single-commit / no-base repo),\n# fall back to the empty-tree hash, NOT HEAD. HEAD..HEAD is an EMPTY diff (reviewer\n# sees nothing); empty-tree..HEAD shows all committed content as added (meaningful).\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\n{\n  echo \"### committed diff ($MB..HEAD)\"\n  git diff \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### unstaged working-tree diff (HEAD..worktree)\"\n  git diff HEAD 2>/dev/null || true\n} > \"$OUT\"\necho \"DIFF_FINAL_BASE=$MB\"\necho \"DIFF_FINAL_ARTIFACT=$OUT\"\necho \"DIFF_FINAL_BYTES=$(wc -c < \"$OUT\" 2>/dev/null || echo 0)\"\n"},{id: diff-review-final,provider: claude,model: sonnet,agent: claude-adversarial-reviewer,depends_on: [capture-diff-final],trigger_rule: all_done,task_class: medium_work,prompt: "You are the Claude adversarial reviewer doing the FINAL re-review after repair.\nRead-only. This node decides whether any semantic finding remains before commit --\nthe mechanical repair gate did NOT prove your earlier objections were fixed.\n\n## Inputs\nSpec: $read-spec.output\nYour original findings: $diff-review.output\nClassifier verdict: $classify-diff-review.output\nRepair pass output: $diff-repair.output\nRefreshed diff provenance: $capture-diff-final.output\n(Read the repaired diff at DIFF_FINAL_ARTIFACT = $ARTIFACTS_DIR/diff-final.patch.\nYou have no Bash tool -- do not run git; read that file.)\n\n## Branch on the repair outcome FIRST (check the SATISFIED FAST PATH before anything else)\n- SATISFIED FAST PATH: if your original review verdict was DIFF_REVIEW=satisfied\n  (Classifier verdict above is {\"verdict\":\"satisfied\"}), then diff-repair was\n  correctly SKIPPED by its `when:` guard because there were no findings to fix.\n  An empty $diff-repair.output and a missing done.flag are EXPECTED on this path,\n  NOT a failure. Re-inspect the captured diff once more to confirm no new unsafe\n  behavior was introduced between the original review and now (e.g., scope creep,\n  unrelated edits). If the diff is still clean, emit DIFF_REVIEW_FINAL=satisfied\n  with UNRESOLVED: (none). Do NOT treat the skipped repair as failed repair.\n- If the original verdict was needs_revision AND diff-repair FAILED or exhausted\n  iterations (its output is empty, shows ESCALATION_REQUIRED=true, or the done.flag\n  was never written): do NOT certify. Emit DIFF_REVIEW_FINAL=needs_revision,\n  summarize the unresolved repair state in UNRESOLVED, and carry through any\n  escalation reason. Never PASS on failed repair.\n- Otherwise (original verdict was needs_revision AND diff-repair signalled done):\n  re-inspect the repaired diff. For EACH finding you raised originally, verify it\n  is actually resolved in the current tree -- not merely claimed resolved.\n\n## Output (STDOUT only)\n  DIFF_REVIEW_FINAL=<satisfied|needs_revision>\n  UNRESOLVED:\n  - <file:line> <finding still open>   (repeat; or \"(none)\")\n  SEMANTIC_RISK=<LOW|MEDIUM|HIGH>\nDIFF_REVIEW_FINAL=satisfied ONLY if every original finding is genuinely resolved and\nno new unsafe behavior was introduced by the repair.\n"},{id: block-classify,depends_on: [diff-review-final],trigger_rule: all_done,bash: "set -uo pipefail\nDIFF_FINAL=$diff-review-final.output\nBUILD=$assert-implement-produced-work.output\nPRECHECK=$gate-already-satisfied.output\n\nfinal_ok=false\n# Anchor-free parse: diff-review-final is Codex prose; sentinel appears inline,\n# not at column 0. Take LAST occurrence so the final verdict always wins.\nfinal_verdict=$(printf '%s\\n' \"$DIFF_FINAL\" \\\n  | grep -oE 'DIFF_REVIEW_FINAL=(satisfied|needs_revision)' \\\n  | tail -n 1)\nif [ \"$final_verdict\" = \"DIFF_REVIEW_FINAL=satisfied\" ]; then final_ok=true; fi\noutcome=$(printf '%s\\n' \"$BUILD\" | sed -n 's/^BUILD_OUTCOME=//p' | head -1)\n\n# Codex FINDING_2: PROCEED requires BOTH a real build AND a satisfied final review.\n# A missing/unparseable BUILD_OUTCOME must NOT slip through as PROCEED.\nif [ \"$outcome\" = \"ALREADY_SATISFIED\" ]; then\n  STATUS=ALREADY_SATISFIED\nelif [ \"$outcome\" = \"REAL_BUILD\" ] && [ \"$final_ok\" = \"true\" ]; then\n  STATUS=PROCEED\nelse\n  # FALSE_COMPLETE, unknown outcome, or final review not satisfied -> block.\n  STATUS=BLOCKED\nfi\n# single JSON line = the entire stdout, so $block-classify.output.status parses\nprintf '{\"status\":\"%s\",\"final_satisfied\":%s,\"build_outcome\":\"%s\"}\\n' \"$STATUS\" \"$final_ok\" \"${outcome:-unknown}\"\n"},{id: opus-repair,provider: codex,model: gpt-5.5,depends_on: [block-classify],when: "$block-classify.output.status == 'BLOCKED'",prompt: "The bdc-feature-development run is BLOCKED before the irreversible commit. Before a\nhuman is paused, you get ONE autonomous repair pass. Diagnose and, if you can,\nresolve it so the build can proceed safely.\n\n## Why blocked\nblock-classify: $block-classify.output\ndiff-review-final: $diff-review-final.output\nassert-implement-produced-work: $assert-implement-produced-work.output\nOriginal Codex findings: $diff-review.output\n\n## Your job\n- If the block is FALSE_COMPLETE (implement claimed done but produced no real changes\n  in THIS worktree): determine whether the WO genuinely needs work here. If it does and\n  you can make the in-scope changes, make them in the assigned worktree (you have the\n  tools). If the WO is genuinely already implemented in this worktree, say so.\n- If the block is diff-review-final=needs_revision: make the specific fix the final\n  reviewer named, in scope, in this worktree.\n- Judge ONLY against this worktree (no origin/main, no sibling worktrees). NEVER\n  fabricate a diff from already-merged commits.\n\n## Output (last lines)\n- If you resolved it (real in-scope changes now exist in this worktree):\n    OPUS_REPAIR=fixed\n- If it is genuinely already-satisfied (no work needed in this worktree):\n    OPUS_REPAIR=already-satisfied\n- If you could NOT resolve it and a human must decide:\n    OPUS_REPAIR=needs-human\n    REASON=<one sentence>\n"},{id: classify-opus-repair,depends_on: [opus-repair],trigger_rule: all_done,bash: "set -uo pipefail\nOPUS=$opus-repair.output\nif printf '%s\\n' \"$OPUS\" | grep -q '^OPUS_REPAIR=fixed'; then\n  printf '{\"fixed\":\"true\"}\\n'\nelse\n  printf '{\"fixed\":\"false\"}\\n'\nfi\n"},{id: opus-rereview,provider: claude,model: sonnet,agent: claude-adversarial-reviewer,depends_on: [classify-opus-repair],trigger_rule: all_done,when: "$classify-opus-repair.output.fixed == 'true'",prompt: "opus-repair just made autonomous in-scope changes to resolve a BLOCKED build. Re-review\nONLY the current worktree diff (the post-repair state). Read-only. Judge ONLY this worktree\n(no origin/main, no sibling worktrees; never fabricate a diff from already-merged commits).\nConfirm the build now satisfies the WO and introduces no regression or unsafe behavior.\n\n## What opus-repair reported\n$opus-repair.output\n\n## Original block reason\n$block-classify.output\n$diff-review-final.output\n\n## Output (STDOUT only, last lines)\n  OPUS_REREVIEW=<satisfied|needs_revision>\n  UNRESOLVED:\n  - <finding still open>   (or \"(none)\")\n"},{id: classify-opus-rereview,depends_on: [opus-rereview],trigger_rule: all_done,bash: "set -uo pipefail\nREVIEW=$opus-rereview.output\nverdict=$(printf '%s\\n' \"$REVIEW\" \\\n  | grep -oE 'OPUS_REREVIEW=(satisfied|needs_revision)' \\\n  | tail -n 1 \\\n  | sed 's/OPUS_REREVIEW=//')\nif [ -z \"$verdict\" ]; then\n  verdict=needs_revision\nfi\nprintf '{\"verdict\":\"%s\"}\\n' \"$verdict\"\n"},{id: block-reclassify,depends_on: [block-classify,opus-repair,classify-opus-rereview],trigger_rule: all_done,bash: "set -uo pipefail\nPRIOR=$block-classify.output\nOPUS=$opus-repair.output\nREREVIEW=$classify-opus-rereview.output\nprior_status=$(printf '%s\\n' \"$PRIOR\" | sed -n 's/.*\"status\":\"\\([A-Z_]*\\)\".*/\\1/p' | head -1)\n\n# If it wasn't blocked, keep the prior status unchanged.\nif [ \"$prior_status\" != \"BLOCKED\" ]; then\n  printf '{\"status\":\"%s\"}\\n' \"${prior_status:-BLOCKED}\"\n  exit 0\nfi\n\n# It was blocked: did Opus fix it? Re-check the worktree for real work.\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nCHANGED=$(git -C \"$WT\" status --porcelain 2>/dev/null | grep -c . || echo 0)\nAHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null \\\n        || git -C \"$WT\" rev-list --count HEAD --not --remotes 2>/dev/null || echo 0)\n\nif printf '%s\\n' \"$OPUS\" | grep -q '^OPUS_REPAIR=fixed' && { [ \"${CHANGED:-0}\" -gt 0 ] || [ \"${AHEAD:-0}\" -gt 0 ]; }; then\n  # Opus made real changes. The autonomous re-review verdict decides the path:\n  # satisfied -> PROCEED (normal commit/PR); anything else -> BLOCKED (salvage\n  # net + human gate own it). Fail CLOSED: missing/unparseable verdict -> BLOCKED.\n  rereview_verdict=$(printf '%s\\n' \"$REREVIEW\" | sed -n 's/.*\"verdict\":\"\\([a-z_]*\\)\".*/\\1/p' | head -1)\n  if [ \"$rereview_verdict\" = \"satisfied\" ]; then\n    printf '{\"status\":\"PROCEED\",\"note\":\"opus-repaired-and-rereviewed-satisfied\"}\\n'\n  else\n    printf '{\"status\":\"BLOCKED\",\"note\":\"opus-made-changes-rereview-failed\"}\\n'\n  fi\nelif printf '%s\\n' \"$OPUS\" | grep -q '^OPUS_REPAIR=already-satisfied'; then\n  printf '{\"status\":\"ALREADY_SATISFIED\",\"note\":\"opus-confirmed-already-satisfied\"}\\n'\nelse\n  printf '{\"status\":\"BLOCKED\",\"note\":\"opus-could-not-resolve\"}\\n'\nfi\n"},{id: noninteractive-salvage,depends_on: [block-reclassify],trigger_rule: all_done,bash: "set -uo pipefail\nRECLASS=$block-reclassify.output\nSTATUS=$(printf '%s\\n' \"$RECLASS\" | sed -n 's/.*\"status\":\"\\([A-Z_]*\\)\".*/\\1/p' | head -1)\n# Only act on a BLOCKED status.\n[ \"$STATUS\" = \"BLOCKED\" ] || { echo \"SALVAGE=skip (status=$STATUS)\"; exit 0; }\n# Interactive runs use pause-gate; leave them alone.\nif [ \"${CAULDRON_INTERACTIVE:-}\" = \"true\" ]; then echo \"SALVAGE=skip (interactive; pause-gate owns this)\"; exit 0; fi\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\ncd \"$WT\" || { echo \"SALVAGE=skip (no worktree)\"; exit 0; }\nCHANGED=$(git status --porcelain 2>/dev/null | grep -c . || echo 0)\nAHEAD=$(git rev-list --count HEAD --not --remotes 2>/dev/null || echo 0)\nif [ \"${CHANGED:-0}\" -eq 0 ] && [ \"${AHEAD:-0}\" -eq 0 ]; then echo \"SALVAGE=skip (nothing to preserve)\"; exit 0; fi\n# Branch suffix uses $$ (Rule 2: never $WORKFLOW_ID under set -u).\nBR=\"salvage/opus-repair-$(basename \"$WT\")-$$\"\ngit add -A 2>/dev/null || true\nif ! git diff --cached --quiet 2>/dev/null; then\n  git -c user.name='cauldron-salvage' -c user.email='noreply@bluedevilcollectibles.com' \\\n    commit -m \"salvage: opus-repaired build preserved for human review (non-interactive BLOCKED)\" 2>&1 | tail -1 || true\nfi\nif git push -u origin \"HEAD:${BR}\" 2>&1 | tail -2; then\n  REPO=$(git config --get remote.origin.url | sed -E 's#.*github.com[:/]##; s#\\.git$##')\n  PR_URL=$(gh pr create --repo \"$REPO\" --head \"$BR\" --base \"${BASE_BRANCH:-dev}\" \\\n    --title \"FALLBACK: opus-repaired build needs human review\" \\\n    --body \"FALLBACK PATH: a BLOCKED build was auto-repaired by opus-repair, but the non-interactive run could not reach a human approval gate. The repair commit is pushed here for human review instead of being stranded in the worktree. See run artifacts for the original block reason.\" \\\n    2>&1 | tail -1 || true)\n  echo \"SALVAGE=pushed branch ${BR}; PR=${PR_URL}\"\nelse\n  echo \"SALVAGE=push-failed (work remains in worktree ${WT})\"\nfi\n"},{id: findings-consolidate,persona: xo,provider: claude,model: sonnet,depends_on: [block-reclassify],trigger_rule: all_done,task_class: clerical,prompt: "Build the human-facing findings ledger for the approval gate. Read every review output\nbelow and emit ONE JSON object. Do not invent findings; only consolidate what the reviews\nand the repair tier already reported.\n\n## Inputs\nplan-review findings (unstructured prose between sentinels):\n$plan-review.output\n\ndiff-review verdict + findings:\n$diff-review.output\n\ndiff-review-final verdict + UNRESOLVED list:\n$diff-review-final.output\n\nblock-classify / block-reclassify status:\n$block-reclassify.output\n\nopus-repair result (REASON= names any fix the self-repair tier deferred):\n$opus-repair.output\n\n## Output: STRICT JSON only. No prose. No code fences.\n{\n  \"summary\": \"<one line: N findings, M unresolved>\",\n  \"findings\": [\n    {\n      \"id\": \"<stable-kebab-id, e.g. locg-migration>\",\n      \"source\": \"plan-review | diff-review | diff-review-final | opus-repair\",\n      \"severity\": \"LOW | MEDIUM | HIGH\",\n      \"title\": \"<one line>\",\n      \"resolution\": \"FIXED-BY-LOOP | UNRESOLVED\",\n      \"suggested_fix\": {\n        \"diagnosis\": \"<the loop's own diagnosis, verbatim where available>\",\n        \"proposed_action\": \"<concrete, e.g. add migration 20260609_identity_connector_accounts_add_locg.sql ALTERing the connector CHECK constraint to include lunar/locg/prh>\",\n        \"fix_class\": \"CODE-EDIT | NEW-SCHEMA-MIGRATION | CONFIG | OTHER\",\n        \"boundary_flag\": true\n      }\n    }\n  ]\n}\n\nRules:\n- Include EVERY finding: FIXED-BY-LOOP (for transparency) AND UNRESOLVED.\n- Emit \"suggested_fix\" ONLY for UNRESOLVED rows; omit it on FIXED-BY-LOOP rows.\n- Set boundary_flag=true exactly when fix_class == \"NEW-SCHEMA-MIGRATION\" (the loop will\n  NOT write that itself; it requires APPROVE-WITH-FIX).\n- If there are zero unresolved findings, \"findings\" still lists the fixed ones and\n  \"summary\" says \"0 unresolved\".\n"},{id: pause-gate,depends_on: [findings-consolidate],when: "$block-reclassify.output.status == 'BLOCKED' || $block-reclassify.output.status == 'PROCEED'",approval: {message: "REVIEW FINDINGS LEDGER (every finding; unresolved ones include a suggested fix):\n$findings-consolidate.output\n\nChoose:\n- APPROVE-AS-IS  -> proceed; any unresolved findings stay unresolved and are logged.\n- APPROVE-WITH-FIX -> authorize the loop to apply the named suggested fix(es), including a\n  new schema migration the self-repair loop deferred; a second review runs before commit.\n- REJECT -> halt; the worktree is preserved.\n\nSAFE STATE: no commit, no push, no PR, no Notion write has happened yet.\n\n(BLOCKED runs: the AI tiers could not fully resolve this. PROCEED runs: reviews passed;\nthis is the final confirmation before the irreversible commit.)\n",choices: [approve_as_is,approve_with_fix,reject],capture_response: true,on_reject: {prompt: "The operator rejected the blocked run. Summarize what was blocked, what the AI\ntiers tried, and what a human must change before re-running. Do not commit or fire.\nOutput: OPERATOR_REJECTED: <reason from approval response>\n",max_attempts: 2}}},{id: apply-suggested-fix,agent: overseer-opus,provider: claude,model: claude-opus-4-7,effort: xhigh,context: fresh,depends_on: [pause-gate],trigger_rule: all_done,when: "$pause-gate.output.decision_verb == 'approve_with_fix'",prompt: "The operator authorized specific fixes at the approval gate. Apply ONLY the fixes whose\nids appear in authorized_fix_ids. Do NOT apply any other finding.\n\n## The full ledger (each finding has an id + suggested_fix)\n$findings-consolidate.output\n\n## Operator decision (AUTHORITATIVE -- authorized_fix_ids lives here)\n$pause-gate.output\n\n## Rules\n- Apply ONLY fixes whose id is in the operator's authorized_fix_ids. If authorized_fix_ids\n  is empty or missing, make NO changes and emit APPLY_SUGGESTED_FIX=nothing-authorized.\n- For an AUTHORIZED NEW-SCHEMA-MIGRATION fix (its id is in authorized_fix_ids): create the\n  migration file named in proposed_action. Check it does not already exist before writing\n  (idempotent create). NEVER write a migration for a finding whose id is not in\n  authorized_fix_ids -- that is the loop boundary; only an explicit operator authorization\n  may cross it.\n- Make the minimal change. Do NOT reformat unrelated code (agent-behavior policy).\n- Work only in the assigned worktree.\n\n## Output (last lines)\n  APPLY_SUGGESTED_FIX=<applied|nothing-authorized>\n  FILES_CHANGED:\n  - <path>   (repeat; or \"(none)\")\n"},{id: apply-diff-review-final,provider: claude,model: sonnet,agent: claude-adversarial-reviewer,depends_on: [apply-suggested-fix],trigger_rule: all_done,when: "$pause-gate.output.decision_verb == 'approve_with_fix'",prompt: "Re-review ONLY the changes apply-suggested-fix just made (especially any new schema\nmigration). Read-only. Verify the fix matches the operator-authorized proposed_action and\nintroduces no regression or unsafe behavior.\n\n## What was applied\n$apply-suggested-fix.output\n\n## The authorized ledger\n$findings-consolidate.output\n\n## Output (STDOUT only)\n  APPLY_DIFF_REVIEW_FINAL=<satisfied|needs_revision>\n  UNRESOLVED:\n  - <finding still open>   (or \"(none)\")\n"},{id: classify-apply-review,depends_on: [apply-diff-review-final],trigger_rule: all_done,when: "$pause-gate.output.decision_verb == 'approve_with_fix'",bash: "set -uo pipefail\nREVIEW=$apply-diff-review-final.output\nverdict=$(printf '%s\\n' \"$REVIEW\" \\\n  | grep -oE 'APPLY_DIFF_REVIEW_FINAL=(satisfied|needs_revision)' \\\n  | tail -n 1 \\\n  | sed 's/APPLY_DIFF_REVIEW_FINAL=//')\nif [ -z \"$verdict\" ]; then\n  verdict=needs_revision\nfi\nprintf '{\"verdict\":\"%s\"}\\n' \"$verdict\"\n"},{id: decide-push-target,persona: major-build,provider: claude,model: "opus[1m]",depends_on: [pause-gate,classify-apply-review],trigger_rule: all_done,when: "$pause-gate.output.decision_verb != 'approve_with_fix' || $classify-apply-review.output.verdict == 'satisfied'",task_class: clerical,prompt: "Decide the push target for this BDC feature Work Order.\n\n## Inputs\nSpec:\n$read-spec.output\n\nValidator:\n$war-council-validator.output\n\n## Branch Name Derivation Rules (F-6A prevention)\nAnchor incidents 2026-05-18: agents emitted branch names that embedded the\ncurrent worktree thread suffix, producing double-suffixed targets like\n\"archon/thread-9772643d-thread-9772643d\" or\n\"feat/WO-AUTH-RETIRE-GAS-PATH-02-thread-feat/WO-AUTH-RETIRE-GAS-PATH-02\".\nThe engine ALREADY appends a unique \"-thread-<hash>\" suffix at push time\n(UNIQUE_BRANCH in commit-and-push). Your job is to emit the BASE branch\nname only.\n\n- Derive the branch name from the WO ID ONLY. Do NOT copy the current\n  git branch name. If running on archon/thread-9772643d, do NOT emit\n  that value or any variant of it as push_target.\n- Use prefix feat/, fix/, or wip/ followed by the WO ID in lowercase\n  with hyphens. Example: WO-FOO-BAR-01 -> feat/wo-foo-bar-01\n- The branch MUST NOT start with archon/thread- or contain -thread-\n  anywhere.\n- The branch MUST NOT embed the current worktree thread hash anywhere\n  in its name.\n- Valid examples: feat/wo-auth-retire-gas-path-02, fix/wo-bugs-01, wip/wo-draft-01\n- commit-and-push validates the emitted branch against this allowlist\n  regex: ^(feat/[A-Za-z0-9_-]+|fix/[A-Za-z0-9_-]+|wip/[A-Za-z0-9_-]+)$\n  and fails closed with \"Malformed branch name\" on mismatch.\n\n## Required Repo Policy\nExtract the target repository from the spec content. Look for any of these patterns (in priority order):\n1. `target_repo: <owner>/<repo>` (YAML field)\n2. `**Target repo:** \\`<owner>/<repo>\\`` (Markdown bold)\n3. `Target repo: <owner>/<repo>` (plain header)\n4. `**Target Repo:** \\`<owner>/<repo>\\`` (Markdown bold, capital R)\n\nThe target repo is where the PR must be opened (NOT the worktree's git origin - Rule 29).\n\nMatch the extracted repo against this hardcoded staging-gate list:\n- bluedevilcollectibles/lspro-react\n- bluedevilcollectibles/shopops-storefront\n- bluedevilcollectibles/shopops\n\nIf the repo matches one of those entries, output:\npush_target: feature-branch:<spec-derived-branch-name>\npr_required: true\nstaging_gate_required: true\nrepo: <owner>/<repo>\n\nIf the repo is bdc-xo non-doctrine code or another code repo, output:\npush_target: feature-branch:<spec-derived-branch-name>\npr_required: true\nstaging_gate_required: false\nrepo: <owner>/<repo>\n\nIf this is doc-only or doctrine-only, output:\nout_of_scope: true\nreason: use bdc-doctrine-update.yaml\nrepo: unknown\n\nCRITICAL: You MUST emit a `repo:` line in every output case. If no target_repo is\nparseable from the spec, emit `repo: unknown` and a WARNING line explaining what is missing.\n"},{id: commit-and-push,persona: overseer,depends_on: [decide-push-target,classify-apply-review,classify-opus-rereview],trigger_rule: all_done,when: "$block-reclassify.output.status == 'PROCEED' || $classify-apply-review.output.verdict == 'satisfied' || $classify-opus-rereview.output.verdict == 'satisfied'",load_bearing: true,bash: "set -euo pipefail\n# 2026-05-16 quote-fix: substituteNodeOutputRefs with escapedForBash=true wraps\n# the output in single quotes. Wrapping the substitution in double quotes here\n# creates `\"'multiline\\nagent\\noutput'\"` which bash mis-tokenizes - line 2+ of\n# the agent output becomes bare commands. Assign directly to bash vars, then\n# quote the var reference. Engine-level fix tracked in WO-HARNESS-NODE-OUTPUT-BASH-QUOTING-01.\nDECIDE_OUTPUT=$decide-push-target.output\n# plan-review emits a fenced output. Extract ONLY the approved-plan block so the\n# changed-file allowlist + commit message never ingest reviewer critique (F8 fix).\n# Must be the revised plan (not pre-review) or a plan-review scope change would be\n# rejected by the allowlist. FAIL CLOSED if the fence is absent (NF1): never fall\n# back to raw output, or PLAN_REVIEW_FINDINGS critique would poison the allowlist.\nPLAN_REVIEW_RAW=$plan-review.output\nPLAN_OUTPUT=$(printf '%s\\n' \"$PLAN_REVIEW_RAW\" | sed -n '/=== APPROVED_PLAN_BEGIN ===/,/=== APPROVED_PLAN_END ===/p' | sed '1d;$d')\nif [ -z \"$PLAN_OUTPUT\" ]; then\n  echo \"ERROR: plan-review output missing the APPROVED_PLAN fence -- cannot extract the approved plan (NF1 fail-closed).\" >&2\n  echo \"--- raw plan-review output (for debugging) ---\" >&2\n  printf '%s\\n' \"$PLAN_REVIEW_RAW\" >&2\n  exit 1\nfi\nDIFF_FINAL=$diff-review-final.output\nRECLASS=$block-reclassify.output\nPAUSE_GATE=$pause-gate.output\nAPPLY_REVIEW=$classify-apply-review.output\nOPUS_REREVIEW_CLASS=$classify-opus-rereview.output\necho \"$DECIDE_OUTPUT\"\nif printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -q '^out_of_scope: true'; then\n  echo \"Out of scope for bdc-feature-development; failing closed.\" >&2\n  exit 1\nfi\n# Irreversible-action gate (Fix D, 2026-05-30): the BLOCK/PAUSE decision now lives\n# upstream in block-classify -> opus-repair -> block-reclassify -> pause-gate. This\n# node only runs `when: $block-reclassify.output.status == 'PROCEED'`. We keep a\n# belt-and-suspenders re-check here (defense in depth) but it must NEVER be the place\n# a block surfaces as a raw failure -- if status isn't PROCEED we should not be here.\nRECLASS_STATUS=$(printf '%s\\n' \"$RECLASS\" | sed -n 's/.*\"status\":\"\\([A-Z_]*\\)\".*/\\1/p' | head -1)\nRECLASS_NOTE=$(printf '%s\\n' \"$RECLASS\" | sed -n 's/.*\"note\":\"\\([a-z0-9_-]*\\)\".*/\\1/p' | head -1)\n# Approve-with-fix bridge: a BLOCKED run may legitimately commit if the operator chose\n# APPROVE-WITH-FIX at the gate AND the post-fix re-review (apply-diff-review-final,\n# classified by classify-apply-review) came back satisfied. Read both from node outputs.\nGATE_VERB=$(printf '%s\\n' \"$PAUSE_GATE\" | sed -n 's/.*\"decision_verb\":\"\\([a-z_]*\\)\".*/\\1/p' | head -1)\nAPPLY_VERDICT=$(printf '%s\\n' \"$APPLY_REVIEW\" | sed -n 's/.*\"verdict\":\"\\([a-z_]*\\)\".*/\\1/p' | head -1)\nAPPROVE_WITH_FIX_OK=false\nif [ \"$GATE_VERB\" = \"approve_with_fix\" ] && [ \"$APPLY_VERDICT\" = \"satisfied\" ]; then\n  APPROVE_WITH_FIX_OK=true\nfi\n# Opus autonomous re-review bridge (WO-HARNESS-OPUS-REPAIR-AUTONOMOUS-REREVIEW-01,\n# Codex revision 2026-06-26): a BLOCKED run that opus-repair fixed AND classify-opus-rereview\n# marked satisfied causes block-reclassify to emit PROCEED with note\n# \"opus-repaired-and-rereviewed-satisfied\". In that path diff-review-final is still\n# needs_revision (it is what triggered the block in the first place) and approve-with-fix\n# is not used. Authorize commit here by reading the opus rereview verdict directly --\n# mirrors the approve-with-fix bridge above. Fail CLOSED: missing/unparseable verdict\n# never grants authorization.\nOPUS_REREVIEW_VERDICT=$(printf '%s\\n' \"$OPUS_REREVIEW_CLASS\" | sed -n 's/.*\"verdict\":\"\\([a-z_]*\\)\".*/\\1/p' | head -1)\nOPUS_REREVIEW_OK=false\nif [ \"$OPUS_REREVIEW_VERDICT\" = \"satisfied\" ] && [ \"$RECLASS_NOTE\" = \"opus-repaired-and-rereviewed-satisfied\" ]; then\n  OPUS_REREVIEW_OK=true\nfi\nif [ \"$RECLASS_STATUS\" != \"PROCEED\" ] && [ \"$APPROVE_WITH_FIX_OK\" != \"true\" ] && [ \"$OPUS_REREVIEW_OK\" != \"true\" ]; then\n  echo \"ERROR: commit-and-push reached with status='$RECLASS_STATUS' and no satisfied approve-with-fix or opus-rereview authorization. Refusing to commit.\" >&2\n  exit 1\nfi\n# Final-review sanity (still required for a real build): diff-review-final must be satisfied,\n# OR an explicit downstream authorization (approve-with-fix re-review satisfied, or opus\n# autonomous re-review satisfied) overrides it. Anchor-free parse (defense-in-depth mirror\n# of block-classify). Fail-closed: anything other than an explicit satisfied leaves the\n# gate refusing unless one of the two downstream bridges is true.\nfinal_verdict_cap=$(printf '%s\\n' \"$DIFF_FINAL\" \\\n  | grep -oE 'DIFF_REVIEW_FINAL=(satisfied|needs_revision)' \\\n  | tail -n 1)\nif [ \"$final_verdict_cap\" != \"DIFF_REVIEW_FINAL=satisfied\" ] && [ \"$APPROVE_WITH_FIX_OK\" != \"true\" ] && [ \"$OPUS_REREVIEW_OK\" != \"true\" ]; then\n  echo \"ERROR: neither diff-review-final, a satisfied approve-with-fix re-review, nor a satisfied opus autonomous re-review authorizes this commit -- refusing (defense in depth).\" >&2\n  exit 1\nfi\n# Defect 1 (WO-HARNESS-CAULDRON-DEFECT-CLEANUP-01): tolerate leading whitespace\n# and code-fence indentation. The strict ^ anchor broke when an agent emitted\n# push_target inside an indented ```text fence (PR #165 anchor run 9069e99c).\nBRANCH=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^[[:space:]]*push_target:[[:space:]]*feature-branch:[[:space:]]*\\([^[:space:]]*\\)[[:space:]]*$/\\1/p' | head -n 1)\nif [ -z \"$BRANCH\" ]; then\n  echo \"No feature branch target found in decide-push-target output.\" >&2\n  exit 1\nfi\n# F-6A: Validate BRANCH against allowlist regex BEFORE constructing UNIQUE_BRANCH.\n# WO-HARNESS-PUSH-CORRECTNESS-HARDENING-01 (anchor 2026-05-18: three WOs hit\n# double-suffix branch names like archon/thread-9772643d-thread-9772643d).\n# The engine appends -thread-<hash> at push time, so the agent must emit a\n# clean feat/|fix/|wip/ prefix only. archon/thread- prefix is rejected here\n# because it would produce a double-suffix UNIQUE_BRANCH.\nBRANCH_PATTERN='^(feat/[A-Za-z0-9_-]+|fix/[A-Za-z0-9_-]+|wip/[A-Za-z0-9_-]+)$'\nif ! printf '%s\\n' \"$BRANCH\" | grep -Eq \"$BRANCH_PATTERN\"; then\n  echo \"Malformed branch name: $BRANCH does not match required pattern feat/|fix/|wip/|archon/thread-\" >&2\n  exit 1\nfi\n# WO-HARNESS-YAML-USE-THREAD-BRANCH-NOT-FEATURE-BRANCH-01\n# Engine already provides a unique archon/thread-<hash> branch per run.\n# Derive a unique remote push target from it instead of clobbering a shared name.\nTHREAD_ID=$(git rev-parse --abbrev-ref HEAD | sed 's|archon/thread-||')\nUNIQUE_BRANCH=\"${BRANCH}-thread-${THREAD_ID}\"\ngit status --short\nDIRTY=$(git status --porcelain)\nif [ -z \"$DIRTY\" ]; then\n  # WO-HARNESS-COMMIT-AND-PUSH-ORIGIN-VERIFY-02: do NOT exit 0 here on the\n  # \"HEAD matches origin\" heuristic. The only invariant that matters is\n  # origin/${UNIQUE_BRANCH} == local HEAD, verified by ls-remote at the END\n  # of this node (after the push loop). A clean tree that already matches\n  # origin simply makes the push a no-op + the verify a pass. Falling\n  # through (instead of exit 0) guarantees every path hits the final verify.\n  # WO-HARNESS-COMMIT-AND-PUSH-BACKSTOP-FALSE-NEGATIVE-01: a clean working\n  # tree does NOT mean the implement loop skipped work - it may have committed\n  # and left the tree clean. Count COMMITS_AHEAD to distinguish true no-op\n  # from pre-committed work that still needs pushing.\n  if git rev-parse --quiet --verify \"origin/${UNIQUE_BRANCH}\" >/dev/null 2>&1; then\n    COMMITS_AHEAD=$(git rev-list --count \"origin/${UNIQUE_BRANCH}..HEAD\" 2>/dev/null || echo 0)\n  else\n    COMMITS_AHEAD=$(git rev-list --count HEAD --not --remotes=origin 2>/dev/null || echo 0)\n  fi\n  if [ \"$COMMITS_AHEAD\" = \"0\" ]; then\n    # F-7C: origin/${UNIQUE_BRANCH} may be missing because the implement\n    # loop already pushed to a different remote branch (e.g. the engine's\n    # archon/thread-<hash> ref). Search git ls-remote origin for any ref\n    # whose HEAD SHA matches local HEAD; if found, retarget UNIQUE_BRANCH\n    # to that name and proceed (push will be a no-op).\n    # WO-HARNESS-PUSH-CORRECTNESS-HARDENING-01 (anchor 2026-05-18:\n    # WO-HARNESS-OVERSEER-FAILURE-CLASSES-EXPANSION-01 12:03 UTC, commit\n    # 2d5f6ac0 on origin/archon/thread-9772643d but UNIQUE_BRANCH was\n    # archon/thread-9772643d-thread-9772643d).\n    LOCAL_HEAD=$(git rev-parse HEAD)\n    RECOVERED=$(git ls-remote origin 2>/dev/null \\\n      | awk -v sha=\"$LOCAL_HEAD\" '$1 == sha {sub(/^refs\\/heads\\//, \"\", $2); print $2}' \\\n      | head -1)\n    if [ -n \"$RECOVERED\" ]; then\n      echo \"Recovered push target from remote: $RECOVERED\"\n      UNIQUE_BRANCH=\"$RECOVERED\"\n    else\n      echo \"No changed files and no commits ahead of origin/${UNIQUE_BRANCH} -- implement loop did not produce work\" >&2\n      exit 1\n    fi\n  else\n    echo \"Backstop: $COMMITS_AHEAD commit(s) ahead of origin -- pushing pre-committed work.\"\n  fi\nelse\n  # Dirty working tree: stage + validate against plan + commit\n  CHANGED_FILES=$(printf '%s\\n' \"$DIRTY\" | awk '{print substr($0,4)}')\n  # Auto-tolerated files: dependency lockfiles + standard auto-regenerated\n  # artifacts managed by package managers during the implement loop.\n  # Without this allowlist, adding a dependency causes bun.lock regeneration\n  # which trips the strict-allowlist check.\n  AUTO_TOLERATED='^(bun\\.lock|package-lock\\.json|yarn\\.lock|pnpm-lock\\.yaml|\\.bun-tag|node_modules/)$'\n  printf '%s\\n' \"$CHANGED_FILES\" | while IFS= read -r path; do\n    if [ -z \"$path\" ]; then\n      continue\n    fi\n    # Skip allowlist check for auto-managed files; just stage them.\n    if printf '%s\\n' \"$path\" | grep -Eq \"$AUTO_TOLERATED\"; then\n      echo \"Auto-tolerated change (lockfile/managed): $path\"\n      git add -- \"$path\"\n      continue\n    fi\n    if ! printf '%s\\n' \"$PLAN_OUTPUT\" | grep -F -- \"$path\" >/dev/null; then\n      # WO-HARNESS-COMMIT-PLAN-DEVIATION-WARN-NOT-FAIL-01 (2026-06-21): the plan\n      # node is a PREDICTION, not a perfection contract. Legitimate builds routinely\n      # touch a file the plan did not pre-name (scope discovered during implement).\n      # This was an exit-1 hard-fail that killed otherwise-good builds AFTER they had\n      # already passed war-council-validator + diff-review -- both of which review the\n      # FULL captured diff (capture-diff: git diff $MB..HEAD + git diff HEAD), so an\n      # unplanned file is already REVIEWED, just not pre-declared. The fraud concern\n      # (silent unrelated commits) is covered by that upstream full-diff review, so\n      # warn loudly + commit instead of failing closed. The warning is greppable for\n      # audit (PLAN_DEVIATION) and surfaces in the manifest.\n      echo \"PLAN_DEVIATION: changed file not pre-listed in plan (reviewed upstream, committing): $path\" >&2\n    fi\n    git add -- \"$path\"\n  done\n  if git diff --cached --quiet; then\n    echo \"No changes staged; nothing for backstop to commit.\" >&2\n    exit 0\n  fi\n  COMMIT_MESSAGE=$(printf '%s\\n' \"$PLAN_OUTPUT\" | sed -n 's/^Commit message: //p' | head -n 1)\n  if [ -z \"$COMMIT_MESSAGE\" ]; then\n    # Re-derive WO_ID locally - see post-started for rationale\n    WO_ID=\"${WO_ID:-$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)}\"\n    COMMIT_MESSAGE=\"feat: ${WO_ID} implementation\"\n  fi\n  git commit -m \"$COMMIT_MESSAGE\"\nfi\n\n# WO-169: real retry guard. 3 attempts, 5s/10s/15s backoff, fail closed.\n# No `|| echo 'STATUS=*_failed'` swallow -- this node is load_bearing.\n# WO-HARNESS-YAML-USE-THREAD-BRANCH-NOT-FEATURE-BRANCH-01: push via refspec\n# so the local archon/thread-<hash> branch lands on a unique remote name\n# (UNIQUE_BRANCH) and does not collide with other parallel runs.\nPUSH_OK=false\nfor attempt in 1 2 3; do\n  if git push origin HEAD:\"${UNIQUE_BRANCH}\" 2>&1; then\n    PUSH_OK=true\n    break\n  fi\n  echo \"WARN: push attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PUSH_OK\" = \"false\" ]; then\n  echo \"ERROR: git push failed after 3 attempts -- aborting workflow (load_bearing node).\" >&2\n  exit 1\nfi\n# WO-HARNESS-COMMIT-AND-PUSH-ORIGIN-VERIFY-02: the ONLY success invariant.\n# Clean-tree / commits-ahead-0 / HEAD-reachable-from-some-remote are NOT\n# valid proxies. The canonical PR branch MUST be on origin at local HEAD\n# before open-pr-if-needed runs, or work is lost when the worktree is cleaned\n# (anchors: Lane A runs ac2777a3 + f6e24ac2, 2026-05-25 -- both lost the\n# report at open-pr because the branch was never durably on origin).\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${UNIQUE_BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nLOCAL_HEAD=\"$(git rev-parse HEAD)\"\nif [ \"$REMOTE_HEAD\" != \"$LOCAL_HEAD\" ]; then\n  echo \"FATAL: canonical branch ${UNIQUE_BRANCH} not durably pushed (origin=${REMOTE_HEAD:-<absent>} local=${LOCAL_HEAD})\" >&2\n  exit 1\nfi\necho \"VERIFIED: origin/${UNIQUE_BRANCH} == local HEAD (${LOCAL_HEAD})\"\necho \"unique_branch=${UNIQUE_BRANCH}\"\n"},{id: open-pr-if-needed,persona: major-build,depends_on: [commit-and-push],task_class: clerical,load_bearing: true,bash: "set -euo pipefail\n# 2026-05-16 quote-fix: see commit-and-push for rationale.\nDECIDE_OUTPUT=$decide-push-target.output\n# Extract ONLY the approved-plan block for the PR title/body (F8 fix) -- keep\n# reviewer critique out of the customer-visible PR. FAIL CLOSED if the fence is\n# absent (NF1): never put raw critique-bearing output in the PR body.\nPLAN_REVIEW_RAW=$plan-review.output\nPLAN_OUTPUT=$(printf '%s\\n' \"$PLAN_REVIEW_RAW\" | sed -n '/=== APPROVED_PLAN_BEGIN ===/,/=== APPROVED_PLAN_END ===/p' | sed '1d;$d')\nif [ -z \"$PLAN_OUTPUT\" ]; then\n  echo \"ERROR: plan-review output missing the APPROVED_PLAN fence -- cannot build PR body (NF1 fail-closed).\" >&2\n  exit 1\nfi\nIMPLEMENT_OUTPUT=$implement.output\nVALIDATOR_OUTPUT=$war-council-validator.output\nCOMMIT_PUSH_OUTPUT=$commit-and-push.output\nif ! printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -q '^pr_required: true'; then\n  echo \"PR not required; skipping.\"\n  exit 0\nfi\n# WO-HARNESS-YAML-USE-THREAD-BRANCH-NOT-FEATURE-BRANCH-01: read the unique\n# remote branch the commit-and-push node pushed to; gh pr create must use\n# --head to target that branch rather than the (local) archon/thread-<hash>.\nUNIQUE_BRANCH=$(printf '%s\\n' \"$COMMIT_PUSH_OUTPUT\" | sed -n 's/^unique_branch=//p' | head -n 1)\nif [ -z \"$UNIQUE_BRANCH\" ]; then\n  echo \"UNIQUE_BRANCH not found in commit-and-push output.\" >&2\n  exit 1\nfi\n# WO-HARNESS-COMMIT-AND-PUSH-ORIGIN-VERIFY-02: precondition guard. Re-verify\n# the canonical branch is on origin at local HEAD BEFORE attempting any PR.\n# If commit-and-push's verify passed this should always hold; failing here\n# means the branch was lost between nodes -- abort before wasting gh retries.\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${UNIQUE_BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nif [ \"$REMOTE_HEAD\" != \"$(git rev-parse HEAD)\" ]; then\n  echo \"FATAL: open-pr precondition failed -- ${UNIQUE_BRANCH} not on origin at HEAD (origin=${REMOTE_HEAD:-<absent>}).\" >&2\n  exit 1\nfi\n# Rule 29: extract explicit repo from decide-push-target output.\n# Never let gh default to the worktree's origin -- it may be bdc-harness\n# even when the spec targets bdc-xo or lspro-react.\nREPO=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^repo: //p' | head -n 1)\nif [ -z \"$REPO\" ] || [ \"$REPO\" = \"unknown\" ]; then\n  echo \"ERROR: decide-push-target did not emit a valid 'repo: <owner>/<repo>'.\" >&2\n  echo \"Fix the spec to include 'target_repo:' or '**Target repo:**' and re-run.\" >&2\n  exit 1\nfi\n# F-8C: Rule 20 staging-gate repos (lspro-react, shopops-storefront, shopops)\n# require PRs to target staging instead of the repo default branch.\n# decide-push-target emits \"staging_gate_required: true|false\"; when true,\n# this node passes --base staging to gh pr create (otherwise it omits --base\n# and lets gh use the repo default).\n# WO-HARNESS-PUSH-CORRECTNESS-HARDENING-01 (closes Rule 20 bypass hole 2026-05-18).\nSTAGING_GATE=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -c '^staging_gate_required: true' 2>/dev/null || true)\nSTAGING_GATE=\"${STAGING_GATE:-0}\"\nif [ \"$STAGING_GATE\" -ge 1 ] 2>/dev/null; then\n  BASE_BRANCH=\"staging\"\nelse\n  BASE_BRANCH=\"\"\nfi\nTITLE=$(printf '%s\\n' \"$PLAN_OUTPUT\" | sed -n 's/^Commit message: //p' | head -n 1)\nif [ -z \"$TITLE\" ]; then\n  TITLE=\"BDC feature Work Order implementation\"\nfi\nBODY_FILE=$(mktemp)\n{\n  echo \"## Summary\"\n  echo \"$PLAN_OUTPUT\"\n  echo\n  echo \"## Validation\"\n  echo \"Workflow-time verify-* nodes were removed 2026-05-16 (Patch 1) - agent self-verifies in implement loop;\"\n  echo \"real validation gates run at PR time (codex-review + claude-review + Gitleaks + e2e-smoke + Captain CI).\"\n  echo \"See implement output below for what the builder verified locally.\"\n  echo\n  echo \"## Implement output\"\n  echo \"$IMPLEMENT_OUTPUT\"\n  echo\n  echo \"## Validator\"\n  echo \"$VALIDATOR_OUTPUT\"\n} > \"$BODY_FILE\"\n# WO-169: real retry guard. 3 attempts, 5s/10s/15s backoff, fail closed.\n# No `|| echo 'STATUS=*_failed'` swallow -- this node is load_bearing.\n# Defect 2 (WO-HARNESS-CAULDRON-DEFECT-CLEANUP-01): check-first design.\n# The old retry-first loop reported a false failure when the PR already\n# existed (created by a parallel implement-loop worktree) or when gh pr\n# create succeeded but returned non-zero (gh CLI quirk). PR #167 anchor\n# run a0dae1f8. Now: look for an existing PR BEFORE attempting create, and\n# re-check after each create attempt so a non-zero-exit-but-created PR is\n# caught instead of triggering a spurious failure.\nPR_OK=false\nEXIST=$(gh pr list --repo \"$REPO\" --head \"$UNIQUE_BRANCH\" --state open \\\n  --json url --jq '.[0].url // empty' 2>/dev/null || true)\nif [ -n \"$EXIST\" ]; then\n  echo \"PR_URL=$EXIST\"\n  echo \"PR already exists (no create needed).\"\n  PR_OK=true\nelse\n  for attempt in 1 2 3; do\n    if gh pr create --repo \"$REPO\" --title \"$TITLE\" --body-file \"$BODY_FILE\" --head \"$UNIQUE_BRANCH\" ${BASE_BRANCH:+--base \"$BASE_BRANCH\"} 2>&1; then\n      PR_OK=true\n      break\n    fi\n    # Re-check: gh pr create may have created the PR but returned non-zero.\n    EXIST=$(gh pr list --repo \"$REPO\" --head \"$UNIQUE_BRANCH\" --state open \\\n      --json url --jq '.[0].url // empty' 2>/dev/null || true)\n    if [ -n \"$EXIST\" ]; then\n      echo \"PR_URL=$EXIST\"\n      echo \"PR created despite non-zero exit (gh CLI quirk; PR confirmed via list).\"\n      PR_OK=true\n      break\n    fi\n    echo \"WARN: gh pr create attempt $attempt failed AND no PR found on origin; retrying after $((attempt * 5))s...\" >&2\n    sleep $((attempt * 5))\n  done\nfi\nif [ \"$PR_OK\" = \"false\" ]; then\n  # WO-HARNESS-COMMIT-AND-PUSH-ORIGIN-VERIFY-02: gh pr create failed, but the\n  # canonical branch was VERIFIED on origin at HEAD above (precondition guard\n  # + commit-and-push verify). So the work is NOT lost -- the operator can open\n  # the PR manually from the pushed branch. Emit a salvage manifest line so the\n  # branch + SHA survive in the run output even though the worktree is cleaned.\n  echo \"PR_CREATE_FAILED_BUT_BRANCH_SAFE: repo=${REPO} branch=${UNIQUE_BRANCH} sha=$(git rev-parse HEAD)\" >&2\n  echo \"ERROR: gh pr create failed after 3 attempts -- aborting workflow (load_bearing node).\" >&2\n  echo \"RECOVERY: open the PR manually -> gh pr create --repo ${REPO} --head ${UNIQUE_BRANCH} ${BASE_BRANCH:+--base ${BASE_BRANCH}}\" >&2\n  exit 1\nfi\n"},{id: build-manifest,persona: major-build,provider: claude,model: "opus[1m]",depends_on: [open-pr-if-needed,block-reclassify,pause-gate],trigger_rule: all_done,task_class: clerical,prompt: "Construct the Captain CI completion manifest for this BDC feature Work Order.\n\n## Outcome branch (Fix D, 2026-05-30) -- read this FIRST\nblock-reclassify status: $block-reclassify.output\n- If status=PROCEED: a real build was committed + a PR opened. Build the full v2\n  manifest below (this is the normal case).\n- If status=ALREADY_SATISFIED: the WO was already implemented in this worktree; no\n  commit/PR. Emit a SHORT manifest: WO ID, OUTCOME=ALREADY_SATISFIED, the evidence\n  from check-already-satisfied, VALIDATION: PASS (verified no-op). Do NOT claim a PR.\n- If status=BLOCKED: the run paused for human correction (pause-gate). Emit\n  OUTCOME=BLOCKED, the block reason, what the AI tiers tried, VALIDATION: BLOCKED.\n  Do NOT claim a PR or DONE.\n\n## Inputs\nSpec:\n$read-spec.output\n\nPlan (approved -- reviewed + revised by plan-review; use the APPROVED_PLAN block):\n$plan-review.output\n\nImplementation:\n$implement.output\n\nCommit and push evidence (ground truth for HEAD/branch):\n$commit-and-push.output\n\nPR evidence (ground truth PR URL/state):\n$open-pr-if-needed.output\n\nVerification:\n(Workflow-time verify-build/types/tests removed 2026-05-16 - agent self-verifies in\nimplement loop, PR-time gates handle real validation. See implement output above.)\n\nValidator:\n$war-council-validator.output\n\nPlan review verdict (self-repair loop -- record PLAN_REVIEW_PASS + RISK as evidence):\n$plan-review.output\n\nDiff review (Codex, initial):\n$diff-review.output\n\nDiff review (Codex, final after repair):\n$diff-review-final.output\n\n## Required Manifest Fields -- v2 labels (validator-compatible)\nEmit these labels verbatim at the top of the manifest (one per line):\n  WO: <WO ID from spec>\n  Builder: <persona>\n  Files created: <comma-separated list -- ONLY files added in the diff; or \"none\">\n  Files modified: <comma-separated list -- ONLY files changed in the diff; or \"none\">\n  Tests: <N passing / N total> or N/A (<reason>)\n  PRs: <PR URL> or N/A (ALREADY_SATISFIED or BLOCKED)\n  Merge ancestors: <merge-base SHA>...<HEAD SHA> (behind_by=<N>) or N/A\n  Grep assertions: <command> => <N> lines; or N/A (manifest auto-generated; see Tests)\n  Runtime verification: <evidence> or N/A (<reason>)\n  VALIDATION: PASS   <- only when all in-run reviews passed\nNOTE: derive Files created/modified from the git diff -- do NOT list preserved/unchanged\nfiles. If no files changed (ALREADY_SATISFIED), emit \"Files created: none\" only.\n\n## In-run review evidence (record as evidence, NOT vibes -- doctrine\nself-repair-review-loops)\n- plan-review verdict (PLAN_REVIEW_PASS + RISK)\n- diff-review-final verdict (DIFF_REVIEW_FINAL)\n- diff-review provider used (codex cross-model, OR claude-fallback with\n  CROSS_MODEL_REVIEW=false disclosed)\nIf any in-run review was skipped or ended needs_revision, VALIDATION cannot be PASS.\n"},{"id":"manifest-consistency-check","persona":"major-build","load_bearing":true,"depends_on":["build-manifest","open-pr-if-needed","block-reclassify"],"trigger_rule":"all_done","task_class":"clerical","bash":"set -euo pipefail\n\ncapture_node_output() {\n  python3 -c 'import shlex, sys; s=sys.stdin.read(); sys.stdout.write((lambda p: p[0] if len(p)==1 else s)(shlex.split(s)) if len(s)>=2 and s[0]==\"'\"'\"'\" and s.rstrip(\"\\n\").endswith(\"'\"'\"'\") else s)'\n}\n\nRECLASSIFY=$(capture_node_output <<'BDC_NODE_OUTPUT_BLOCK_RECLASSIFY'\n$block-reclassify.output\nBDC_NODE_OUTPUT_BLOCK_RECLASSIFY\n)\nSTATUS=$(printf '%s\\n' \"$RECLASSIFY\" | sed -n 's/.*\"status\":\"\\([A-Z_]*\\)\".*/\\1/p' | head -1)\n\nOPEN_PR_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_OPEN_PR'\n$open-pr-if-needed.output\nBDC_NODE_OUTPUT_OPEN_PR\n)\nPR_URL=$(printf '%s\\n' \"$OPEN_PR_OUT\" | grep -E '^PR_URL=' | sed 's/^PR_URL=//' | head -1 || true)\nif [ -z \"$PR_URL\" ]; then\n  PR_URL=$(printf '%s\\n' \"$OPEN_PR_OUT\" | grep -E '^https://github\\.com/' | head -1 || true)\nfi\n\nMANIFEST_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_MANIFEST'\n$build-manifest.output\nBDC_NODE_OUTPUT_MANIFEST\n)\nextract() {\n  { printf '%s\\n' \"$MANIFEST_OUT\" | grep -E \"^${1}:\" | head -1 | sed \"s/^${1}:[[:space:]]*//\"; } || true\n}\nPRS_LINE=$(extract \"PRs\")\n\nif [ \"$STATUS\" = \"PROCEED\" ] && [ -n \"$PR_URL\" ]; then\n  PRS_LOWER=$(printf '%s\\n' \"$PRS_LINE\" | tr '[:upper:]' '[:lower:]')\n  if printf '%s\\n' \"$PRS_LOWER\" | grep -Eq 'no commit|no pr|not opened|n/a' \\\n    && ! printf '%s\\n' \"$PRS_LINE\" | grep -Fq \"$PR_URL\"; then\n    WT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\n    HEAD_SHA=$(git -C \"$WT\" rev-parse HEAD 2>/dev/null || echo unknown)\n    RUN_START_SHA=$(cat \"${ARTIFACTS_DIR:-}/run-start-sha.txt\" 2>/dev/null || echo unknown)\n    BRANCH=$(git -C \"$WT\" rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)\n    ORIGIN_HEAD=$(git -C \"$WT\" log -1 --format=%H \"origin/${BRANCH}\" 2>/dev/null || echo unknown)\n    PR_STATE=$(gh pr view \"$PR_URL\" --json state,number --jq '\"#\" + (.number|tostring) + \" \" + .state' 2>/dev/null || echo unknown)\n    echo \"SELF_CONSISTENCY_ERROR: build-manifest claims \\\"${PRS_LINE}\\\" but block-reclassify=PROCEED and open-pr-if-needed resolved PR_URL=${PR_URL} (HEAD=${HEAD_SHA}, RUN_START_SHA=${RUN_START_SHA}, origin/${BRANCH}=${ORIGIN_HEAD}, PR=${PR_STATE})\" >&2\n    exit 1\n  fi\nfi\n\nprintf 'OK\\n'\n"},{id: patch-pr-body,persona: major-build,depends_on: [build-manifest, manifest-consistency-check],when: "$manifest-consistency-check.output == 'OK'",trigger_rule: all_done,task_class: clerical,bash: "set -euo pipefail\n\ncapture_node_output() {\n  # Node output refs are substituted before bash runs. Capturing them via a\n  # quoted heredoc keeps raw backticks, quotes, and $() literal; the Python\n  # shim also normalizes the current executor's shell-quoted substitution.\n  python3 -c 'import shlex, sys; s=sys.stdin.read(); sys.stdout.write((lambda p: p[0] if len(p)==1 else s)(shlex.split(s)) if len(s)>=2 and s[0]==\"'\"'\"'\" and s.rstrip(\"\\n\").endswith(\"'\"'\"'\") else s)'\n}\n\n# -- Outcome guard: only patch on PROCEED (a real PR was opened).\nRECLASSIFY=$(capture_node_output <<'BDC_NODE_OUTPUT_BLOCK_RECLASSIFY'\n$block-reclassify.output\nBDC_NODE_OUTPUT_BLOCK_RECLASSIFY\n)\nSTATUS=$(printf '%s\\n' \"$RECLASSIFY\" | sed -n 's/.*\"status\":\"\\([A-Z_]*\\)\".*/\\1/p' | head -1)\nif [ \"$STATUS\" != \"PROCEED\" ]; then\n  echo \"patch-pr-body: status=$STATUS -- skipping PR body patch (no real PR on this path).\"\n  exit 0\nfi\n\n# -- Resolve PR URL from open-pr-if-needed output.\n# gh pr create success path prints a bare URL line; the race-recovery path\n# emits \"PR_URL=<url>\". Handle both.\nOPEN_PR_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_OPEN_PR'\n$open-pr-if-needed.output\nBDC_NODE_OUTPUT_OPEN_PR\n)\nPR_URL=$(printf '%s\\n' \"$OPEN_PR_OUT\" | grep -E '^PR_URL=' | sed 's/^PR_URL=//' | head -1 || true)\nif [ -z \"$PR_URL\" ]; then\n  PR_URL=$(printf '%s\\n' \"$OPEN_PR_OUT\" | grep -E '^https://github\\.com/' | head -1 || true)\nfi\nif [ -z \"$PR_URL\" ]; then\n  echo \"ERROR: could not resolve PR URL from open-pr-if-needed output -- cannot patch body.\" >&2\n  exit 1\nfi\n\n# -- Resolve REPO from decide-push-target output (Rule 29: never let gh\n#    default to the worktree's origin).\nDECIDE_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_DECIDE'\n$decide-push-target.output\nBDC_NODE_OUTPUT_DECIDE\n)\nREPO=$(printf '%s\\n' \"$DECIDE_OUT\" | sed -n 's/^repo: //p' | head -1)\nif [ -z \"$REPO\" ] || [ \"$REPO\" = \"unknown\" ]; then\n  echo \"ERROR: REPO not resolved from decide-push-target output.\" >&2\n  exit 1\nfi\n\n# -- Derive base branch from the ACTUAL PR (gh pr view), not from a guess.\n#    open-pr-if-needed passes --base staging for staging-gate repos and\n#    otherwise omits --base, so gh uses each repo's default branch (which\n#    may be 'main' on some repos and 'dev' on others). Asking the PR for\n#    its baseRefName is the only reliable source.\nPR_BASE=$(gh pr view \"$PR_URL\" --repo \"$REPO\" --json baseRefName --jq '.baseRefName' 2>/dev/null || echo \"\")\nif [ -z \"$PR_BASE\" ]; then\n  echo \"ERROR: could not read baseRefName from $PR_URL (gh pr view failed) -- cannot derive file lists.\" >&2\n  exit 1\nfi\nBASE_REF=\"origin/${PR_BASE}\"\n# Make sure the local ref is fresh enough to diff against -- in container\n# runs the worktree may not have fetched the latest base.\ngit fetch --quiet origin \"${PR_BASE}\" 2>/dev/null || true\n\n# If origin/<base> is not present in this (possibly sparse) worktree, fall back so the\n# diff is computed against a real ref instead of silently returning empty (which used to\n# trip the grep/pipefail abort and skip the manifest entirely).\nEMPTY_TREE_FALLBACK=0\nif ! git rev-parse --verify --quiet \"${BASE_REF}\" >/dev/null 2>&1; then\n  if git rev-parse --verify --quiet FETCH_HEAD >/dev/null 2>&1; then\n    BASE_REF=\"FETCH_HEAD\"\n  else\n    # Empty-tree sha (git's well-known empty tree object). Diffing HEAD against it lists\n    # every tracked file as added -- a safe last resort for a fresh branch.\n    # NOTE: git's three-dot symmetric-diff syntax (BASE...HEAD) requires BOTH endpoints\n    # to be commit-ish; a tree object is rejected. The two-arg form (BASE HEAD) accepts\n    # a tree on the left and produces the same \"every tracked file added\" listing we want.\n    BASE_REF=\"$(git hash-object -t tree /dev/null)\"\n    EMPTY_TREE_FALLBACK=1\n  fi\nfi\n\n# -- Derive file lists from git diff --name-status (the #307 lesson: NEVER\n#    list preserved/unchanged files -- the validator's sparse checkout\n#    cannot see them and CHECK 2 will fail). Map every status the validator\n#    understands so deletion-only and rename-only PRs do not emit 'none':\n#      A         -> Files created\n#      M         -> Files modified\n#      D         -> Files modified, annotated \"(deleted)\"  (validator\n#                   CHECK 2 confirms via `git log --diff-filter=D`)\n#      R<score>  -> rename: new path -> Files created;\n#                   old path -> Files modified \"(deleted)\"\n#      C<score>  -> copy:   new path -> Files created (source untouched)\nif [ \"$EMPTY_TREE_FALLBACK\" = \"1\" ]; then\n  # Two-arg form: compares the empty tree object directly against HEAD and lists every\n  # tracked file as added. Symmetric-diff (...) would silently fail here because a tree\n  # is not commit-ish, and the `|| true` would mask the failure as an empty NAME_STATUS.\n  NAME_STATUS=$(git diff --name-status \"${BASE_REF}\" HEAD 2>/dev/null || true)\nelse\n  NAME_STATUS=$(git diff --name-status \"${BASE_REF}...HEAD\" 2>/dev/null || true)\nfi\nFILES_CREATED=$(printf '%s\\n' \"$NAME_STATUS\" | awk -F'\\t' '\n  $1==\"A\"           { print $2 }\n  $1 ~ /^R[0-9]*$/  { print $3 }\n  $1 ~ /^C[0-9]*$/  { print $3 }\n' | awk 'NF' | paste -sd ',' -)\nFILES_MODIFIED=$(printf '%s\\n' \"$NAME_STATUS\" | awk -F'\\t' '\n  $1==\"M\"           { print $2 }\n  $1==\"D\"           { printf \"%s (deleted)\\n\", $2 }\n  $1 ~ /^R[0-9]*$/  { printf \"%s (deleted)\\n\", $2 }\n' | awk 'NF' | paste -sd ',' -)\n[ -z \"$FILES_CREATED\" ] && FILES_CREATED=\"none\"\n[ -z \"$FILES_MODIFIED\" ] && FILES_MODIFIED=\"none\"\n\n# -- Extract structured fields from build-manifest AI output.\nMANIFEST_OUT=$(capture_node_output <<'BDC_NODE_OUTPUT_MANIFEST'\n$build-manifest.output\nBDC_NODE_OUTPUT_MANIFEST\n)\nextract() {\n  # pipefail-safe: grep exits 1 when the field line is absent; under\n  # set -euo pipefail that would abort the whole node mid-manifest. The\n  # `|| true` makes a missing field yield empty (the [ -z ] guards below\n  # supply the fallback) instead of killing patch-pr-body. (Hotfix\n  # 2026-06-26: second grep/pipefail trap in this node, same class as the\n  # file-list awk-NF fix.)\n  { printf '%s\\n' \"$MANIFEST_OUT\" | grep -E \"^${1}:\" | head -1 | sed \"s/^${1}:[[:space:]]*//\"; } || true\n}\nWO_LINE=$(extract \"WO\")\nBUILDER_LINE=$(extract \"Builder\")\nTESTS_LINE=$(extract \"Tests\")\nPRS_LINE=$(extract \"PRs\")\nif [ -z \"$PRS_LINE\" ]; then\n  PRS_LINE=\"$PR_URL\"\nfi\nMERGE_ANCS=$(extract \"Merge ancestors\")\nif [ -z \"$MERGE_ANCS\" ]; then\n  MB=$(git merge-base \"$BASE_REF\" HEAD 2>/dev/null || echo \"\")\n  HEAD_SHA=$(git rev-parse HEAD 2>/dev/null || echo \"\")\n  BEHIND=$(git rev-list --count \"HEAD..${BASE_REF}\" 2>/dev/null || echo \"0\")\n  if [ -n \"$MB\" ] && [ -n \"$HEAD_SHA\" ]; then\n    MERGE_ANCS=\"${MB}...${HEAD_SHA} (behind_by=${BEHIND})\"\n  else\n    MERGE_ANCS=\"N/A\"\n  fi\nfi\nGREP_ASSERT=$(extract \"Grep assertions\")\n[ -z \"$GREP_ASSERT\" ] && GREP_ASSERT=\"N/A (manifest auto-generated; see Tests)\"\nRT_VERIFY=$(extract \"Runtime verification\")\n[ -z \"$RT_VERIFY\" ] && RT_VERIFY=\"N/A (deploy via sync-workflows.sh; see workflow run)\"\n# -- Validation line: extract the explicit VALIDATION (or INFRA VALIDATION)\n#    marker emitted by build-manifest. Fail CLOSED if it is missing -- per\n#    Rule 14 the manifest MUST include a validation line, and silently\n#    defaulting to \"VALIDATION: PASS\" would let an unvalidated build\n#    slip past Captain CI (the #321 hazard).\nVALIDATION_LINE=$(printf '%s\\n' \"$MANIFEST_OUT\" | grep -E '^(INFRA )?VALIDATION:' | head -1 || true)\nif [ -z \"$VALIDATION_LINE\" ]; then\n  VALIDATION_LINE=\"VALIDATION: NOT_EMITTED -- build-manifest did not include a VALIDATION line; Captain CI must reject\"\nfi\n\n# -- Assemble v2 manifest block. Use printf (not heredoc) so the bash\n#    source stays indented inside the YAML block scalar.\nMANIFEST_BLOCK=$(printf '%s\\n' \\\n  \"WO: ${WO_LINE}\" \\\n  \"Builder: ${BUILDER_LINE}\" \\\n  \"Files created: ${FILES_CREATED}\" \\\n  \"Files modified: ${FILES_MODIFIED}\" \\\n  \"Tests: ${TESTS_LINE}\" \\\n  \"PRs: ${PRS_LINE}\" \\\n  \"Merge ancestors: ${MERGE_ANCS}\" \\\n  \"Grep assertions: ${GREP_ASSERT}\" \\\n  \"Runtime verification: ${RT_VERIFY}\" \\\n  \"${VALIDATION_LINE}\")\n\n# -- Build new PR body. Fetch current body, strip any prior manifest block\n#    using a unique sentinel (HTML comment) so we never accidentally cut\n#    legitimate \"---\" rules out of the prose. Idempotent: a re-run starts\n#    from a stub body OR a previously-patched body and yields a single block.\nCURRENT_BODY=$(gh pr view \"$PR_URL\" --repo \"$REPO\" --json body --jq '.body' 2>/dev/null || echo \"\")\nPROSE=$(printf '%s\\n' \"$CURRENT_BODY\" | awk '/^<!-- bdc-manifest-start -->$/{exit} {print}')\n\nBODY_FILE=$(mktemp)\n{\n  printf '%s\\n' \"$PROSE\"\n  echo \"\"\n  echo \"<!-- bdc-manifest-start -->\"\n  printf '%s\\n' \"$MANIFEST_BLOCK\"\n  echo \"<!-- bdc-manifest-end -->\"\n} > \"$BODY_FILE\"\n\n# -- Patch the PR body.\ngh pr edit \"$PR_URL\" --repo \"$REPO\" --body-file \"$BODY_FILE\"\necho \"patch-pr-body: PR body updated with v2 manifest.\"\necho \"PR_URL=$PR_URL\"\n"},{id: flip-notion,persona: xo,provider: claude,model: sonnet,depends_on: [build-manifest],trigger_rule: all_done,task_class: clerical,prompt: "Update the Notion Work Order page if Notion MCP is available in this runtime.\n\n## Outcome branch (Fix D, 2026-05-30) -- read block-reclassify FIRST\nblock-reclassify status: $block-reclassify.output\n- status=PROCEED: set Claude Status: REVIEW, Status: Review, add the manifest as a\n  page comment (normal case).\n- status=ALREADY_SATISFIED: set Claude Status: REVIEW with a note that the WO was\n  already implemented (verified no-op); add the short manifest. Do NOT claim a PR.\n- status=BLOCKED: do NOT flip to REVIEW. Add a comment that the run PAUSED for human\n  correction with the block reason, and emit an XO_ACTION line. Leave status as-is.\n\n## Manifest\n$build-manifest.output\n\nIf Notion MCP is not available inside the container, do not invent a workaround.\nEmit an XO_ACTION line asking XO to flip Notion manually with the manifest above.\n"},{id: flip-notion-on-failure,persona: xo,provider: claude,model: sonnet,depends_on: [war-council-validator,flip-notion],trigger_rule: all_done,task_class: clerical,prompt: "FALLBACK Notion flip. Update Notion ONLY if the normal flip-notion node did NOT\nalready flip the WO to REVIEW, AND the build was genuinely good. This is a\nsafety net for the harness tail-node defect (cauldron-fallback-recovery doctrine).\n\n## Step 1 -- did the normal flip already happen? (idempotency guard)\nflip-notion node output: $flip-notion.output\n- If $flip-notion.output shows the WO was already flipped to REVIEW (Claude Status\n  REVIEW / Status Review set successfully), STOP. Do nothing. Emit:\n  \"FALLBACK_FLIP_SKIPPED: normal flip-notion already set REVIEW.\" Exit.\n- If $flip-notion.output is empty, errored, or shows the flip did NOT complete,\n  continue to Step 2.\n\n## Step 2 -- was the build actually good? (satisfied-gate -- do NOT flip on a real failure)\nwar-council-validator report: $war-council-validator.output\n- The validator verdict MUST be `satisfied` (look for \"Verdict: satisfied\" or\n  \"VALIDATION: PASS\"). If the verdict is `needs_revision`, `fail`, or the validator\n  never ran (output empty), this is a REAL build failure -- do NOT flip. Emit:\n  \"FALLBACK_FLIP_DECLINED: validator verdict not satisfied; real failure; leaving Notion as-is.\" Exit.\n- Only if the verdict is satisfied, continue to Step 3.\n\n## Step 3 -- perform the fallback flip\nSet on the Notion WO page:\n- Claude Status: REVIEW\n- Status: Review\n- Add a page comment starting EXACTLY with \"FALLBACK PATH:\" so the recovery is\n  greppable, including: which tail node failed (infer from the available outputs),\n  that the validator returned satisfied (build good), and the PR/branch info if present.\n\n## Inputs for the comment\nPush status: $commit-and-push.output (may be empty if commit-and-push failed)\nPR status:   $open-pr-if-needed.output (may be empty if open-pr-if-needed failed)\n\nIf Notion MCP is not available inside the container, do not invent a workaround.\nLog \"FALLBACK_FLIP_DEFERRED: Notion MCP unavailable\" and exit 0.\n"}]}