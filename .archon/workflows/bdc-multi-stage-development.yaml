{name: bdc-multi-stage-development,description: "Use when: Executing a BDC Work Order whose spec declares an ordered `stages:` list\n-- a multi-stage pipeline across one or more repos/targets (connect = 2 stages,\nstorefront = 3-4 stages, future = N). The pipeline builds each stage sequentially,\npinned to its repo + target_branch, gating between stages (PR-open + CI-green +\nreview-clean + mergeable, NOT merged).\nInput: WO_ID in the environment or user message. Spec lives in bdc-xo.\nDoes: Reads the BDC WO spec, parses the explicit per-stage contract, asserts every\nstage's repo is registered, allocates one worktree per stage, runs the\nbdc-feature-development build loop pattern per stage in order, threads forward\nthe prior stage's PR/branch/contract, opens a coordinated PR per stage, builds a\nconsolidated multi-stage manifest, and flips Notion REVIEW only when ALL stages\npass.\nNOT for: Single-repo WOs without an explicit `stages:` declaration -- use\nbdc-feature-development. A 1-stage pipeline IS supported here (N=1 regression\ninvariant -- same stage engine, behavior-equivalent output) but the normal\nsingle-repo route remains bdc-feature-development.\n\nAnchor: 2026-06-09 connect saga -- WO-CONNECT-MANUAL-AND-UI-01 was MIXED-repo\n(shopops-api backend + lspro-react UI). Every fire allocated ONE worktree for ONE\nrepo, leaving the UI half UNBUILDABLE on a git branch. This workflow is the\nstructural fix for the MIXED-repo WO class AND the tenant-storefront deploy engine.\n\nSubstrate: packages/isolation/src/stage-allocator.ts (Phase 1 code change, requires\nrebuild + restart). The allocator's deterministic branch derivation\n(archon/<wo-id>/<stage-id>, NO run-id suffix) is the C5 idempotency contract:\nre-fires UPDATE the same stage branch -- no duplicate-PR spray.\n",policyFile: harness/policies/agent-behavior.md,model: sonnet,nodes: [{id: preflight-github-auth,persona: major-build,load_bearing: true,bash: "set -euo pipefail\nif ! git push --dry-run origin \"HEAD:refs/heads/preflight-auth-probe-$(date +%s)\" 2>&1; then\n  echo \"ERROR: GITHUB auth check failed -- container cannot push to origin.\" >&2\n  echo \"Likely cause: GITHUB_TOKEN missing in executor env, or token lacks repo scope.\" >&2\n  exit 1\nfi\necho \"preflight-github-auth PASS\"\n"},{id: read-spec,persona: xo,depends_on: [preflight-github-auth],bash: "set -euo pipefail\nWO_ID=\"${WO_ID:-}\"\nif [ -z \"$WO_ID\" ]; then\n  WO_ID=$(printf '%s\\n' \"$USER_MESSAGE\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)\nfi\nif [ -z \"$WO_ID\" ]; then\n  echo \"WO_ID missing. Provide WO_ID in environment or user message.\" >&2\n  exit 1\nfi\nSPEC_PATH=\"docs/work-orders/${WO_ID}.md\"\nSPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nif [ -z \"$SPEC_CONTENT\" ]; then\n  SPEC_PATH=\"docs/superpowers/specs/${WO_ID}.md\"\n  SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  MATCH=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main\" --template '{{range .}}{{.path}}{{\"\\n\"}}{{end}}' 2>/dev/null | grep \"${WO_ID}.md$\" | head -n 1)\n  if [ -n \"$MATCH\" ]; then\n    SPEC_PATH=\"$MATCH\"\n    SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' | tr -d '\\n' | base64 -d || true)\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  ISSUE_NUM=$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'issue=[0-9]+' | head -n 1 | cut -d= -f2 || true)\n  if [ -z \"$ISSUE_NUM\" ]; then\n    ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \\\n      --search \"${WO_ID} in:title\" --json number,title \\\n      --jq '.[0].number' 2>/dev/null || true)\n  fi\n  if [ -n \"$ISSUE_NUM\" ] && [ \"$ISSUE_NUM\" != \"null\" ]; then\n    SPEC_CONTENT=$(gh issue view \"$ISSUE_NUM\" --repo bluedevilcollectibles/bdc-xo \\\n      --json body --jq .body 2>/dev/null || true)\n    [ -n \"$SPEC_CONTENT\" ] && SPEC_PATH=\"issues/${ISSUE_NUM}\"\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then echo \"Spec not found\" >&2; exit 1; fi\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nRUN_START_SHA=$(git -C \"$WT\" rev-parse HEAD 2>/dev/null || echo unknown)\nmkdir -p \"$ARTIFACTS_DIR\" 2>/dev/null || true\nprintf '%s\\n' \"$RUN_START_SHA\" > \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || true\nprintf '%s' \"$SPEC_CONTENT\" > \"$ARTIFACTS_DIR/spec.md\" 2>/dev/null || true\nprintf 'WO_ID=%s\\nSPEC_PATH=bdc-xo:%s\\nRUN_START_SHA=%s\\nSPEC_ARTIFACT=%s\\n\\n' \\\n  \"$WO_ID\" \"$SPEC_PATH\" \"$RUN_START_SHA\" \"$ARTIFACTS_DIR/spec.md\"\nprintf '%s\\n' \"$SPEC_CONTENT\"\n"},{id: parse-stages,persona: major-build,depends_on: [read-spec],load_bearing: true,bash: "set -uo pipefail\nSPEC_FILE=\"$ARTIFACTS_DIR/spec.md\"\nif [ ! -s \"$SPEC_FILE\" ]; then\n  echo \"ERROR: spec artifact missing or empty at $SPEC_FILE\" >&2\n  exit 1\nfi\n# Extract the canonical yaml-fenced `stages:` block from the spec. Spec bodies\n# frequently embed an example/schema fence BEFORE the real declaration; the\n# canonical block is the one immediately preceded by either a heading line\n# \"## Canonical stages\"/\"### Stages\" OR a marker comment\n# \"<!-- canonical-stages -->\" / \"<!-- stages: canonical -->\". If no marker\n# is present, we fall back to the LAST fenced `stages:` block (canonical\n# declarations conventionally come AFTER examples). Taking the FIRST block\n# is unsafe: an example schema with 0/1 stages would execute instead of the\n# real ordered pipeline. The selection rule + chosen block are echoed to\n# stderr so reviewers can verify which block was consumed.\nOUT=\"$ARTIFACTS_DIR/stages.yaml\"\npython3 - \"$SPEC_FILE\" \"$OUT\" <<'PYEOF'\nimport sys, re\nspec = open(sys.argv[1], 'r', encoding='utf-8', errors='replace').read()\n# Find every fenced yaml block that opens with a `stages:` line at column 0.\n# Pattern: ```yaml ... stages: ... ```.\nfence_re = re.compile(r\"```ya?ml\\s*\\n(.*?)\\n```\", re.DOTALL)\ncandidates = []  # list of (start_offset, body)\nfor m in fence_re.finditer(spec):\n    body = m.group(1)\n    for line in body.splitlines():\n        if line.startswith('stages:'):\n            candidates.append((m.start(), body))\n            break\nif not candidates:\n    # Fallback: an unfenced `stages:` block (column 0) followed by indented YAML.\n    lines = spec.splitlines()\n    out = []\n    capturing = False\n    for line in lines:\n        if not capturing:\n            if line.startswith('stages:'):\n                capturing = True\n                out.append(line)\n            continue\n        if line == '':\n            out.append(line)\n            continue\n        if not (line.startswith(' ') or line.startswith('\\t') or line.startswith('-')):\n            break\n        out.append(line)\n    if out:\n        candidates.append((0, '\\n'.join(out)))\nif not candidates:\n    sys.stderr.write(\"FAIL: no `stages:` declaration found in spec.\\n\")\n    sys.exit(1)\n# Selection rule:\n#  1. Prefer a block immediately preceded (within ~3 lines / ~600 chars) by an\n#     explicit canonical marker: \"## Canonical stages\", \"### Stages\",\n#     \"<!-- canonical-stages -->\", or \"<!-- stages: canonical -->\".\n#  2. If exactly one block exists, use it.\n#  3. If multiple blocks exist and none is marked canonical, FAIL CLOSED.\n#     Picking first or last is unsafe because specs often contain example\n#     schemas near C2 and may contain later appendix examples. The declared\n#     executable block must be marked so selection is deterministic.\nMARKERS = [\n    re.compile(r\"^\\s*##+\\s+Canonical\\s+stages\\b\", re.IGNORECASE | re.MULTILINE),\n    re.compile(r\"^\\s*##+\\s+Stages\\b\", re.IGNORECASE | re.MULTILINE),\n    re.compile(r\"<!--\\s*canonical-stages\\s*-->\", re.IGNORECASE),\n    re.compile(r\"<!--\\s*stages:\\s*canonical\\s*-->\", re.IGNORECASE),\n]\nchosen = None\nchosen_reason = None\nfor marker in MARKERS:\n    for offset, body in candidates:\n        # Look backwards from offset for the marker within a 600-char window.\n        window = spec[max(0, offset - 600):offset]\n        if marker.search(window):\n            chosen = body\n            chosen_reason = \"explicit-marker:%s\" % marker.pattern\n            break\n    if chosen is not None:\n        break\nif chosen is None:\n    if len(candidates) == 1:\n        chosen = candidates[0][1]\n        chosen_reason = \"single-stages-block\"\n    else:\n        sys.stderr.write(\n            \"FAIL: %d `stages:` blocks found but none is marked canonical. \"\n            \"Add '<!-- canonical-stages -->' immediately before the declared executable block.\\n\"\n            % len(candidates)\n        )\n        sys.exit(1)\nsys.stderr.write(\"stages-block-selected reason=%s\\n\" % chosen_reason)\nsys.stderr.write(\"stages-block-candidates=%d\\n\" % len(candidates))\nopen(sys.argv[2], 'w', encoding='utf-8').write(chosen)\nprint(\"stages-yaml-extracted=\" + sys.argv[2])\nprint(\"stages-block-selection=\" + chosen_reason)\nPYEOF\nif [ ! -s \"$OUT\" ]; then\n  echo \"ERROR: extracted stages YAML is empty\" >&2\n  exit 1\nfi\n# Convert the extracted YAML fragment to JSON for downstream consumption.\n# Use python's yaml if available; otherwise fall back to a minimal parser.\nJSON_OUT=\"$ARTIFACTS_DIR/stages.json\"\npython3 - \"$OUT\" \"$JSON_OUT\" <<'PYEOF'\nimport sys, json\ntry:\n    import yaml\nexcept ImportError:\n    sys.stderr.write(\"FAIL: python yaml module unavailable; cannot parse stages.\\n\")\n    sys.exit(1)\ntext = open(sys.argv[1], 'r', encoding='utf-8').read()\ntry:\n    data = yaml.safe_load(text)\nexcept yaml.YAMLError as e:\n    sys.stderr.write(\"FAIL: stages YAML parse error: %s\\n\" % e)\n    sys.exit(1)\nstages = data.get('stages') if isinstance(data, dict) else None\nif not isinstance(stages, list) or len(stages) == 0:\n    sys.stderr.write(\"FAIL: parsed `stages` is not a non-empty list.\\n\")\n    sys.exit(1)\n# Required keys -- a stage MUST declare its full execution contract. No\n# downstream defaults are permitted to silently fill these (spec C2 mandates\n# the contract is explicit at the spec level, not inferred at runtime).\nrequired = ['id', 'repo', 'target_branch', 'in_scope_files', 'verify_commands', 'readiness_bar']\nfor i, st in enumerate(stages):\n    if not isinstance(st, dict):\n        sys.stderr.write(\"FAIL: stage %d is not a mapping.\\n\" % i)\n        sys.exit(1)\n    for k in required:\n        if k not in st:\n            sys.stderr.write(\"FAIL: stage %d missing required key '%s'.\\n\" % (i, k))\n            sys.exit(1)\n    # verify_commands must be a non-empty list (zero-command verify is a no-op gate).\n    vc = st.get('verify_commands')\n    if not isinstance(vc, list) or len(vc) == 0:\n        sys.stderr.write(\"FAIL: stage %d 'verify_commands' must be a non-empty list.\\n\" % i)\n        sys.exit(1)\n    # readiness_bar must be a mapping with the four required booleans, all true.\n    rb = st.get('readiness_bar')\n    if not isinstance(rb, dict):\n        sys.stderr.write(\"FAIL: stage %d 'readiness_bar' must be a mapping.\\n\" % i)\n        sys.exit(1)\n    for rk in ('pr_open', 'ci_green', 'diff_review_clean', 'mergeable'):\n        if rk not in rb:\n            sys.stderr.write(\"FAIL: stage %d 'readiness_bar' missing key '%s'.\\n\" % (i, rk))\n            sys.exit(1)\n        if rb[rk] is not True:\n            sys.stderr.write(\"FAIL: stage %d 'readiness_bar.%s' must be true (no soft gates).\\n\" % (i, rk))\n            sys.exit(1)\nopen(sys.argv[2], 'w', encoding='utf-8').write(json.dumps(stages, indent=2))\nprint(\"STAGE_COUNT=%d\" % len(stages))\nprint(\"STAGE_IDS=\" + \",\".join(str(s.get('id')) for s in stages))\nPYEOF\nif [ ! -s \"$JSON_OUT\" ]; then\n  echo \"ERROR: stages.json was not produced\" >&2\n  exit 1\nfi\necho \"STAGES_ARTIFACT=$JSON_OUT\"\necho \"parse-stages PASS\"\n"},{id: preflight-repo-registry,persona: major-build,depends_on: [parse-stages],load_bearing: true,bash: "set -uo pipefail\nSTAGES=\"$ARTIFACTS_DIR/stages.json\"\nif [ ! -s \"$STAGES\" ]; then\n  echo \"ERROR: stages.json missing\" >&2\n  exit 1\nfi\nSERVER_URL=\"${ARCHON_SERVER_URL:-http://127.0.0.1:3090}\"\nCODEBASES_JSON=\"$ARTIFACTS_DIR/codebases.json\"\n# /api/codebases requires the operator token (401 without it). The executor\n# subprocess inherits the container env, so ARCHON_OPERATOR_TOKEN is present.\n# Anchor: canary run 63f255b1 (2026-07-01, this lane's FIRST fire) failed here\n# with a misleading \"cannot reach\" -- the server was up; the curl was unauthed.\nif ! curl -sS --fail \"${SERVER_URL}/api/codebases\"              -H \"x-archon-operator-token: ${ARCHON_OPERATOR_TOKEN:-}\"              -o \"$CODEBASES_JSON\" 2>&1; then\n  echo \"ERROR: /api/codebases unreachable or unauthorized at ${SERVER_URL} -- registry gate cannot run.\" >&2\n  echo \"Check ARCHON_OPERATOR_TOKEN in executor env and ARCHON_SERVER_URL. NO SILENT FALLBACK.\" >&2\n  exit 1\nfi\nENRICHED=\"$ARTIFACTS_DIR/stages-enriched.json\"\npython3 - \"$STAGES\" \"$CODEBASES_JSON\" \"$ENRICHED\" <<'PYEOF'\nimport sys, json\nstages = json.load(open(sys.argv[1]))\ncatalog = json.load(open(sys.argv[2]))\n# Catalog shape: { codebases: [ { id, name, defaultCwd, ... }, ... ] }\n# or possibly a flat list. Handle both.\nentries = catalog.get('codebases') if isinstance(catalog, dict) else catalog\nif not isinstance(entries, list):\n    sys.stderr.write(\"FAIL: codebases response did not return a list.\\n\")\n    sys.exit(1)\nby_name = {}\nfor e in entries:\n    if not isinstance(e, dict):\n        continue\n    name = e.get('name') or e.get('full_name') or ''\n    if not name:\n        continue\n    by_name[name.lower()] = e\n    # Also key by short name (without owner) for tolerant matching.\n    short = name.split('/')[-1].lower()\n    by_name.setdefault(short, e)\nmissing = []\nenriched = []\nfor st in stages:\n    repo = (st.get('repo') or '').strip()\n    if not repo:\n        missing.append({'stageId': st.get('id'), 'repo': '<empty>'})\n        continue\n    entry = by_name.get(repo.lower())\n    if entry is None:\n        short = repo.split('/')[-1].lower()\n        entry = by_name.get(short)\n    if entry is None:\n        missing.append({'stageId': st.get('id'), 'repo': repo})\n        continue\n    codebase_id = entry.get('id') or entry.get('codebase_id') or ''\n    codebase_path = entry.get('defaultCwd') or entry.get('default_cwd') or entry.get('path') or ''\n    out = dict(st)\n    out['codebaseId'] = str(codebase_id)\n    out['codebasePath'] = codebase_path\n    # canonicalRepoPath: same as codebasePath for the registry's main checkout.\n    # The runtime stage-allocator may further resolve this via getCanonicalRepoPath.\n    out['canonicalRepoPath'] = codebase_path\n    enriched.append(out)\nif missing:\n    sys.stderr.write(\"FAIL: %d stage(s) reference unregistered repo(s):\\n\" % len(missing))\n    for m in missing:\n        sys.stderr.write(\"  - stage '%s' repo '%s' is NOT registered\\n\" % (m['stageId'], m['repo']))\n    sys.stderr.write(\"Register each missing repo and re-fire. NO PARTIAL BUILDS.\\n\")\n    sys.exit(1)\nopen(sys.argv[3], 'w', encoding='utf-8').write(json.dumps(enriched, indent=2))\nprint(\"REGISTRY_OK=true\")\nprint(\"ENRICHED_STAGES=%s\" % sys.argv[3])\nprint(\"STAGE_REPOS=\" + \",\".join(s['repo'] for s in enriched))\nPYEOF\n"},{id: allocate-stage-worktrees,persona: major-build,depends_on: [preflight-repo-registry],load_bearing: true,bash: "set -uo pipefail\nENRICHED=\"$ARTIFACTS_DIR/stages-enriched.json\"\nif [ ! -s \"$ENRICHED\" ]; then\n  echo \"ERROR: stages-enriched.json missing\" >&2\n  exit 1\nfi\nWO_ID=\"${WO_ID:-$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)}\"\nif [ -z \"$WO_ID\" ]; then\n  echo \"ERROR: WO_ID unresolvable for branch derivation\" >&2\n  exit 1\nfi\nOUT=\"$ARTIFACTS_DIR/stage-worktrees.json\"\n\n# ---- Locate the bdc-harness source root (where the substrate lives). ----\n# The substrate is packages/isolation/src/stage-allocator.ts in the harness\n# repo. We discover it deterministically: prefer explicit HARNESS_ROOT env,\n# then walk up from CWD, then probe canonical install paths. FAIL CLOSED\n# if we cannot find it -- no silent fallback to raw git.\nMARKER_REL=\"packages/isolation/src/stage-allocator.ts\"\nHARNESS_ROOT=\"\"\nif [ -n \"${HARNESS_ROOT_OVERRIDE:-}\" ] && [ -f \"${HARNESS_ROOT_OVERRIDE}/${MARKER_REL}\" ]; then\n  HARNESS_ROOT=\"${HARNESS_ROOT_OVERRIDE}\"\nfi\nif [ -z \"$HARNESS_ROOT\" ]; then\n  D=\"$(pwd)\"\n  while [ -n \"$D\" ] && [ \"$D\" != \"/\" ]; do\n    if [ -f \"$D/$MARKER_REL\" ]; then HARNESS_ROOT=\"$D\"; break; fi\n    D=\"$(dirname \"$D\")\"\n  done\nfi\nif [ -z \"$HARNESS_ROOT\" ]; then\n  for candidate in \\\n    \"/.archon/workspaces/bluedevilcollectibles/bdc-harness/source\" \\\n    \"${ARCHON_HOME:-$HOME/.archon}/workspaces/bluedevilcollectibles/bdc-harness/source\" \\\n    \"$HOME/.archon/workspaces/bluedevilcollectibles/bdc-harness/source\"; do\n    if [ -f \"$candidate/$MARKER_REL\" ]; then HARNESS_ROOT=\"$candidate\"; break; fi\n  done\nfi\nif [ -z \"$HARNESS_ROOT\" ]; then\n  echo \"ERROR: bdc-harness source root not found -- cannot invoke createStageWorktree substrate.\" >&2\n  echo \"Searched: HARNESS_ROOT_OVERRIDE env, walked up from CWD ($(pwd)), and canonical install paths.\" >&2\n  echo \"Set HARNESS_ROOT_OVERRIDE=/path/to/bdc-harness/source and re-run.\" >&2\n  exit 1\nfi\necho \"HARNESS_ROOT=$HARNESS_ROOT\"\nif ! command -v bun >/dev/null 2>&1; then\n  echo \"ERROR: bun not on PATH -- cannot run the substrate shim.\" >&2\n  exit 1\nfi\n\n# ---- Substrate shim: imports createStageWorktree and calls it per stage. ----\n# We write the shim into $ARTIFACTS_DIR so its diagnostic output is auditable,\n# and we CD into HARNESS_ROOT so bun resolves @archon/isolation via the\n# workspace package.json. The shim reads stages-enriched.json + WO_ID,\n# invokes createStageWorktree(...) per stage, and emits the same\n# stage-worktrees.json shape downstream nodes consume.\nSHIM=\"$ARTIFACTS_DIR/stage-alloc-shim.ts\"\ncat > \"$SHIM\" <<'TSEOF'\n// Stage allocator shim -- thin wrapper around createStageWorktree.\n// Invoked from allocate-stage-worktrees node in bdc-multi-stage-development.yaml.\n//\n// We use a dynamic import keyed off process.env.HARNESS_ROOT (set by the\n// calling bash node) so the substrate resolves via an ABSOLUTE filesystem\n// path. This avoids depending on `bun install` having materialized the\n// @archon/isolation workspace symlink at runtime -- a real concern in\n// freshly-cloned worktrees where node_modules has not been populated yet.\nimport { readFileSync, writeFileSync } from 'node:fs';\nimport { join } from 'node:path';\nconst HARNESS_ROOT = process.env.HARNESS_ROOT;\nif (!HARNESS_ROOT) {\n  process.stderr.write('shim FAIL: HARNESS_ROOT env var not set by caller\\n');\n  process.exit(2);\n}\nconst allocatorPath = join(HARNESS_ROOT, 'packages/isolation/src/stage-allocator.ts');\nconst mod = await import(allocatorPath);\nconst createStageWorktree = mod.createStageWorktree as (\n  opts: {\n    woId: string;\n    stageId: string;\n    codebaseId: string;\n    codebaseName: string;\n    canonicalRepoPath: string;\n    targetBranch: string;\n  }\n) => Promise<{ stageId: string; branchName: string; worktreePath: string; codebaseId: string; adopted: boolean }>;\n\ntype EnrichedStage = {\n  id: string;\n  repo: string;\n  target_branch: string;\n  in_scope_files?: unknown;\n  verify_commands?: unknown;\n  readiness_bar?: unknown;\n  depends_on?: unknown;\n  codebaseId: string;\n  codebasePath: string;\n  canonicalRepoPath: string;\n};\n\nasync function main(): Promise<void> {\n  const enrichedPath = process.argv[2];\n  const woId = process.argv[3];\n  const outPath = process.argv[4];\n  if (!enrichedPath || !woId || !outPath) {\n    process.stderr.write('shim usage: stage-alloc-shim.ts <enriched-json> <wo-id> <out-json>\\n');\n    process.exit(2);\n  }\n  const stages: EnrichedStage[] = JSON.parse(readFileSync(enrichedPath, 'utf-8'));\n  const out: Array<Record<string, unknown>> = [];\n  for (const st of stages) {\n    if (!Array.isArray(st.verify_commands) || st.verify_commands.length === 0) {\n      throw new Error(`stage ${st.id} missing required non-empty verify_commands`);\n    }\n    const readiness = st.readiness_bar as Record<string, unknown> | undefined;\n    const readinessKeys = ['pr_open', 'ci_green', 'diff_review_clean', 'mergeable'];\n    if (\n      !readiness ||\n      readinessKeys.some((key) => readiness[key] !== true)\n    ) {\n      throw new Error(\n        `stage ${st.id} missing required readiness_bar booleans: ${readinessKeys.join(', ')}`\n      );\n    }\n    const result = await createStageWorktree({\n      woId,\n      stageId: st.id,\n      codebaseId: st.codebaseId,\n      codebaseName: st.repo,\n      canonicalRepoPath: st.canonicalRepoPath,\n      targetBranch: st.target_branch,\n    });\n    out.push({\n      stageId: result.stageId,\n      branchName: result.branchName,\n      worktreePath: result.worktreePath,\n      codebaseId: result.codebaseId,\n      canonicalRepoPath: st.canonicalRepoPath,\n      repo: st.repo,\n      targetBranch: st.target_branch,\n      inScopeFiles: st.in_scope_files,\n      verifyCommands: st.verify_commands,\n      readinessBar: st.readiness_bar,\n      dependsOn: st.depends_on ?? null,\n      adopted: result.adopted,\n    });\n    process.stderr.write(\n      `stage=${result.stageId} branch=${result.branchName} adopted=${result.adopted} path=${result.worktreePath}\\n`\n    );\n  }\n  writeFileSync(outPath, JSON.stringify(out, null, 2));\n  process.stdout.write(`STAGE_WORKTREES=${outPath}\\n`);\n  for (const row of out) {\n    process.stdout.write(\n      `  stage=${row.stageId} branch=${row.branchName} adopted=${row.adopted} path=${row.worktreePath}\\n`\n    );\n  }\n}\n\nmain().catch((err: unknown) => {\n  const e = err as Error;\n  process.stderr.write(`stage-alloc-shim FAIL: ${e.message}\\n`);\n  if (e.stack) process.stderr.write(`${e.stack}\\n`);\n  process.exit(1);\n});\nTSEOF\n\n# Invoke the substrate. We CD into HARNESS_ROOT so bun resolves any\n# transitive workspace packages the substrate may use. HARNESS_ROOT is\n# exported so the shim can dynamically import the substrate by absolute\n# path. --no-env-file prevents bun from auto-loading .env from the harness\n# source (the workflow's runtime env is the source of truth here).\n( cd \"$HARNESS_ROOT\" && HARNESS_ROOT=\"$HARNESS_ROOT\" bun --no-env-file \"$SHIM\" \"$ENRICHED\" \"$WO_ID\" \"$OUT\" )\nRC=$?\nif [ \"$RC\" -ne 0 ]; then\n  echo \"ERROR: createStageWorktree substrate invocation failed (exit $RC).\" >&2\n  echo \"Shim: $SHIM  Enriched: $ENRICHED  Out: $OUT\" >&2\n  exit \"$RC\"\nfi\nif [ ! -s \"$OUT\" ]; then\n  echo \"ERROR: substrate produced no output at $OUT\" >&2\n  exit 1\nfi\necho \"allocate-stage-worktrees PASS (invoked createStageWorktree for each declared stage)\"\n"},{id: implement-pipeline,persona: major-build,depends_on: [allocate-stage-worktrees],agent: major-build,task_class: heavy_work,loop: {until: __NEVER_EMIT_USE_UNTIL_BASH__,max_iterations: 3,fresh_context: true,until_bash: "set -uo pipefail\nDONE=\"$ARTIFACTS_DIR/pipeline-done.flag\"\nif [ -f \"$DONE\" ]; then\n  echo \"pipeline-done.flag present -- all stages passed\"\n  exit 0\nfi\nif ls \"$ARTIFACTS_DIR\"/stage-*-blocked.json >/dev/null 2>&1; then\n  echo \"stage blocked artifact present -- pipeline BLOCKED, halting loop\"\n  exit 0\nfi\necho \"pipeline incomplete; iterating\"\nexit 1\n",prompt: "You are the multi-stage pipeline builder. Build the stages declared in\n$ARTIFACTS_DIR/stage-worktrees.json IN ORDER, sequentially, gating between.\n\n## Inputs (read each FIRST before doing anything)\n- Stage list with allocated worktrees: $ARTIFACTS_DIR/stage-worktrees.json\n- Original WO spec: $read-spec.output (also at $ARTIFACTS_DIR/spec.md)\n- Prior iteration output: $LOOP_PREV_OUTPUT\n- Per-stage forward artifacts (from prior PASSED stages): files matching\n  $ARTIFACTS_DIR/stage-<id>-done.json (read EACH at startup).\n- Per-stage block artifacts: files matching $ARTIFACTS_DIR/stage-<id>-blocked.json.\n\n## Resume rule\nOn every iteration, FIRST scan $ARTIFACTS_DIR for stage-*-done.json and\nstage-*-blocked.json. Then process the FULL declared list in order until\nevery stage is done or one stage blocks. Build only stages that have\nNEITHER (those not yet complete and not blocked). For each such stage,\nensure depends_on (if any) is already PASSED before starting it. Do not\nstop after one successful stage; continue to the next declared stage in\nthe same iteration after writing the current stage's done artifact.\n\n## Per-stage build (repeat these steps for each unblocked stage in order)\n\n### 1. Prepare\nRead the stage entry: stageId, branchName, worktreePath, repo,\ntargetBranch, inScopeFiles, verifyCommands, readinessBar.\ncd into worktreePath (the stage's worktree, NOT this run's worktree).\nRead every prior stage-<priorId>-done.json so you have the prior PR URL,\nbranch, API contract, staging URL, and env vars to build against.\n\n### 2. Plan + Implement (inside the stage worktree)\n- Modify ONLY files in this stage's inScopeFiles (exact paths only).\n- Use prior-stage artifacts as the contract you build against -- the\n  backend's branch (NOT main) defines the endpoints the UI calls.\n- Do NOT touch files outside this stage's inScopeFiles. Do NOT reformat.\n- Do NOT use `git commit --allow-empty`.\n\n### 3. Verify\nRun every command in verifyCommands from the worktreePath. ALL must pass.\nIf any fail, do NOT mark the stage done -- write a stage-<id>-blocked.json\nper step 6.\n\n### 4. Adversarial diff review (self)\nInspect `git diff --stat` and the full diff. Confirm:\n  - Every change is in inScopeFiles. (Contract drift = BLOCK.)\n  - No debug prints, no commented-out code, no TODOs added.\n  - Tests exist for new behavior or there is an explicit reason in the spec.\nIf you find a finding you cannot fix in this iteration, halt that stage\nand write the block artifact per step 6.\n\n### 5. Commit + push (BEFORE marking done)\nFrom worktreePath:\n  git add -A -- <inScopeFiles>\n  git commit -m \"feat: ${WO_ID} stage:${stageId} -- <one-line summary>\"\n  git push -u origin \"${branchName}\"\nOn push failure: write $ARTIFACTS_DIR/stage-${stageId}-blocked.json with\nblocking_reason \"push_failed: <git error>\" and HALT -- no retry, no silent\nswallow, earlier stage PRs stand. Do NOT write the done artifact.\n\n### 6. Open PR + evaluate readiness bar\n- Open PR: gh pr create --repo <repo> --base <targetBranch> --head <branchName>\n  --title \"feat: <stageId> -- ${WO_ID}\" --body-file <body>\n  Race recovery: if a PR is already open on this branch, capture its URL\n  via `gh pr list --repo <repo> --head <branchName> --state open --json url`.\n- Check readiness bar via `gh pr view <URL> --json\n  state,mergeable,statusCheckRollup` and parse:\n    * pr_open       = state == 'OPEN'\n    * ci_green      = every statusCheckRollup entry conclusion in\n                      [SUCCESS, NEUTRAL, SKIPPED]\n    * mergeable     = mergeable == 'MERGEABLE' (HARD GATE -- C3 contract).\n                      UNKNOWN is NOT a pass. If GitHub returns UNKNOWN\n                      (mergeability not yet computed after push), POLL for up\n                      to 3 minutes (re-run `gh pr view ... --json mergeable`\n                      every 15s). If UNKNOWN still after the poll window OR\n                      if mergeable is 'CONFLICTING' / anything other than\n                      'MERGEABLE', this gate is FAIL: write the stage block\n                      artifact with blocking_reason 'pr_not_mergeable: <state>'.\n                      NEVER advance to the next stage on UNKNOWN.\n    * diff_review_clean = self-review above did not surface a blocking finding\n- ALL four readiness criteria must be true to advance. ANY criterion failing\n  (including mergeable=UNKNOWN after poll window) MUST write the block\n  artifact -- no soft pass, no silent advance.\n\n### 7. Stage outcome\nIf readiness PASS:\n  Write $ARTIFACTS_DIR/stage-${stageId}-done.json with shape:\n    {\n      \"stageId\": \"...\",\n      \"branchName\": \"...\",\n      \"prUrl\": \"...\",\n      \"repo\": \"...\",\n      \"targetBranch\": \"...\",\n      \"status\": \"PASS\",\n      \"verifyResult\": \"...one-line summary...\",\n      \"reviewResult\": \"...one-line summary...\",\n      \"blockingReason\": null,\n      \"forward\": {\n        \"apiContract\": \"...optional notes for next stage...\",\n        \"stagingUrl\": \"...if applicable...\",\n        \"envVars\": {}\n      }\n    }\nIf readiness FAIL or any prior step failed:\n  Write $ARTIFACTS_DIR/stage-${stageId}-blocked.json with shape:\n    {\n      \"stageId\": \"...\",\n      \"branchName\": \"...\",\n      \"prUrl\": \"...or null...\",\n      \"repo\": \"...\",\n      \"status\": \"BLOCKED\",\n      \"blockingReason\": \"<one of: push_failed, ci_red, review_blocked, pr_not_mergeable, verify_failed, plan_ambiguous, registry_missing>: <detail>\",\n      \"earlierPrsStand\": true\n    }\n  and HALT this iteration. Do NOT continue to later stages after a block.\n\n### 8. After all stages done\nWhen every stage in stage-worktrees.json has a corresponding done.json\n(and zero blocked.json), write $ARTIFACTS_DIR/pipeline-done.flag (empty file).\n\n## Stage data passing -- THE forward contract (C4)\nEach done.json's `forward` object is the contract for downstream stages.\nStage N+1 reads stage-<N>-done.json before planning. The backend stage\npublishes its branch name + API contract; the UI stage builds against\nthat branch (not main, not staging head -- the BACKEND'S PR branch which\nis the reviewed code).\n\n## N=1 invariant (C6)\nIf stages.json has exactly one entry, execute the same stage loop with N=1.\nOutput shape is identical to bdc-feature-development's manifest contract\n(one PR opened, one stage-<id>-done.json). NO delegation to another\nworkflow; same code path, behavior-equivalent.\n\n## Re-fire idempotency (C5)\nBranch names are deterministic per (WO_ID, stageId) -- no run-id suffix.\nRe-fires UPDATE the same stage branch and the same PR. Never create\na second PR for the same stage.\n\n## ASCII-only\nAll file edits MUST be pure ASCII. No emojis, no em-dashes, no smart quotes.\n\n## Loop exit\nThis loop is gated by until_bash. Completion = pipeline-done.flag exists\nOR any stage-*-blocked.json exists. There is NO text sentinel that exits\nthis loop -- write the right artifact and let until_bash decide.\n"}},{id: consolidated-manifest,persona: major-build,depends_on: [implement-pipeline],trigger_rule: all_done,load_bearing: true,bash: "set -uo pipefail\nSTAGES=\"$ARTIFACTS_DIR/stage-worktrees.json\"\nif [ ! -s \"$STAGES\" ]; then\n  echo \"ERROR: stage-worktrees.json missing\" >&2\n  exit 1\nfi\nOUT=\"$ARTIFACTS_DIR/pipeline-manifest.json\"\npython3 - \"$STAGES\" \"$ARTIFACTS_DIR\" \"$OUT\" <<'PYEOF'\nimport sys, json, os, glob\nstages = json.load(open(sys.argv[1]))\nartifacts_dir = sys.argv[2]\nrows = []\nmissing_artifacts = []\nblocked = []\npassed = []\nfor st in stages:\n    sid = st['stageId']\n    done_path = os.path.join(artifacts_dir, \"stage-%s-done.json\" % sid)\n    blocked_path = os.path.join(artifacts_dir, \"stage-%s-blocked.json\" % sid)\n    row = {\n        'stageId': sid,\n        'branchName': st['branchName'],\n        'repo': st['repo'],\n        'targetBranch': st['targetBranch'],\n    }\n    if os.path.exists(done_path):\n        try:\n            data = json.load(open(done_path))\n        except Exception as e:\n            missing_artifacts.append(\"%s (parse error: %s)\" % (sid, e))\n            continue\n        row['status'] = 'PASS'\n        row['prUrl'] = data.get('prUrl')\n        row['verifyResult'] = data.get('verifyResult')\n        row['reviewResult'] = data.get('reviewResult')\n        row['blockingReason'] = None\n        passed.append(sid)\n    elif os.path.exists(blocked_path):\n        try:\n            data = json.load(open(blocked_path))\n        except Exception as e:\n            missing_artifacts.append(\"%s (parse error: %s)\" % (sid, e))\n            continue\n        row['status'] = 'BLOCKED'\n        row['prUrl'] = data.get('prUrl')\n        row['verifyResult'] = data.get('verifyResult')\n        row['reviewResult'] = data.get('reviewResult')\n        row['blockingReason'] = data.get('blockingReason')\n        blocked.append(sid)\n    else:\n        missing_artifacts.append(sid)\n        row['status'] = 'MISSING'\n        row['prUrl'] = None\n        row['verifyResult'] = None\n        row['reviewResult'] = None\n        row['blockingReason'] = 'artifact_missing'\n    rows.append(row)\noverall = 'PASS' if (len(blocked) == 0 and len(missing_artifacts) == 0) else 'BLOCKED'\nmanifest = {\n    'overall_status': overall,\n    'stage_count': len(stages),\n    'passed_stages': passed,\n    'blocked_stages': blocked,\n    'missing_artifacts': missing_artifacts,\n    'stages': rows,\n}\nopen(sys.argv[3], 'w', encoding='utf-8').write(json.dumps(manifest, indent=2))\nprint(\"MANIFEST=%s\" % sys.argv[3])\nprint(\"OVERALL_STATUS=%s\" % overall)\nprint(\"PASSED=%s\" % \",\".join(passed))\nprint(\"BLOCKED=%s\" % \",\".join(blocked))\nif missing_artifacts:\n    print(\"MISSING_ARTIFACTS=%s\" % \",\".join(missing_artifacts))\n# Fail closed if anything is missing -- completeness guard.\nif missing_artifacts:\n    sys.stderr.write(\"FAIL: %d stage artifact(s) missing -- manifest incomplete.\\n\" % len(missing_artifacts))\n    sys.exit(1)\nPYEOF\n"},{id: flip-notion,persona: xo,depends_on: [consolidated-manifest],trigger_rule: all_done,task_class: clerical,prompt: "Update the Notion Work Order page based on the multi-stage pipeline outcome.\n\n## Inputs\nConsolidated manifest: $consolidated-manifest.output\nPipeline manifest file: $ARTIFACTS_DIR/pipeline-manifest.json\nOriginal spec: $read-spec.output\n\n## Outcome branching\nRead OVERALL_STATUS from consolidated-manifest output (and re-read\npipeline-manifest.json for the full stage list).\n\n- OVERALL_STATUS=PASS: set Claude Status: REVIEW, Status: Review. Add the\n  manifest as a page comment. The comment MUST include EVERY stage's\n  branch, PR URL, repo, status, verify result, and review result.\n- OVERALL_STATUS=BLOCKED: do NOT flip to REVIEW. Add a page comment listing\n  which stages PASSED (their PRs STAND) and which BLOCKED (with blocking\n  reason). Emit an XO_ACTION line with the manifest summary so XO knows what\n  to triage.\n\nNever claim PR URLs that are not in pipeline-manifest.json. Never silently\nskip a stage. If Notion MCP is not available in the runtime, emit an\nXO_ACTION line asking XO to flip Notion manually with the manifest.\n"}]}