{name: bdc-cauldron-multi-stage-pipeline-01,description: "Tailored child workflow for WO-CAULDRON-MULTI-STAGE-PIPELINE-01.\nUse when: implementing the generic N-stage Cauldron pipeline that runs sequential\nper-repo stages with a gate between (each stage = its own worktree, build+verify+\nadversarial-review+gate, then advance). Reuses the proven single-repo build loop\nfrom bdc-feature-development -- the new surface is sequencing/gating only.\nTarget repo: bluedevilcollectibles/bdc-harness (dev branch).\nClass: INFRA. No Rule 20 staging gate (bdc-harness is not in the staging-gate set).\n",policyFile: harness/policies/agent-behavior.md,model: sonnet,inputs: {WO_ID: {default: WO-CAULDRON-MULTI-STAGE-PIPELINE-01}},nodes: [{id: preflight-github-auth,persona: major-build,load_bearing: true,bash: "set -euo pipefail\nif ! git push --dry-run origin \"HEAD:refs/heads/preflight-auth-probe-$(date +%s)\" 2>&1; then\n  echo \"ERROR: GITHUB auth check failed -- container cannot push to origin.\" >&2\n  echo \"Likely cause: GITHUB_TOKEN missing in executor env, or token lacks repo scope.\" >&2\n  exit 1\nfi\necho \"preflight-github-auth PASS\"\n"},{id: read-spec,persona: xo,depends_on: [preflight-github-auth],bash: "set -euo pipefail\nWO_ID=\"${WO_ID:-WO-CAULDRON-MULTI-STAGE-PIPELINE-01}\"\nif [ -z \"$WO_ID\" ]; then\n  WO_ID=$(printf '%s\\n' \"$USER_MESSAGE\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)\nfi\nif [ -z \"$WO_ID\" ]; then\n  echo \"WO_ID missing. Provide WO_ID in environment or user message.\" >&2\n  exit 1\nfi\nSPEC_PATH=\"docs/work-orders/${WO_ID}.md\"\nSPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nif [ -z \"$SPEC_CONTENT\" ]; then\n  SPEC_PATH=\"docs/superpowers/specs/${WO_ID}.md\"\n  SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  MATCH=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main\" --template '{{range .}}{{.path}}{{\"\\n\"}}{{end}}' 2>/dev/null | grep \"${WO_ID}.md$\" | head -n 1)\n  if [ -n \"$MATCH\" ]; then\n    SPEC_PATH=\"$MATCH\"\n    SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' | tr -d '\\n' | base64 -d || true)\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  ISSUE_NUM=$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'issue=[0-9]+' | head -n 1 | cut -d= -f2 || true)\n  if [ -z \"$ISSUE_NUM\" ]; then\n    ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \\\n      --search \"${WO_ID} in:title\" --json number,title \\\n      --jq '.[0].number' 2>/dev/null || true)\n  fi\n  if [ -n \"$ISSUE_NUM\" ] && [ \"$ISSUE_NUM\" != \"null\" ]; then\n    SPEC_CONTENT=$(gh issue view \"$ISSUE_NUM\" --repo bluedevilcollectibles/bdc-xo \\\n      --json body --jq .body 2>/dev/null || true)\n    [ -n \"$SPEC_CONTENT\" ] && SPEC_PATH=\"issues/${ISSUE_NUM}\"\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then echo \"Spec not found (tried docs/work-orders/, docs/superpowers/specs/ direct, date-prefix glob, and GitHub issue search)\" >&2; exit 1; fi\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nRUN_START_SHA=$(git -C \"$WT\" rev-parse HEAD 2>/dev/null || echo unknown)\nmkdir -p \"$ARTIFACTS_DIR\" 2>/dev/null || true\nprintf '%s\\n' \"$RUN_START_SHA\" > \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || true\nprintf 'WO_ID=%s\\nSPEC_PATH=bdc-xo:%s\\nRUN_START_SHA=%s\\n\\n' \"$WO_ID\" \"$SPEC_PATH\" \"$RUN_START_SHA\"\nprintf '%s\\n' \"$SPEC_CONTENT\"\n"},{id: check-already-satisfied,persona: war-council-architect,agent: war-council-architect,depends_on: [read-spec],task_class: clerical,prompt: "You decide ONE thing: are this WO's deliverables ALREADY fully present in the\nCURRENT worktree's HEAD, such that a build would produce no changes? You are\nREAD-ONLY. Judge ONLY against this worktree (you are cd'd into it; use plain git\nand Read/Grep/Glob on local files). Do NOT consult origin/main or other worktrees.\n\n## Spec\n$read-spec.output\n\n## How to decide\n- Extract the spec's Stop Point / verification commands / grep assertions / named\n  deliverable files.\n- For this WO specifically: confirm whether\n    .archon/workflows/defaults/bdc-multi-stage-development.yaml\n  exists AND whether `grep -rci \"dual.repo\" .archon/workflows/defaults/` returns 0\n  AND whether the worktree allocation code (packages/.../worktree.ts area) has been\n  extended to allocate one worktree per declared stage.\n- This is a HIGH BAR. Only conclude already-satisfied if you are confident a fresh\n  implementation would change nothing. ANY doubt -> proceed (false).\n\n## Output (exactly one of these on its own last line)\n- If every deliverable is already present and satisfied in this worktree:\n    ALREADY_SATISFIED=true\n  followed by: SATISFIED_EVIDENCE=<one line naming the deliverables + how verified>\n- Otherwise (work is needed, OR you cannot confirm with high confidence):\n    ALREADY_SATISFIED=false\nDefault to false. Skipping a build that was actually needed is far worse than\nrunning a redundant build that the downstream no-op guard will catch.\n"},{id: gate-already-satisfied,depends_on: [check-already-satisfied],bash: "set -uo pipefail\nCAS=$check-already-satisfied.output\nif printf '%s\\n' \"$CAS\" | grep -qE '^ALREADY_SATISFIED=true'; then\n  echo \"ALREADY_SATISFIED=true\"\n  echo \"PRECHECK_VERDICT=already-satisfied\"\n  printf '%s\\n' \"$CAS\" | grep '^SATISFIED_EVIDENCE=' | head -1 || true\n  echo \"Note: WO appears already implemented in this worktree; the build chain will\"\n  echo \"produce no diff and the run will resolve as a verified no-op (not a failure).\"\nelse\n  echo \"ALREADY_SATISFIED=false\"\n  echo \"PRECHECK_VERDICT=needs-build\"\nfi\nexit 0\n"},{id: plan,persona: war-council-architect,depends_on: [gate-already-satisfied],agent: war-council-architect,task_class: medium_work,prompt: "Read the BDC Work Order spec below and produce a concise implementation plan.\n\n## Idempotency note\nPre-check verdict (from gate-already-satisfied): $gate-already-satisfied.output\nIf PRECHECK_VERDICT=already-satisfied, the deliverables already exist in this\nworktree. Produce a minimal plan that VERIFIES the existing state rather than\nre-creating it; implement will correctly make no changes and emit ALREADY_SATISFIED.\n\n## Required Output\nReturn structured Markdown with these headings:\n- WO ID\n- Files to modify\n- Files to create\n- Files explicitly out of scope\n- Verification commands\n- Commit message\n- Push policy\n- Staging gate required\n\n## BDC Push Policy\nTarget repo: bluedevilcollectibles/bdc-harness (NOT a Rule 20 staging-gate repo).\nUse a feature branch plus PR, base branch dev, no staging gate.\n\n## WO-specific scope (multi-stage pipeline)\nIn scope:\n- .archon/workflows/defaults/bdc-multi-stage-development.yaml (NEW workflow YAML)\n- the per-stage worktree allocation code in bdc-harness packages\n  (multi-worktree allocation extending the existing single-worktree allocator)\n- stage-schema parsing + stage gate + inter-stage data passing + deterministic\n  per-stage branch/PR naming + consolidated multi-stage manifest\n- registered-codebase pre-flight guard\nOut of scope: any change to bdc-feature-development.yaml beyond optional N=1\ndelegation; any change to shopops-api or lspro-react repos in THIS WO.\n\n## Spec\n$read-spec.output\n"},{id: plan-review,persona: war-council-architect,agent: war-council-architect,depends_on: [plan],task_class: medium_work,loop: {fresh_context: true,until: PLAN_REVIEW_APPROVED,max_iterations: 3,prompt: "You are the War Council Architect doing an adversarial self-review of the\nimplementation plan, then REVISING it in place. Iteration-driven self-repair:\none initial pass + up to 2 repair attempts. You are READ-ONLY (no file writes,\nno shell) -- everything you produce goes to STDOUT.\n\n## Prior iteration (read FIRST)\nYour previous iteration's full output (empty on the first pass):\n$LOOP_PREV_OUTPUT\nIf it contains findings (PLAN_REVIEW=needs_revision), you MUST resolve every one\nin the revised plan this iteration. If a finding repeats and you cannot resolve\nit, escalate (below) instead of looping again.\n\n## Inputs\nOriginal plan: $plan.output\nSpec: $read-spec.output\n\n## Attack the plan on these dimensions\n1. Scope creep -- any file not justified by the spec.\n2. Missing files -- in-scope work the plan omits (the new workflow YAML AND the\n   multi-worktree allocation code AND consolidated manifest; per General's C8,\n   the substrate code change MUST be a separate phase, not hidden inside YAML).\n3. Unsafe assumptions -- \"assume X exists\" without verification.\n4. Rule 20 staging gate -- bdc-harness is NOT a staging-gate repo, so the plan\n   must NOT require --base staging. PR base should be dev.\n5. Out-of-scope list present and correct (no edits to other repos in this WO).\n6. Generic N-stage contract -- the plan must NOT hardcode 2 repos / 2 stages;\n   it must accept an ordered stages: list with N elements, each pinned to a\n   repo/target, with explicit depends_on + readiness_bar.\n7. Failure semantics -- preflight failure, stage-1 failure, stage-N failure\n   after earlier PRs exist, unregistered repo, CI red, review blocked, PR not\n   mergeable, push failure -- each must map to FAIL FAST or BLOCKED, never REVIEW.\n8. N=1 single-repo regression -- the plan must explicitly preserve behavior-\n   equivalence with bdc-feature-development for a 1-stage pipeline (delegate\n   OR prove behavior-equivalent output).\n\n## Self-repair (the point -- do not just report)\nIf you find issues AND they are plan-level fixable, REVISE the plan to resolve\nthem and emit the corrected plan in full. Do not halt for a human on anything\nyou can fix here.\n\n## Required STDOUT format (this is the only handoff -- emit EXACTLY this shape)\nThe blocks are fenced so downstream nodes consume ONLY the approved plan, never\nyour critique. Emit, in this order:\n\n  PLAN_REVIEW_PASS=<true|false>\n  PLAN_REVIEW_RISK=<LOW|MEDIUM|HIGH>\n\n  === APPROVED_PLAN_BEGIN ===\n  <the FINAL revised plan in full -- this and ONLY this is what implement uses>\n  === APPROVED_PLAN_END ===\n\n  === PLAN_REVIEW_FINDINGS_BEGIN ===\n  <your findings / what you changed and why, or \"(none)\">\n  === PLAN_REVIEW_FINDINGS_END ===\n\nThe APPROVED_PLAN block must always contain a complete, usable plan (even on a\npassing first iteration where you changed nothing -- echo the original plan there).\nKeep ALL critique inside the FINDINGS block; never let critique leak into the\nAPPROVED_PLAN block.\n\n## Completion sentinel (success ONLY)\nIf and ONLY if PLAN_REVIEW_PASS=true (scope contained, no in-scope file missing,\nRule 20 gate correct, generic N-stage contract respected, failure-mode coverage\ncomplete, N=1 regression preserved), emit on its OWN LINE as the LAST line:\n  PLAN_REVIEW_APPROVED\nOn a failing iteration emit instead (never the approved token):\n  PLAN_REVIEW_NEEDS_REVISION\n\n## Escalation (emit instead of approving; do NOT emit the approved sentinel)\nIf the spec is ambiguous/contradictory, the fix needs a new side-effect class or\nungranted scope, or the same finding survived a prior attempt and you cannot\nresolve it -- set PLAN_REVIEW_PASS=false, emit PLAN_REVIEW_NEEDS_REVISION, and put\nthis block inside the FINDINGS block:\n  ESCALATION_REQUIRED=true\n  ESCALATION_REASON=<ambiguous-spec|new-side-effect-class|loop-exhausted>\n  WO_ID=<id>\n  NODE=plan-review\n  ATTEMPTS=<n>/3\n  WHAT_FAILED=<one paragraph>\n  WHAT_WAS_TRIED=<3-6 bullets>\n  LAST_REVIEW_FINDINGS=<exact bullets>\n  SINGLE_DECISION_NEEDED=<one sentence John can answer>\n  SAFE_STATE=<nothing committed/pushed; plan stage only>\n"}},{id: implement,persona: major-build,depends_on: [plan-review],agent: major-build,task_class: medium_work,loop: {prompt: "Implement the approved plan for WO-CAULDRON-MULTI-STAGE-PIPELINE-01.\n\n## Spec\n$read-spec.output\n\n## Plan (approved by plan-review)\nUse ONLY the text between the === APPROVED_PLAN_BEGIN === and\n=== APPROVED_PLAN_END === markers below as the plan. IGNORE everything outside\nthose markers (verdict headers, the PLAN_REVIEW_FINDINGS block, sentinels) --\nthat is reviewer metadata, not the plan.\n$plan-review.output\n\n## WORKTREE PINNING\nYou run inside ONE assigned git worktree. ALL of your work and ALL of your\ncompletion judgments MUST happen inside it. Resolve it first:\n  WT=$(git rev-parse --show-toplevel)\nThen:\n- Make EVERY git/grep/diff/log call relative to THIS worktree.\n- You MUST NOT read, grep, or judge \"already done\" against any OTHER location:\n  not the shared source/ checkout, not origin/main, not another thread's worktree.\n\n## Execution Rules for this WO (CRITICAL -- business-risk invariant)\nThe new bdc-multi-stage-development.yaml + supporting code MUST:\n- Accept an ORDERED stages: list with N elements (NOT hardcoded to 2). Each\n  stage has: id, repo, target_branch, depends_on (optional), in_scope_files,\n  verify_commands, readiness_bar { pr_open, ci_green, diff_review_clean, mergeable }.\n- Run stages SEQUENTIALLY: stage N+1 starts ONLY after stage N's readiness bar\n  (PR-open + CI-green + review-clean + mergeable) passes. PR-open + mergeable,\n  NOT merged (no mid-run merge babysitting).\n- Allocate ONE worktree per stage (multi-worktree extension of the existing\n  single-worktree allocator). Each stage's build loop runs IN that worktree.\n- Thread forward, per stage: PR URL, branch name, API contract/route list,\n  staging URL, env vars / endpoint base URLs. Stage N+1 MUST be able to read\n  stage N's artifacts.\n- Deterministic per-stage branch naming: archon/<wo-id>/<stage-id>-<run-id>.\n  Re-fires UPDATE the same stage branch -- NO duplicate PR spray.\n- Single-repo fallback: a 1-stage pipeline EITHER delegates directly to\n  bdc-feature-development OR runs the same stage engine with N=1 and produces\n  behavior-equivalent output. The choice MUST be stated explicitly.\n- Pre-flight: assert EVERY declared stage's repo is registered in the codebase\n  registry BEFORE any stage starts. Unregistered repo -> FAIL FAST (no partial\n  builds, no false REVIEW).\n- Failure semantics: stage-N failure after stage-(N-1) PR exists -> earlier PRs\n  STAND, failing stage = BLOCKED with reason, pipeline overall = BLOCKED. NEVER\n  partial REVIEW. NEVER silently skip a repo.\n- Consolidated manifest covering EVERY stage with: branch, PR, repo, status,\n  verify result, review result, blocking reason. flip-notion -> REVIEW only when\n  ALL required stages pass their gate; ANY blocked stage -> BLOCKED.\n- Reuse the bdc-feature-development node pattern (plan -> implement -> verify ->\n  diff-review -> commit-push -> open-pr) PER stage. Do NOT rebuild the build loop.\n- The workflow YAML itself MUST be pure ASCII (dogfood Rule 13).\n\n## Files in scope\n- .archon/workflows/defaults/bdc-multi-stage-development.yaml (NEW workflow)\n- packages/.../worktree.ts area (extend single-worktree allocator to per-stage)\n- regenerated bundled-defaults bundle (per harness convention)\nOut of scope: bdc-feature-development.yaml internal edits beyond optional N=1\ndelegation; any change to shopops-api or lspro-react repos in this WO; the\npilot fire against WO-CONNECT-MANUAL-AND-UI-01 (that is a separate fire after\nthis WO lands).\n\nDo not deploy. Do not bypass approval gates. Do not use git commit --allow-empty.\n\n## Commit-and-push BEFORE exit\nWhen your implementation is complete, BEFORE emitting the sentinel below, run:\n\n```bash\nBRANCH=$(git rev-parse --abbrev-ref HEAD)\nWO_ID=\"${WO_ID:-WO-CAULDRON-MULTI-STAGE-PIPELINE-01}\"\ngit add -A\ngit diff --cached --quiet || git commit -m \"feat: implement ${WO_ID}\n\nImplementation per WO spec. Self-verified within implement loop.\n\nCo-Authored-By: Claude (Cauldron major-build) <noreply@anthropic.com>\"\ngit push -u origin \"$BRANCH\" 2>&1 || echo \"WARN: push failed - operator must recover from worktree\"\n```\n\n## Completion Criteria + Sentinel Emission\nBefore emitting any completion sentinel, run this self-check IN THIS WORKTREE:\n  WT=$(git rev-parse --show-toplevel)\n  CHANGED=$(git -C \"$WT\" status --porcelain | wc -l)\n  AHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null \\\n          || git -C \"$WT\" rev-list --count HEAD --not --remotes 2>/dev/null || echo 0)\nThen choose EXACTLY ONE ending:\n\n1. REAL BUILD (you made in-scope changes): only if CHANGED>0 OR AHEAD>0 with real\n   file changes. Emit, each on its own line:\n     COMPLETE\n     BUILD_COMPLETE\n     <promise>COMPLETE</promise>\n\n2. ALREADY SATISFIED (deliverables already reachable from THIS worktree's HEAD):\n     ALREADY_SATISFIED: <one sentence: which deliverables already exist in this worktree HEAD>\n     COMPLETE\n\n3. TRUE BLOCKER (spec ambiguous / missing source of truth / cannot proceed):\n     BLOCKED: <one-sentence reason>\n\nANTI-FRAUD RULE: you may emit the case-1 BUILD sentinels ONLY if you made real\nin-scope edits. If you did no work because it was already done, that is case 2.\n",until: COMPLETE,max_iterations: 5,fresh_context: true}},{id: checkpoint-push,persona: overseer,depends_on: [implement],bash: "set -uo pipefail\n\nWO_ID=\"${WO_ID:-WO-CAULDRON-MULTI-STAGE-PIPELINE-01}\"\nWIP_BRANCH=\"wip/${WO_ID}-$(date +%Y%m%d%H%M%S)\"\n\ngit add -A 2>/dev/null || true\n\nif git diff --cached --quiet 2>/dev/null; then\n  echo \"checkpoint-push: nothing staged -- no commit needed\"\n  exit 0\nfi\n\ngit commit -m \"wip: checkpoint after implement loop -- ${WO_ID}\n\nCauldron resilience checkpoint. Not the final commit.\nWill be superseded by backstop commit-and-push node.\n\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>\" \\\n  2>/dev/null || { echo \"WARN: checkpoint commit failed -- continuing\" >&2; exit 0; }\n\nif git push -u origin \"HEAD:${WIP_BRANCH}\" 2>/dev/null; then\n  echo \"checkpoint-push: WIP branch pushed -- ${WIP_BRANCH}\"\n  echo \"CHECKPOINT_BRANCH=${WIP_BRANCH}\"\n  echo \"CHECKPOINT_SHA=$(git rev-parse HEAD)\"\nelse\n  echo \"WARN: checkpoint push failed -- work is local only; backstop will retry\" >&2\nfi\nexit 0\n"},{id: assert-implement-produced-work,persona: overseer,depends_on: [checkpoint-push],load_bearing: true,bash: "set -uo pipefail\nIMPL=$implement.output\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nBASE=$(cat \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || echo \"\")\nHEAD_NOW=$(git -C \"$WT\" rev-parse HEAD 2>/dev/null || echo \"\")\nCHANGED=$(git -C \"$WT\" status --porcelain 2>/dev/null | grep -c . || echo 0)\nif [ -n \"$BASE\" ] && [ \"$BASE\" != \"unknown\" ] && [ -n \"$HEAD_NOW\" ]; then\n  AHEAD=$(git -C \"$WT\" rev-list --count \"${BASE}..HEAD\" 2>/dev/null || echo 0)\nelse\n  AHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null || echo 0)\nfi\nHAS_WORK=false\nif [ \"${CHANGED:-0}\" -gt 0 ] || [ \"${AHEAD:-0}\" -gt 0 ]; then HAS_WORK=true; fi\n\nSAID_COMPLETE=false\nif printf '%s\\n' \"$IMPL\" | grep -qE '^(COMPLETE|BUILD_COMPLETE)$|<promise>COMPLETE</promise>'; then SAID_COMPLETE=true; fi\nSAID_ALREADY=false\nif printf '%s\\n' \"$IMPL\" | grep -qE '^ALREADY_SATISFIED:'; then SAID_ALREADY=true; fi\n\necho \"WORKTREE=$WT\"\necho \"CHANGED_FILES=$CHANGED\"\necho \"COMMITS_AHEAD=$AHEAD\"\necho \"IMPL_SAID_COMPLETE=$SAID_COMPLETE\"\necho \"IMPL_SAID_ALREADY_SATISFIED=$SAID_ALREADY\"\n\nif [ \"$HAS_WORK\" = \"true\" ]; then\n  echo \"BUILD_OUTCOME=REAL_BUILD\"\n  echo \"assert-implement-produced-work: real changes present -- proceeding to review chain\"\n  exit 0\nfi\n\nif [ \"$SAID_ALREADY\" = \"true\" ]; then\n  echo \"BUILD_OUTCOME=ALREADY_SATISFIED\"\n  echo \"assert-implement-produced-work: implement reported ALREADY_SATISFIED and worktree is genuinely clean -- legitimate no-op\"\n  exit 0\nfi\n\necho \"BUILD_OUTCOME=FALSE_COMPLETE\"\necho \"ERROR: implement emitted COMPLETE but produced ZERO real changes (CHANGED=$CHANGED AHEAD=$AHEAD).\" >&2\nexit 0\n"},{id: ascii-gate,persona: major-build,depends_on: [assert-implement-produced-work],load_bearing: true,bash: "set -uo pipefail\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\ncd \"$WT\"\nBASE=$(cat \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || echo \"\")\nif [ -z \"$BASE\" ] || [ \"$BASE\" = \"unknown\" ] || ! git rev-parse --verify \"$BASE\" >/dev/null 2>&1; then\n  BASE_REF=\"origin/${BASE_BRANCH:-main}\"\n  BASE=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"\")\nfi\nSRC_RE='\\.(js|jsx|ts|tsx|mjs|cjs|html|sh|bash|gs|yaml|yml)$'\nif [ -n \"$BASE\" ] && git rev-parse --verify \"$BASE\" >/dev/null 2>&1; then\n  CHANGED=$( { git diff --name-only \"$BASE\"..HEAD 2>/dev/null; git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E \"$SRC_RE\" || true )\nelse\n  CHANGED=$( { git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u | grep -E \"$SRC_RE\" || true )\nfi\nif [ -z \"$CHANGED\" ]; then\n  echo \"ascii-gate PASS (no changed source files to scan)\"\n  exit 0\nfi\nGREP_P_OK=0\nif printf 'a\\xe2\\x80\\x94b\\n' | grep -qP \"[^\\x00-\\x7F]\" 2>/dev/null; then GREP_P_OK=1; fi\ndetect() {\n  f=\"$1\"\n  if [ \"$GREP_P_OK\" = \"1\" ]; then\n    grep -lP \"[^\\x00-\\x7F]\" \"$f\" >/dev/null 2>&1 && return 1\n  elif command -v perl >/dev/null 2>&1; then\n    perl -ne 'exit 1 if /[^\\x00-\\x7F]/' \"$f\" || return 1\n  else\n    od -An -tu1 \"$f\" 2>/dev/null | tr ' ' '\\n' | grep -qE '^(12[89]|1[3-9][0-9]|2[0-4][0-9]|25[0-5])$' && return 1\n  fi\n  return 0\n}\nHITFILE=$(mktemp)\nprintf '%s\\n' \"$CHANGED\" | while IFS= read -r f; do\n  [ -z \"$f\" ] && continue\n  [ -f \"$f\" ] || continue\n  if ! detect \"$f\"; then printf '%s\\n' \"$f\" >> \"$HITFILE\"; fi\ndone\nif [ -s \"$HITFILE\" ]; then\n  echo \"ASCII GATE FAILED -- non-ASCII bytes in changed source file(s):\" >&2\n  cat \"$HITFILE\" >&2\n  rm -f \"$HITFILE\"\n  exit 1\nfi\nrm -f \"$HITFILE\"\necho \"ascii-gate PASS (scanned $(printf '%s\\n' \"$CHANGED\" | grep -c .) changed source file(s), all ASCII)\"\nexit 0\n"},{id: war-council-validator,persona: captain-ci-validator,depends_on: [ascii-gate],task_class: medium_work,prompt: "Invoke or emulate the war-council-validator review for this Work Order.\n\n## Validator Agent\nwar-council-validator\n\n## Inputs\nSpec:\n$read-spec.output\n\nPlan (approved -- reviewed + revised by plan-review):\n$plan-review.output\n\nImplementation output:\n$implement.output\n\nGit diff:\nRun `git diff --stat` and `git diff --check`, then inspect the relevant changed files.\n\n## Required Output\nReturn either:\n- satisfied: with evidence that the spec deliverables and stop conditions were met\n- needs_revision: with exact file/path/behavior findings\n"},{id: capture-diff,depends_on: [war-council-validator],bash: "set -uo pipefail\nmkdir -p \"$ARTIFACTS_DIR\"\nOUT=\"$ARTIFACTS_DIR/diff.patch\"\nBASE_REF=\"origin/${BASE_BRANCH:-main}\"\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\n{\n  echo \"### git diff --stat ($MB..HEAD)\"\n  git diff --stat \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### git diff --name-only ($MB..HEAD)\"\n  git diff --name-only \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### committed diff ($MB..HEAD)\"\n  git diff \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### unstaged working-tree diff (HEAD..worktree)\"\n  git diff HEAD 2>/dev/null || true\n} > \"$OUT\"\necho \"DIFF_BASE=$MB\"\necho \"DIFF_COMMAND=git diff $MB..HEAD (+ git diff HEAD for unstaged)\"\necho \"DIFF_ARTIFACT=$OUT\"\necho \"DIFF_BYTES=$(wc -c < \"$OUT\" 2>/dev/null || echo 0)\"\n"},{id: diff-review,provider: codex,model: gpt-5.5,agent: codex-adversarial-reviewer,depends_on: [capture-diff],task_class: medium_work,prompt: "You are the Codex adversarial diff reviewer. Cross-model review of the diff that\nmajor-build just produced, BEFORE it is committed. You are READ-ONLY.\n\n## Inputs\nSpec: $read-spec.output\nValidator verdict: $war-council-validator.output\nDiff provenance: $capture-diff.output\n\n## Inspect the ACTUAL diff (read-only)\nREAD the captured diff at the DIFF_ARTIFACT path from $capture-diff.output (it is\n$ARTIFACTS_DIR/diff.patch). Use Read/Grep/Glob on the changed files for context.\n\n## Focus areas (in addition to general adversarial review)\n1. Generic N-stage contract: the new workflow MUST accept an ordered stages: list\n   (N elements), NOT hardcode 2 repos / 2 stages / \"dual-repo\". Any \"dual-repo\"\n   token surviving in the workflow YAML or filename is a P0 finding.\n2. Sequential gating: stage N+1 must NOT start until stage N's readiness bar\n   (pr_open + ci_green + diff_review_clean + mergeable) passes. Concurrent stages\n   or skipped gate = P0.\n3. Per-stage worktree allocation: the substrate code MUST allocate one worktree\n   per declared stage. A workflow that still binds one worktree per run is a P0.\n4. Pre-flight registry check: every declared stage's repo MUST be asserted\n   registered BEFORE stage 1 starts. Missing = P0 (the connect-saga failure mode).\n5. Partial-failure preservation: stage-N failure after stage-(N-1) PR exists must\n   keep the earlier PR standing and set overall = BLOCKED (not partial REVIEW,\n   not silent skip). Any path that flips REVIEW with a blocked stage = P0.\n6. Deterministic per-stage branch naming + idempotent re-fire (archon/<wo-id>/\n   <stage-id>-<run-id>). Duplicate-PR spray on re-fire = P0.\n7. N=1 single-repo regression: a 1-stage pipeline must produce identical behavior\n   to bdc-feature-development today (one worktree, one PR, no regression).\n8. Consolidated manifest: every stage with branch, PR, repo, status, verify,\n   review, blocking reason. Missing any field = finding.\n9. Workflow YAML itself is pure ASCII (dogfood Rule 13).\n10. Contract drift, unverified claims, unsafe behavior, missing tests for any\n    in-scope behavior.\n\n## Output (STDOUT only -- you cannot write files)\nEmit exactly:\n  DIFF_REVIEW=<satisfied|needs_revision>\n  FINDINGS:\n  - <file:line> <one specific, fixable finding>   (repeat; or \"(none)\")\n  SEMANTIC_RISK=<LOW|MEDIUM|HIGH>\n"},{id: diff-repair,persona: major-build,agent: major-build,depends_on: [diff-review],task_class: medium_work,loop: {fresh_context: true,until: __NEVER_EMIT_USE_UNTIL_BASH__,max_iterations: 3,until_bash: "set -uo pipefail\nDONE=\"$ARTIFACTS_DIR/diff-repair-done.flag\"\n[ -f \"$DONE\" ] || { echo \"repair not signalled done\"; exit 1; }\nBASE_REF=\"origin/${BASE_BRANCH:-main}\"\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\nDEBUG_RE='console\\.log\\(|debugger;|binding\\.pry|import pdb'\nif { git diff --unified=0 \"$MB\"..HEAD 2>/dev/null; git diff --unified=0 HEAD 2>/dev/null; } \\\n     | grep -E '^\\+' | grep -Eq \"$DEBUG_RE\"; then\n  echo \"debug statement present in feature diff\"; exit 1\nfi\nexit 0\n",prompt: "You are major-build. The Codex diff reviewer raised findings on your diff.\nFix every fixable finding in place. You are the BUILDER; Codex does not edit.\n\n## Codex review verdict\n$diff-review.output\n\n## Prior repair iteration (if any)\n$LOOP_PREV_OUTPUT\n\n## What to do\n- If DIFF_REVIEW=satisfied with no findings: make no changes; just signal done.\n- Otherwise: resolve each FINDINGS line. Fix the generic N-stage contract,\n  fix sequential gating, fix per-stage worktree allocation, add the pre-flight\n  registry check, fix partial-failure preservation, fix deterministic per-stage\n  branch naming, fix N=1 regression, complete the consolidated manifest.\n  Modify only in-scope files.\n\n## NEVER FABRICATE A DIFF\nIf the captured diff is empty / header-only because the WO appears already\nimplemented, you MUST NOT regenerate or reconstruct $ARTIFACTS_DIR/diff.patch\nfrom already-merged commits or any other branch/worktree. The diff artifact\nmust reflect ONLY real, uncommitted-or-this-worktree changes.\n\n## Escalation (ONLY these -- else fix and let the loop continue)\nWrite the escalation block to $ARTIFACTS_DIR/diff-repair-escalation.txt and STOP if:\n- a finding requires a new side-effect class / scope the lane was not granted\n- a finding requires human-only authority\n- the spec is ambiguous about the correct fix\n- the same finding survived a prior repair attempt and you cannot resolve it\nEscalation block (exact keys):\n  ESCALATION_REQUIRED=true\n  ESCALATION_REASON=<new-side-effect-class|human-only-authority|ambiguous-spec|loop-exhausted|already-implemented-no-diff>\n  WO_ID=<id>\n  NODE=diff-repair\n  ATTEMPTS=<n>/3\n  WHAT_FAILED=<one paragraph>\n  WHAT_WAS_TRIED=<3-6 bullets>\n  LAST_REVIEW_FINDINGS=<exact Codex findings>\n  SINGLE_DECISION_NEEDED=<one sentence John can answer>\n  SAFE_STATE=<work is local in the worktree; nothing committed or pushed yet>\n\n## Signal done (the FLAG is the only gate -- there is NO completion token)\nWhen you have addressed every fixable finding (or there were none) AND\nintroduced no debug prints:\n  - Write an empty file at $ARTIFACTS_DIR/diff-repair-done.flag\n"}},{id: capture-diff-final,depends_on: [diff-repair],trigger_rule: all_done,bash: "set -uo pipefail\nmkdir -p \"$ARTIFACTS_DIR\"\nOUT=\"$ARTIFACTS_DIR/diff-final.patch\"\nBASE_REF=\"origin/${BASE_BRANCH:-main}\"\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\n{\n  echo \"### committed diff ($MB..HEAD)\"\n  git diff \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### unstaged working-tree diff (HEAD..worktree)\"\n  git diff HEAD 2>/dev/null || true\n} > \"$OUT\"\necho \"DIFF_FINAL_BASE=$MB\"\necho \"DIFF_FINAL_ARTIFACT=$OUT\"\necho \"DIFF_FINAL_BYTES=$(wc -c < \"$OUT\" 2>/dev/null || echo 0)\"\n"},{id: diff-review-final,provider: codex,model: gpt-5.5,agent: codex-adversarial-reviewer,depends_on: [capture-diff-final],trigger_rule: all_done,task_class: medium_work,prompt: "You are the Codex adversarial reviewer doing the FINAL re-review after repair.\nRead-only. This node decides whether any semantic finding remains before commit.\n\n## Inputs\nSpec: $read-spec.output\nYour original findings: $diff-review.output\nRepair pass output: $diff-repair.output\nRefreshed diff provenance: $capture-diff-final.output\n(Read the repaired diff at DIFF_FINAL_ARTIFACT = $ARTIFACTS_DIR/diff-final.patch.)\n\n## Branch on the repair outcome FIRST\n- If diff-repair FAILED or exhausted iterations: do NOT certify. Emit\n  DIFF_REVIEW_FINAL=needs_revision, summarize the unresolved repair state in\n  UNRESOLVED, and carry through any escalation reason.\n- Otherwise: re-inspect the repaired diff. For EACH finding you raised originally,\n  verify it is actually resolved in the current tree.\n\n## Output (STDOUT only)\n  DIFF_REVIEW_FINAL=<satisfied|needs_revision>\n  UNRESOLVED:\n  - <file:line> <finding still open>   (repeat; or \"(none)\")\n  SEMANTIC_RISK=<LOW|MEDIUM|HIGH>\n"},{id: block-classify,depends_on: [diff-review-final],trigger_rule: all_done,bash: "set -uo pipefail\nDIFF_FINAL=$diff-review-final.output\nBUILD=$assert-implement-produced-work.output\n\nfinal_ok=false\nfinal_verdict=$(printf '%s\\n' \"$DIFF_FINAL\" \\\n  | grep -oE 'DIFF_REVIEW_FINAL=(satisfied|needs_revision)' \\\n  | tail -n 1)\nif [ \"$final_verdict\" = \"DIFF_REVIEW_FINAL=satisfied\" ]; then final_ok=true; fi\noutcome=$(printf '%s\\n' \"$BUILD\" | sed -n 's/^BUILD_OUTCOME=//p' | head -1)\n\nif [ \"$outcome\" = \"ALREADY_SATISFIED\" ]; then\n  STATUS=ALREADY_SATISFIED\nelif [ \"$outcome\" = \"REAL_BUILD\" ] && [ \"$final_ok\" = \"true\" ]; then\n  STATUS=PROCEED\nelse\n  STATUS=BLOCKED\nfi\nprintf '{\"status\":\"%s\",\"final_satisfied\":%s,\"build_outcome\":\"%s\"}\\n' \"$STATUS\" \"$final_ok\" \"${outcome:-unknown}\"\n"},{id: opus-repair,agent: overseer-opus,effort: xhigh,context: fresh,depends_on: [block-classify],when: "$block-classify.output.status == 'BLOCKED'",prompt: "The bdc-cauldron-multi-stage-pipeline-01 run is BLOCKED before the irreversible\ncommit. Before a human is paused, you get ONE autonomous repair pass.\n\n## Why blocked\nblock-classify: $block-classify.output\ndiff-review-final: $diff-review-final.output\nassert-implement-produced-work: $assert-implement-produced-work.output\nOriginal Codex findings: $diff-review.output\n\n## Your job\n- If FALSE_COMPLETE: determine whether the WO genuinely needs work here. If yes\n  and you can make the in-scope changes, make them in the assigned worktree.\n- If diff-review-final=needs_revision: make the specific fix the final reviewer\n  named, in scope, in this worktree.\n- Judge ONLY against this worktree (no origin/main, no sibling worktrees).\n- For this WO: the workflow MUST be a generic N-stage sequential pipeline (not\n  a 2-repo special case); per-stage worktree allocation; pre-flight registry\n  check; partial-failure preservation; deterministic per-stage branch naming;\n  N=1 single-repo regression preserved; consolidated manifest.\n\n## Output (last lines)\n- If you resolved it:\n    OPUS_REPAIR=fixed\n- If genuinely already-satisfied:\n    OPUS_REPAIR=already-satisfied\n- If you could NOT resolve it:\n    OPUS_REPAIR=needs-human\n    REASON=<one sentence>\n"},{id: block-reclassify,depends_on: [block-classify,opus-repair],trigger_rule: all_done,bash: "set -uo pipefail\nPRIOR=$block-classify.output\nOPUS=$opus-repair.output\nprior_status=$(printf '%s\\n' \"$PRIOR\" | sed -n 's/.*\"status\":\"\\([A-Z_]*\\)\".*/\\1/p' | head -1)\n\nif [ \"$prior_status\" != \"BLOCKED\" ]; then\n  printf '{\"status\":\"%s\"}\\n' \"${prior_status:-BLOCKED}\"\n  exit 0\nfi\n\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nCHANGED=$(git -C \"$WT\" status --porcelain 2>/dev/null | grep -c . || echo 0)\nAHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null \\\n        || git -C \"$WT\" rev-list --count HEAD --not --remotes 2>/dev/null || echo 0)\n\nif printf '%s\\n' \"$OPUS\" | grep -q '^OPUS_REPAIR=fixed' && { [ \"${CHANGED:-0}\" -gt 0 ] || [ \"${AHEAD:-0}\" -gt 0 ]; }; then\n  printf '{\"status\":\"BLOCKED\",\"note\":\"opus-made-changes-need-re-review\"}\\n'\nelif printf '%s\\n' \"$OPUS\" | grep -q '^OPUS_REPAIR=already-satisfied'; then\n  printf '{\"status\":\"ALREADY_SATISFIED\",\"note\":\"opus-confirmed-already-satisfied\"}\\n'\nelse\n  printf '{\"status\":\"BLOCKED\",\"note\":\"opus-could-not-resolve\"}\\n'\nfi\n"},{id: pause-gate,depends_on: [block-reclassify],when: "$block-reclassify.output.status == 'BLOCKED'",approval: {message: "This run is BLOCKED before the irreversible commit and the AI tiers could not\nsafely resolve it. The run is PAUSED (not failed) -- nothing was committed or\npushed. Review and either correct + resume, or reject.\n\nWhat to inspect:\n- block-classify / block-reclassify: why it blocked.\n- diff-review-final verdict + Codex findings.\n- opus-repair output: what the Opus tier tried and why it could not finish.\n- business-risk-gate output (if blocking): the multi-stage pipeline may have\n  violated single-repo no-regression OR allowed a stage to false-complete /\n  silently skip a repo (the WO's load-bearing invariant).\n- $ARTIFACTS_DIR/diff-repair-escalation.txt if present.\n\nSAFE STATE: no commit, no push, no PR, no Notion write has happened.\n\n- \"approved\" / \"proceed\" -> resume\n- \"reject\" / \"stop\" -> halt\n",capture_response: true,on_reject: {prompt: "The operator rejected the blocked run. Summarize what was blocked, what the AI\ntiers tried, and what a human must change before re-running.\nOutput: OPERATOR_REJECTED: <reason from approval response>\n",max_attempts: 2}}},{id: business-risk-gate,persona: overseer,depends_on: [block-reclassify],when: "$block-reclassify.output.status == 'PROCEED'",load_bearing: true,bash: "set -uo pipefail\n# BUSINESS_RISK_INVARIANT (verbatim from spec):\n# Single-repo WOs MUST produce identical behavior to bdc-feature-development (one\n# worktree, one PR, no regression); a MIXED-repo WO MUST NEVER false-complete or\n# silently skip a repo -- any unregistered or failed stage must FAIL FAST or set\n# BLOCKED, never REVIEW.\necho \"BUSINESS_RISK_INVARIANT: Single-repo WOs MUST produce identical behavior to bdc-feature-development (one worktree, one PR, no regression); a MIXED-repo WO MUST NEVER false-complete or silently skip a repo -- any unregistered or failed stage must FAIL FAST or set BLOCKED, never REVIEW.\"\n\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\ncd \"$WT\"\nBASE=$(cat \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || echo \"\")\nif [ -z \"$BASE\" ] || [ \"$BASE\" = \"unknown\" ] || ! git rev-parse --verify \"$BASE\" >/dev/null 2>&1; then\n  BASE_REF=\"origin/${BASE_BRANCH:-main}\"\n  BASE=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"\")\nfi\n\n# Identify the new multi-stage workflow YAML + supporting code introduced by this run.\nCHANGED=$( { git diff --name-only \"$BASE\"..HEAD 2>/dev/null; git diff --name-only HEAD 2>/dev/null; git ls-files --others --exclude-standard 2>/dev/null; } | sort -u || true )\nWORKFLOW_FILES=$(printf '%s\\n' \"$CHANGED\" | grep -E '\\.archon/workflows/.*bdc-multi-stage-development.*\\.ya?ml$' || true)\nALL_WORKFLOW_FILES=$(printf '%s\\n' \"$CHANGED\" | grep -E '\\.archon/workflows/.*\\.ya?ml$' || true)\nCODE_FILES=$(printf '%s\\n' \"$CHANGED\" | grep -E '\\.(ts|tsx|js|mjs|cjs)$' || true)\nSCAN_TARGETS=\"$WORKFLOW_FILES $CODE_FILES\"\n\nVIOLATIONS=0\n\n# Check 1: the new workflow YAML MUST exist in the changed set.\nif [ -z \"$WORKFLOW_FILES\" ]; then\n  echo \"VIOLATION: bdc-multi-stage-development.yaml not present in the changed file set.\" >&2\n  VIOLATIONS=$((VIOLATIONS + 1))\nfi\n\n# Check 2: ZERO \"dual-repo\" tokens may survive (rename invariant per General's C1).\n# The model is generic N-stage, not a 2-repo special case. Any \"dual-repo\" or\n# \"dual_repo\" string in any changed workflow YAML is a P0 violation.\nDUAL_REPO_HITS=0\nfor f in $ALL_WORKFLOW_FILES; do\n  [ -f \"$f\" ] || continue\n  if grep -Eiq 'dual[._-]?repo' \"$f\" 2>/dev/null; then\n    echo \"VIOLATION ($f): 'dual-repo' token survives -- the pipeline is generic N-stage, not 2-repo.\" >&2\n    VIOLATIONS=$((VIOLATIONS + 1))\n    DUAL_REPO_HITS=$((DUAL_REPO_HITS + 1))\n  fi\ndone\n\n# Check 3: the new workflow must reference the generic N-stage contract.\n# Require at least one of: 'stages', 'per-stage', 'stage-gate', 'stage_gate',\n# or 'allocate.*worktree' in the bdc-multi-stage-development workflow.\nSTAGE_OK=false\nfor f in $WORKFLOW_FILES; do\n  [ -f \"$f\" ] || continue\n  if grep -Eq '(stages|per-stage|stage[-_]gate|allocate.*worktree)' \"$f\" 2>/dev/null; then\n    STAGE_OK=true\n    break\n  fi\ndone\nif [ -n \"$WORKFLOW_FILES\" ] && [ \"$STAGE_OK\" = \"false\" ]; then\n  echo \"VIOLATION: bdc-multi-stage-development.yaml does not reference the N-stage contract (stages/per-stage/stage-gate/allocate worktree).\" >&2\n  VIOLATIONS=$((VIOLATIONS + 1))\nfi\n\n# Check 4: the workflow MUST encode fail-fast / BLOCKED semantics. Forbid any\n# path that flips REVIEW with a blocked or unregistered stage. Require a\n# registry pre-flight reference AND a BLOCKED-on-stage-failure reference.\nFAILFAST_OK=false\nfor f in $WORKFLOW_FILES; do\n  [ -f \"$f\" ] || continue\n  if grep -Eqi '(BLOCKED|fail[-_ ]?fast|unregistered|registry)' \"$f\" 2>/dev/null; then\n    FAILFAST_OK=true\n    break\n  fi\ndone\nif [ -n \"$WORKFLOW_FILES\" ] && [ \"$FAILFAST_OK\" = \"false\" ]; then\n  echo \"VIOLATION: bdc-multi-stage-development.yaml does not encode fail-fast / BLOCKED semantics on stage failure.\" >&2\n  VIOLATIONS=$((VIOLATIONS + 1))\nfi\n\n# Check 5: workflow YAML + supporting code MUST be pure ASCII (dogfood Rule 13).\nfor f in $SCAN_TARGETS; do\n  [ -f \"$f\" ] || continue\n  if command -v perl >/dev/null 2>&1; then\n    if ! perl -ne 'exit 1 if /[^\\x00-\\x7F]/' \"$f\" 2>/dev/null; then\n      echo \"VIOLATION ($f): multi-stage-related file contains non-ASCII bytes (must dogfood Rule 13).\" >&2\n      VIOLATIONS=$((VIOLATIONS + 1))\n    fi\n  fi\ndone\n\nif [ \"$VIOLATIONS\" -gt 0 ]; then\n  echo \"BUSINESS_RISK_GATE=BLOCKED\" >&2\n  echo \"Total invariant violations: $VIOLATIONS\" >&2\n  echo \"Refusing to proceed to commit-and-push. Fix the violations above and re-run.\" >&2\n  exit 1\nfi\necho \"BUSINESS_RISK_GATE=PASS\"\necho \"All checks: new workflow YAML present, no 'dual-repo' tokens, N-stage contract referenced, fail-fast/BLOCKED semantics encoded, files are ASCII-clean.\"\nexit 0\n"},{id: decide-push-target,persona: major-build,depends_on: [business-risk-gate],when: "$block-reclassify.output.status == 'PROCEED'",task_class: clerical,prompt: "Decide the push target for this BDC feature Work Order.\n\n## Inputs\nSpec:\n$read-spec.output\n\nValidator:\n$war-council-validator.output\n\n## Branch Name Derivation Rules\n- Derive the branch name from the WO ID ONLY. Do NOT copy the current\n  git branch name.\n- Use prefix feat/, fix/, or wip/ followed by the WO ID in lowercase\n  with hyphens. Example: WO-CAULDRON-MULTI-STAGE-PIPELINE-01 ->\n  feat/wo-cauldron-multi-stage-pipeline-01\n- The branch MUST NOT start with archon/thread- or contain -thread-\n  anywhere.\n- Valid pattern: ^(feat/[A-Za-z0-9_-]+|fix/[A-Za-z0-9_-]+|wip/[A-Za-z0-9_-]+)$\n\n## Required Repo Policy\nTarget repo: bluedevilcollectibles/bdc-harness. This is NOT a Rule 20 staging-gate\nrepo. Output:\n  push_target: feature-branch:feat/wo-cauldron-multi-stage-pipeline-01\n  pr_required: true\n  staging_gate_required: false\n  repo: bluedevilcollectibles/bdc-harness\n\nCRITICAL: You MUST emit a `repo:` line in every output case.\n"},{id: commit-and-push,persona: overseer,depends_on: [decide-push-target],when: "$block-reclassify.output.status == 'PROCEED'",load_bearing: true,bash: "set -euo pipefail\nDECIDE_OUTPUT=$decide-push-target.output\nPLAN_REVIEW_RAW=$plan-review.output\nPLAN_OUTPUT=$(printf '%s\\n' \"$PLAN_REVIEW_RAW\" | sed -n '/=== APPROVED_PLAN_BEGIN ===/,/=== APPROVED_PLAN_END ===/p' | sed '1d;$d')\nif [ -z \"$PLAN_OUTPUT\" ]; then\n  echo \"ERROR: plan-review output missing the APPROVED_PLAN fence.\" >&2\n  exit 1\nfi\nDIFF_FINAL=$diff-review-final.output\nRECLASS=$block-reclassify.output\necho \"$DECIDE_OUTPUT\"\nif printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -q '^out_of_scope: true'; then\n  echo \"Out of scope; failing closed.\" >&2\n  exit 1\nfi\nRECLASS_STATUS=$(printf '%s\\n' \"$RECLASS\" | sed -n 's/.*\"status\":\"\\([A-Z_]*\\)\".*/\\1/p' | head -1)\nif [ \"$RECLASS_STATUS\" != \"PROCEED\" ]; then\n  echo \"ERROR: commit-and-push reached with status='$RECLASS_STATUS' (expected PROCEED).\" >&2\n  exit 1\nfi\nfinal_verdict_cap=$(printf '%s\\n' \"$DIFF_FINAL\" \\\n  | grep -oE 'DIFF_REVIEW_FINAL=(satisfied|needs_revision)' \\\n  | tail -n 1)\nif [ \"$final_verdict_cap\" != \"DIFF_REVIEW_FINAL=satisfied\" ]; then\n  echo \"ERROR: diff-review-final not satisfied despite PROCEED status.\" >&2\n  exit 1\nfi\nBRANCH=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^push_target: feature-branch://p' | head -n 1)\nif [ -z \"$BRANCH\" ]; then\n  echo \"No feature branch target found in decide-push-target output.\" >&2\n  exit 1\nfi\nBRANCH_PATTERN='^(feat/[A-Za-z0-9_-]+|fix/[A-Za-z0-9_-]+|wip/[A-Za-z0-9_-]+)$'\nif ! printf '%s\\n' \"$BRANCH\" | grep -Eq \"$BRANCH_PATTERN\"; then\n  echo \"Malformed branch name: $BRANCH\" >&2\n  exit 1\nfi\nTHREAD_ID=$(git rev-parse --abbrev-ref HEAD | sed 's|archon/thread-||')\nUNIQUE_BRANCH=\"${BRANCH}-thread-${THREAD_ID}\"\ngit status --short\nDIRTY=$(git status --porcelain)\nif [ -z \"$DIRTY\" ]; then\n  if git rev-parse --quiet --verify \"origin/${UNIQUE_BRANCH}\" >/dev/null 2>&1; then\n    COMMITS_AHEAD=$(git rev-list --count \"origin/${UNIQUE_BRANCH}..HEAD\" 2>/dev/null || echo 0)\n  else\n    COMMITS_AHEAD=$(git rev-list --count HEAD --not --remotes=origin 2>/dev/null || echo 0)\n  fi\n  if [ \"$COMMITS_AHEAD\" = \"0\" ]; then\n    LOCAL_HEAD=$(git rev-parse HEAD)\n    RECOVERED=$(git ls-remote origin 2>/dev/null \\\n      | awk -v sha=\"$LOCAL_HEAD\" '$1 == sha {sub(/^refs\\/heads\\//, \"\", $2); print $2}' \\\n      | head -1)\n    if [ -n \"$RECOVERED\" ]; then\n      echo \"Recovered push target from remote: $RECOVERED\"\n      UNIQUE_BRANCH=\"$RECOVERED\"\n    else\n      echo \"No changed files and no commits ahead of origin/${UNIQUE_BRANCH}.\" >&2\n      exit 1\n    fi\n  else\n    echo \"Backstop: $COMMITS_AHEAD commit(s) ahead of origin -- pushing pre-committed work.\"\n  fi\nelse\n  CHANGED_FILES=$(printf '%s\\n' \"$DIRTY\" | awk '{print substr($0,4)}')\n  AUTO_TOLERATED='^(bun\\.lock|package-lock\\.json|yarn\\.lock|pnpm-lock\\.yaml|\\.bun-tag|node_modules/)$'\n  printf '%s\\n' \"$CHANGED_FILES\" | while IFS= read -r path; do\n    if [ -z \"$path\" ]; then\n      continue\n    fi\n    if printf '%s\\n' \"$path\" | grep -Eq \"$AUTO_TOLERATED\"; then\n      echo \"Auto-tolerated change (lockfile/managed): $path\"\n      git add -- \"$path\"\n      continue\n    fi\n    if ! printf '%s\\n' \"$PLAN_OUTPUT\" | grep -F -- \"$path\" >/dev/null; then\n      echo \"Changed file was not listed in plan output: $path\" >&2\n      exit 1\n    fi\n    git add -- \"$path\"\n  done\n  if git diff --cached --quiet; then\n    echo \"No changes staged; nothing for backstop to commit.\" >&2\n    exit 0\n  fi\n  COMMIT_MESSAGE=$(printf '%s\\n' \"$PLAN_OUTPUT\" | sed -n 's/^Commit message: //p' | head -n 1)\n  if [ -z \"$COMMIT_MESSAGE\" ]; then\n    WO_ID=\"${WO_ID:-WO-CAULDRON-MULTI-STAGE-PIPELINE-01}\"\n    COMMIT_MESSAGE=\"feat: ${WO_ID} implementation\"\n  fi\n  git commit -m \"$COMMIT_MESSAGE\"\nfi\n\nPUSH_OK=false\nfor attempt in 1 2 3; do\n  if git push origin HEAD:\"${UNIQUE_BRANCH}\" 2>&1; then\n    PUSH_OK=true\n    break\n  fi\n  echo \"WARN: push attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PUSH_OK\" = \"false\" ]; then\n  echo \"ERROR: git push failed after 3 attempts.\" >&2\n  exit 1\nfi\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${UNIQUE_BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nLOCAL_HEAD=\"$(git rev-parse HEAD)\"\nif [ \"$REMOTE_HEAD\" != \"$LOCAL_HEAD\" ]; then\n  echo \"FATAL: canonical branch ${UNIQUE_BRANCH} not durably pushed.\" >&2\n  exit 1\nfi\necho \"VERIFIED: origin/${UNIQUE_BRANCH} == local HEAD (${LOCAL_HEAD})\"\necho \"unique_branch=${UNIQUE_BRANCH}\"\n"},{id: open-pr-if-needed,persona: major-build,depends_on: [commit-and-push],task_class: clerical,load_bearing: true,bash: "set -euo pipefail\nDECIDE_OUTPUT=$decide-push-target.output\nPLAN_REVIEW_RAW=$plan-review.output\nPLAN_OUTPUT=$(printf '%s\\n' \"$PLAN_REVIEW_RAW\" | sed -n '/=== APPROVED_PLAN_BEGIN ===/,/=== APPROVED_PLAN_END ===/p' | sed '1d;$d')\nif [ -z \"$PLAN_OUTPUT\" ]; then\n  echo \"ERROR: plan-review output missing the APPROVED_PLAN fence.\" >&2\n  exit 1\nfi\nIMPLEMENT_OUTPUT=$implement.output\nVALIDATOR_OUTPUT=$war-council-validator.output\nCOMMIT_PUSH_OUTPUT=$commit-and-push.output\nif ! printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -q '^pr_required: true'; then\n  echo \"PR not required; skipping.\"\n  exit 0\nfi\nUNIQUE_BRANCH=$(printf '%s\\n' \"$COMMIT_PUSH_OUTPUT\" | sed -n 's/^unique_branch=//p' | head -n 1)\nif [ -z \"$UNIQUE_BRANCH\" ]; then\n  echo \"UNIQUE_BRANCH not found in commit-and-push output.\" >&2\n  exit 1\nfi\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${UNIQUE_BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nif [ \"$REMOTE_HEAD\" != \"$(git rev-parse HEAD)\" ]; then\n  echo \"FATAL: open-pr precondition failed -- ${UNIQUE_BRANCH} not on origin at HEAD.\" >&2\n  exit 1\nfi\nREPO=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^repo: //p' | head -n 1)\nif [ -z \"$REPO\" ] || [ \"$REPO\" = \"unknown\" ]; then\n  echo \"ERROR: decide-push-target did not emit a valid 'repo: <owner>/<repo>'.\" >&2\n  exit 1\nfi\nSTAGING_GATE=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -c '^staging_gate_required: true' 2>/dev/null || true)\nSTAGING_GATE=\"${STAGING_GATE:-0}\"\nif [ \"$STAGING_GATE\" -ge 1 ] 2>/dev/null; then\n  BASE_BRANCH=\"staging\"\nelse\n  BASE_BRANCH=\"\"\nfi\nTITLE=$(printf '%s\\n' \"$PLAN_OUTPUT\" | sed -n 's/^Commit message: //p' | head -n 1)\nif [ -z \"$TITLE\" ]; then\n  TITLE=\"WO-CAULDRON-MULTI-STAGE-PIPELINE-01: add generic N-stage Cauldron pipeline\"\nfi\nBODY_FILE=$(mktemp)\n{\n  echo \"## Summary\"\n  echo \"$PLAN_OUTPUT\"\n  echo\n  echo \"## Validation\"\n  echo \"ascii-gate passed; business-risk-gate (load_bearing) validated the multi-stage\"\n  echo \"pipeline invariants (no dual-repo tokens, generic N-stage contract referenced,\"\n  echo \"fail-fast/BLOCKED semantics encoded, ASCII-clean) before commit.\"\n  echo\n  echo \"## Implement output\"\n  echo \"$IMPLEMENT_OUTPUT\"\n  echo\n  echo \"## Validator\"\n  echo \"$VALIDATOR_OUTPUT\"\n} > \"$BODY_FILE\"\nPR_OK=false\nfor attempt in 1 2 3; do\n  if gh pr create --repo \"$REPO\" --title \"$TITLE\" --body-file \"$BODY_FILE\" --head \"$UNIQUE_BRANCH\" ${BASE_BRANCH:+--base \"$BASE_BRANCH\"} 2>&1; then\n    PR_OK=true\n    break\n  fi\n  if [ -n \"$UNIQUE_BRANCH\" ]; then\n    EXIST=$(gh pr list --repo \"$REPO\" --head \"$UNIQUE_BRANCH\" --state open \\\n      --json url --jq '.[0].url // empty' 2>/dev/null || true)\n    if [ -n \"$EXIST\" ]; then\n      echo \"PR_URL=$EXIST\"\n      PR_OK=true\n      break\n    fi\n  fi\n  echo \"WARN: gh pr create attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PR_OK\" = \"false\" ]; then\n  echo \"PR_CREATE_FAILED_BUT_BRANCH_SAFE: repo=${REPO} branch=${UNIQUE_BRANCH} sha=$(git rev-parse HEAD)\" >&2\n  echo \"ERROR: gh pr create failed after 3 attempts.\" >&2\n  echo \"RECOVERY: open the PR manually -> gh pr create --repo ${REPO} --head ${UNIQUE_BRANCH} ${BASE_BRANCH:+--base ${BASE_BRANCH}}\" >&2\n  exit 1\nfi\n"},{id: build-manifest,persona: major-build,depends_on: [open-pr-if-needed,block-reclassify,pause-gate,business-risk-gate],trigger_rule: all_done,task_class: clerical,prompt: "Construct the Captain CI completion manifest for WO-CAULDRON-MULTI-STAGE-PIPELINE-01.\n\n## Outcome branch -- read this FIRST\nblock-reclassify status: $block-reclassify.output\nbusiness-risk-gate output: $business-risk-gate.output\n- If status=PROCEED AND business-risk-gate=PASS: a real build was committed + PR\n  opened. Build the full manifest (the normal case).\n- If status=ALREADY_SATISFIED: the WO was already implemented in this worktree.\n  Emit a SHORT manifest: WO ID, OUTCOME=ALREADY_SATISFIED, evidence, VALIDATION: PASS.\n- If status=BLOCKED OR business-risk-gate=BLOCKED: the run paused. Emit\n  OUTCOME=BLOCKED, the block reason, what the AI tiers tried, VALIDATION: BLOCKED.\n\n## Inputs\nSpec:\n$read-spec.output\n\nPlan (approved):\n$plan-review.output\n\nImplementation:\n$implement.output\n\nValidator:\n$war-council-validator.output\n\nPlan review verdict:\n$plan-review.output\n\nDiff review (Codex, initial):\n$diff-review.output\n\nDiff review (Codex, final after repair):\n$diff-review-final.output\n\nBusiness-risk-gate (load_bearing -- WO invariant):\n$business-risk-gate.output\n\n## Required Manifest Fields\n- WO ID\n- Files created\n- Files modified\n- Routes added\n- Migrations\n- Tests (count passing/total)\n- Commit SHA\n- Validation evidence (INFRA class: runtime evidence + business-risk-gate verdict)\n- PR URL, if opened\n- Staging gate status (not required for bdc-harness)\n- In-run review evidence: plan-review PASS+RISK; diff-review-final verdict;\n  business-risk-gate PASS/BLOCKED\n"},{id: flip-notion,persona: xo,depends_on: [build-manifest],trigger_rule: all_done,task_class: clerical,prompt: "Update the Notion Work Order page if Notion MCP is available in this runtime.\n\n## Outcome branch -- read block-reclassify FIRST\nblock-reclassify status: $block-reclassify.output\nbusiness-risk-gate output: $business-risk-gate.output\n- status=PROCEED AND business-risk-gate=PASS: set Claude Status: REVIEW,\n  Status: Review, add the manifest as a page comment.\n- status=ALREADY_SATISFIED: set Claude Status: REVIEW with a note that the WO\n  was already implemented (verified no-op); add the short manifest.\n- status=BLOCKED OR business-risk-gate=BLOCKED: do NOT flip to REVIEW. Add a\n  comment that the run PAUSED with the block reason; emit an XO_ACTION line.\n\n## Manifest\n$build-manifest.output\n\nIf Notion MCP is not available inside the container, do not invent a workaround.\nEmit an XO_ACTION line asking XO to flip Notion manually with the manifest above.\n"}]}