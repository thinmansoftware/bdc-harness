{name: bdc-shopops-connector-check-add-lunar-01,description: "Use when: Executing WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01 -- add 'lunar' as a\nfirst-class connector so Lunar Distribution can write identity_connector_accounts rows.\nInput: WO_ID = WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01.\nDoes:\n  - Reads spec from bdc-xo docs/work-orders/.\n  - Creates shopops-api/migrations/20260614_identity_connector_accounts_add_lunar.sql\n    (idempotent CHECK constraint extension adding 'lunar' to the nine-value set).\n  - Creates shopops-api/migrations/20260614_identity_connector_accounts_add_lunar_rollback.sql\n    (rollback: restores nine-value set, removes only 'lunar', keeps 'locg').\n  - Edits shopops-api/migrations/ci-staging-migrations.txt or apply-ci-staging-migrations.js\n    to apply the migration on staging by the same mechanism the locg migration uses.\n  - Edits shopops-api/routes/identity/connectors.js: adds 'lunar' to KNOWN_CONNECTORS\n    and DEFAULT_CAPABILITIES (reads providers/lunar.js to determine correct capabilities).\n  - Runs: node tests/run_all.js (all tests pass).\n  - Commits, pushes feature branch, opens PR to staging.\n  - Provides Rule 19 docker exec grep evidence in manifest.\n  - Flips Notion WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01 to REVIEW with manifest in Notes.\nRepo: bluedevilcollectibles/shopops (staging branch -- Rule 20 staging-gate repo).\nWO class: CODE (single-repo, schema migration + code edit).\nparallel_ok: false\n",policyFile: harness/policies/agent-behavior.md,model: sonnet,inputs: {WO_ID: {default: WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01}},nodes: [{id: preflight-github-auth,load_bearing: true,bash: "set -euo pipefail\nif ! git push --dry-run origin \"HEAD:refs/heads/preflight-auth-probe-$(date +%s)\" 2>&1; then\n  echo \"ERROR: GITHUB auth check failed -- container cannot push to bluedevilcollectibles/shopops.\" >&2\n  exit 1\nfi\necho \"preflight-github-auth PASS\"\necho \"TARGET_REPO=bluedevilcollectibles/shopops\"\necho \"TARGET_BRANCH=staging\"\n"},{id: read-spec,depends_on: [preflight-github-auth],bash: "set -euo pipefail\nWO_ID=\"${WO_ID:-WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01}\"\nSPEC_CONTENT=$(gh api \\\n  \"repos/bluedevilcollectibles/bdc-xo/contents/docs/work-orders/${WO_ID}.md?ref=main\" \\\n  --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nSPEC_PATH=\"docs/work-orders/${WO_ID}.md\"\nif [ -z \"$SPEC_CONTENT\" ]; then\n  SPEC_PATH=\"docs/superpowers/specs/${WO_ID}.md\"\n  SPEC_CONTENT=$(gh api \\\n    \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" \\\n    --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  GLOB_PATH=$(gh api \\\n    \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main\" \\\n    --template '{{range .}}{{.path}}{{\"\\n\"}}{{end}}' 2>/dev/null \\\n    | grep \"${WO_ID}.md$\" | head -1 || true)\n  if [ -n \"$GLOB_PATH\" ]; then\n    SPEC_PATH=\"$GLOB_PATH\"\n    SPEC_CONTENT=$(gh api \\\n      \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" \\\n      --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \\\n    --search \"${WO_ID} in:title\" --json number,title \\\n    --jq '.[0].number' 2>/dev/null || true)\n  if [ -n \"$ISSUE_NUM\" ] && [ \"$ISSUE_NUM\" != \"null\" ]; then\n    SPEC_CONTENT=$(gh issue view \"$ISSUE_NUM\" --repo bluedevilcollectibles/bdc-xo \\\n      --json body --jq .body 2>/dev/null || true)\n    [ -n \"$SPEC_CONTENT\" ] && SPEC_PATH=\"issues/${ISSUE_NUM}\"\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  echo \"Spec not found for ${WO_ID}\" >&2; exit 1\nfi\nprintf 'WO_ID=%s\\nSPEC_PATH=bdc-xo:%s\\n\\n' \"$WO_ID\" \"$SPEC_PATH\"\nprintf -- '--- SPEC ---\\n%s\\n' \"$SPEC_CONTENT\"\n"},{id: fresh-branch,depends_on: [read-spec],bash: "set -euo pipefail\ngit fetch origin staging --depth=50 || true\ngit checkout staging 2>/dev/null || echo \"staging branch held by worktree; staying on current HEAD\"\ngit reset --hard origin/staging 2>/dev/null || true\nBRANCH=\"wo/shopops-connector-check-add-lunar-01-run-$(date +%Y%m%d%H%M%S)\"\ngit checkout -b \"$BRANCH\"\necho \"BRANCH=${BRANCH}\"\necho \"BASE=staging\"\necho \"REPO=bluedevilcollectibles/shopops\"\n"},{id: implement,depends_on: [fresh-branch],loop: {fresh_context: true,until: COMPLETE,max_iterations: 5,prompt: "Implement WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01 in the shopops repo.\nCWD = shopops repo root. This is a COMPLETION of half-done work -- the locg\nmigration is the exact template, mirror it for lunar. All three changes must land.\n\n## Spec\n$read-spec.output\n\n## Branch\n$fresh-branch.output\n\n## STEP 0 -- Read provider and apply-script FIRST (Rule 17)\nBefore writing anything:\n1. Read shopops-api/services/connect/providers/lunar.js to determine capabilities.\n2. Read shopops-api/scripts/apply-ci-staging-migrations.js end-to-end to confirm\n   how the locg migration is applied on staging. Apply lunar by the SAME mechanism.\n3. Read shopops-api/routes/identity/connectors.js (full file) to understand\n   KNOWN_CONNECTORS, DEFAULT_CAPABILITIES, and any credentialsExist block.\n\n## STEP 1 -- Migration (CREATE NEW)\nCreate shopops-api/migrations/20260614_identity_connector_accounts_add_lunar.sql.\nMirror the locg migration EXACTLY: idempotent, pg_class-guarded, DO block,\nBEGIN/DO/COMMIT, ASCII-only, no emojis. New CHECK set: existing nine plus 'lunar'.\nHeader: companion to WO-CONNECT-LUNAR-ADAPTER-01; STAGING ONLY; idempotent.\nReference failing tests: test_connect_lunar.js, test_connect_capture.js,\ntest_connect_agent_contract.js.\n\nAlso create shopops-api/migrations/20260614_identity_connector_accounts_add_lunar_rollback.sql.\nRollback restores nine-value set (removes only 'lunar', keeps 'locg').\n\n## STEP 2 -- Apply mechanism (match locg)\nApply the lunar migration by whichever mechanism the locg migration uses (discovered\nin STEP 0 -- may be manifest-txt entry or apply-script special-case).\nDo NOT add rollback files to any manifest.\n\n## STEP 3 -- KNOWN_CONNECTORS + DEFAULT_CAPABILITIES (EDIT connectors.js)\nAdd 'lunar' to KNOWN_CONNECTORS (after 'locg').\nAdd lunar: entry to DEFAULT_CAPABILITIES using actual capabilities from\nproviders/lunar.js (discovered in STEP 0).\nIf there is a credentialsExist/secret-field block for 'locg', add a parallel\nblock for 'lunar' matching the provider's actual secret shape.\n\n## Tests\ncd shopops-api && node tests/run_all.js\ntest_connect_lunar.js, test_connect_capture.js, test_connect_agent_contract.js must pass.\n\n## Commit\ngit -c user.name=\"John Ranson\" -c user.email=\"admin@bluedevilcollectibles.com\" \\\n  commit -m \"feat(shopops-api): WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01 -- register lunar connector\n\n- migrations/20260614_identity_connector_accounts_add_lunar.sql: extend CHECK\n  constraint to add 'lunar' (nine-value set + lunar, idempotent, locg preserved)\n- migrations/20260614_identity_connector_accounts_add_lunar_rollback.sql: rollback\n- ci-staging-migrations.txt or apply-ci-staging-migrations.js: lunar applied by\n  same mechanism as locg migration\n- routes/identity/connectors.js: 'lunar' added to KNOWN_CONNECTORS and\n  DEFAULT_CAPABILITIES\n\nCo-Authored-By: Claude Sonnet (Cauldron bdc-shopops-connector-check-add-lunar-01) <noreply@anthropic.com>\"\ngit push -u origin \"$(git rev-parse --abbrev-ref HEAD)\" 2>&1 || echo \"WARN: push failed; backstop will retry\"\n\n## Required output\nRULE19_FILE=routes/identity/connectors.js\nRULE19_GREP='lunar'\nLUNAR_CAPABILITY=<capability string(s) from providers/lunar.js>\nAPPLY_MECHANISM=<manifest-txt OR apply-script-special-case>\nCOMPLETE\n"}},{id: business-risk-gate,load_bearing: true,depends_on: [implement],bash: "set -euo pipefail\nBUSINESS_RISK_INVARIANT=\"The migration must extend the CHECK constraint by adding only 'lunar' to the existing nine-value set -- it must never drop or alter the 'locg' entry or any prior connector value, or existing connector rows and tests will break.\"\necho \"=== business-risk-gate: verifying BUSINESS_RISK_INVARIANT ===\"\necho \"Invariant: $BUSINESS_RISK_INVARIANT\"\nMIGRATION=\"shopops-api/migrations/20260614_identity_connector_accounts_add_lunar.sql\"\nif [ ! -f \"$MIGRATION\" ]; then\n  echo \"ERROR: migration file not found: $MIGRATION\" >&2\n  echo \"BUSINESS_RISK_INVARIANT=violated\"; exit 1\nfi\nif ! grep -q \"'locg'\" \"$MIGRATION\"; then\n  echo \"ERROR: 'locg' not found in migration -- locg was dropped.\" >&2\n  echo \"BUSINESS_RISK_INVARIANT=violated\"; exit 1\nfi\nif ! grep -q \"'lunar'\" \"$MIGRATION\"; then\n  echo \"ERROR: 'lunar' not found in migration -- extension not applied.\" >&2\n  echo \"BUSINESS_RISK_INVARIANT=violated\"; exit 1\nfi\nfor CONN in shopify ebay whatnot tiktok woocommerce pos facebook instagram; do\n  if ! grep -q \"'$CONN'\" \"$MIGRATION\"; then\n    echo \"ERROR: connector '$CONN' missing from migration -- prior value dropped.\" >&2\n    echo \"BUSINESS_RISK_INVARIANT=violated\"; exit 1\n  fi\ndone\nCONNECTORS_JS=\"shopops-api/routes/identity/connectors.js\"\nif ! grep -q \"'lunar'\" \"$CONNECTORS_JS\"; then\n  echo \"ERROR: 'lunar' not found in connectors.js\" >&2\n  echo \"BUSINESS_RISK_INVARIANT=violated\"; exit 1\nfi\nif ! grep -q \"'locg'\" \"$CONNECTORS_JS\"; then\n  echo \"ERROR: 'locg' missing from connectors.js -- prior connector removed.\" >&2\n  echo \"BUSINESS_RISK_INVARIANT=violated\"; exit 1\nfi\necho \"BUSINESS_RISK_INVARIANT=satisfied\"\necho \"business-risk-gate PASS\"\n"},{id: decide-push-target,depends_on: [business-risk-gate],bash: "set -euo pipefail\necho \"PUSH_TARGET=staging\"\necho \"BASE_BRANCH=staging\"\necho \"RULE20=true\"\n"},{id: verify-grep,depends_on: [decide-push-target],bash: "set -euo pipefail\necho \"=== WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01 grep assertions ===\"\nLUNAR_COUNT=$(grep -c \"'lunar'\" shopops-api/routes/identity/connectors.js)\n[ \"$LUNAR_COUNT\" -ge 2 ] || { echo \"FAIL: 'lunar' < 2 in connectors.js\" >&2; exit 1; }\necho \"grep -c \\\"'lunar'\\\" shopops-api/routes/identity/connectors.js -> $LUNAR_COUNT PASS\"\nLOCG_COUNT=$(grep -c \"'locg'\" shopops-api/routes/identity/connectors.js)\n[ \"$LOCG_COUNT\" -ge 1 ] || { echo \"FAIL: 'locg' missing from connectors.js\" >&2; exit 1; }\necho \"grep -c \\\"'locg'\\\" shopops-api/routes/identity/connectors.js -> $LOCG_COUNT PASS\"\nMIGRATION_LUNAR=$(grep -c \"'lunar'\" shopops-api/migrations/20260614_identity_connector_accounts_add_lunar.sql)\n[ \"$MIGRATION_LUNAR\" -ge 1 ] || { echo \"FAIL: 'lunar' not in migration\" >&2; exit 1; }\necho \"grep -c \\\"'lunar'\\\" ...add_lunar.sql -> $MIGRATION_LUNAR PASS\"\nMIGRATION_LOCG=$(grep -c \"'locg'\" shopops-api/migrations/20260614_identity_connector_accounts_add_lunar.sql)\n[ \"$MIGRATION_LOCG\" -ge 1 ] || { echo \"FAIL: 'locg' not in migration -- prior value dropped\" >&2; exit 1; }\necho \"grep -c \\\"'locg'\\\" ...add_lunar.sql -> $MIGRATION_LOCG PASS\"\necho \"=== All grep assertions PASS ===\"\n"},{id: verify-tests,depends_on: [implement],bash: "set -euo pipefail\ncd shopops-api\nnode tests/run_all.js\necho \"node tests/run_all.js PASS\"\n"},{id: commit-and-push,depends_on: [verify-grep,verify-tests],load_bearing: true,bash: "set -euo pipefail\nBRANCH=\"$(git rev-parse --abbrev-ref HEAD)\"\ngit add -A\nif git diff --cached --quiet; then\n  echo \"No staged changes; implement loop already committed.\"\nelse\n  git -c user.name=\"John Ranson\" -c user.email=\"admin@bluedevilcollectibles.com\" \\\n    commit -m \"chore: backstop commit WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01\"\nfi\nPUSH_OK=false\nfor attempt in 1 2 3; do\n  if git push -u origin \"$BRANCH\" 2>&1; then\n    PUSH_OK=true; break\n  fi\n  sleep $((attempt * 5))\ndone\n[ \"$PUSH_OK\" = \"true\" ] || { echo \"ERROR: git push failed after 3 attempts.\" >&2; exit 1; }\necho \"BRANCH=${BRANCH}\"\necho \"SHA=$(git rev-parse HEAD)\"\n"},{id: open-pr-if-needed,depends_on: [commit-and-push],load_bearing: true,bash: "set -euo pipefail\nWO_ID=\"WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01\"\nREPO=\"bluedevilcollectibles/shopops\"\nBRANCH=\"$(git rev-parse --abbrev-ref HEAD)\"\nBASE=\"staging\"\nTITLE=\"feat(shopops-api): WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01 -- register lunar connector\"\nEXIST=$(gh pr list --repo \"$REPO\" --head \"$BRANCH\" --state open \\\n  --json url --jq '.[0].url // empty' 2>/dev/null || true)\nif [ -n \"$EXIST\" ]; then echo \"PR_URL=$EXIST\"; exit 0; fi\nBODY_FILE=$(mktemp)\nprintf 'Implements %s.\\nSpec: bdc-xo docs/work-orders/%s.md.\\n\\nThree coordinated changes:\\n1. migrations/20260614_identity_connector_accounts_add_lunar.sql\\n2. ci-staging-migrations.txt or apply-ci-staging-migrations.js\\n3. routes/identity/connectors.js -- lunar added\\n\\nRule 19 (COPY . /app): after merge+rebuild:\\n  docker exec shopops-api grep -n lunar /app/routes/identity/connectors.js\\n  Expected: >= 2 matches\\n' \"$WO_ID\" \"$WO_ID\" > \"$BODY_FILE\"\nfor attempt in 1 2 3 4 5; do\n  if PR_OUT=$(gh pr create --repo \"$REPO\" --base \"$BASE\" --head \"$BRANCH\" \\\n      --title \"$TITLE\" --body-file \"$BODY_FILE\" 2>&1); then\n    echo \"PR_URL=$PR_OUT\"; exit 0\n  fi\n  EXIST=$(gh pr list --repo \"$REPO\" --head \"$BRANCH\" --state open \\\n    --json url --jq '.[0].url // empty' 2>/dev/null || true)\n  if [ -n \"$EXIST\" ]; then echo \"PR_URL=$EXIST\"; exit 0; fi\n  sleep $((attempt * 5))\ndone\necho \"ERROR: gh pr create failed after 5 attempts.\" >&2; exit 1\n"},{id: build-manifest,depends_on: [open-pr-if-needed],task_class: clerical,prompt: "Build the Captain CI completion manifest v2 for WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01.\n\nWO: WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01\nBuilder: Devils Cauldron (Archon bdc-shopops-connector-check-add-lunar-01)\n\nFiles created:\n - shopops-api/migrations/20260614_identity_connector_accounts_add_lunar.sql\n - shopops-api/migrations/20260614_identity_connector_accounts_add_lunar_rollback.sql\n\nFiles modified:\n - shopops-api/migrations/ci-staging-migrations.txt or scripts/apply-ci-staging-migrations.js\n   (APPLY_MECHANISM from implement output)\n - shopops-api/routes/identity/connectors.js (+lunar KNOWN_CONNECTORS + DEFAULT_CAPABILITIES)\n\nTests: $verify-tests.output\n\nPRs: $open-pr-if-needed.output\n\nMerge ancestors:\n - shopops staging HEAD: SHA from $commit-and-push.output | behind_by: 0\n\nGrep assertions:\n - shopops: grep -c \"'lunar'\" shopops-api/routes/identity/connectors.js -> >= 2\n - shopops: grep -c \"'locg'\" shopops-api/routes/identity/connectors.js -> >= 1 (locg preserved)\n - shopops: grep -c \"'lunar'\" shopops-api/migrations/20260614_identity_connector_accounts_add_lunar.sql -> >= 1\n - shopops: grep -c \"'locg'\" shopops-api/migrations/20260614_identity_connector_accounts_add_lunar.sql -> >= 1\n\nRuntime verification (Rule 19 -- shopops-api uses COPY . /app, rebuild required after merge):\n PENDING -- rebuild + restart shopops-api container after John promotes the staged PR.\n After rebuild:\n   docker exec shopops-api grep -n \"'lunar'\" /app/routes/identity/connectors.js\n     -> Expected: >= 2 matches (KNOWN_CONNECTORS + DEFAULT_CAPABILITIES)\n   docker exec shopops-api grep -n \"'locg'\" /app/routes/identity/connectors.js\n     -> Expected: >= 1 match (locg preserved)\n Staging schema (query staging Supabase directly):\n   SELECT pg_get_constraintdef(oid) FROM pg_constraint\n     WHERE conname = 'identity_connector_accounts_connector_check';\n   -> Expected: contains both 'lunar' and 'locg'\n\nVercel deployment: N/A (shopops-api is Docker on Hetzner, not Vercel)\n\nVALIDATION: PASS (runtime verify pending post-deploy; all pre-deploy assertions verified above)\n\nInputs:\nImplement: $implement.output\nBusiness-risk-gate: $business-risk-gate.output\nGrep: $verify-grep.output\nTests: $verify-tests.output\nPR: $open-pr-if-needed.output\n"},{id: flip-notion,depends_on: [build-manifest],task_class: clerical,prompt: "Flip Notion WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01 to REVIEW.\nManifest MUST go in Notes property (NOT as a page comment -- Captain CI reads Notes).\nNEVER mark Status as DONE -- only REVIEW.\n\nRequired Notion updates:\n- Claude Status -> REVIEW\n- Status -> Review\n- Notes -> manifest from $build-manifest.output VERBATIM\n\nSearch Notion DB a6df831c-0b52-449f-8ca4-d77be6b70d0a for WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01.\nUse notion-update-page to set Claude Status=REVIEW, Status=Review, Notes=manifest.\n\nIf Notion MCP is unavailable, output:\nXO_MANUAL: flip WO-SHOPOPS-CONNECTOR-CHECK-ADD-LUNAR-01 to REVIEW with manifest above.\n\nManifest: $build-manifest.output\nPR: $open-pr-if-needed.output\n"}]}