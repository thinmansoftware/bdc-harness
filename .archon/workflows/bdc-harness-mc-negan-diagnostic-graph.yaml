{name: bdc-harness-mc-negan-diagnostic-graph,description: "Use when: Executing WO-MC-NEGAN-DIAGNOSTIC-GRAPH-01 -- Mission Control diagnostic graph\n(codename Negan) in bdc-harness packages/web. EXTENDS the existing ReactFlow + dagre\nMission Control graph; does NOT rebuild it.\nInput: WO_ID + NOTION_PAGE_ID. Spec lives in bdc-xo docs/work-orders/ on main.\nDoes: reads the spec, plans surgically, self-reviews the plan, implements the diagnostic\nsurfaces (FailureReason, LoopArc side-rail fix, FleetStrip+CoFire, LucilleHint+Kill, then\nNodePeek/CostBurnMeter/RunHistorySparkline/Replay/HealthTell), verifies tsc/eslint/prettier\n+ the 8 scenario tests + the two no-regression suites, Codex-reviews the diff, commits,\nopens a PR --base dev, builds a Captain CI manifest, flips Notion to REVIEW.\nNOT for: backend-only WOs, doctrine updates, infra deploys, customer-facing repos.\n",policyFile: harness/policies/agent-behavior.md,provider: claude,model: sonnet,target_repo: bluedevilcollectibles/bdc-harness,inputs: {WO_ID: {default: WO-MC-NEGAN-DIAGNOSTIC-GRAPH-01},NOTION_PAGE_ID: {default: 374ef4c9-ce00-8157-bbf6-c4934e4b60ca}},nodes: [{id: preflight-github-auth,persona: major-build,load_bearing: true,bash: "set -euo pipefail\nif ! git push --dry-run origin \"HEAD:refs/heads/preflight-auth-probe-$(date +%s)\" 2>&1; then\n  echo \"ERROR: GITHUB auth check failed -- container cannot push to origin.\" >&2\n  echo \"Likely cause: GITHUB_TOKEN missing in executor env, or token lacks repo scope.\" >&2\n  exit 1\nfi\necho \"preflight-github-auth PASS\"\n"},{id: read-spec,persona: xo,depends_on: [preflight-github-auth],bash: "set -euo pipefail\nWO_ID=\"${WO_ID:-WO-MC-NEGAN-DIAGNOSTIC-GRAPH-01}\"\nif [ -z \"$WO_ID\" ]; then\n  WO_ID=$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)\nfi\nif [ -z \"$WO_ID\" ]; then\n  echo \"WO_ID missing. Provide WO_ID in environment or user message.\" >&2\n  exit 1\nfi\n# Spec lives in bdc-xo (NOT the target codebase). Cross-repo fetch via gh api ?ref=main.\n# Rule 5: docs/work-orders/ direct -> docs/superpowers/specs/ direct -> date-prefix glob -> issue body.\nSPEC_PATH=\"docs/work-orders/${WO_ID}.md\"\nSPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nif [ -z \"$SPEC_CONTENT\" ]; then\n  SPEC_PATH=\"docs/superpowers/specs/${WO_ID}.md\"\n  SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' 2>/dev/null | tr -d '\\n' | base64 -d 2>/dev/null || true)\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  MATCH=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/docs/superpowers/specs?ref=main\" --template '{{range .}}{{.path}}{{\"\\n\"}}{{end}}' 2>/dev/null | grep \"${WO_ID}.md$\" | head -n 1)\n  if [ -n \"$MATCH\" ]; then\n    SPEC_PATH=\"$MATCH\"\n    SPEC_CONTENT=$(gh api \"repos/bluedevilcollectibles/bdc-xo/contents/${SPEC_PATH}?ref=main\" --template '{{.content}}' | tr -d '\\n' | base64 -d || true)\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then\n  ISSUE_NUM=$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'issue=[0-9]+' | head -n 1 | cut -d= -f2 || true)\n  if [ -z \"$ISSUE_NUM\" ]; then\n    ISSUE_NUM=$(gh issue list --repo bluedevilcollectibles/bdc-xo \\\n      --search \"${WO_ID} in:title\" --json number,title \\\n      --jq '.[0].number' 2>/dev/null || true)\n  fi\n  if [ -n \"$ISSUE_NUM\" ] && [ \"$ISSUE_NUM\" != \"null\" ]; then\n    SPEC_CONTENT=$(gh issue view \"$ISSUE_NUM\" --repo bluedevilcollectibles/bdc-xo \\\n      --json body --jq .body 2>/dev/null || true)\n    [ -n \"$SPEC_CONTENT\" ] && SPEC_PATH=\"issues/${ISSUE_NUM}\"\n  fi\nfi\nif [ -z \"$SPEC_CONTENT\" ]; then echo \"Spec not found (tried docs/work-orders/, docs/superpowers/specs/ direct, date-prefix glob, and GitHub issue search)\" >&2; exit 1; fi\n# Immutable run-start base SHA for assert-implement-produced-work (Fix A).\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nRUN_START_SHA=$(git -C \"$WT\" rev-parse HEAD 2>/dev/null || echo unknown)\nmkdir -p \"$ARTIFACTS_DIR\" 2>/dev/null || true\nprintf '%s\\n' \"$RUN_START_SHA\" > \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || true\nprintf 'WO_ID=%s\\nSPEC_PATH=bdc-xo:%s\\nRUN_START_SHA=%s\\n\\n' \"$WO_ID\" \"$SPEC_PATH\" \"$RUN_START_SHA\"\nprintf '%s\\n' \"$SPEC_CONTENT\"\n"},{id: check-already-satisfied,persona: war-council-architect,agent: war-council-architect,depends_on: [read-spec],task_class: clerical,prompt: "You decide ONE thing: are this WO's deliverables ALREADY fully present in the CURRENT\nworktree's HEAD, such that a build would produce no changes? You are READ-ONLY. Judge\nONLY against this worktree (you are cd'd into it; use plain git + Read/Grep/Glob on\nlocal files). Do NOT consult origin/main or other worktrees.\n\n## This WO is an EXTENSION, not a rebuild\nThe Mission Control graph already exists (ExecutionDagNode.tsx, dag-layout.ts,\nWorkflowProgressCard.tsx, cost-utils.ts, dag-self-repair-loop.ts). \"Already satisfied\"\nhere means the NEW diagnostic surfaces (FailureReason, LoopArc side-rail routing,\nFleetStrip/CoFire, LucilleHint/Kill, NodePeek, CostBurnMeter, RunHistorySparkline,\nReplay, HealthTell) are ALL already present AND the spec's 8 scenario tests already\npass. The existing graph being present is NOT sufficient -- the new surfaces must exist.\n\n## Spec\n$read-spec.output\n\n## Output (exactly one of these on its own last line)\n- If every NEW deliverable is already present and the new tests pass in this worktree:\n    ALREADY_SATISFIED=true\n  followed by: SATISFIED_EVIDENCE=<one line naming the new surfaces + how verified>\n- Otherwise (any new surface missing, OR you cannot confirm with high confidence):\n    ALREADY_SATISFIED=false\nDefault to false. A redundant build is far cheaper than skipping real diagnostic work.\n"},{id: gate-already-satisfied,depends_on: [check-already-satisfied],bash: "set -uo pipefail\nCAS=$check-already-satisfied.output\nif printf '%s\\n' \"$CAS\" | grep -qE '^ALREADY_SATISFIED=true'; then\n  echo \"ALREADY_SATISFIED=true\"\n  echo \"PRECHECK_VERDICT=already-satisfied\"\n  printf '%s\\n' \"$CAS\" | grep '^SATISFIED_EVIDENCE=' | head -1 || true\nelse\n  echo \"ALREADY_SATISFIED=false\"\n  echo \"PRECHECK_VERDICT=needs-build\"\nfi\nexit 0\n"},{id: plan,persona: war-council-architect,depends_on: [gate-already-satisfied],agent: war-council-architect,task_class: medium_work,prompt: "Read the BDC Work Order spec below and produce a concise implementation plan for a\nWEB/UI extension of the existing Mission Control DAG graph in bdc-harness packages/web.\n\n## Idempotency note\nPre-check verdict (from gate-already-satisfied): $gate-already-satisfied.output\nIf PRECHECK_VERDICT=already-satisfied, produce a minimal VERIFY plan rather than\nre-creating; implement will correctly make no changes and emit ALREADY_SATISFIED.\n\n## CRITICAL framing for THIS WO\n- This EXTENDS an existing ReactFlow + @dagrejs/dagre graph. It does NOT rebuild it,\n  does NOT replace the layout engine, does NOT add a new graph library.\n- WEB changes are IN SCOPE (most edits are in packages/web). There is NO \"no\n  packages/web\" guard for this WO -- the opposite is true.\n- In-scope existing files to EXTEND (verify each exists FIRST -- do NOT assume):\n    packages/web/src/components/workflows/ExecutionDagNode.tsx\n    packages/web/src/lib/dag-layout.ts\n    packages/web/src/components/workflows/WorkflowDagViewer.tsx\n    packages/web/src/components/chat/WorkflowProgressCard.tsx\n    packages/web/src/lib/cost-utils.ts\n    packages/web/src/lib/dag-self-repair-loop.ts\n  Plus possibly surfacing 1-2 EXISTING fields (target_repo / node_failed error string /\n  bound workflow commit / per-node output) through the runs/events API in packages/server.\n  Label each touched file EXISTING-render vs NEW-surface.\n- INVARIANT THAT MUST NOT BREAK: the two existing features SELF-REPAIR-LOOP-VIZ-01 and\n  LOOP-ITERATION-COUNTER-01. Their existing tests MUST still pass after this change.\n  The plan MUST include running those two suites as a no-regression check.\n- Replay caveat: the builder MUST confirm the engine supports per-node replay. If it\n  does NOT, v1 scopes Replay to \"re-fire the WO\" and flags node-level replay as a\n  fast-follow. Do NOT fake per-node replay.\n\n## Build order (from spec Section 13)\nCore surfaces first (the \"saved this session\" set):\n  1. FailureReason (error class on the failed node face)\n  2. LoopArc side-rail fix (route back-edges as a clean right-gutter curved arc;\n     reuse deriveLoopArcs / deriveCycleState; strip cycles BEFORE dagre)\n  3. FleetStrip + CoFireBadge (RED alarm when >=2 live runs share a target repo)\n  4. LucilleHint + KillButton (approval consequence text + a real /cancel control)\nThen richness:\n  5. NodePeek  6. CostBurnMeter  7. RunHistorySparkline  8. Replay  9. HealthTell\nEach surface should ship green independently. One PR or a small wave is the builder's call.\n\n## Required Output\nReturn structured Markdown with these headings:\n- WO ID\n- Files to modify\n- Files to create\n- Files explicitly out of scope\n- Verification commands (MUST include the four below)\n- Commit message\n- Push policy\n- Staging gate required\n\n## Verification commands the plan MUST list\n- cd packages/web && bun x tsc --noEmit\n- cd packages/web && bun x eslint .  (or the repo's configured eslint invocation)\n- cd packages/web && bun x prettier --check .\n- the 8 scenario tests (component/render + the geometric loop-arc no-intersection\n  assertion + a /cancel integration test) PASS\n- SELF-REPAIR-LOOP-VIZ-01 and LOOP-ITERATION-COUNTER-01 existing tests still PASS\n\n## BDC Push Policy\nbdc-harness is NOT a Rule 20 staging-gate repo. Use a feature branch + PR --base dev.\nNo staging gate. (Hardcoded staging-gate repos are lspro-react, shopops-storefront,\nshopops only -- this WO targets none of them.)\n\n## Spec\n$read-spec.output\n"},{id: plan-review,persona: war-council-architect,agent: war-council-architect,depends_on: [plan],task_class: medium_work,loop: {fresh_context: true,until: PLAN_REVIEW_APPROVED,max_iterations: 3,prompt: "You are the War Council Architect doing an adversarial self-review of the\nimplementation plan, then REVISING it in place. One initial pass + up to 2 repair\nattempts. You are READ-ONLY (no file writes, no shell) -- output goes to STDOUT.\n\n## Prior iteration (read FIRST)\n$LOOP_PREV_OUTPUT\nIf it contains findings (PLAN_REVIEW=needs_revision), resolve every one this\niteration. If a finding repeats and you cannot resolve it, escalate (below).\n\n## Inputs\nOriginal plan: $plan.output\nSpec: $read-spec.output\n\n## Attack the plan on these dimensions\n1. Scope creep -- any file not justified by the spec. (But REMEMBER: packages/web is\n   the PRIMARY surface here -- web edits are EXPECTED, not creep.)\n2. Missing files -- in-scope work the plan omits (any of the 9 surfaces dropped).\n3. Rebuild risk -- does the plan EXTEND the existing graph, or does it replace\n   ReactFlow/dagre or add a new layout engine? Replacing is REJECTED by the spec.\n4. No-regression -- does the plan run SELF-REPAIR-LOOP-VIZ-01 +\n   LOOP-ITERATION-COUNTER-01 tests as a gate? It MUST.\n5. Replay honesty -- does the plan confirm engine per-node replay support and fall\n   back to re-fire-WO (flag fast-follow) rather than faking it? It MUST.\n6. Verification -- does the plan list tsc/eslint/prettier clean in packages/web AND\n   the 8 scenario tests including the geometric loop-arc no-intersection assertion?\n7. Rule 20 staging gate -- bdc-harness is NOT a staging-gate repo. Plan must use\n   --base dev with NO staging gate. If the plan adds a staging gate, that is wrong.\n8. Out-of-scope list present and correct.\n\n## Self-repair (the point -- do not just report)\nIf you find fixable issues, REVISE the plan to resolve them and emit the corrected\nplan in full. Do not halt for a human on anything you can fix here.\n\n## Required STDOUT format (emit EXACTLY this shape)\n  PLAN_REVIEW_PASS=<true|false>\n  PLAN_REVIEW_RISK=<LOW|MEDIUM|HIGH>\n\n  === APPROVED_PLAN_BEGIN ===\n  <the FINAL revised plan in full -- this and ONLY this is what implement uses>\n  === APPROVED_PLAN_END ===\n\n  === PLAN_REVIEW_FINDINGS_BEGIN ===\n  <your findings / what you changed and why, or \"(none)\">\n  === PLAN_REVIEW_FINDINGS_END ===\n\nThe APPROVED_PLAN block must always contain a complete, usable plan (even on a\npassing first iteration -- echo the original plan there). Keep ALL critique inside\nthe FINDINGS block.\n\n## Completion sentinel (success ONLY)\nIf and ONLY if PLAN_REVIEW_PASS=true, emit on its OWN LINE as the LAST line:\n  PLAN_REVIEW_APPROVED\nOn a failing iteration emit instead:\n  PLAN_REVIEW_NEEDS_REVISION\n\n## Escalation (emit instead of approving)\nIf the spec is ambiguous/contradictory, the fix needs a new side-effect class or\nungranted scope, or the same finding survived a prior attempt -- set\nPLAN_REVIEW_PASS=false, emit PLAN_REVIEW_NEEDS_REVISION, and put this inside FINDINGS:\n  ESCALATION_REQUIRED=true\n  ESCALATION_REASON=<ambiguous-spec|new-side-effect-class|loop-exhausted>\n  WO_ID=<id>\n  NODE=plan-review\n  ATTEMPTS=<n>/3\n  WHAT_FAILED=<one paragraph>\n  WHAT_WAS_TRIED=<3-6 bullets>\n  LAST_REVIEW_FINDINGS=<exact bullets>\n  SINGLE_DECISION_NEEDED=<one sentence John can answer>\n  SAFE_STATE=<nothing committed/pushed; plan stage only>\n"}},{id: implement,persona: major-build,depends_on: [plan-review],agent: major-build,task_class: medium_work,loop: {prompt: "Implement the approved plan for this BDC feature Work Order -- a WEB/UI extension of\nthe existing Mission Control DAG graph in bdc-harness packages/web.\n\n## Spec\n$read-spec.output\n\n## Plan (approved by plan-review)\nUse ONLY the text between === APPROVED_PLAN_BEGIN === and === APPROVED_PLAN_END ===\nbelow as the plan. IGNORE everything outside those markers.\n$plan-review.output\n\n## WORKTREE PINNING (Fix A -- anchor run 04daeafc)\nYou run inside ONE assigned git worktree. ALL work and ALL completion judgments MUST\nhappen inside it. Resolve it first: WT=$(git rev-parse --show-toplevel). Make EVERY\ngit/grep/diff call relative to THIS worktree. NEVER judge \"already done\" against\norigin/main, the shared source/ checkout, or another thread's worktree.\n\n## FIELD-AVAILABILITY CHECK FIRST (spec Section 7 -- do this BEFORE adding surfaces)\nRead the runs/events API + the run object and CONFIRM the client actually receives:\ntarget_repo / bound codebase, the node_failed error string, the bound workflow\ncommit, metadata.approval.onRejectPrompt / onRejectMaxAttempts, per-node output/diff\n(for NodePeek), and whether the engine supports per-node replay. Label each touched\nfield EXISTING-render vs NEW-surface-one-field. \"Kill the brain not the body\" applies\nto the BUILD too: read the resolver/API before adding surfaces. Do NOT assume a field\nis present -- if NodePeek/Replay/FailureReason need a field that is NOT surfaced,\nsurface the EXISTING field through the packages/server runs/events API (an API-shape\naddition, not a schema change), or scope that surface down and flag it.\n\n## REPLAY HONESTY\nConfirm the engine supports per-node replay. If it does NOT: scope Replay v1 to\n\"re-fire the WO\", and flag node-level replay as a fast-follow. Do NOT fake it.\n\n## Build order (core first, then richness -- each ships green independently)\nCore: FailureReason -> LoopArc side-rail fix -> FleetStrip+CoFire -> LucilleHint+Kill.\nRichness: NodePeek -> CostBurnMeter -> RunHistorySparkline -> Replay -> HealthTell.\nThe LoopArc fix: reuse the EXISTING deriveLoopArcs / deriveCycleState; strip loop/back\nedges BEFORE the dagre call in layoutWithDagre so dagre lays out the clean forward\nDAG, then re-add back-edges as explicit curved ReactFlow edges in a right-gutter lane\nwith a per-arc x-offset and an iteration-count label, NEVER crossing the forward spine.\n\n## NO-REGRESSION INVARIANT (must NOT break)\nSELF-REPAIR-LOOP-VIZ-01 and LOOP-ITERATION-COUNTER-01 are existing features. Their\nexisting tests MUST still pass. Run them. The \"greyed opus-repair/pause-gate = brain\nintact\" health signal on a healthy run must be PRESERVED (HealthTell amplifies it,\ndoes not remove it).\n\n## TESTS (doctrine baseline -- assert real behavior, not \"did not throw\")\nWrite/extend tests so the spec's 8 scenarios are covered. At least these:\n- Co-fire alarm: 2 live runs same repo -> RED CoFireBadge with both run ids; 1 run -> none.\n- FailureReason on face: a node_failed with a model-400 string renders a concise class\n  (\"codex 400: model not supported\"), full error on hover -- assert the class text.\n- LOOP ARC (the geometric assertion): after layout, assert NO loop-back edge path\n  intersects any forward node's bounding box (geometric or snapshot check).\n- Lucille + Kill: paused node with on_reject max_attempts=2 renders the consequence\n  text; Kill (/cancel) integration test drives the run to status=cancelled.\n- NodePeek: clicking a node renders that step's output/diff/error/command.\n- Cost meter: FleetStrip renders $/min + session total, color-graded.\n- Replay: failed node re-dispatches (alt-model variant passes the override) OR, if the\n  engine lacks node-level replay, the re-fire-WO fallback is exercised + flagged.\n- No regression: SELF-REPAIR-LOOP-VIZ-01 + LOOP-ITERATION-COUNTER-01 suites still PASS.\n\n## Execution Rules\n- Modify only in-scope files. Prefer existing repo patterns/helpers. ASCII-only source.\n- Do not reformat unrelated code. Do not deploy. Do not bypass approval gates.\n- Do NOT use `git commit --allow-empty` or any empty/verify-only commit.\n- Husky pre-commit needs bun; the container has it.\n\n## Commit-and-push BEFORE exit (resilience, Patch 2)\nWhen implementation is complete, BEFORE emitting the sentinel, run:\n```bash\nBRANCH=$(git rev-parse --abbrev-ref HEAD)\nWO_ID=\"${WO_ID:-$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)}\"\ngit add -A\ngit diff --cached --quiet || git commit -m \"feat: implement ${WO_ID}\n\nMission Control diagnostic graph (Negan) per WO spec. Self-verified within implement loop.\n\nCo-Authored-By: Claude (Cauldron major-build) <noreply@anthropic.com>\"\ngit push -u origin \"$BRANCH\" 2>&1 || echo \"WARN: push failed - operator must recover from worktree\"\n```\n\n## Completion Criteria + Sentinel (Patch 3; Fix A)\nBefore emitting any sentinel, self-check IN THIS WORKTREE:\n  WT=$(git rev-parse --show-toplevel)\n  CHANGED=$(git -C \"$WT\" status --porcelain | wc -l)\n  AHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null \\\n          || git -C \"$WT\" rev-list --count HEAD --not --remotes 2>/dev/null || echo 0)\nThen choose EXACTLY ONE ending:\n1. REAL BUILD (in-scope changes; CHANGED>0 OR AHEAD>0): emit each on its own line:\n     COMPLETE\n     BUILD_COMPLETE\n     <promise>COMPLETE</promise>\n2. ALREADY SATISFIED (all new surfaces already reachable from THIS worktree HEAD and\n   you correctly made no changes): emit BOTH, each on its own line:\n     ALREADY_SATISFIED: <one sentence: which surfaces already exist in this worktree HEAD>\n     COMPLETE\n   Do NOT also emit BUILD_COMPLETE / <promise>; do NOT make an empty commit.\n3. TRUE BLOCKER (spec ambiguous / missing source of truth / cannot proceed):\n     BLOCKED: <one-sentence reason>\nANTI-FRAUD: emit the case-1 BUILD sentinels ONLY if you made real in-scope edits.\nA bare COMPLETE with a clean worktree and no ALREADY_SATISFIED line is FALSE_COMPLETE.\n",until: COMPLETE,max_iterations: 5,fresh_context: true}},{id: checkpoint-push,persona: overseer,depends_on: [implement],bash: "set -uo pipefail\nWO_ID=\"${WO_ID:-unknown}\"\nWIP_BRANCH=\"wip/${WO_ID}-$(date +%Y%m%d%H%M%S)\"\ngit add -A 2>/dev/null || true\nif git diff --cached --quiet 2>/dev/null; then\n  echo \"checkpoint-push: nothing staged -- no commit needed\"\n  exit 0\nfi\ngit commit -m \"wip: checkpoint after implement loop -- ${WO_ID}\n\nCauldron resilience checkpoint. Not the final commit.\nWill be superseded by backstop commit-and-push node.\n\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>\" \\\n  2>/dev/null || { echo \"WARN: checkpoint commit failed -- continuing\" >&2; exit 0; }\nif git push -u origin \"HEAD:${WIP_BRANCH}\" 2>/dev/null; then\n  echo \"checkpoint-push: WIP branch pushed -- ${WIP_BRANCH}\"\n  echo \"CHECKPOINT_BRANCH=${WIP_BRANCH}\"\n  echo \"CHECKPOINT_SHA=$(git rev-parse HEAD)\"\nelse\n  echo \"WARN: checkpoint push failed -- work is local only; backstop will retry\" >&2\nfi\nexit 0\n"},{id: assert-implement-produced-work,persona: overseer,depends_on: [checkpoint-push],load_bearing: true,bash: "set -uo pipefail\nIMPL=$implement.output\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nBASE=$(cat \"$ARTIFACTS_DIR/run-start-sha.txt\" 2>/dev/null || echo \"\")\nHEAD_NOW=$(git -C \"$WT\" rev-parse HEAD 2>/dev/null || echo \"\")\nCHANGED=$(git -C \"$WT\" status --porcelain 2>/dev/null | grep -c . || echo 0)\nif [ -n \"$BASE\" ] && [ \"$BASE\" != \"unknown\" ] && [ -n \"$HEAD_NOW\" ]; then\n  AHEAD=$(git -C \"$WT\" rev-list --count \"${BASE}..HEAD\" 2>/dev/null || echo 0)\nelse\n  AHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null || echo 0)\nfi\nHAS_WORK=false\nif [ \"${CHANGED:-0}\" -gt 0 ] || [ \"${AHEAD:-0}\" -gt 0 ]; then HAS_WORK=true; fi\nSAID_COMPLETE=false\nif printf '%s\\n' \"$IMPL\" | grep -qE '^(COMPLETE|BUILD_COMPLETE)$|<promise>COMPLETE</promise>'; then SAID_COMPLETE=true; fi\nSAID_ALREADY=false\nif printf '%s\\n' \"$IMPL\" | grep -qE '^ALREADY_SATISFIED:'; then SAID_ALREADY=true; fi\necho \"WORKTREE=$WT\"\necho \"CHANGED_FILES=$CHANGED\"\necho \"COMMITS_AHEAD=$AHEAD\"\necho \"IMPL_SAID_COMPLETE=$SAID_COMPLETE\"\necho \"IMPL_SAID_ALREADY_SATISFIED=$SAID_ALREADY\"\nif [ \"$HAS_WORK\" = \"true\" ]; then\n  echo \"BUILD_OUTCOME=REAL_BUILD\"\n  echo \"assert-implement-produced-work: real changes present -- proceeding to review chain\"\n  exit 0\nfi\nif [ \"$SAID_ALREADY\" = \"true\" ]; then\n  echo \"BUILD_OUTCOME=ALREADY_SATISFIED\"\n  echo \"assert-implement-produced-work: implement reported ALREADY_SATISFIED and worktree is genuinely clean -- legitimate no-op\"\n  exit 0\nfi\necho \"BUILD_OUTCOME=FALSE_COMPLETE\"\necho \"ERROR: implement emitted COMPLETE but produced ZERO real changes (CHANGED=$CHANGED AHEAD=$AHEAD).\" >&2\necho \"False/fraudulent completion (anchor 04daeafc). Downstream gate will PAUSE for correction.\" >&2\nexit 0\n"},{id: war-council-validator,persona: captain-ci-validator,depends_on: [assert-implement-produced-work],task_class: medium_work,prompt: "Invoke or emulate the war-council-validator review for this Work Order.\n\n## Validator Agent\nwar-council-validator\n\n## Inputs\nSpec:\n$read-spec.output\n\nPlan (approved -- reviewed + revised by plan-review):\n$plan-review.output\n\nImplementation output:\n$implement.output\n\nGit diff:\nRun `git diff --stat` and `git diff --check`, then inspect the changed files.\n\n## WO-specific validation focus\n- The 8 scenario tests exist AND assert real behavior (not \"did not throw\"). The\n  geometric loop-arc assertion must actually check no loop-back path intersects a\n  forward node box. The /cancel test must drive a run to status=cancelled.\n- SELF-REPAIR-LOOP-VIZ-01 and LOOP-ITERATION-COUNTER-01 existing tests STILL PASS\n  (no regression). If you cannot confirm both, that is needs_revision.\n- tsc/eslint/prettier clean in packages/web.\n- The change EXTENDS the existing graph (no new layout engine, ReactFlow/dagre kept).\n- If Replay was scoped to re-fire-WO because the engine lacks per-node replay, confirm\n  that was flagged as a fast-follow and NOT faked.\n\n## Required Output\nReturn either:\n- satisfied: with evidence the spec deliverables + stop conditions were met\n- needs_revision: with exact file/path/behavior findings\n"},{id: capture-diff,depends_on: [war-council-validator],bash: "set -uo pipefail\nmkdir -p \"$ARTIFACTS_DIR\"\nOUT=\"$ARTIFACTS_DIR/diff.patch\"\nBASE_REF=\"origin/${BASE_BRANCH:-dev}\"\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\n{\n  echo \"### git diff --stat ($MB..HEAD)\"\n  git diff --stat \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### git diff --name-only ($MB..HEAD)\"\n  git diff --name-only \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### committed diff ($MB..HEAD)\"\n  git diff \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### unstaged working-tree diff (HEAD..worktree)\"\n  git diff HEAD 2>/dev/null || true\n} > \"$OUT\"\necho \"DIFF_BASE=$MB\"\necho \"DIFF_COMMAND=git diff $MB..HEAD (+ git diff HEAD for unstaged)\"\necho \"DIFF_ARTIFACT=$OUT\"\necho \"DIFF_BYTES=$(wc -c < \"$OUT\" 2>/dev/null || echo 0)\"\n"},{id: diff-review,provider: codex,model: gpt-5.5,agent: codex-adversarial-reviewer,depends_on: [capture-diff],task_class: medium_work,prompt: "You are the Codex adversarial diff reviewer. Cross-model review of the diff that\nmajor-build produced, BEFORE commit. READ-ONLY: inspect and report, no edits, no\nstate-mutating commands.\n\n## Inputs\nSpec: $read-spec.output\nValidator verdict: $war-council-validator.output\nDiff provenance: $capture-diff.output\n\n## Inspect the ACTUAL diff (read-only)\nREAD the captured diff at DIFF_ARTIFACT ($ARTIFACTS_DIR/diff.patch). You have no Bash\ntool -- do NOT run git. Use Read/Grep/Glob on the changed files. Focus on what tests +\nthe validator can miss in THIS WEB WO:\n1. Layout regression -- does the LoopArc change keep the forward spine clean and reuse\n   the existing deriveLoopArcs/deriveCycleState, or did it re-implement layout / risk\n   breaking SELF-REPAIR-LOOP-VIZ-01 or LOOP-ITERATION-COUNTER-01?\n2. Unverified claims -- a surface (FailureReason, NodePeek, Replay) reads a field that\n   is NOT actually surfaced by the runs/events API, or a behavior no test exercises.\n3. Faked replay -- a per-node \"replay\" button that does not actually re-dispatch, or\n   pretends node-level replay exists when the engine lacks it.\n4. Missing tests -- in-scope behavior (esp. the geometric loop-arc assertion and the\n   /cancel integration) with no test asserting real output.\n5. ASCII / non-ASCII chars introduced into source.\n\n## Output (STDOUT only)\nEmit exactly:\n  DIFF_REVIEW=<satisfied|needs_revision>\n  FINDINGS:\n  - <file:line> <one specific, fixable finding>   (repeat; or \"(none)\")\n  SEMANTIC_RISK=<LOW|MEDIUM|HIGH>\nEvery finding cites a file and the exact problem. Only flag what must change before commit.\n"},{id: diff-repair,persona: major-build,agent: major-build,depends_on: [diff-review],task_class: medium_work,loop: {fresh_context: true,until: __NEVER_EMIT_USE_UNTIL_BASH__,max_iterations: 3,until_bash: "set -uo pipefail\nDONE=\"$ARTIFACTS_DIR/diff-repair-done.flag\"\n[ -f \"$DONE\" ] || { echo \"repair not signalled done\"; exit 1; }\nBASE_REF=\"origin/${BASE_BRANCH:-dev}\"\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\nDEBUG_RE='console\\.log\\(|debugger;'\nif { git diff --unified=0 \"$MB\"..HEAD 2>/dev/null; git diff --unified=0 HEAD 2>/dev/null; } \\\n     | grep -E '^\\+' | grep -Eq \"$DEBUG_RE\"; then\n  echo \"debug statement present in feature diff\"; exit 1\nfi\nexit 0\n",prompt: "You are major-build. The Codex diff reviewer raised findings on your diff. Fix every\nfixable finding in place. You are the BUILDER; Codex does not edit.\n\n## Codex review verdict\n$diff-review.output\n\n## Prior repair iteration (if any)\n$LOOP_PREV_OUTPUT\n\n## What to do\n- DIFF_REVIEW=satisfied with no findings: make no changes; just signal done.\n- Otherwise: resolve each FINDINGS line. Add the missing test, fix the layout/contract\n  drift, surface the missing field through the runs/events API, stop faking replay.\n  Modify only in-scope files. Do not reformat unrelated code. Do not deploy.\n  Note: console.log left in a debug-print position will FAIL the mechanical gate --\n  remove debug prints from the feature diff before signalling done.\n\n## NEVER FABRICATE A DIFF (Fix C -- anchor run 04daeafc)\nIf the captured diff is empty/header-only because the WO appears already implemented,\nyou MUST NOT regenerate diff.patch from already-merged commits or another branch. If\nthe diff is genuinely empty because there is nothing to repair, do NOT write the\ndone.flag; instead write the escalation block (below) with\nESCALATION_REASON=already-implemented-no-diff and STOP.\n\n## Escalation (ONLY these -- else fix and let the loop continue)\nWrite to $ARTIFACTS_DIR/diff-repair-escalation.txt and STOP if:\n- a finding requires a new side-effect class / ungranted scope\n- a finding requires human-only authority (deploy, prod write, irreversible op)\n- the spec is ambiguous about the correct fix\n- the same finding survived a prior repair attempt and you cannot resolve it\nEscalation block (exact keys):\n  ESCALATION_REQUIRED=true\n  ESCALATION_REASON=<new-side-effect-class|human-only-authority|ambiguous-spec|loop-exhausted|already-implemented-no-diff>\n  WO_ID=<id>\n  NODE=diff-repair\n  ATTEMPTS=<n>/3\n  WHAT_FAILED=<one paragraph>\n  WHAT_WAS_TRIED=<3-6 bullets>\n  LAST_REVIEW_FINDINGS=<exact Codex findings>\n  SINGLE_DECISION_NEEDED=<one sentence John can answer>\n  SAFE_STATE=<work is local in the worktree; nothing committed or pushed yet>\n\n## Signal done (the FLAG is the only gate -- there is NO completion token)\nWhen you have addressed every fixable finding (or there were none) AND introduced no\ndebug prints, write an empty file at $ARTIFACTS_DIR/diff-repair-done.flag (the ONLY\nsignal). If you escalated, do NOT write the flag.\n"}},{id: capture-diff-final,depends_on: [diff-repair],trigger_rule: all_done,bash: "set -uo pipefail\nmkdir -p \"$ARTIFACTS_DIR\"\nOUT=\"$ARTIFACTS_DIR/diff-final.patch\"\nBASE_REF=\"origin/${BASE_BRANCH:-dev}\"\nEMPTY_TREE=$(git hash-object -t tree /dev/null 2>/dev/null || echo 4b825dc642cb6eb9a060e54bf8d69288fbee4904)\nMB=$(git merge-base HEAD \"$BASE_REF\" 2>/dev/null || git rev-parse HEAD~1 2>/dev/null || echo \"$EMPTY_TREE\")\n[ -n \"$MB\" ] || MB=\"$EMPTY_TREE\"\n{\n  echo \"### committed diff ($MB..HEAD)\"\n  git diff \"$MB\"..HEAD 2>/dev/null || true\n  echo\n  echo \"### unstaged working-tree diff (HEAD..worktree)\"\n  git diff HEAD 2>/dev/null || true\n} > \"$OUT\"\necho \"DIFF_FINAL_BASE=$MB\"\necho \"DIFF_FINAL_ARTIFACT=$OUT\"\necho \"DIFF_FINAL_BYTES=$(wc -c < \"$OUT\" 2>/dev/null || echo 0)\"\n"},{id: diff-review-final,provider: codex,model: gpt-5.5,agent: codex-adversarial-reviewer,depends_on: [capture-diff-final],trigger_rule: all_done,task_class: medium_work,prompt: "You are the Codex adversarial reviewer doing the FINAL re-review after repair.\nRead-only. Decide whether any semantic finding remains before commit.\n\n## Inputs\nSpec: $read-spec.output\nYour original findings: $diff-review.output\nRepair pass output: $diff-repair.output\nRefreshed diff provenance: $capture-diff-final.output\n(Read the repaired diff at DIFF_FINAL_ARTIFACT = $ARTIFACTS_DIR/diff-final.patch. No\nBash tool -- do not run git; read that file.)\n\n## Branch on the repair outcome FIRST\n- If diff-repair FAILED or exhausted (empty output, ESCALATION_REQUIRED=true, or the\n  done.flag was never written): do NOT certify. Emit DIFF_REVIEW_FINAL=needs_revision,\n  summarize the unresolved state in UNRESOLVED, carry through any escalation reason.\n- Otherwise: re-inspect. For EACH original finding, verify it is actually resolved.\n\n## Output (STDOUT only)\n  DIFF_REVIEW_FINAL=<satisfied|needs_revision>\n  UNRESOLVED:\n  - <file:line> <finding still open>   (repeat; or \"(none)\")\n  SEMANTIC_RISK=<LOW|MEDIUM|HIGH>\nDIFF_REVIEW_FINAL=satisfied ONLY if every original finding is genuinely resolved and no\nnew unsafe behavior was introduced (esp. no regression to the loop-viz / iteration-counter).\n"},{id: block-classify,depends_on: [diff-review-final],trigger_rule: all_done,bash: "set -uo pipefail\nDIFF_FINAL=$diff-review-final.output\nBUILD=$assert-implement-produced-work.output\nfinal_ok=false\nfinal_verdict=$(printf '%s\\n' \"$DIFF_FINAL\" \\\n  | grep -oE 'DIFF_REVIEW_FINAL=(satisfied|needs_revision)' \\\n  | tail -n 1)\nif [ \"$final_verdict\" = \"DIFF_REVIEW_FINAL=satisfied\" ]; then final_ok=true; fi\noutcome=$(printf '%s\\n' \"$BUILD\" | sed -n 's/^BUILD_OUTCOME=//p' | head -1)\nif [ \"$outcome\" = \"ALREADY_SATISFIED\" ]; then\n  STATUS=ALREADY_SATISFIED\nelif [ \"$outcome\" = \"REAL_BUILD\" ] && [ \"$final_ok\" = \"true\" ]; then\n  STATUS=PROCEED\nelse\n  STATUS=BLOCKED\nfi\nprintf '{\"status\":\"%s\",\"final_satisfied\":%s,\"build_outcome\":\"%s\"}\\n' \"$STATUS\" \"$final_ok\" \"${outcome:-unknown}\"\n"},{id: opus-repair,agent: overseer-opus,effort: xhigh,context: fresh,depends_on: [block-classify],when: "$block-classify.output.status == 'BLOCKED'",prompt: "The bdc-harness Mission Control diagnostic-graph run is BLOCKED before the irreversible\ncommit. You get ONE autonomous repair pass before a human is paused.\n\n## Why blocked\nblock-classify: $block-classify.output\ndiff-review-final: $diff-review-final.output\nassert-implement-produced-work: $assert-implement-produced-work.output\nOriginal Codex findings: $diff-review.output\n\n## Your job\n- FALSE_COMPLETE (implement claimed done but no real changes here): determine whether\n  the WO genuinely needs work in THIS worktree. If yes and you can make the in-scope\n  WEB changes, make them. If genuinely already implemented here, say so.\n- diff-review-final=needs_revision: make the specific fix the final reviewer named,\n  in scope, in this worktree (likely a missing test, a layout regression, or an\n  un-surfaced field). Do NOT regress SELF-REPAIR-LOOP-VIZ-01 / LOOP-ITERATION-COUNTER-01.\n- Judge ONLY against this worktree. NEVER fabricate a diff from already-merged commits.\n\n## Output (last lines)\n- Resolved (real in-scope changes now exist here): OPUS_REPAIR=fixed\n- Genuinely already-satisfied (no work needed here): OPUS_REPAIR=already-satisfied\n- Could NOT resolve, human must decide:\n    OPUS_REPAIR=needs-human\n    REASON=<one sentence>\n"},{id: block-reclassify,depends_on: [block-classify,opus-repair],trigger_rule: all_done,bash: "set -uo pipefail\nPRIOR=$block-classify.output\nOPUS=$opus-repair.output\nprior_status=$(printf '%s\\n' \"$PRIOR\" | sed -n 's/.*\"status\":\"\\([A-Z_]*\\)\".*/\\1/p' | head -1)\nif [ \"$prior_status\" != \"BLOCKED\" ]; then\n  printf '{\"status\":\"%s\"}\\n' \"${prior_status:-BLOCKED}\"\n  exit 0\nfi\nWT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)\nCHANGED=$(git -C \"$WT\" status --porcelain 2>/dev/null | grep -c . || echo 0)\nAHEAD=$(git -C \"$WT\" rev-list --count \"@{upstream}..HEAD\" 2>/dev/null \\\n        || git -C \"$WT\" rev-list --count HEAD --not --remotes 2>/dev/null || echo 0)\nif printf '%s\\n' \"$OPUS\" | grep -q '^OPUS_REPAIR=fixed' && { [ \"${CHANGED:-0}\" -gt 0 ] || [ \"${AHEAD:-0}\" -gt 0 ]; }; then\n  printf '{\"status\":\"BLOCKED\",\"note\":\"opus-made-changes-need-re-review\"}\\n'\nelif printf '%s\\n' \"$OPUS\" | grep -q '^OPUS_REPAIR=already-satisfied'; then\n  printf '{\"status\":\"ALREADY_SATISFIED\",\"note\":\"opus-confirmed-already-satisfied\"}\\n'\nelse\n  printf '{\"status\":\"BLOCKED\",\"note\":\"opus-could-not-resolve\"}\\n'\nfi\n"},{id: pause-gate,depends_on: [block-reclassify],when: "$block-reclassify.output.status == 'BLOCKED'",approval: {message: "This run is BLOCKED before the irreversible commit and the AI tiers could not safely\nresolve it. The run is PAUSED (not failed) -- nothing was committed or pushed.\n\nWhat to inspect:\n- block-classify / block-reclassify: why it blocked (FALSE_COMPLETE = implement\n  produced no real changes; or diff-review-final = needs_revision -- likely a missing\n  test, a loop-arc layout regression, or an un-surfaced runs/events field).\n- diff-review-final verdict + the Codex findings.\n- opus-repair output: what the Opus tier tried and why it could not finish.\n- $ARTIFACTS_DIR/diff-repair-escalation.txt if present.\n\nSAFE STATE: no commit, no push, no PR, no Notion write has happened.\n\n- \"approved\" / \"proceed\" -> resume (only if you corrected the worktree so a real,\n  reviewed change exists; commit-and-push still re-checks the gate)\n- \"reject\" / \"stop\" -> halt; worktree changes (if any) remain for manual handling\n",capture_response: true,on_reject: {prompt: "The operator rejected the blocked run. Summarize what was blocked, what the AI\ntiers tried, and what a human must change before re-running. Do not commit or fire.\nOutput: OPERATOR_REJECTED: <reason from approval response>\n",max_attempts: 2}}},{id: decide-push-target,persona: major-build,depends_on: [block-reclassify],when: "$block-reclassify.output.status == 'PROCEED'",task_class: clerical,prompt: "Decide the push target for this BDC Work Order.\n\n## Inputs\nSpec:\n$read-spec.output\nValidator:\n$war-council-validator.output\n\n## Branch Name Derivation Rules (F-6A prevention)\n- Derive the branch name from the WO ID ONLY. Do NOT copy the current git branch name.\n  The engine appends a unique -thread-<hash> suffix at push time; emit the BASE name only.\n- Prefix feat/, fix/, or wip/ + the WO ID lowercased with hyphens.\n  Example: WO-MC-NEGAN-DIAGNOSTIC-GRAPH-01 -> feat/wo-mc-negan-diagnostic-graph-01\n- The branch MUST NOT start with archon/thread- or contain -thread- anywhere.\n- Allowlist regex (commit-and-push enforces): ^(feat/[A-Za-z0-9_-]+|fix/[A-Za-z0-9_-]+|wip/[A-Za-z0-9_-]+)$\n\n## Required Repo Policy\nTarget repo is bluedevilcollectibles/bdc-harness (from the spec target_repo). bdc-harness\nis NOT a Rule 20 staging-gate repo, and its integration branch is `dev` (NOT main).\nOutput exactly:\npush_target: feature-branch:<spec-derived-branch-name>\npr_required: true\nstaging_gate_required: false\nrepo: bluedevilcollectibles/bdc-harness\nbase_branch: dev\n\nCRITICAL: emit a `repo:` line and a `base_branch: dev` line in your output.\n"},{id: commit-and-push,persona: overseer,depends_on: [decide-push-target],when: "$block-reclassify.output.status == 'PROCEED'",load_bearing: true,bash: "set -euo pipefail\nDECIDE_OUTPUT=$decide-push-target.output\nPLAN_REVIEW_RAW=$plan-review.output\nPLAN_OUTPUT=$(printf '%s\\n' \"$PLAN_REVIEW_RAW\" | sed -n '/===[[:space:]]*APPROVED_PLAN_BEGIN[[:space:]]*===/,/===[[:space:]]*APPROVED_PLAN_END[[:space:]]*===/p' | sed '1d;$d')\nif [ -z \"$PLAN_OUTPUT\" ]; then\n  echo \"ERROR: plan-review output missing the APPROVED_PLAN fence (NF1 fail-closed).\" >&2\n  exit 1\nfi\nDIFF_FINAL=$diff-review-final.output\nRECLASS=$block-reclassify.output\necho \"$DECIDE_OUTPUT\"\nif printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -q '^out_of_scope: true'; then\n  echo \"Out of scope; failing closed.\" >&2\n  exit 1\nfi\nRECLASS_STATUS=$(printf '%s\\n' \"$RECLASS\" | sed -n 's/.*\"status\":\"\\([A-Z_]*\\)\".*/\\1/p' | head -1)\nif [ \"$RECLASS_STATUS\" != \"PROCEED\" ]; then\n  echo \"ERROR: commit-and-push reached with status='$RECLASS_STATUS' (expected PROCEED).\" >&2\n  exit 1\nfi\nfinal_verdict_cap=$(printf '%s\\n' \"$DIFF_FINAL\" \\\n  | grep -oE 'DIFF_REVIEW_FINAL=(satisfied|needs_revision)' \\\n  | tail -n 1)\nif [ \"$final_verdict_cap\" != \"DIFF_REVIEW_FINAL=satisfied\" ]; then\n  echo \"ERROR: diff-review-final not satisfied despite PROCEED -- refusing commit.\" >&2\n  exit 1\nfi\nBRANCH=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^push_target: feature-branch://p' | head -n 1)\nif [ -z \"$BRANCH\" ]; then\n  echo \"No feature branch target found in decide-push-target output.\" >&2\n  exit 1\nfi\nBRANCH_PATTERN='^(feat/[A-Za-z0-9_-]+|fix/[A-Za-z0-9_-]+|wip/[A-Za-z0-9_-]+)$'\nif ! printf '%s\\n' \"$BRANCH\" | grep -Eq \"$BRANCH_PATTERN\"; then\n  echo \"Malformed branch name: $BRANCH does not match feat/|fix/|wip/\" >&2\n  exit 1\nfi\nTHREAD_ID=$(git rev-parse --abbrev-ref HEAD | sed 's|archon/thread-||')\nUNIQUE_BRANCH=\"${BRANCH}-thread-${THREAD_ID}\"\ngit status --short\nDIRTY=$(git status --porcelain)\nif [ -z \"$DIRTY\" ]; then\n  if git rev-parse --quiet --verify \"origin/${UNIQUE_BRANCH}\" >/dev/null 2>&1; then\n    COMMITS_AHEAD=$(git rev-list --count \"origin/${UNIQUE_BRANCH}..HEAD\" 2>/dev/null || echo 0)\n  else\n    COMMITS_AHEAD=$(git rev-list --count HEAD --not --remotes=origin 2>/dev/null || echo 0)\n  fi\n  if [ \"$COMMITS_AHEAD\" = \"0\" ]; then\n    LOCAL_HEAD=$(git rev-parse HEAD)\n    RECOVERED=$(git ls-remote origin 2>/dev/null \\\n      | awk -v sha=\"$LOCAL_HEAD\" '$1 == sha {sub(/^refs\\/heads\\//, \"\", $2); print $2}' \\\n      | head -1)\n    if [ -n \"$RECOVERED\" ]; then\n      echo \"Recovered push target from remote: $RECOVERED\"\n      UNIQUE_BRANCH=\"$RECOVERED\"\n    else\n      echo \"No changed files and no commits ahead of origin/${UNIQUE_BRANCH} -- implement loop did not produce work\" >&2\n      exit 1\n    fi\n  else\n    echo \"Backstop: $COMMITS_AHEAD commit(s) ahead of origin -- pushing pre-committed work.\"\n  fi\nelse\n  CHANGED_FILES=$(printf '%s\\n' \"$DIRTY\" | awk '{print substr($0,4)}')\n  AUTO_TOLERATED='^(bun\\.lock|package-lock\\.json|yarn\\.lock|pnpm-lock\\.yaml|\\.bun-tag|node_modules/)$'\n  printf '%s\\n' \"$CHANGED_FILES\" | while IFS= read -r path; do\n    if [ -z \"$path\" ]; then\n      continue\n    fi\n    if printf '%s\\n' \"$path\" | grep -Eq \"$AUTO_TOLERATED\"; then\n      echo \"Auto-tolerated change (lockfile/managed): $path\"\n      git add -- \"$path\"\n      continue\n    fi\n    if ! printf '%s\\n' \"$PLAN_OUTPUT\" | grep -F -- \"$path\" >/dev/null; then\n      echo \"Changed file was not listed in plan output: $path\" >&2\n      exit 1\n    fi\n    git add -- \"$path\"\n  done\n  if git diff --cached --quiet; then\n    echo \"No changes staged; nothing for backstop to commit.\" >&2\n    exit 0\n  fi\n  COMMIT_MESSAGE=$(printf '%s\\n' \"$PLAN_OUTPUT\" | sed -n 's/^Commit message: //p' | head -n 1)\n  if [ -z \"$COMMIT_MESSAGE\" ]; then\n    WO_ID=\"${WO_ID:-$(printf '%s\\n' \"${USER_MESSAGE:-}\" | grep -Eo 'WO-[A-Z0-9-]+' | head -n 1 || true)}\"\n    COMMIT_MESSAGE=\"feat: ${WO_ID} Mission Control diagnostic graph\"\n  fi\n  git -c user.name=\"John Ranson\" -c user.email=\"admin@bluedevilcollectibles.com\" commit -m \"$COMMIT_MESSAGE\"\nfi\nPUSH_OK=false\nfor attempt in 1 2 3; do\n  if git push origin HEAD:\"${UNIQUE_BRANCH}\" 2>&1; then\n    PUSH_OK=true\n    break\n  fi\n  echo \"WARN: push attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PUSH_OK\" = \"false\" ]; then\n  echo \"ERROR: git push failed after 3 attempts -- aborting (load_bearing node).\" >&2\n  exit 1\nfi\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${UNIQUE_BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nLOCAL_HEAD=\"$(git rev-parse HEAD)\"\nif [ \"$REMOTE_HEAD\" != \"$LOCAL_HEAD\" ]; then\n  echo \"FATAL: canonical branch ${UNIQUE_BRANCH} not durably pushed (origin=${REMOTE_HEAD:-<absent>} local=${LOCAL_HEAD})\" >&2\n  exit 1\nfi\necho \"VERIFIED: origin/${UNIQUE_BRANCH} == local HEAD (${LOCAL_HEAD})\"\necho \"unique_branch=${UNIQUE_BRANCH}\"\n"},{id: open-pr-if-needed,persona: major-build,depends_on: [commit-and-push],task_class: clerical,load_bearing: true,bash: "set -euo pipefail\nDECIDE_OUTPUT=$decide-push-target.output\nPLAN_REVIEW_RAW=$plan-review.output\nPLAN_OUTPUT=$(printf '%s\\n' \"$PLAN_REVIEW_RAW\" | sed -n '/===[[:space:]]*APPROVED_PLAN_BEGIN[[:space:]]*===/,/===[[:space:]]*APPROVED_PLAN_END[[:space:]]*===/p' | sed '1d;$d')\nif [ -z \"$PLAN_OUTPUT\" ]; then\n  echo \"ERROR: plan-review output missing the APPROVED_PLAN fence (NF1 fail-closed).\" >&2\n  exit 1\nfi\nIMPLEMENT_OUTPUT=$implement.output\nVALIDATOR_OUTPUT=$war-council-validator.output\nCOMMIT_PUSH_OUTPUT=$commit-and-push.output\nif ! printf '%s\\n' \"$DECIDE_OUTPUT\" | grep -q '^pr_required: true'; then\n  echo \"PR not required; skipping.\"\n  exit 0\nfi\nUNIQUE_BRANCH=$(printf '%s\\n' \"$COMMIT_PUSH_OUTPUT\" | sed -n 's/^unique_branch=//p' | head -n 1)\nif [ -z \"$UNIQUE_BRANCH\" ]; then\n  echo \"UNIQUE_BRANCH not found in commit-and-push output.\" >&2\n  exit 1\nfi\nREMOTE_HEAD=\"$(git ls-remote origin \"refs/heads/${UNIQUE_BRANCH}\" 2>/dev/null | awk '{print $1}')\"\nif [ \"$REMOTE_HEAD\" != \"$(git rev-parse HEAD)\" ]; then\n  echo \"FATAL: open-pr precondition failed -- ${UNIQUE_BRANCH} not on origin at HEAD (origin=${REMOTE_HEAD:-<absent>}).\" >&2\n  exit 1\nfi\nREPO=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^repo: //p' | head -n 1)\nif [ -z \"$REPO\" ] || [ \"$REPO\" = \"unknown\" ]; then\n  echo \"ERROR: decide-push-target did not emit a valid 'repo: <owner>/<repo>'.\" >&2\n  exit 1\nfi\n# bdc-harness integration branch is dev (NOT main). Base the PR on dev.\nBASE_BRANCH=$(printf '%s\\n' \"$DECIDE_OUTPUT\" | sed -n 's/^base_branch: //p' | head -n 1)\nif [ -z \"$BASE_BRANCH\" ]; then\n  BASE_BRANCH=\"dev\"\nfi\nTITLE=$(printf '%s\\n' \"$PLAN_OUTPUT\" | sed -n 's/^Commit message: //p' | head -n 1)\nif [ -z \"$TITLE\" ]; then\n  TITLE=\"WO-MC-NEGAN-DIAGNOSTIC-GRAPH-01: Mission Control diagnostic graph (Negan)\"\nfi\nBODY_FILE=$(mktemp)\n{\n  echo \"## Summary\"\n  echo \"$PLAN_OUTPUT\"\n  echo\n  echo \"## Validation\"\n  echo \"Agent self-verifies in the implement loop (tsc/eslint/prettier in packages/web,\"\n  echo \"8 scenario tests incl. the geometric loop-arc assertion + /cancel integration,\"\n  echo \"and the SELF-REPAIR-LOOP-VIZ-01 + LOOP-ITERATION-COUNTER-01 no-regression suites).\"\n  echo \"PR-time gates (codex-review + claude-review + Gitleaks + e2e-smoke) re-validate.\"\n  echo\n  echo \"## Implement output\"\n  echo \"$IMPLEMENT_OUTPUT\"\n  echo\n  echo \"## Validator\"\n  echo \"$VALIDATOR_OUTPUT\"\n} > \"$BODY_FILE\"\nPR_OK=false\nfor attempt in 1 2 3; do\n  if gh pr create --repo \"$REPO\" --title \"$TITLE\" --body-file \"$BODY_FILE\" --head \"$UNIQUE_BRANCH\" --base \"$BASE_BRANCH\" 2>&1; then\n    PR_OK=true\n    break\n  fi\n  if [ -n \"$UNIQUE_BRANCH\" ]; then\n    EXIST=$(gh pr list --repo \"$REPO\" --head \"$UNIQUE_BRANCH\" --state open \\\n      --json url --jq '.[0].url // empty' 2>/dev/null || true)\n    if [ -n \"$EXIST\" ]; then\n      echo \"PR_URL=$EXIST\"\n      PR_OK=true\n      break\n    fi\n  fi\n  echo \"WARN: gh pr create attempt $attempt failed; retrying after $((attempt * 5))s...\" >&2\n  sleep $((attempt * 5))\ndone\nif [ \"$PR_OK\" = \"false\" ]; then\n  echo \"PR_CREATE_FAILED_BUT_BRANCH_SAFE: repo=${REPO} branch=${UNIQUE_BRANCH} sha=$(git rev-parse HEAD)\" >&2\n  echo \"ERROR: gh pr create failed after 3 attempts -- aborting (load_bearing node).\" >&2\n  echo \"RECOVERY: gh pr create --repo ${REPO} --head ${UNIQUE_BRANCH} --base ${BASE_BRANCH}\" >&2\n  exit 1\nfi\n"},{id: build-manifest,persona: major-build,depends_on: [open-pr-if-needed,block-reclassify,pause-gate],trigger_rule: all_done,task_class: clerical,prompt: "Construct the Captain CI completion manifest (v2) for this BDC Work Order.\n\n## Outcome branch (read FIRST)\nblock-reclassify status: $block-reclassify.output\n- status=PROCEED: real build committed + PR opened. Build the full v2 manifest.\n- status=ALREADY_SATISFIED: already implemented in this worktree; no commit/PR. Emit a\n  SHORT manifest: WO ID, OUTCOME=ALREADY_SATISFIED, evidence, VALIDATION: PASS (no-op).\n- status=BLOCKED: paused for human correction. Emit OUTCOME=BLOCKED, the block reason,\n  what the AI tiers tried, VALIDATION: BLOCKED. Do NOT claim a PR or DONE.\n\n## Inputs\nSpec:\n$read-spec.output\nPlan (approved -- APPROVED_PLAN block):\n$plan-review.output\nImplementation:\n$implement.output\nValidator:\n$war-council-validator.output\nDiff review (Codex, initial):\n$diff-review.output\nDiff review (Codex, final after repair):\n$diff-review-final.output\n\n## Required Manifest Fields (v2)\n- WO: WO-MC-NEGAN-DIAGNOSTIC-GRAPH-01\n- Builder: Cauldron major-build (bdc-harness-mc-negan-diagnostic-graph)\n- Files modified / Files created (packages/web + any packages/server runs/events surface)\n- Tests: count passing / count total + the command (bun test in packages/web). Call out\n  the 8 scenario tests AND that SELF-REPAIR-LOOP-VIZ-01 + LOOP-ITERATION-COUNTER-01 PASS.\n- PRs: PR URL (base dev), commit SHA\n- Grep assertions: rerunnable greps proving the new surfaces exist\n- Runtime verification: N/A reason (web bundle ships in the archon-app image rebuild;\n  no separate web deploy; not a shopops-api container source-change)\n- Vercel deployment: N/A reason (not a Vercel repo)\n- In-run review evidence: plan-review PLAN_REVIEW_PASS + RISK; diff-review-final verdict;\n  diff-review provider (codex cross-model). If any in-run review was skipped or ended\n  needs_revision, VALIDATION cannot be PASS.\n- VALIDATION: PASS  (only if all gates above are green)\n"},{id: flip-notion,persona: xo,depends_on: [build-manifest],trigger_rule: all_done,bash: "set -uo pipefail\n# Rule 7: Archon does NOT auto-update Notion. Flip Claude Status=REVIEW + Status=Review\n# (NEVER DONE -- Captain CI is the only closer). Fail OPEN: if NOTION_PAGE_ID is still\n# the placeholder, or NOTION_TOKEN is absent, emit XO_ACTION instead of guessing.\nPAGE_ID=\"${NOTION_PAGE_ID:-REPLACE_WITH_NOTION_PAGE_ID}\"\nWO_ID=\"${WO_ID:-WO-MC-NEGAN-DIAGNOSTIC-GRAPH-01}\"\nMANIFEST=$build-manifest.output\nRECLASS=$block-reclassify.output\nSTATUS=$(printf '%s\\n' \"$RECLASS\" | sed -n 's/.*\"status\":\"\\([A-Z_]*\\)\".*/\\1/p' | head -1)\nSTATUS=\"${STATUS:-BLOCKED}\"\n\n# BLOCKED -> do NOT flip to REVIEW; surface for XO and stop.\nif [ \"$STATUS\" = \"BLOCKED\" ]; then\n  echo \"XO_ACTION: run PAUSED/BLOCKED for ${WO_ID}; do NOT flip to REVIEW. Inspect the\"\n  echo \"pause-gate + diff-review-final + opus-repair output and correct, then resume or re-fire.\"\n  exit 0\nfi\n\nif [ \"$PAGE_ID\" = \"REPLACE_WITH_NOTION_PAGE_ID\" ] || [ -z \"$PAGE_ID\" ]; then\n  echo \"XO_ACTION: NOTION_PAGE_ID not provided (still placeholder). Flip ${WO_ID} to\"\n  echo \"Claude Status=REVIEW + Status=Review manually and paste the manifest into Notes.\"\n  echo \"--- MANIFEST ---\"\n  printf '%s\\n' \"$MANIFEST\"\n  exit 0\nfi\nif [ -z \"${NOTION_TOKEN:-}\" ]; then\n  echo \"XO_ACTION: NOTION_TOKEN absent in container; cannot write Notion from the run.\"\n  echo \"Flip ${WO_ID} (page ${PAGE_ID}) to Claude Status=REVIEW + Status=Review manually.\"\n  echo \"--- MANIFEST ---\"\n  printf '%s\\n' \"$MANIFEST\"\n  exit 0\nfi\n\n# Best-effort Notion API write (Rule 11: NO n8n webhook -- direct api.notion.com only).\n# Set both select properties to Review/REVIEW. Property names match the BDC tracker.\nRESP=$(curl -s -w '\\n%{http_code}' -X PATCH \"https://api.notion.com/v1/pages/${PAGE_ID}\" \\\n  -H \"Authorization: Bearer ${NOTION_TOKEN}\" \\\n  -H \"Notion-Version: 2022-06-28\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"properties\":{\"Status\":{\"status\":{\"name\":\"Review\"}},\"Claude Status\":{\"select\":{\"name\":\"REVIEW\"}}}}' 2>&1 || true)\nCODE=$(printf '%s\\n' \"$RESP\" | tail -n 1)\nif [ \"$CODE\" = \"200\" ]; then\n  echo \"flip-notion: set ${WO_ID} (page ${PAGE_ID}) -> Status=Review, Claude Status=REVIEW\"\n  echo \"STATUS=ok\"\nelse\n  echo \"XO_ACTION: Notion PATCH returned HTTP ${CODE}; flip ${WO_ID} (page ${PAGE_ID}) manually.\"\n  echo \"DETAIL=$(printf '%s\\n' \"$RESP\" | head -n -1)\"\n  echo \"STATUS=failed_flip\"\nfi\necho \"--- MANIFEST (for Notes) ---\"\nprintf '%s\\n' \"$MANIFEST\"\nexit 0\n"}]}