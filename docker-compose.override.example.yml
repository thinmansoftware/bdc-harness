# Docker Compose override for user-extended builds (development / local Docker).
# Copy this file to docker-compose.override.yml -- do NOT modify docker-compose.override.example.yml.
# docker-compose.override.yml is gitignored so your customizations stay local.
#
# Docker Compose automatically merges docker-compose.override.yml with docker-compose.yml
# when both files are present -- no extra flags needed:
#   docker compose up -d
#
# NOTE: The base docker-compose.yml uses `build: .` (Dockerfile by default). This override
# switches it to Dockerfile.user so Compose builds your custom image instead.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.user

# /home/appuser (Claude/Codex/Pi config, gitconfig, shell history) is already
# persisted by default via the archon_user_home named volume in the base compose.
# To bind-mount a host path instead, set ARCHON_USER_HOME=/your/host/path in .env
# (the host path must be writable by UID 1001). No override-file edit needed.

# Root-HOME credential persistence for Codex (BDC-specific):
# archon-app-1 runs as root (HOME=/root). The archon_user_home volume only
# covers /home/appuser, so /root/.codex is wiped on rebuild unless bind-mounted.
# This mirrors the /root/.claude bind mount pattern already on the host.
# To enable, add the volumes stanza below to your production docker-compose.override.yml
# (that file is gitignored on the host -- do NOT add it here):
#
# services:
#   app:
#     volumes:
#       - ${ARCHON_USER_HOME:?set ARCHON_USER_HOME in .env}/.codex:/root/.codex
#
# After adding, rebuild + restart: docker compose build && docker compose up -d
# Verify: docker exec archon-app-1 sh -c 'ls /root/.codex/auth.json'
# Context: WO-HARNESS-CODEX-AUTH-FAILBACK-01 (2026-06-29), anchor incident 2026-06-11.

# GitHub App key mounts -- lane UID isolation (WO-HARNESS-APP-KEY-ISOLATION-01):
# The reviewer (Overseer) and Builder 2 App private keys are mounted read-only
# into the container. Their HOST ownership/modes are what enforce the boundary --
# the server (appuser 1001) can read them, a builder lane (laneuser 1002) cannot
# read the reviewer key but CAN read the Builder 2 key (lanes ARE Builder 2).
#
# Required HOST owner/group/mode for each PEM (set by the post-merge rebuild step
# in docs/operations/container-github-app-auth.md):
#   thinman-overseer.pem    root : archon-secrets(1100) : 0440   (reviewer -- lane MUST NOT read)
#   thinman-builder-2.pem    root : laneuser(1002)       : 0440   (Builder 2 -- lane MUST read)
#   thinman-builder.pem      REMOVED -- drop this unused mount from your host override
#
# Example production docker-compose.override.yml (gitignored on the host -- do
# NOT add it here); the thinman-builder.pem line is intentionally absent:
#
# services:
#   app:
#     volumes:
#       - /opt/bdc/archon/secrets/thinman-overseer.private-key.pem:/run/secrets/thinman-overseer.pem:ro
#       - /opt/bdc/archon/secrets/thinman-builder-2.private-key.pem:/run/secrets/thinman-builder-2.pem:ro
#
# Verify after rebuild (see docs/operations/container-github-app-auth.md, Stops 4-6):
#   docker exec -u 1002:1002 archon-app-1 cat /run/secrets/thinman-overseer.pem   # Permission denied
#   docker exec -u 1002:1002 archon-app-1 test -r /run/secrets/thinman-builder-2.pem  # exit 0
