# Bun configuration for Remote Agentic Coding Platform

[test]
# packages/ avoids duplicate suites under workspace/worktrees.
# scripts/ is included so `bun test scripts/...` (a name filter, not a path)
# can see container tests. Package test scripts do not read this file.
root = ["./packages", "./scripts"]
# Run preload script before tests (now in @archon/core)
preload = ["./packages/core/src/test/setup.ts"]
# Coverage output
coverage = true
coverageDir = "coverage"
