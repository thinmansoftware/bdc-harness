# Bun configuration for Remote Agentic Coding Platform

[test]
# Substring filters such as `bun test scripts/container` only match files under
# root. Scan the repo root so that command discovers scripts/container tests.
# Ignore nested workspace and worktree checkouts so those trees are not scanned
# for duplicate suites (what root = "./packages" used to prevent).
root = "."
pathIgnorePatterns = [
  "workspace/**",
  "workspaces/**",
  "worktrees/**",
]
# Run preload script before tests (now in @archon/core)
preload = ["./packages/core/src/test/setup.ts"]
# Coverage output
coverage = true
coverageDir = "coverage"
