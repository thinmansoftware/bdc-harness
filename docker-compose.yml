# =============================================================================
# Archon - Docker Compose
# =============================================================================
#
# Usage:
#   docker compose up -d                                  # App with SQLite (default)
#   docker compose --profile with-db up -d                # App + local PostgreSQL
#   docker compose --profile cloud up -d                  # App + Caddy HTTPS reverse proxy
#   docker compose --profile with-db --profile cloud up -d  # All three
#
# Database:
#   SQLite is the default (zero config). For PostgreSQL, either:
#   - Use --profile with-db for a local container, and set in .env:
#     DATABASE_URL=postgresql://postgres:postgres@postgres:5432/remote_coding_agent
#   - Or point DATABASE_URL to an external database (Supabase, Neon, etc.)
#
# Data:
#   Set ARCHON_DATA in .env to control where Archon stores data on the host:
#     ARCHON_DATA=/opt/archon-data    # Any absolute path on the host
#   Default: Docker-managed volume (archon_data)
#
# User home (Claude/Codex/Pi config, gitconfig, shell history):
#   /home/appuser is persisted by default to the archon_user_home named volume so
#   user-installed Claude Code skills/commands/agents/hooks, Codex/Pi auth state,
#   and ~/.gitconfig survive container rebuilds. To use a host path instead:
#     ARCHON_USER_HOME=/opt/archon-user-home    # Any absolute path on the host
#   Default: Docker-managed volume (archon_user_home)
#
# Harness artifacts (load-bearing workflow output -- host-persistent, WO-168 Tier 1):
#   /host-artifacts is a host bind mount where load-bearing workflow nodes save
#   git bundles + raw artifacts BEFORE remote push, so work survives container
#   prune / push failure / worktree cleanup. Anchor: 2026-05-16 engine sortie
#   lost 13 specs when worktree pruned after silent push failure.
#   Default: ./harness-artifacts (host path relative to compose file).
#   Override: HARNESS_ARTIFACTS=/opt/harness-artifacts in .env if needed.
#   Recovery procedure: docs/recovery/host-artifact-recovery.md
#
# Cloud (HTTPS):
#   1. Set DOMAIN=archon.example.com in .env
#   2. Point DNS A record to your server
#   3. Add --profile cloud -- Caddy handles TLS automatically via Let's Encrypt
#

services:
  # -------------------------------------------------------------------------
  # App (always runs)
  # -------------------------------------------------------------------------
  app:
    build: .
    image: archon
    env_file: .env
    environment:
      ARCHON_DOCKER: "true"
      # WO-HARNESS-CONTAINER-GITHUB-AUTH-BOUNDARY-01 (#171):
      # Workflows (sync-workflows, author-wo-batch, persona-schema, engine
      # sortie) push branches/PRs to GitHub from inside the container. The
      # token must be visible to bash subprocesses AND to both the legacy
      # GH_TOKEN credential-helper check in docker-entrypoint.sh and the
      # current `gh` CLI which reads GITHUB_TOKEN. Map both names to the
      # same host value so neither path silently no-ops.
      # NEVER store the literal token here. Value comes from .env (which is
      # gitignored) or the host shell env. See docs/operations/container-github-auth.md.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-${GITHUB_TOKEN:-}}
      # Merge Manager / Overseer uses these to mint short-lived installation
      # tokens. Values come from .env; private key material is never stored here.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ${ARCHON_DATA:-archon_data}:/.archon
      - ${ARCHON_USER_HOME:-archon_user_home}:/home/appuser
      # Read-only GitHub App key mount. The host file stays outside git; set
      # GITHUB_APP_PRIVATE_KEY_PATH to its path under this mount.
      - ${GITHUB_APP_SECRETS_DIR:-./secrets}:/opt/bdc/archon/secrets:ro
      # WO-168 Tier 1: host-persistent artifact mount. Load-bearing workflow
      # nodes (bdc-author-wo-batch commit-and-push, etc.) write a git bundle +
      # raw artifacts here BEFORE attempting remote push, so worktree prune /
      # push failure does not destroy work. See docs/recovery/host-artifact-recovery.md.
      - ${HARNESS_ARTIFACTS:-./harness-artifacts}:/host-artifacts
    networks:
      - archon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

  # -------------------------------------------------------------------------
  # PostgreSQL (optional: --profile with-db)
  # Set DATABASE_URL in .env to connect the app to this container.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    profiles: ["with-db"]
    environment:
      POSTGRES_DB: remote_coding_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000_combined.sql:/docker-entrypoint-initdb.d/000_combined.sql:ro
      - ./migrations:/migrations:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - archon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Caddy reverse proxy with automatic HTTPS (optional: --profile cloud)
  # Requires DOMAIN set in .env. See Caddyfile for configuration.
  # -------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    profiles: ["cloud"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - archon-network
    depends_on:
      app:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Auth service -- form-based login for Caddy forward_auth (optional: --profile auth)
  # Use alongside --profile cloud: docker compose --profile cloud --profile auth up -d
  # Requires AUTH_USERNAME, AUTH_PASSWORD_HASH, COOKIE_SECRET in .env.
  # See docs/docker.md for setup instructions.
  # -------------------------------------------------------------------------
  auth-service:
    build: ./auth-service
    profiles: ["auth"]
    restart: unless-stopped
    env_file: .env
    environment:
      AUTH_PORT: "${AUTH_SERVICE_PORT:-9000}"
    expose:
      - "${AUTH_SERVICE_PORT:-9000}"
    networks:
      - archon-network

volumes:
  archon_data:
  archon_user_home:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  archon-network:
    driver: bridge
