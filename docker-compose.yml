# =============================================================================
# Archon - Docker Compose
# =============================================================================
#
# Usage:
#   docker compose up -d                                  # App with SQLite (default)
#   docker compose --profile with-db up -d                # App + local PostgreSQL
#   docker compose --profile cloud up -d                  # App + Caddy HTTPS reverse proxy
#   docker compose --profile with-db --profile cloud up -d  # All three
#
# Database:
#   SQLite is the default (zero config). For PostgreSQL, either:
#   - Use --profile with-db for a local container, and set in .env:
#     DATABASE_URL=postgresql://postgres:postgres@postgres:5432/remote_coding_agent
#   - Or point DATABASE_URL to an external database (Supabase, Neon, etc.)
#
# Data:
#   Set ARCHON_DATA in .env to control where Archon stores data on the host:
#     ARCHON_DATA=/opt/archon-data    # Any absolute path on the host
#   Default: Docker-managed volume (archon_data)
#
# User home (Claude/Codex/Pi config, gitconfig, shell history):
#   /home/appuser is persisted by default to the archon_user_home named volume so
#   user-installed Claude Code skills/commands/agents/hooks, Codex/Pi auth state,
#   and ~/.gitconfig survive container rebuilds. To use a host path instead:
#     ARCHON_USER_HOME=/opt/archon-user-home    # Any absolute path on the host
#   Default: Docker-managed volume (archon_user_home)
#
# Harness artifacts (load-bearing workflow output -- host-persistent, WO-168 Tier 1):
#   /host-artifacts is a host bind mount where load-bearing workflow nodes save
#   git bundles + raw artifacts BEFORE remote push, so work survives container
#   prune / push failure / worktree cleanup. Anchor: 2026-05-16 engine sortie
#   lost 13 specs when worktree pruned after silent push failure.
#   Default: ./harness-artifacts (host path relative to compose file).
#   Override: HARNESS_ARTIFACTS=/opt/harness-artifacts in .env if needed.
#   Recovery procedure: docs/recovery/host-artifact-recovery.md
#
# Cloud (HTTPS):
#   1. Set DOMAIN=archon.example.com in .env
#   2. Point DNS A record to your server
#   3. Add --profile cloud -- Caddy handles TLS automatically via Let's Encrypt
#

services:
  # -------------------------------------------------------------------------
  # App (always runs)
  # -------------------------------------------------------------------------
  app:
    build:
      context: .
      args:
        # Baked into the image so the container reports its build (W2 / C7 / C9).
        ARCHON_BUILD_SHA: ${ARCHON_BUILD_SHA:-unknown}
    image: archon
    env_file: .env
    environment:
      ARCHON_DOCKER: "true"
      # WO-HARNESS-CONTAINER-GITHUB-AUTH-BOUNDARY-01 (#171):
      # Workflows (sync-workflows, author-wo-batch, persona-schema, engine
      # sortie) push branches/PRs to GitHub from inside the container. The
      # token must be visible to bash subprocesses AND to both the legacy
      # GH_TOKEN credential-helper check in docker-entrypoint.sh and the
      # current `gh` CLI which reads GITHUB_TOKEN. Map both names to the
      # same host value so neither path silently no-ops.
      # NEVER store the literal token here. Value comes from .env (which is
      # gitignored) or the host shell env. See docs/operations/container-github-auth.md.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-${GITHUB_TOKEN:-}}
      # WO-HARNESS-MM-THINMAN-APP-WIRE-01 (#1575): Thinman Overseer GitHub App
      # credentials for the Merge Manager / overseer real-mode GitHub client.
      # When all of ID + INSTALLATION_ID + a valid PEM resolve, overseer GitHub
      # calls mint an installation token (thinman-overseer[bot]) instead of the
      # admin PAT above; a partial config fails loudly and NEVER downgrades to the
      # PAT. Wired explicitly here (like GH_TOKEN) -- not only via env_file -- so
      # the vars are present in the container startup environment and visible to
      # bash subprocesses, not just the app process. Provide the key by EITHER
      # GITHUB_APP_PRIVATE_KEY (inline PEM; no mount needed) OR
      # GITHUB_APP_PRIVATE_KEY_PATH pointing at a mounted file (see optional volume
      # below). NEVER a literal here: values come from .env (gitignored). See
      # docs/operations/container-github-app-auth.md.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-}
      # PR #848: Cursor rail (Overseer `cursor` judge rung + `cursor` provider).
      # cursor-agent reads its credential from CURSOR_API_KEY when set; otherwise
      # from ~/.cursor, seeded from the read-only mount below. NEVER a literal
      # here -- value comes from .env (gitignored) or the host shell env.
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      # Duty Officer clock: OpenRouter primary (OPENROUTER_API_KEY or GLM_API_KEY
      # from env_file), native xAI Grok backup (XAI_API_KEY). GitHub issue comments
      # stay off unless DUTY_OFFICER_GH_NUDGE=true -- do not treat GITHUB_TOKEN as consent.
      DUTY_OFFICER_OPENROUTER_MODEL: ${DUTY_OFFICER_OPENROUTER_MODEL:-x-ai/grok-4.6}
      DUTY_OFFICER_JUDGE_ENABLED: ${DUTY_OFFICER_JUDGE_ENABLED:-false}
      DUTY_OFFICER_GH_NUDGE: ${DUTY_OFFICER_GH_NUDGE:-false}
      # WO-HARNESS-DO-SECURITY-DETECTOR-01: zero-LLM security-scan detector. ARMED_AT
      # defaults to PR-open date + 14 days (PR opened 2026-09-23 -> 2026-10-07 grace end);
      # before that the detector is disarmed (checks run, marker PATCHed, no P0/P1
      # issue). Move the date on purpose with a diary row -- silence is the alarm.
      DUTY_OFFICER_SECURITY_DETECTOR_ARMED_AT: ${DUTY_OFFICER_SECURITY_DETECTOR_ARMED_AT:-2026-10-07}
      DUTY_OFFICER_SECURITY_SCAN_REPOS: ${DUTY_OFFICER_SECURITY_SCAN_REPOS:-thinmansoftware/shopops,thinmansoftware/lspro-react,thinmansoftware/scout-service,thinmansoftware/bdc-harness}
      DUTY_OFFICER_SECURITY_SCAN_WORKFLOW: ${DUTY_OFFICER_SECURITY_SCAN_WORKFLOW:-security-scan.yml}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ${ARCHON_DATA:-archon_data}:/.archon
      - ${ARCHON_USER_HOME:-archon_user_home}:/home/appuser
      # Optional (Option A -- mounted PEM). Uncomment and set
      # GITHUB_APP_PRIVATE_KEY_HOST_PATH in .env to mount the App private key as a
      # read-only file, then set GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/thinman-overseer.pem
      # (keeps the key out of `docker compose config` output and process env).
      - ${GITHUB_APP_PRIVATE_KEY_HOST_PATH:-/dev/null}:/run/secrets/thinman-overseer.pem:ro
      # PR #848: host cursor-agent credential directory (the ~/.cursor of the
      # user who ran `cursor-agent login`), read-only. Set CURSOR_CONFIG_HOST_PATH
      # in .env. Default /dev/null makes a missing path harmless: the entrypoint
      # only seeds /home/appuser/.cursor when this target is a non-empty DIRECTORY.
      # Not mounted over ~/.cursor directly: cursor-agent writes state there and a
      # /dev/null default would turn ~/.cursor into a file on the persisted volume.
      - ${CURSOR_CONFIG_HOST_PATH:-/dev/null}:/run/secrets/cursor-config:ro
      # WO-168 Tier 1: host-persistent artifact mount. Load-bearing workflow
      # nodes (bdc-author-wo-batch commit-and-push, etc.) write a git bundle +
      # raw artifacts here BEFORE attempting remote push, so worktree prune /
      # push failure does not destroy work. See docs/recovery/host-artifact-recovery.md.
      - ${HARNESS_ARTIFACTS:-./harness-artifacts}:/host-artifacts
    networks:
      - archon-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3000}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

  # -------------------------------------------------------------------------
  # PostgreSQL (optional: --profile with-db)
  # Set DATABASE_URL in .env to connect the app to this container.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    profiles: ["with-db"]
    environment:
      POSTGRES_DB: remote_coding_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/000_combined.sql:/docker-entrypoint-initdb.d/000_combined.sql:ro
      - ./migrations:/migrations:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - archon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Caddy reverse proxy with automatic HTTPS (optional: --profile cloud)
  # Requires DOMAIN set in .env. See Caddyfile for configuration.
  # -------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    profiles: ["cloud"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - archon-network
    depends_on:
      app:
        condition: service_healthy

  # -------------------------------------------------------------------------
  # Auth service -- form-based login for Caddy forward_auth (optional: --profile auth)
  # Use alongside --profile cloud: docker compose --profile cloud --profile auth up -d
  # Requires AUTH_USERNAME, AUTH_PASSWORD_HASH, COOKIE_SECRET in .env.
  # See docs/docker.md for setup instructions.
  # -------------------------------------------------------------------------
  auth-service:
    build: ./auth-service
    profiles: ["auth"]
    restart: unless-stopped
    env_file: .env
    environment:
      AUTH_PORT: "${AUTH_SERVICE_PORT:-9000}"
    expose:
      - "${AUTH_SERVICE_PORT:-9000}"
    networks:
      - archon-network

volumes:
  archon_data:
  archon_user_home:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  archon-network:
    driver: bridge
