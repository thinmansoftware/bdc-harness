name: Test Suite

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check bundled defaults
        run: bun run check:bundled

      - name: Check bundled skill
        run: bun run check:bundled-skill

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint --max-warnings 0

      - name: Check formatting
        run: bun run format:check

      - name: GitHub service command and credential routing regressions
        run: bun test --timeout 30000 ./scripts/github-service-exec.test.ts packages/overseer/src/__tests__/github-command-durable-metering.test.ts ./scripts/github-service-token.test.ts ./scripts/container/gh-merge-guard.test.ts ./scripts/container/docker-entrypoint-app-helper.test.ts ./scripts/github-service-login.test.ts

      - name: Run tests
        run: bun run test

  windows-gate:
    runs-on: ubuntu-latest
    outputs:
      run_windows: ${{ steps.classify.outputs.run_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Classify changed paths
        id: classify
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun scripts/windows-ci/windows-paths.ts --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }} >> "$GITHUB_OUTPUT"
          else
            echo "run_windows=true" >> "$GITHUB_OUTPUT"
          fi

  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    needs: windows-gate
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       needs.windows-gate.outputs.run_windows == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check bundled defaults
        run: bun run check:bundled

      - name: Check bundled skill
        run: bun run check:bundled-skill

      - name: GitHub service command and credential routing regressions
        run: bun test --timeout 30000 ./scripts/github-service-exec.test.ts packages/overseer/src/__tests__/github-command-durable-metering.test.ts ./scripts/github-service-token.test.ts ./scripts/container/gh-merge-guard.test.ts ./scripts/container/docker-entrypoint-app-helper.test.ts ./scripts/github-service-login.test.ts

      - name: Dispatch worker tests (Windows)
        run: >
          bun test --timeout 30000
          ./scripts/dispatch-worker/acp/conformance.test.ts
          ./scripts/dispatch-worker/acp/kill-tree.test.ts
          ./scripts/dispatch-worker/acp/session.test.ts
          ./scripts/dispatch-worker/adapters.test.ts
          ./scripts/dispatch-worker/agent-cwd.test.ts
          ./scripts/dispatch-worker/board-motion.test.ts
          ./scripts/dispatch-worker/claude-acp/adapter.test.ts
          ./scripts/dispatch-worker/credentials.test.ts
          ./scripts/dispatch-worker/dispatch-migration-smoke.test.ts
          ./scripts/dispatch-worker/instance-lock.test.ts
          ./scripts/dispatch-worker/mcp/session.test.ts
          ./scripts/dispatch-worker/outcome-transcript.test.ts
          ./scripts/dispatch-worker/prompt-token.test.ts
          ./scripts/dispatch-worker/report-unroutable.test.ts
          ./scripts/dispatch-worker/restart-evidence.test.ts
          ./scripts/dispatch-worker/seat-preflight.cursor.test.ts
          ./scripts/dispatch-worker/seat-preflight.test.ts
          ./scripts/dispatch-worker/stdin-prompt.test.ts
          ./scripts/dispatch-worker/watchdog.test.ts
          ./scripts/dispatch-worker/worker-log.test.ts

      - name: Run tests (Windows package-serial)
        run: bun run --sequential --filter '*' test

  dispatch-phase15-postgres:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: phase15
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d phase15"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DISPATCH_POSTGRES_PHASE15_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/phase15
      TASKMASTER_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/phase15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Phase 1.5 PostgreSQL integration
        run: bun test packages/core/src/db/dispatch.postgres.test.ts
      - name: Taskmaster health migration and atomic reset PostgreSQL integration
        run: bun test packages/core/src/db/taskmaster.postgres.test.ts
      - name: Taskmaster durable daily fire cap PostgreSQL integration
        run: bun test packages/core/src/db/taskmaster-fire-cap.postgres.test.ts
      - name: CE scope approvals PostgreSQL integration
        run: bun test packages/core/src/db/board-scope-approvals.postgres.test.ts

  docker-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: archon-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probe packaged pnpm offline
        run: |
          docker run --rm --network none --user appuser --entrypoint sh archon-ci:test -ec '
            scratch=$(mktemp -d)
            cd "$scratch"
            printf "%s\n" "{\"packageManager\":\"pnpm@12.14.0\"}" > package.json
            for attempt in 1 2; do
              test "$(pnpm --version)" = "12.14.0"
              test "$(pnpm exec node --version)" = "v26.12.1"
            done
            test "$(cat package.json)" = "{\"packageManager\":\"pnpm@12.14.0\"}"
            case "$(node --version)" in v26*) exit 1 ;; esac
            test "$(bun --version)" = "1.3.11"
          '

      - name: Smoke test -- packaged GitHub helper dependency closure
        run: |
          docker run --rm --network none --user appuser --entrypoint bun archon-ci:test build \
            /app/scripts/github-service-token.ts /app/scripts/github-service-exec.ts \
            --target=bun --outdir /tmp/archon-github-helper-smoke

      - name: Smoke test -- container starts and serves /api/health
        run: |
          mkdir -p "$RUNNER_TEMP/overseer-secrets"
          printf 'synthetic-ci-canary\n' > "$RUNNER_TEMP/overseer-secrets/thinman-overseer.pem"
          chmod 0644 "$RUNNER_TEMP/overseer-secrets/thinman-overseer.pem"
          docker run -d --name archon-smoke -e PORT=3000 -e CLAUDE_USE_GLOBAL_AUTH=true -p 3000:3000 \
            -v "$RUNNER_TEMP/overseer-secrets/thinman-overseer.pem:/run/secrets/thinman-overseer.pem:ro" archon-ci:test
          sleep 5
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:3000/api/health

      - name: Smoke test -- lane toolchain as application user
        run: |
          docker exec --user appuser archon-smoke sh -ec 'node --version && npm --version && npx --version && pytest --version'

      - name: Smoke test -- Overseer native review sandbox as application user
        run: |
          test "$(docker exec --user reviewer archon-smoke id -u)" = 1002
          ! docker exec --user reviewer archon-smoke cat /run/secrets/thinman-overseer.pem
          ! docker exec --user reviewer archon-smoke sh -c 'ls /.archon/workspaces'
          ! docker exec --user reviewer archon-smoke sh -c 'cat /home/appuser/.codex/auth.json'
          ! docker exec --user reviewer archon-smoke sh -c 'cat /proc/1/environ'
          docker exec --user appuser archon-smoke bun run scripts/overseer-review-sandbox-smoke.ts
          test "$(docker inspect archon-smoke --format '{{.HostConfig.Privileged}} {{json .HostConfig.CapAdd}}')" = 'false null'

      - name: Dump container logs on failure
        if: failure()
        run: docker logs archon-smoke 2>&1 || true

      - name: Cleanup smoke test container
        if: always()
        run: docker rm -f archon-smoke || true
