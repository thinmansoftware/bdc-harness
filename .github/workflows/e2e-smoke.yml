# Provider lanes gate on secret presence; presence does not validate credentials.
# BDC policy: no metered provider API calls in CI. Set the repository variable
# E2E_PROVIDER_SMOKE=off to explicitly opt out, including for exhausted credentials.
# To re-enable an eligible lane, add its missing secret or set E2E_PROVIDER_SMOKE=on
# to remove the opt-out; the corresponding secret must still be present.
# e2e-deterministic is the always-on baseline, independent of provider preflight.
name: E2E Smoke Tests

on:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credentials-preflight:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      E2E_PROVIDER_SMOKE: ${{ vars.E2E_PROVIDER_SMOKE }}
    outputs:
      has_openai: ${{ steps.credentials.outputs.has_openai }}
      has_anthropic: ${{ steps.credentials.outputs.has_anthropic }}
    steps:
      - name: Detect provider credentials and opt-out
        id: credentials
        shell: bash
        run: |
          if [ "$E2E_PROVIDER_SMOKE" = "off" ]; then
            echo "has_openai=false" >> "$GITHUB_OUTPUT"
            echo "has_anthropic=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_openai=$([ -n "$OPENAI_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "has_anthropic=$([ -n "$ANTHROPIC_API_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarize provider lane eligibility
        shell: bash
        env:
          HAS_OPENAI: ${{ steps.credentials.outputs.has_openai }}
          HAS_ANTHROPIC: ${{ steps.credentials.outputs.has_anthropic }}
        run: |
          codex="skipped (no credential: OPENAI_API_KEY)"
          claude="skipped (no credential: ANTHROPIC_API_KEY)"
          if [ "$E2E_PROVIDER_SMOKE" = "off" ]; then
            codex="skipped (opt-out: E2E_PROVIDER_SMOKE=off)"
            claude="skipped (opt-out: E2E_PROVIDER_SMOKE=off)"
          else
            if [ "$HAS_OPENAI" = "true" ]; then codex="will run (credential present)"; fi
            if [ "$HAS_ANTHROPIC" = "true" ]; then claude="will run (credential present)"; fi
          fi
          mixed="skipped (provider prerequisite skipped: no credential or opt-out, as above)"
          if [ "$HAS_OPENAI" = "true" ] && [ "$HAS_ANTHROPIC" = "true" ]; then
            mixed="will run if both provider lanes succeed"
          fi
          echo "Provider lanes: e2e-codex: $codex; e2e-claude: $claude; e2e-mixed: $mixed." >> "$GITHUB_STEP_SUMMARY"

  # --- Tier 1: Deterministic (no API keys needed) ------------------------
  e2e-deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup uv (for Python script nodes)
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run deterministic workflow
        run: bun run cli workflow run e2e-deterministic --no-worktree "smoke test"

  # --- Tier 2a: Claude provider ------------------------------------------
  e2e-claude:
    needs: credentials-preflight
    if: needs.credentials-preflight.outputs.has_anthropic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Claude smoke test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # YAML `env:` values don't expand `~`, so set CLAUDE_BIN_PATH in the
          # shell where $HOME resolves. The native installer drops the binary
          # at $HOME/.local/bin/claude.
          export CLAUDE_BIN_PATH="$HOME/.local/bin/claude"
          bun run cli workflow run e2e-claude-smoke --no-worktree "smoke test"

  # --- Tier 2b: Codex provider -------------------------------------------
  e2e-codex:
    needs: credentials-preflight
    if: needs.credentials-preflight.outputs.has_openai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Codex smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bun run cli workflow run e2e-codex-smoke --no-worktree "smoke test"

  # --- Tier 3: Mixed providers -------------------------------------------
  e2e-mixed:
    # GitHub skips this job while either credential-backed prerequisite above is skipped.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-claude, e2e-codex]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run mixed providers test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # YAML `env:` values don't expand `~`, so set CLAUDE_BIN_PATH in the
          # shell where $HOME resolves. The native installer drops the binary
          # at $HOME/.local/bin/claude.
          export CLAUDE_BIN_PATH="$HOME/.local/bin/claude"
          bun run cli workflow run e2e-mixed-providers --no-worktree "smoke test"
