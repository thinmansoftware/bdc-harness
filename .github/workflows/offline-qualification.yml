name: Offline staging qualification

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/staging/**'
      - 'Dockerfile'
      - 'docker-compose.qualification.yml'
      - 'bun.lock'
      - 'package.json'
      - '.dockerignore'
      - '.github/workflows/offline-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: teetime-qual-${{ github.run_id }}-${{ github.run_attempt }}
      QUALIFICATION_CONTAINER: teetime-qual-${{ github.run_id }}-${{ github.run_attempt }}
      QUALIFICATION_IMAGE: teetime-qual:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Test offline boundary and normal server behavior
        run: |
          bun test packages/paths/src/offline-qualification.test.ts
          bun --filter @archon/server test
          bun --filter @archon/server type-check
          bun x tsc --noEmit -p scripts/tsconfig.json
      - name: Test restricted provider source candidate
        # Restricted-provider tests are isolated processes because SDK mocks are global.
        # The synthetic executable uses the real SDK but never contacts a model.
        # Runtime admission remains separate from these source checks.
        run: |
          cd packages/providers
          bun test src/codex/restricted-provider.test.ts
          bun test src/codex/restricted-sdk.test.ts
          bun test src/codex/provider.test.ts
          bun x tsc --noEmit
      - name: Build exact checkout candidate image
        run: |
          echo "Testing checkout $(git rev-parse HEAD) (PR runs use merge candidate)"
          docker build --build-arg ARCHON_BUILD_SHA="$(git rev-parse HEAD)" -t "$QUALIFICATION_IMAGE" .
      - name: Launch isolated staging
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "QUALIFICATION_OPERATOR_TOKEN=$token" >> "$GITHUB_ENV"
          export QUALIFICATION_OPERATOR_TOKEN="$token"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.qualification.yml up -d
          for attempt in $(seq 1 24); do
            status=$(docker inspect "$QUALIFICATION_CONTAINER" --format '{{.State.Health.Status}}')
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Verify non-model Codex tool sandbox
        run: |
          python3 scripts/staging/run-codex-sandbox-probe.py --image "$QUALIFICATION_IMAGE" --expected-sha "$(git rev-parse HEAD)"
      - name: Verify runtime and isolation
        run: |
          python3 scripts/staging/inspect-offline-qualification.py "$QUALIFICATION_CONTAINER" "$(git rev-parse HEAD)" "$COMPOSE_PROJECT_NAME"
          docker exec "$QUALIFICATION_CONTAINER" bun scripts/staging/verify-offline-qualification.ts
      - name: Collect bounded state and remove this job's resources
        if: always()
        run: |
          docker inspect "$QUALIFICATION_CONTAINER" --format '{{.Id}} {{.Image}} {{.State.Status}} {{.HostConfig.NetworkMode}}' || true
          export QUALIFICATION_OPERATOR_TOKEN="${QUALIFICATION_OPERATOR_TOKEN:-cleanup-only}"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.qualification.yml down --volumes
