name: Offline staging qualification

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/staging/**'
      - 'Dockerfile'
      - 'docker-compose.qualification.yml'
      - 'bun.lock'
      - 'package.json'
      - '.dockerignore'
      - '.github/workflows/offline-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: teetime-qual-${{ github.run_id }}-${{ github.run_attempt }}
      QUALIFICATION_CONTAINER: teetime-qual-${{ github.run_id }}-${{ github.run_attempt }}
      QUALIFICATION_IMAGE: teetime-qual:${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Test offline boundary and normal server behavior
        run: |
          python3 scripts/staging/test_cleanup_apparmor_audit.py
          python3 scripts/staging/test_apparmor_negatives.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_connect_proxy.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_auth_receiver.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_watchdog.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_canary_protocol.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_bounded_process.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_snapshot.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_git_objects.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_git_commit.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_snapshot_exporter.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_artifact_contract.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_materialization_frame.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_materializer.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_materialization_check.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_fixture_diagnostics.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_materialization_probe.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_artifact_materialization.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_joined_fixture.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_proxy_receipt.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_canary_diagnostics.py
          python3 -m unittest discover -s scripts/staging -p test_teetime_operator_protocol.py
          bun test ./scripts/staging/teetime-canary-result.test.ts
          bun test ./scripts/staging/teetime-artifact-stream.test.ts
          bun test ./scripts/staging/teetime-sdk-lifecycle.test.ts
          bun test packages/paths/src/offline-qualification.test.ts
          bun --filter @archon/server test
          bun --filter @archon/server type-check
          bun x tsc --noEmit -p scripts/tsconfig.json
      - name: Test restricted provider source candidate
        # Restricted-provider tests are isolated processes because SDK mocks are global.
        # The synthetic executable uses the real SDK but never contacts a model.
        # Runtime admission remains separate from these source checks.
        run: |
          cd packages/providers
          bun test src/codex/restricted-provider.test.ts
          bun test src/codex/restricted-canary-transport.test.ts
          bun test src/codex/restricted-sdk.test.ts
          bun test src/community/pi/restricted-review.test.ts
          bun test src/community/pi/restricted-review-transport.test.ts
          bun test src/community/pi/restricted-review-evidence.test.ts
          bun test src/codex/restricted-run-factory.test.ts
          bun test src/codex/provider.test.ts
          bun x tsc --noEmit
      - name: Build exact checkout candidate image
        run: |
          echo "Testing checkout $(git rev-parse HEAD) (PR runs use merge candidate)"
          docker build --build-arg ARCHON_BUILD_SHA="$(git rev-parse HEAD)" -t "$QUALIFICATION_IMAGE" .
      - name: Launch isolated staging
        id: launch_staging
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "QUALIFICATION_OPERATOR_TOKEN=$token" >> "$GITHUB_ENV"
          export QUALIFICATION_OPERATOR_TOKEN="$token"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.qualification.yml up -d
          for attempt in $(seq 1 24); do
            status=$(docker inspect "$QUALIFICATION_CONTAINER" --format '{{.State.Health.Status}}')
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Require named sandbox and configuration isolation
        run: |
          set -euo pipefail
          uname -r
          docker version --format '{{.Server.Version}}'
          sudo apparmor_parser --version
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          profile="teetime-probe-mount-${{ github.run_id }}-${{ github.run_attempt }}"
          profile_file="$RUNNER_TEMP/$profile"
          test -r /etc/apparmor.d/abi/3.0
          test -r /etc/apparmor.d/tunables/global
          test -r /etc/apparmor.d/abstractions/base
          if sudo grep -Fq "$profile " /sys/kernel/security/apparmor/profiles; then exit 1; fi
          python3 scripts/staging/render-apparmor-audit.py "$profile" > "$profile_file"
          sha256sum "$profile_file"
          sudo apparmor_parser -a "$profile_file"
          cleanup_profile() {
            status=$?
            set +e
            python3 scripts/staging/cleanup-apparmor-audit.py "$profile" "$profile_file"
            cleanup_status=$?
            if [ "$cleanup_status" -ne 0 ]; then exit "$cleanup_status"; fi
            exit "$status"
          }
          trap cleanup_profile EXIT
          audit_start=$(date --utc '+%Y-%m-%d %H:%M:%S')
          python3 scripts/staging/run-codex-sandbox-probe.py --apparmor-profile "$profile" --image "$QUALIFICATION_IMAGE" --expected-sha "$(git rev-parse HEAD)"
          python3 scripts/staging/run-codex-sandbox-probe.py --apparmor-profile "$profile" --isolated-network --image "$QUALIFICATION_IMAGE" --expected-sha "$(git rev-parse HEAD)"
          python3 scripts/staging/run-codex-sandbox-probe.py --apparmor-profile "$profile" --kind configuration --image "$QUALIFICATION_IMAGE" --expected-sha "$(git rev-parse HEAD)"
          python3 scripts/staging/run-codex-sandbox-probe.py --apparmor-profile "$profile" --kind configuration --hostile-project --image "$QUALIFICATION_IMAGE" --expected-sha "$(git rev-parse HEAD)"
          negative_dir="$RUNNER_TEMP/teetime-negative-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir "$negative_dir"
          gcc -static -O2 -Wall -Wextra -Werror scripts/staging/probe-apparmor-negative.c -o "$negative_dir/teetime-mount-negative"
          sha256sum scripts/staging/probe-apparmor-negative.c "$negative_dir/teetime-mount-negative"
          base_id=$(docker image inspect "$QUALIFICATION_IMAGE" --format '{{.Id}}')
          negative_image="teetime-negative:${{ github.run_id }}-${{ github.run_attempt }}"
          printf 'FROM %s\nCOPY teetime-mount-negative /app/teetime-mount-negative\n' "$QUALIFICATION_IMAGE" > "$negative_dir/Dockerfile"
          docker build --pull=false -t "$negative_image" "$negative_dir"
          test "$(docker image inspect "$QUALIFICATION_IMAGE" --format '{{.Id}}')" = "$base_id"
          docker image inspect "$negative_image" --format '{{.Id}}'
          negative_start=$(date --utc '+%Y-%m-%d %H:%M:%S')
          python3 scripts/staging/run-codex-sandbox-probe.py --kind negative --apparmor-profile "$profile" --image "$negative_image" --expected-sha "$(git rev-parse HEAD)"
          sudo journalctl -k --since "$negative_start" --no-pager > "$negative_dir/audit.log"
          python3 scripts/staging/verify-apparmor-negatives.py "$profile" "$negative_dir/audit.log"
          docker image rm "$negative_image"
          echo "Required non-model qualification passed; model admission remains separate"
      - name: Verify runtime and isolation
        run: |
          python3 scripts/staging/inspect-offline-qualification.py "$QUALIFICATION_CONTAINER" "$(git rev-parse HEAD)" "$COMPOSE_PROJECT_NAME"
          docker exec "$QUALIFICATION_CONTAINER" bun scripts/staging/verify-offline-qualification.ts
      - name: Collect bounded state and remove this job's resources
        if: always()
        run: |
          docker inspect "$QUALIFICATION_CONTAINER" --format '{{.Id}} {{.Image}} {{.State.Status}} {{.HostConfig.NetworkMode}}' || true
          export QUALIFICATION_OPERATOR_TOKEN="${QUALIFICATION_OPERATOR_TOKEN:-cleanup-only}"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.qualification.yml down --volumes
