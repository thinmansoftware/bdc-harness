# M-131 Phase B Claude seat compose example.
services:
  bdc-seat-claude:
    build:
      context: ../..
      dockerfile: deploy/m131-seat/Dockerfile
      args:
        BUILD_SHA: "${BUILD_SHA:?BUILD_SHA is required - pass the exact commit SHA}"
    image: bdc-seat-claude:${BUILD_SHA:?BUILD_SHA is required - pass the exact commit SHA}
    container_name: bdc-seat-claude
    user: "10001:10001"
    restart: unless-stopped
    environment:
      SEAT_BUILD_SHA: "${BUILD_SHA:?BUILD_SHA is required - pass the exact commit SHA}"
    volumes:
      - ./config.seat.claude.example.json:/app/config/seat.json:ro
      - ${M131_CLAUDE_SECRET_INGRESS:-./placeholder/claude-credential.json}:/run/m131/secret-ingress/claude-credential.json:ro
      - ${M131_OPERATOR_TOKEN_FILE:-./placeholder/archon-operator-token}:/run/m131/operator-token/archon-operator-token:ro
      - m131-claude-vendor-profile:/home/seat/.claude
      - m131-claude-state:/var/lib/bdc-seat
    healthcheck:
      test: ["CMD", "bun", "run", "scripts/dispatch-worker/seat-preflight.ts", "--config", "/app/config/seat.json"]
      interval: 60s
      timeout: 15s
      retries: 3

volumes:
  m131-claude-vendor-profile:
  m131-claude-state:
