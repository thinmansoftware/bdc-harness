# M-131 Phase B Codex-MCP seat compose example. ACP/MCP transport leg
# (WO-HARNESS-M131-PHASE-B-CODEX-CLAUDE-SEATS-01), distinct from the plain-CLI
# bdc-seat-codex added by WO-HARNESS-M131-PHASE-B-SEAT-PACKAGING-01 -- both may
# run concurrently, each restricted to exactly one provider by seat-preflight.
services:
  bdc-seat-codex-mcp:
    build:
      context: ../..
      dockerfile: deploy/m131-seat/Dockerfile
      args:
        BUILD_SHA: "${BUILD_SHA:?BUILD_SHA is required - pass the exact commit SHA}"
    image: bdc-seat-codex-mcp:${BUILD_SHA:?BUILD_SHA is required - pass the exact commit SHA}
    container_name: bdc-seat-codex-mcp
    user: "10001:10001"
    restart: unless-stopped
    environment:
      SEAT_BUILD_SHA: "${BUILD_SHA:?BUILD_SHA is required - pass the exact commit SHA}"
    volumes:
      - ./config.seat.codex-mcp.example.json:/app/config/seat.json:ro
      - ${M131_CODEX_SECRET_INGRESS:-./placeholder/codex-credential.json}:/run/m131/secret-ingress/codex-credential.json:ro
      - ${M131_OPERATOR_TOKEN_FILE:-./placeholder/archon-operator-token}:/run/m131/operator-token/archon-operator-token:ro
      - m131-codex-mcp-vendor-profile:/home/seat/.codex
      - m131-codex-mcp-state:/var/lib/bdc-seat
    healthcheck:
      test: ["CMD", "bun", "run", "scripts/dispatch-worker/seat-preflight.ts", "--config", "/app/config/seat.json"]
      interval: 60s
      timeout: 15s
      retries: 3

volumes:
  m131-codex-mcp-vendor-profile:
  m131-codex-mcp-state:
